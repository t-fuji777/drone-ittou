陸できる場所を確認し、操縦者へ適切な助言を行うことができること。⚫補助者にも機体の特性を理解させておくこと。","補助者を配置する場合の留意点です。\n・飛行経路とその周辺の障害物などを事前に確認し、適切な経路を特定して選びます。\n・飛行経路の全体が見渡せる位置に、補助者を配置します。補助者は双眼鏡などを持ち、飛行の状況や周囲の気象の変化などを常に監視して、操縦者へ必要な助言を行います。\n・操縦者と補助者が、いつでも連絡を取れるようにします。\n・補助者が、安全に着陸できる場所を確認し、操縦者へ適切な助言ができるようにします。\n・補助者にも、機体の特性を理解させておきます。"],["6.4 飛行の方法に応じた運航リスクの評価及び最適な運航の計画の立案 補助者を配置しない場合","補助者を配置しない場合は、例えば、次のような内容を追加する。⚫飛行経路には、第三者が存在する可能性が低い場所を設定する。第三者が存在する可能性が低い場所は、山、海水域、河川・湖沼、森林、農用地又はこれらに類するものとする。⚫空港等における進入表面等の上空の空域、航空機の離陸及び着陸の安全を確保するために必要なものとして国土交通大臣が告示で定める空域又は地表若しくは水面から150ｍ以上の高さの空域の飛行は行わない。（一時的に地表から150mを超える飛行を行う場合は、山間部の谷間など、航空機との衝突のおそれができる限り低い空域を選定する。）⚫全ての飛行経路において飛行中に不測の事態（機体の異常、飛行経路周辺への第三者の立入り、航空機の接近、運用限界を超える気象等）が発生した場合に、付近の適切な場所に安全に着陸させる等の緊急時の対策手順を定めるとともに、第三者及び物件に危害を与えずに着陸ができる場所を予め選定すること。","補助者を配置しない場合は、例えば次のような内容を追加します。\n・飛行経路には、第三者がいる可能性の低い場所を設定します。第三者がいる可能性の低い場所とは、山、海水域、河川・湖沼、森林、農用地、またはこれらに似た場所のことです。\n・次の空域では飛行しません。\n　- 空港等における進入表面などの上空の空域\n　- 航空機の離陸・着陸の安全を確保するために必要なものとして国土交通大臣が告示で定める空域\n　- 地表または水面から150m以上の高さの空域\n　（一時的に地表から150mを超えて飛ばす場合は、山間部の谷間など、航空機とぶつかるおそれができるだけ低い空域を選びます。）\n・すべての飛行経路について、飛行中に不測の事態が起きたときの緊急時の対策手順を決めておきます。不測の事態とは、機体の異常、飛行経路周辺への第三者の立入り、航空機の接近、運用限界を超える気象などです。近くの適切な場所へ安全に着陸させるといった手順を定め、あわせて、第三者や物件に危害を与えずに着陸できる場所をあらかじめ選んでおきます。"],["6.4 飛行の方法に応じた運航リスクの評価及び最適な運航の計画の立案 補助者を配置しない場合","⚫飛行前に、飛行させようとする経路及びその周辺について、不測の事態が発生した際に適切に安全上の措置を講じることができる状態であることを現場確認する。⚫飛行範囲の外周から落下距離の範囲内を立入管理区画とし、飛行経路には第三者が存在する可能性が低い場所の設定基準を準用する。⚫立入管理区画を設定した場合は、当該立入管理区画に立看板等を設置するとともに、インターネットやポスター等により、問い合わせ先を明示した上で上空を無人航空機が飛行することを第三者に対して周知する。⚫立入管理区画に道路、鉄道、家屋等、第三者が存在する可能性を排除できない場所が含まれる場合には、追加の第三者の立入りを制限する方法を講じる。","・飛行の前に、飛ばそうとする経路とその周辺について、不測の事態が起きたときに適切な安全上の措置がとれる状態かどうかを、現場で確認します。\n・飛行範囲の外周から落下距離の範囲内を立入管理区画とします。この区画をどこに設けるかは、飛行経路について定めた「第三者がいる可能性の低い場所」の設定基準をそのまま当てはめて考えます。\n・立入管理区画を設定したときは、その区画に立看板などを設置します。あわせて、インターネットやポスターなどで、問い合わせ先を示したうえで、上空を無人航空機が飛ぶことを第三者に知らせます。\n・立入管理区画の中に、道路・鉄道・家屋など、第三者がいる可能性をなくせない場所が含まれる場合は、第三者の立入りを制限する方法をさらに追加して講じます。"]];
const KYO_STOP = ["について","とは","ですか","ますか","ください","教えて","どんな","どの","どう","なに","どこ","いくつ","何","場合","とき","こと","もの","必要","理由","意味","違い","とき","します","ですが","でしょうか"];
// 教則検索画面では右下の電卓FABを隠す（検索ボタンや本文と重なるため）
function fabVis(){ const f=$("#calcFab"); if(f) f.style.display = (Tview==="kyo") ? "none" : "flex"; }
function kyoEsc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function kyoCount(s,t){ let n=0,p=0; while((p=s.indexOf(t,p))>=0){ n++; p+=t.length; } return n; }
// 表記ゆれの吸収（中黒・空白の除去、全角英数→半角）。教則は「イエロー・ゾーン」等と中黒を挟む
function kyoNorm(s){
  return String(s).replace(/[・･　\s]/g,"")
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
}
let KYON=null;
function kyoIndex(){ if(!KYON) KYON=KYO.map(c=>[kyoNorm(c[0]), kyoNorm(c[1]), kyoNorm(c[2])]); return KYON; }
// 質問文から検索語を抽出（漢字・カタカナ・英数の2文字以上の連なり。助詞や疑問語は除く）
// split=true のときは複合語を前後半にも分解する（完全一致で見つからない場合の保険）
function kyoTerms(q, split){
  const raw=(q||"").match(/[一-龥々]{2,}|[ァ-ヴー]{2,}|[A-Za-z]{2,}|[0-9]{1,4}/g)||[];
  let ts=raw.filter(w=>KYO_STOP.indexOf(w)<0);
  if(split){
    const ex=[];
    ts.forEach(w=>{ if(w.length>=5){ ex.push(w.slice(0,Math.ceil(w.length/2))); ex.push(w.slice(Math.floor(w.length/2))); } });
    ts=ts.concat(ex.filter(w=>w.length>=2&&KYO_STOP.indexOf(w)<0));
  }
  if(!ts.length){   // ひらがなのみの質問は2文字ずつに分解
    const h=(q||"").replace(/[、。，．\s？?！!「」『』（）()【】]/g,"");
    for(let i=0;i<h.length-1;i++) ts.push(h.substr(i,2));
  }
  return ts.filter((t,i)=>ts.indexOf(t)===i).slice(0,12);
}
// スコアリング: 珍しい語ほど重く（IDF）、検索語をより多く含む節ほど強く（網羅率の2乗）
function kyoScore(ts){
  if(!ts.length) return {terms:[],hl:[],hits:[]};
  const IX=kyoIndex(), N=KYO.length, tn=ts.map(kyoNorm);
  const df=tn.map(t=>{ let d=0; for(const c of IX){ if(c[1].indexOf(t)>=0||c[2].indexOf(t)>=0||c[0].indexOf(t)>=0) d++; } return d||N; });
  const w=tn.map((t,k)=>Math.log(1+N/df[k])*t.length);
  const hits=[];
  IX.forEach((c,i)=>{
    let sc=0,h=0;
    tn.forEach((t,k)=>{
      // 原文と解説の両方を検索対象に（教則の硬い用語でも、やさしい言い回しでも見つかる）
      const nb=Math.min(kyoCount(c[1],t)+kyoCount(c[2],t),3), nl=kyoCount(c[0],t);
      if(nb||nl){ h++; sc += w[k]*(nb + nl*3); }
    });
    if(h){ const cov=h/tn.length; hits.push({i:i, sc:sc*cov*cov, h:h}); }
  });
  hits.sort((a,b)=>b.sc-a.sc||a.i-b.i);
  // ハイライトは珍しい語だけに絞る（「飛行」のような頻出語まで塗ると読みにくいため）
  const hl=ts.filter((t,k)=>df[k] <= Math.max(3, N*0.15));
  return {terms:ts, hl:(hl.length?hl:ts), hits:hits.slice(0,6)};
}
function kyoSearch(q){
  let r=kyoScore(kyoTerms(q,false));          // まず完全な語だけで検索
  if(r.hits.length<3) r=kyoScore(kyoTerms(q,true));   // 少なければ分解語も併用
  return r;
}
function kyoMark(text, terms){
  // kyoEsc 済みの文字列には < > が存在しないため、これを目印として使い最後に一度で置換する
  let s=kyoEsc(text);
  terms.slice().sort((a,b)=>b.length-a.length).forEach(t=>{
    const n=kyoNorm(t);
    // 検索語は漢字・かな・英数のみ（正規表現の特殊文字は含まれない）。念のため他は対象外にする
    if(!n || !/^[぀-ヿ一-鿿ｦ-ﾟA-Za-z0-9ー々]+$/.test(n)) return;
    const pat=n.split("").join("[・･]?");   // 教則の「イエロー・ゾーン」のような中黒をまたぐ
    try{ s=s.replace(new RegExp(pat,"g"), m=>"<"+m+">"); }catch(e){}
  });
  return s.replace(/[<>]/g, c=> c==="<" ? '<mark class="kyo-hl">' : "</mark>");
}
// その節に対応する問題を BANK から探す（節番号→章の順にフォールバック）
function kyoRelated(label){
  const sec=(String(label).match(/^(\d\.\d)/)||[])[1];
  if(sec){ const r=BANK.filter(q=>q.ref&&q.ref.indexOf(sec)>=0); if(r.length>=3) return {list:r, by:sec}; }
  const ch=(String(label).match(/^(\d)/)||[])[1];
  if(ch){ const r=BANK.filter(q=>q.ref&&q.ref.indexOf("第"+ch+"章")>=0); if(r.length>=3) return {list:r, by:"第"+ch+"章"}; }
  return null;
}
let kyoQ="", kyoOpen={};
function kyoToggle(i){ kyoOpen[i]=!kyoOpen[i]; renderKyo(); }
function kyoAsk(v){ kyoQ=(v==null?(($("#kyoInput")||{}).value||""):v); kyoOpen={}; renderKyo(); }
function kyoClear(){ kyoQ=""; kyoOpen={}; renderKyo(); const el=$("#kyoInput"); if(el){ el.value=""; el.focus(); } }
// 入力中も×の表示を切り替える（検索前に打った文字も一括で消せるように）
function kyoXVis(){ const el=$("#kyoInput"), x=$("#kyoX"); if(el&&x) x.style.display = el.value ? "grid" : "none"; }
const KYO_QUIZ_MAX=20;   // 1セッションが長くなりすぎないよう上限を設ける
function kyoQuiz(label){
  const r=kyoRelated(label);
  if(!r){ toast("この項目の問題はありません"); return; }
  const list=spaceOut(shuffle(r.list).slice(0,KYO_QUIZ_MAX));
  Q={list:list,i:0,sel:null,answered:false,correct:0,wrongIds:[],mode:"cat",timer:0,tInt:null,mock:false,learn:true,view4:snap4(list)};
  renderQuiz();
}
const KYO_SAMPLES=["リモートIDが免除されるのはどんな場合","飛行禁止空域はどこ","立入管理措置とは","目視外飛行に必要な装備","カテゴリーIII飛行の要件","フレネルゾーンの計算","アルコールの影響下での飛行","飛行日誌に記載する内容"];
function renderKyo(){
  Tview="kyo";
  const res=kyoQ.trim()?kyoSearch(kyoQ):{terms:[],hits:[]};
  let h=`<div class="screen"><div class="sec-title">教則を検索（第5版）</div>
    <div class="explain" style="margin-bottom:12px">わからないことを入力すると、<b>教則の内容をやさしく言い換えた解説</b>を表示します。用語でも文章でも構いません（教則の原文も併せて確認できます）。</div>
    <div class="kyo-box">
      <div class="kyo-inwrap">
        <input id="kyoInput" class="kyo-input" type="search" placeholder="例）リモートIDが免除されるのはどんな場合" value="${kyoEsc(kyoQ)}"
          oninput="kyoXVis()" onkeydown="if(event.key==='Enter'){event.preventDefault();kyoAsk();}">
        <button id="kyoX" class="kyo-x" aria-label="入力を消す" title="入力を消す"
          style="display:${kyoQ?'grid':'none'}" onclick="kyoClear()">×</button>
      </div>
      <button class="btn primary kyo-go" onclick="kyoAsk()">検索</button>
    </div>`;
  if(!kyoQ.trim()){
    h+=`<div style="margin-top:14px"><div style="font-size:11.5px;color:var(--sub);font-weight:700;margin-bottom:8px">よくある質問から</div>
      <div class="kyo-chips">${KYO_SAMPLES.map(s=>`<button onclick="kyoAsk('${s}')">${s}</button>`).join("")}</div></div>
      <div class="note" style="margin-top:16px;line-height:1.7">収録: 教則第5版（令和8年7月14日適用）の全文 ${KYO.length}項目。<br>解説はすべて教則の原文と突き合わせて、数値・区分・義務・例外に食い違いがないことを確認しています。</div></div>`;
  } else if(!res.hits.length){
    h+=`<div class="empty" style="margin-top:18px">該当する記載が見つかりませんでした。<br>別の言い方や、用語（例：リモートID、立入管理措置）で試してください。</div>
      <button class="btn ghost" onclick="kyoClear()">検索をやり直す</button></div>`;
  } else {
    h+=`<div style="font-size:11.5px;color:var(--sub);margin:14px 2px 8px">該当 ${res.hits.length}件（検索語: ${res.terms.slice(0,6).map(kyoEsc).join("・")}）</div>`;
    res.hits.forEach(x=>{
      const c=KYO[x.i], rel=kyoRelated(c[0]), open=!!kyoOpen[x.i];
      h+=`<div class="ref-card" style="margin-bottom:10px">
        <div style="font-size:10.5px;color:var(--acc2);font-weight:700;margin-bottom:7px">${kyoEsc(c[0])}</div>
        <div class="kyo-body">${kyoMark(c[2], res.hl)}</div>
        <button class="kyo-src-btn" onclick="kyoToggle(${x.i})">${open?"教則の原文を閉じる":"教則の原文を見る"}</button>
        ${open?`<div class="kyo-src">${kyoMark(c[1], res.hl)}</div>`:""}
        ${rel?`<button class="btn ghost" style="margin-top:10px;padding:8px" onclick="kyoQuiz('${kyoEsc(c[0]).replace(/'/g,"")}')">この分野の問題を解く（${Math.min(rel.list.length,KYO_QUIZ_MAX)}問）</button>`:""}
      </div>`;
    });
    h+=`<button class="btn ghost" style="margin-top:4px" onclick="kyoClear()">検索をやり直す</button></div>`;
  }
  main.innerHTML=h; main.scrollTop=0; fabVis();
  const el=$("#kyoInput"); if(el&&kyoQ.trim()==="") el.focus();
}

// ============================================================
//  記号一覧（表形式）
// ============================================================
// 記号一覧は計算公式タブ内のサブ画面（v77で統合）。旧来の呼び出しにも対応
function symbolTableHTML(){
  const rows = SYMBOL_CARDS.map(c=>{
    const en = (c.en && c.en!=="—") ? c.en : "";
    return `<tr>
      <td class="st-sym">${c.sym}</td>
      <td class="st-read">${c.read||""}</td>
      <td class="st-mean">${c.mean}${en?`<div class="st-en">${en}</div>`:''}</td>
    </tr>`;
  }).join("");
  return `<div class="explain" style="margin-bottom:14px">計算問題に出る記号と読み・意味の一覧です。</div>
    <div class="symtable-wrap"><table class="symtable">
      <thead><tr><th>記号</th><th>読み</th><th>意味</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}
function renderSymbolTable(){ calcTab="symbol"; renderCalc(); }

// ============================================================
//  CALC FORMULA SHEET
// ============================================================
function bindSup(str){ return str.replace(/(.)([²³⁸⁹]+)/g,'<span style="white-space:nowrap">$1$2</span>'); }
// v95: カードの `cases`（求める値ごとの場合分け）をオレンジ枠で描画する
function casesHTML(card){
  if(!card || !card.cases || !card.cases.length) return "";
  return `<div class="fcases">`+card.cases.map(function(c){
    return `<div class="fcase"><div class="ft">${c.for}</div>`
      + `<div class="fq">${bindSup(String(c.fml).split("\n").join("<br>"))}</div>`
      + (c.ex ? `<div class="fe">例：${c.ex}</div>` : "")
      + `</div>`;
  }).join("")+`</div>`;
}
function fmlHTML(str){
  return String(str).split("<br>").map(function(ln){
    var depth=0, t0=ln;
    while(t0.charAt(0)==="　"){ depth++; t0=t0.slice(1); }
    var d="d"+(depth>3?3:depth);
    var t=t0.trim();
    if(t==="") return '<div style="height:10px"></div>';
    if(t.charAt(0)==="※") return '<div class="fn '+d+'">'+t0+'</div>';
    if(t.indexOf("【公式】")===0) return '<div class="fh '+d+'">'+bindSup(t0)+'</div>';
    var ix=t0.indexOf("例：");
    if(ix>=0) return '<div class="fl '+d+'">'+bindSup(t0.slice(0,ix))+'<span class="fex">'+t0.slice(ix)+'</span></div>';
    return '<div class="fl '+d+'">'+bindSup(t0)+'</div>';
  }).join("");
}
function fitFH(root){
  if(!root||!root.querySelectorAll) return;
  var els=root.querySelectorAll(".fh"); if(!els||!els.length) return;
  for(var i=0;i<els.length;i++){
    var el=els[i]; if(!el||!el.style) continue;
    el.style.whiteSpace="nowrap"; el.style.fontSize="";
    var cs=(typeof getComputedStyle==="function"?getComputedStyle(el):null);
    var size=parseFloat(cs?cs.fontSize:"12.5")||12.5;
    var g=80;
    while(el.clientWidth>0 && el.scrollWidth>el.clientWidth+0.5 && size>9 && (g--)>0){ size-=0.5; el.style.fontSize=size+"px"; }
    // 9pxまで縮めても収まらない長い見出しは、はみ出させずに折り返す
    if(el.clientWidth>0 && el.scrollWidth>el.clientWidth+0.5) el.style.whiteSpace="normal";
  }
}
let calcTab="formula";   // 計算公式タブ内の表示（formula=計算公式・既定 / symbol=記号一覧）
function setCalcTab(t){ calcTab=t; renderCalc(); }
function renderCalc(){
  Tview="calc";
  let h=`<div class="screen">
    <div class="seg">
      <button class="${calcTab==="formula"?"on":""}" onclick="setCalcTab('formula')">計算公式</button>
      <button class="${calcTab==="symbol"?"on":""}" onclick="setCalcTab('symbol')">記号一覧</button>
    </div>`;
  if(calcTab==="symbol"){
    h+=`<div class="sec-title">記号一覧（計算問題で使う記号）</div>${symbolTableHTML()}`;
  } else {
    h+=`<div class="sec-title">計算公式シート（一等の核心）</div>
      <div class="explain" style="margin-bottom:16px">本番は計算5問。<b>2問以上の失点は致命的</b>です。試験画面の電卓は使用可、持込不可。各公式の逆算も併記。</div>`;
    for(const s2 of FORMULA_CARDS){
      h+=`<div class="ref-card"><h3>${s2.term}</h3>
        <div class="formula">${fmlHTML(s2.formula)}${casesHTML(s2)}</div>${s2.note?`<div class="note" style="margin-top:8px;color:var(--acc2)">${s2.note}</div>`:''}</div>`;
    }
    h+=`<button class="btn primary" style="margin-top:6px" onclick="startQuiz('cat',5)">計算問題を解く →</button>`;
  }
  h+=`</div>`;
  main.innerHTML=h; main.scrollTop=0; fitFH(main); fabVis();
}

// ============================================================
//  REVIEW (wrong answers)
// ============================================================
function renderReview(){
  Tview="review";
  const wrongList=BANK.filter(q=>S.wrong[q.id]);
  let h=`<div class="screen"><div class="sec-title">🔁 復習リスト（要再確認）</div>`;
  if(!wrongList.length){
    h+=`<div class="empty">🎉<br>復習が必要な問題はありません。<br>学習や模試で間違えた問題が<br>ここに集まります。</div>
    <button class="btn ghost" onclick="renderHome();setNavActive('home')">ホームへ</button></div>`;
    main.innerHTML=h; main.scrollTop=0; return;
  }
  h+=`<div class="explain ng" style="margin-bottom:14px"><b>${wrongList.length}問</b>が要復習です。連続2回正解すると、自動でリストから外れます。</div>
    <button class="btn bad" style="margin-bottom:14px" onclick="startQuiz('review')">▶ ${wrongList.length}問をまとめて復習</button>`;
  // group by cat
  for(const c of [1,2,3,4,5]){
    const sub=wrongList.filter(q=>q.cat===c);
    if(!sub.length) continue;
    h+=`<div style="margin:8px 2px 8px;font-size:12px;font-weight:700;color:var(--sub)">${CATS[c].icon} ${CATS[c].short}（${sub.length}）</div>`;
    sub.forEach(q=>{
      h+=`<div class="ref-card" style="padding:13px 14px"><div style="font-size:13px;line-height:1.5;font-weight:500">${q.q.split("\n")[0]}</div>
        <div style="font-size:11px;color:var(--good);margin-top:7px">正答: ${q.o[q.a]}</div>
        <div style="font-size:10.5px;color:var(--sub);margin-top:5px;line-height:1.5">${q.e.split("\n")[0]}</div></div>`;
    });
  }
  h+=`</div>`;
  main.innerHTML=h; main.scrollTop=0;
}

// ============================================================
//  STATS
// ============================================================
function renderStats(){
  Tview="stats";
  const tot=BANK.length, kn=BANK.filter(q=>S.known[q.id]).length, seen=BANK.filter(q=>S.seen[q.id]).length;
  const wrong=BANK.filter(q=>S.wrong[q.id]).length;
  const mocks=S.history.filter(h=>h.mock);
  const lastMock=mocks[mocks.length-1];
  let h=`<div class="screen"><div class="sec-title">📊 学習成績</div>
    <div class="rstat" style="margin-bottom:14px">
      <div class="box ok"><div class="n">${kn}</div><div class="l">習得</div></div>
      <div class="box ng"><div class="n">${wrong}</div><div class="l">要復習</div></div>
      <div class="box"><div class="n">${Math.round(kn/tot*100)}<span style="font-size:14px">%</span></div><div class="l">全体習得率</div></div>
    </div>`;
  // per-category bars
  h+=`<div class="ref-card"><h3 style="color:var(--ink);font-size:13px">分野別 習得率</h3><div style="margin-top:6px">`;
  for(const c of [1,2,3,4,5]){
    const list=byCat(c), k=knownCount(list), p=list.length?Math.round(k/list.length*100):0;
    h+=`<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px">
      <span>${CATS[c].icon} ${CATS[c].short}</span><span style="color:var(--sub)">${k}/${list.length}・${p}%</span></div>
      <div style="height:7px;background:var(--panel2);border-radius:4px;overflow:hidden"><i style="display:block;height:100%;width:${p}%;background:var(--acc);border-radius:4px"></i></div></div>`;
  }
  h+=`</div></div>`;
  // mock history
  h+=`<div class="ref-card"><h3 style="color:var(--ink);font-size:13px">模試の記録</h3>`;
  if(lastMock){
    const tu=lastMock.timeUsed!=null?`・${Math.floor(lastMock.timeUsed/60)}分`:'';
    h+=`<div class="note" style="margin-top:4px">直近: <b style="color:${lastMock.pct>=90?'var(--good)':'var(--bad)'}">${lastMock.pct}%</b>（${lastMock.correct}/${lastMock.total}${tu}）・${lastMock.pct>=90?'合格基準達成':'基準未達'}</div>`;
    const recent=mocks.slice(-6);
    h+=`<div style="display:flex;gap:6px;align-items:flex-end;height:70px;margin-top:14px">`;
    recent.forEach(m=>{ h+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
      <div style="width:100%;height:${Math.max(8,m.pct*0.55)}px;background:${m.pct>=90?'var(--good)':'var(--bad)'};border-radius:4px 4px 0 0"></div>
      <span style="font-size:9px;color:var(--sub)">${m.pct}</span></div>`; });
    h+=`</div>`;
    // 分野別トレンド（v70）: byCat 保存済みの模試から直近と前回を比較
    const mB=mocks.filter(m=>m.byCat);
    const lb=mB[mB.length-1], pb=mB[mB.length-2];
    if(lb){
      h+=`<div style="margin-top:14px;border-top:1px dashed var(--line);padding-top:11px"><div style="font-size:11.5px;font-weight:700;color:var(--sub);margin-bottom:7px">分野別（直近模試・前回比）</div>`;
      for(const c of [1,2,5,3,4]){
        const b=lb.byCat[c]; if(!b) continue;
        const p=Math.round(b.ok/b.n*100);
        let diff='';
        if(pb && pb.byCat[c]){
          const d=p-Math.round(pb.byCat[c].ok/pb.byCat[c].n*100);
          diff = d>0?`<span style="color:var(--good)">↑+${d}</span>` : d<0?`<span style="color:var(--bad)">↓${d}</span>` : `<span style="color:var(--sub)">→±0</span>`;
        }
        h+=`<div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:5px"><span>${CATS[c].short}</span><span style="color:${p>=90?'var(--good)':'var(--bad)'}">${p}%　${diff}</span></div>`;
      }
      h+=`</div>`;
      if(lb.wrongIds && lb.wrongIds.length) h+=`<button class="btn bad" style="width:100%;margin-top:8px" onclick="reviewMockWrong()">直近模試の間違い${lb.wrongIds.length}問を解き直す</button>`;
    }
  } else {
    h+=`<div class="note" style="margin-top:4px">まだ模試の記録がありません。「模擬試験 70問」に挑戦してみましょう。</div>`;
  }
  h+=`</div>`;
  h+=`<button class="btn ghost" style="margin-top:6px" onclick="resetAll()">学習データをリセット</button></div>`;
  main.innerHTML=h; main.scrollTop=0; refreshHeader();
}
async function resetAll(){
  if(!confirm("習得状況・復習リスト・成績をすべて消去します。よろしいですか？")) return;
  S={ known:{}, wrong:{}, seen:{}, streak:S.streak, lastDay:S.lastDay, history:[], attempts:{}, bankVer:S.bankVer, cs:{}, daily:{}, box:{}, due:{}, srInit:true };
  await save(); toast("リセットしました"); renderStats(); refreshHeader();
}

}
