<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>一等学科試験 暗記マスター</title>
<meta name="description" content="一等無人航空機操縦士 学科試験の暗記アプリ（教則第5版準拠・必勝計算5公式）">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="一等学科">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Bebas+Neue&display=swap');

  :root{
    --bg:#0a0e1a;
    --panel:#121829;
    --panel2:#1a2238;
    --line:#26304d;
    --ink:#e8ecf6;
    --sub:#8b97b8;
    --acc:#3dd6c4;
    --acc2:#ffb627;
    --bad:#ff5d6c;
    --good:#3ddc84;
    --hot:#ff7a45;
    --shadow:0 10px 40px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  /* PWAでホームバー領域(下部セーフエリア)がナビ色で埋まるようにする */
  html{background:#121829}
  body{
    font-family:'Zen Kaku Gothic New',sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(61,214,196,.10), transparent 60%),
      radial-gradient(1000px 500px at -10% 110%, rgba(255,182,39,.07), transparent 55%),
      var(--bg);
    color:var(--ink);
    overflow:hidden;
    height:100dvh;
    display:flex;flex-direction:column;
  }
  #app{position:fixed;top:0;bottom:0;left:0;right:0;height:100%;display:flex;flex-direction:column;max-width:480px;width:100%;margin:0 auto;overflow:hidden}

  /* ---------- Header ---------- */
  header{
    padding:calc(16px + env(safe-area-inset-top)) 18px 16px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(18,24,41,.9),rgba(18,24,41,.4));
    backdrop-filter:blur(8px);
    position:relative;z-index:5;
  }
  .h-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .logo{display:flex;align-items:center;gap:10px}
  .logo .mark{
    width:36px;height:36px;border-radius:9px;
    object-fit:cover;
    box-shadow:0 4px 14px rgba(0,0,0,.5);
  }
  .logo h1{font-size:15px;font-weight:900;letter-spacing:.02em;line-height:1.15}
  .logo .sub{font-size:10.5px;color:var(--sub);font-weight:500;margin-top:1px}
  .streak{
    font-family:'Bebas Neue',sans-serif;font-size:13px;color:var(--acc2);
    border:1px solid rgba(255,182,39,.35);border-radius:20px;padding:4px 11px;
    display:flex;align-items:center;gap:5px;letter-spacing:.06em;
  }
  .progbar{height:5px;background:var(--panel2);border-radius:4px;margin-top:12px;overflow:hidden}
  .progbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:4px;width:0;transition:width .5s cubic-bezier(.4,0,.2,1)}
  .prog-label{display:flex;justify-content:space-between;font-size:10.5px;color:var(--sub);margin-top:6px;font-weight:500}

  /* ---------- Scroll body ---------- */
  main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:30px 16px calc(128px + env(safe-area-inset-bottom))} /* 下パディングは電卓FAB(66+52px)より深く取り、最下部コンテンツが隠れないようにする */
  main::-webkit-scrollbar{width:0}

  .screen{animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ---------- Home cat cards ---------- */
  .sec-title{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.08em;margin:6px 2px 12px;text-transform:uppercase}
  .cat{
    background:linear-gradient(135deg,var(--panel),var(--panel2));
    border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;
    position:relative;overflow:hidden;cursor:pointer;transition:transform .15s, border-color .15s;
  }
  .cat:active{transform:scale(.985)}
  .cat .row{display:flex;align-items:center;gap:13px}
  .cat .ic{
    width:46px;height:46px;border-radius:13px;flex:none;display:grid;place-items:center;font-size:22px;
    background:rgba(61,214,196,.12);border:1px solid rgba(61,214,196,.25);
  }
  .cat.c1 .ic{background:rgba(255,93,108,.12);border-color:rgba(255,93,108,.3)}
  .cat.c2 .ic{background:rgba(61,214,196,.12);border-color:rgba(61,214,196,.3)}
  .cat.c3 .ic{background:rgba(255,182,39,.12);border-color:rgba(255,182,39,.3)}
  .cat.c4 .ic{background:rgba(124,140,255,.12);border-color:rgba(124,140,255,.3)}
  .cat.c5 .ic{background:rgba(255,122,69,.14);border-color:rgba(255,122,69,.35)}
  .cat .meta{flex:1;min-width:0}
  .cat .meta b{font-size:14.5px;font-weight:700;display:block;line-height:1.3}
  .cat .meta span{font-size:11.5px;color:var(--sub);font-weight:500}
  .cat .cprog{margin-top:12px}
  .cat .cprog .bar{height:4px;background:rgba(0,0,0,.3);border-radius:3px;overflow:hidden}
  .cat .cprog .bar i{display:block;height:100%;border-radius:3px;width:0;transition:width .5s}
  .cat.c1 .cprog .bar i{background:var(--bad)}
  .cat.c2 .cprog .bar i{background:var(--acc)}
  .cat.c3 .cprog .bar i{background:var(--acc2)}
  .cat.c4 .cprog .bar i{background:#7c8cff}
  .cat.c5 .cprog .bar i{background:var(--hot)}
  .cat .cprog .t{font-size:10px;color:var(--sub);margin-top:5px;display:flex;justify-content:space-between}
  .badge1{position:absolute;top:11px;right:11px;font-size:9px;font-weight:900;letter-spacing:.05em;
    background:var(--bad);color:#fff;padding:3px 7px;border-radius:6px}

  /* ---------- Mode buttons ---------- */
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
  .mode-btn{
    border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px 12px;text-align:left;
    cursor:pointer;transition:transform .12s,border-color .15s;color:var(--ink);
  }
  .mode-btn:active{transform:scale(.97)}
  .mode-btn .e{font-size:20px;display:block;margin-bottom:7px}
  .mode-btn b{font-size:13px;font-weight:700;display:block}
  .mode-btn span{font-size:10.5px;color:var(--sub)}
  .mode-btn.full{grid-column:1/3;border-color:rgba(255,93,108,.4);background:linear-gradient(135deg,rgba(255,93,108,.1),var(--panel))}

  /* ---------- Quiz ---------- */
  .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
  .qcount{font-family:'Bebas Neue';font-size:20px;letter-spacing:.05em;color:var(--ink)}
  .qcount small{color:var(--sub);font-size:13px}
  .qtag{font-size:10px;font-weight:700;padding:4px 9px;border-radius:7px;background:var(--panel2);color:var(--sub);border:1px solid var(--line)}
  .qtag.one{background:rgba(255,93,108,.15);color:#ff8a95;border-color:rgba(255,93,108,.3)}
  .qtimer{font-family:'Bebas Neue';font-size:17px;color:var(--acc);letter-spacing:.05em}
  .qmini-bar{height:4px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-bottom:16px}
  .qmini-bar i{display:block;height:100%;background:var(--acc);transition:width .3s}

  .qcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px 18px;box-shadow:var(--shadow);margin-bottom:16px}
  .qnum{font-size:11px;color:var(--acc);font-weight:700;margin-bottom:9px;letter-spacing:.05em}
  .qtext{font-size:15.5px;font-weight:500;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
  .qtext .fml{display:block;background:var(--panel2);border:1px dashed var(--line);border-radius:9px;padding:10px 12px;margin:11px 0;font-size:13.5px;color:var(--acc2);font-family:'SF Mono','Menlo','Consolas','Courier New',monospace;letter-spacing:.02em;font-weight:600;overflow-wrap:anywhere}

  .opts{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
  .opt{
    border:1.5px solid var(--line);background:var(--panel);border-radius:13px;padding:14px 15px;
    display:flex;align-items:flex-start;gap:11px;cursor:pointer;transition:all .15s;color:var(--ink);text-align:left;
    font-size:14px;line-height:1.5;font-weight:500;
  }
  .opt:active{transform:scale(.99)}
  .opt .k{width:22px;height:22px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);
    display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;color:var(--sub);margin-top:1px}
  /* flex の子は既定で縮まないため、長い数式が枠から溢れる。min-width:0 と折返しで防ぐ */
  .opt > span:not(.k){min-width:0;flex:1;overflow-wrap:anywhere}
  .opt.sel{border-color:var(--acc);background:rgba(61,214,196,.08)}
  .opt.sel .k{background:var(--acc);color:#04141a;border-color:var(--acc)}
  .opt.correct{border-color:var(--good);background:rgba(61,220,132,.12)}
  .opt.correct .k{background:var(--good);color:#04140a;border-color:var(--good)}
  .opt.wrong{border-color:var(--bad);background:rgba(255,93,108,.1)}
  .opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
  .opt.disabled{pointer-events:none;opacity:.65}
  .opt.disabled.correct,.opt.disabled.wrong{opacity:1}

  .explain{border-radius:13px;padding:15px 16px;margin-bottom:14px;font-size:13px;line-height:1.65;animation:fade .3s;border:1px solid var(--line);background:var(--panel2);overflow-wrap:anywhere}
  .explain.ok{border-color:rgba(61,220,132,.4);background:rgba(61,220,132,.07)}
  .explain.ng{border-color:rgba(255,93,108,.4);background:rgba(255,93,108,.07)}
  .explain .res{font-weight:900;font-size:14px;margin-bottom:7px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0}
  .explain.ok .res{color:var(--good)}
  .explain.ng .res{color:var(--bad)}
  .explain .body{color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
  .explain .ref{margin-top:9px;font-size:10.5px;color:var(--sub);border-top:1px dashed var(--line);padding-top:8px;overflow-wrap:anywhere}
  /* 解説に添付する公式カードは、狭い画面でも枠内に収める（収まらない行は横スクロール） */
  .explain .formula{max-width:100%;overflow-x:auto}
  .explain .formula .fh,.explain .formula .fl{overflow-wrap:anywhere;word-break:normal}

  /* ---------- Flashcard ---------- */
  .flash{perspective:1600px;margin-bottom:16px}
  .flash-inner{position:relative;width:100%;min-height:420px;transition:transform .55s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
  .flash.flipped .flash-inner{transform:rotateY(180deg)}
  .flash-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border:1px solid var(--line);border-radius:18px;padding:20px 18px 44px;display:flex;flex-direction:column;
    justify-content:flex-start;box-shadow:var(--shadow);overflow-y:auto;-webkit-overflow-scrolling:touch}
  .flash-face::-webkit-scrollbar{width:0}
  .flash-front{background:linear-gradient(150deg,var(--panel),var(--panel2))}
  .flash-back{background:linear-gradient(150deg,#15263a,var(--panel2));transform:rotateY(180deg)}
  .flash .tag{font-size:10px;font-weight:700;color:var(--acc);letter-spacing:.06em;margin-bottom:12px;text-align:center;flex:none}
  .flash .fq{font-size:15px;font-weight:700;line-height:1.55;margin-bottom:14px}
  .flash .a{font-size:13px;line-height:1.65;font-weight:500;color:var(--ink)}
  .flash .fopts{display:flex;flex-direction:column;gap:8px}
  .flash .fopt{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;line-height:1.45;font-weight:500;
    border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:rgba(0,0,0,.15)}
  .flash .fk{width:19px;height:19px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);
    display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;color:var(--sub);margin-top:1px}
  .flash .fopt.fok{border-color:var(--good);background:rgba(61,220,132,.14)}
  .flash .fk.fkok{background:var(--good);color:#04140a;border-color:var(--good)}
  .flash .hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:10px;color:var(--sub)}
  .flash .dformula{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc2);
    border-radius:10px;padding:14px 14px;font-family:'SF Mono','Menlo','Consolas','Courier New',monospace;font-size:14px;letter-spacing:0;font-weight:600;
    color:var(--acc2);margin-bottom:14px;line-height:1.9;text-align:left;overflow-wrap:anywhere}
  .flash .dmean{font-size:18px;font-weight:700;line-height:1.5;text-align:center;color:var(--ink);margin-bottom:12px}
  .flash .dunit{font-size:13px;color:var(--acc);text-align:center;font-weight:600;
    border-top:1px dashed var(--line);padding-top:11px}
  /* デッキ（公式/記号カード） */
  .deck-screen{display:flex;flex-direction:column;height:100%}
  .deck-flash{flex:1 1 auto;min-height:200px;max-height:420px;margin-bottom:12px}
  .deck-flash .flash-inner{height:100%;min-height:0}
  .deck-flash .flash-face{padding:18px}
  /* 記号一覧テーブル */
  .symtable-wrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
  .symtable{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--panel)}
  .symtable th{background:var(--panel2);color:var(--sub);font-weight:700;font-size:11px;
    padding:9px 8px;text-align:left;border-bottom:1px solid var(--line)}
  .symtable td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.45}
  .symtable tr:last-child td{border-bottom:none}
  .symtable tr:nth-child(even){background:var(--panel2)}
  .symtable .st-sym{font-weight:900;color:var(--acc2);font-size:17px;white-space:nowrap;width:50px;text-align:center}
  .symtable .st-read{color:var(--sub);font-size:11px;white-space:nowrap;width:72px}
  .symtable .st-mean{color:#eef2fb;font-size:13px;font-weight:500}
  .symtable .st-en{display:inline-block;margin-top:6px;font-size:10.5px;color:var(--acc);font-weight:700;
    border:1px solid rgba(61,214,196,.35);border-radius:5px;padding:1px 7px;letter-spacing:.02em}
  /* 記号一覧ここまで */

  /* ---------- Buttons ---------- */
  .actions{display:flex;gap:10px}
  .btn{flex:1;border:none;border-radius:13px;padding:15px;font-size:14px;font-weight:700;cursor:pointer;
    font-family:inherit;transition:transform .12s,opacity .15s;display:flex;align-items:center;justify-content:center;gap:7px}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:linear-gradient(135deg,var(--acc),#2a9d8f);color:#04141a}
  .btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
  .btn.bad{background:rgba(255,93,108,.16);color:#ff8a95;border:1px solid rgba(255,93,108,.3)}
  .btn.good{background:rgba(61,220,132,.16);color:var(--good);border:1px solid rgba(61,220,132,.3)}
  .btn:disabled{opacity:.4;pointer-events:none}

  /* ---------- Result ---------- */
  .result{text-align:center;padding:20px 6px}
  .result .big{font-family:'Bebas Neue';font-size:72px;line-height:1;letter-spacing:.02em}
  .result .big.pass{color:var(--good)}
  .result .big.fail{color:var(--bad)}
  .result .verdict{font-size:18px;font-weight:900;margin:6px 0 4px}
  .result .desc{font-size:12.5px;color:var(--sub);margin-bottom:22px;line-height:1.6}
  .rstat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:22px}
  .rstat .box{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 8px}
  .rstat .box .n{font-family:'Bebas Neue';font-size:28px;line-height:1}
  .rstat .box .l{font-size:10px;color:var(--sub);margin-top:4px}
  .rstat .box.ok .n{color:var(--good)}
  .rstat .box.ng .n{color:var(--bad)}

  /* ---------- Calc reference ---------- */
  .ref-card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:12px}
/* v95: 「◯◯を求める場合」を公式の下にオレンジ枠で独立表示する */
.fcases{margin-top:11px;display:flex;flex-direction:column;gap:8px}
.fcase{border:1px solid var(--acc2);border-left:3px solid var(--acc2);border-radius:10px;padding:9px 11px;background:rgba(255,182,39,.06)}
.fcase .ft{font-size:11px;font-weight:800;color:var(--acc2);margin-bottom:5px;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;overflow-wrap:anywhere}
.fcase .fq{font-size:13px;font-weight:700;font-family:'Courier New',ui-monospace,monospace;color:var(--ink);line-height:1.85;overflow-wrap:anywhere;word-break:keep-all}
.fcase .fe{font-size:10.5px;color:var(--sub);margin-top:5px;line-height:1.5;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;overflow-wrap:anywhere}
  .ref-card h3{font-size:14px;font-weight:900;color:var(--acc2);margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .ref-card .when{font-size:10.5px;color:var(--sub);margin-bottom:11px}
  .ref-card .formula{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--acc2);
    border-radius:9px;padding:13px 14px;font-family:'SF Mono','Menlo','Consolas','Courier New',monospace;font-size:14px;letter-spacing:0;
    color:var(--acc2);margin-bottom:10px;line-height:2;font-weight:600;white-space:normal;overflow-wrap:anywhere;word-break:normal}
  .ref-card .note{font-size:12px;color:var(--sub);line-height:1.6}
  .ref-card .note b{color:var(--ink)}

  /* ---------- Bottom nav ---------- */
  nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
    height:calc(54px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
    background:#121829;backdrop-filter:blur(14px);
    border-top:1px solid var(--line);display:flex;z-index:10}
  nav button{flex:1;background:none;border:none;color:var(--sub);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:3px;cursor:pointer;font-family:inherit;transition:color .15s;padding:0 2px}
  nav button .ni{font-size:18px;line-height:1}
  nav button .nl{font-size:9px;font-weight:700;white-space:nowrap}
  nav button.on{color:var(--acc)}

  .empty{text-align:center;color:var(--sub);font-size:13px;padding:50px 20px;line-height:1.7}
  .pill{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;
    background:var(--panel2);border:1px solid var(--line);color:var(--sub);margin:0 4px 8px 0}
  .pill.on{background:var(--acc);color:#04141a;border-color:var(--acc)}

  .toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:11px 18px;border-radius:12px;
    font-size:12.5px;font-weight:600;opacity:0;transition:all .3s;z-index:50;box-shadow:var(--shadow);pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .filter-row{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
  .filter-row::-webkit-scrollbar{height:0}
  .chip{flex:none;font-size:11.5px;font-weight:700;padding:8px 13px;border-radius:20px;border:1px solid var(--line);
    background:var(--panel);color:var(--sub);cursor:pointer;white-space:nowrap;transition:all .15s}
  .chip.on{background:var(--acc);color:#04141a;border-color:var(--acc)}
/* CBT電卓 */
.calcwrap{margin-top:12px}
.calc-toggle{width:100%;padding:11px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;font-weight:700;font-size:14px}
.calc-pad{margin-top:8px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}
.calc-disp{background:var(--bg);color:var(--ink);font-family:'SF Mono','Menlo','Consolas','Courier New',monospace;font-size:20px;text-align:right;padding:10px 12px;border-radius:8px;margin-bottom:8px;min-height:24px;word-break:break-all}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc-keys button{padding:14px 0;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;font-size:17px;font-weight:700;cursor:pointer}
.calc-keys button:active{background:var(--acc);color:#04201c}

.formula .fh,.dformula .fh{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;font-size:12.5px;font-weight:700;color:var(--acc2);line-height:1.65;word-break:normal;overflow-wrap:anywhere;margin-bottom:1px}

.calc-modal-ov{position:fixed;inset:0;background:rgba(4,8,16,.62);z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px}
.calc-modal{width:100%;max-width:300px;background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 12px 44px rgba(0,0,0,.55)}

.kyo-chips{display:flex;flex-wrap:wrap;gap:7px}
.kyo-chips button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:999px;
  padding:8px 12px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit;text-align:left}

.kyo-body{font-size:12.5px;line-height:1.85;color:var(--ink);overflow-wrap:anywhere;white-space:pre-wrap}
.kyo-src-btn{margin-top:10px;background:none;border:none;color:var(--acc);font-size:11.5px;font-weight:700;
  padding:4px 0;cursor:pointer;font-family:inherit;text-decoration:underline}
.kyo-src{margin-top:8px;padding:10px 12px;background:var(--panel2);border-left:3px solid var(--line);border-radius:8px;
  font-size:11.5px;line-height:1.8;color:var(--sub);overflow-wrap:anywhere}

.puz-slots.ok .puz-slot .pw,.puz-slots.ok .puz-slot .ps{color:var(--good)}
.puz-slots.ng .puz-slot{border-color:var(--bad)}
.puz-slots.ng .puz-slot .pw,.puz-slots.ng .puz-slot .ps{color:var(--bad)}
.puz-pool{display:flex;flex-wrap:wrap;gap:8px}

.puz-cap{font-size:10.5px;font-weight:800;color:var(--sub);letter-spacing:.08em;margin:14px 2px 6px;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif}
.puz-pool button{min-height:46px;padding:6px 10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer}
.puz-pool button:disabled{opacity:.22}
.puz-pool button:active{transform:scale(.95)}
/* ---------- 模試CBT（解答状況グリッド・ペース警告） ---------- */
.qtimer.warn{color:var(--bad)}
.mock-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-height:300px;overflow-y:auto;margin-top:4px}
.mock-cell{padding:8px 0;text-align:center;font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:7px;background:var(--panel2);color:var(--sub);cursor:pointer}
.mock-cell.done{background:var(--acc);border-color:var(--acc);color:#06121e}
.mock-cell.flag{border-color:var(--bad);color:var(--bad)}
.mock-cell.done.flag{color:#06121e;box-shadow:inset 0 0 0 1.5px var(--bad)}
.mock-cell.cur{outline:2px solid var(--acc2)}
</style>

<script>
// ============================================================
//  QUESTION BANK  — 一等無人航空機操縦士 学科試験（教則第5版準拠・令和8年7月14日適用）
//  cat: 1=規則 2=システム 3=操縦者/運航体制 4=リスク管理 5=計算[一等]
//  lvl: "common"=二等相当 / "one"=一等のみ
// ============================================================
const BANK = [];
// ============ v63: 実出題準拠の再構築バンク（Excel210問＋教則補完41問・全問4択） ============
// ---- 第3章 規則（91問） ----
const Q_RULES = [
  {cat:1,lvl:"common",q:"航空法における無人航空機の定義について、適切なものを１つ選べ。",o:["航空法において、無人航空機は航空の用に供することができる飛行機、回転翼航空機、滑空機及び飛行船であり、構造上人が乗ることができず、遠隔操作または自動操縦により飛行でき、カメラ等の装備品も含めた重量が100グラム以上のものを指す。","航空法において、無人航空機は航空の用に供することができる飛行機、回転翼航空機、滑空機及び飛行船であり、構造上人が乗ることができず、遠隔操作または自動操縦により飛行でき、重量が100グラム以上のものを指す。","航空法において、無人航空機は航空の用に供することができる飛行機、回転翼航空機、滑空機及び飛行船であり、構造上人が乗ることができず、遠隔操作または自動操縦により飛行でき、重量が100グラム以上のものを指すが、もっぱら個人的な趣味利用の場合は除かれる。","航空法において、無人航空機は航空の用に供することができる飛行機、回転翼航空機、滑空機及び飛行船であり、構造上人が乗ることができず、遠隔操作により飛行でき、重量が100グラム以上のものを指し、自動操縦のみにより飛行するものは含まれない。"],a:1,e:"航空法の「無人航空機」は、次のすべてに当てはまるものです。\n・飛行機、回転翼航空機、滑空機、飛行船のいずれかであること\n・構造上、人が乗れないこと\n・遠隔操作または自動操縦（＝プログラムで自動的に操縦すること）で飛ばせること\n・重さが100グラム以上であること\n「構造上人が乗ることができない」は、人が座れる座席があるかないかだけで決まるものではありません。また、仕事で使うか個人の趣味で使うかは、航空法の定義には関係ありません。\nここでいう重さは、機体本体とバッテリーを合計した重さです。カメラなど、取り外せる付属品の重さは入れません。",ref:"教則 第3章 3.1.1 無人航空機の定義"},
  {cat:1,lvl:"common",q:"航空法における無人航空機の定義について、機体重量が何グラム以上のものが対象とされているか。",o:["200 グラム以上","250 グラム以上","150 グラム以上","100 グラム以上"],a:3,e:"航空法で「無人航空機」として扱われるのは、重さが100グラム以上のものです。100グラム未満のマルチローター等は無人航空機ではなく、「模型航空機」に分類されます。",ref:"教則 第3章 航空法における無人航空機の定義"},
  {cat:1,lvl:"common",q:"航空法における無人航空機の定義の一部である「重量が 100 グラム以上のもの」について、正しいものを１つ選べ。",o:["航空法では、無人航空機の重量は、無人航空機本体の重量及びバッテリーの重量の合計を指している。","航空法では、無人航空機の重量は、無人航空機本体、バッテリー及び取り外し可能な付属品の全ての重量を含む。","航空法では、無人航空機の重量は、無人航空機本体の重量を指している。","航空法では、無人航空機の重量は、バッテリーを除いた無人航空機本体とカメラ等の装備品の合計の重量を指している。"],a:0,e:"航空法でいう無人航空機の「重さ」は、機体本体とバッテリーを合計した重さです。取り外せるカメラなどの付属品の重さは入れません。",ref:"教則 第3章 3.1.1 無人航空機の定義（重量）"},
  {cat:1,lvl:"common",q:"航空法における無人航空機の定義の一部である「遠隔操作又は自動操縦により飛行させることができるもの」について、不適切なものを１つ選べ。",o:["航空法では、自動操縦により飛行させることができるものだけが無人航空機に該当する。","航空法における「自動操縦」には、プログラムにより自動的に操縦を行うことが含まれる。","航空法では、紙飛行機など遠隔操作又は自動操縦により制御できないものは無人航空機には該当しない。","航空法上、遠隔操作又は自動操縦により飛行させることができるものが全て無人航空機に該当するとは言えない。"],a:0,e:"航空法では、無人航空機は「遠隔操作 または 自動操縦（＝プログラムで自動的に操縦すること）で飛ばせるもの」と決められています。どちらか一方ができれば当てはまるので、「自動操縦で飛ばせるものだけが該当する」という説明は誤りです。\n紙飛行機のように、遠隔操作も自動操縦もできず制御できないものは、無人航空機には当てはまりません。逆に、遠隔操作や自動操縦で飛ばせても、重さが100グラム未満のものや、構造上人が乗れるものは無人航空機にはなりません。",ref:"教則 第3章 3.1.1 無人航空機の定義（遠隔操作・自動操縦）"},
  {cat:1,lvl:"common",q:"模型航空機について、もっとも正しいものを１つ選べ。",o:["重量110グラムのゴム動力模型機(遠隔・自動操縦不可)は無人航空機に含まれ、模型航空機には該当しない。","重量99グラムのマルチローターは模型航空機に含まれ、無人航空機には該当しない。","重量110グラムのゴム動力模型機(遠隔・自動操縦不可)は模型航空機に該当し、無人航空機にも該当する。","重量99グラムのマルチローターは、遠隔操作により飛行させることができるため無人航空機に該当し、模型航空機には該当しない。"],a:1,e:"模型航空機とは、ゴム動力模型機や、重さ100グラム未満のマルチローター等のことです。\n重さ100グラム未満のマルチローターは無人航空機には当たらず、模型航空機に分類されます。\nまた、ゴム動力模型機は「遠隔操作または自動操縦で飛ばせる」という無人航空機の条件を満たさないため、重さが100グラム以上でも無人航空機にはならず、基本的に模型航空機に当たります。",ref:"教則 第3章 3.1.1 無人航空機の定義（模型航空機）"},
  {cat:1,lvl:"common",q:"模型航空機に対する規制について、適切ではないものを１つ選べ。",o:["国土交通省が災害等の発生時に緊急用務空域を設定した場合、無人航空機は当該空域における飛行が禁止されるが、模型航空機については飛行が禁止されない。","空港等の周辺、航空路内の空域（高度１５０メートル以上）、高度２５０メートル以上の空域において、模型航空機を飛行させる場合には、国土交通省への事前の届出が必要となる。","重量１００グラム未満の模型航空機であっても、航空機の飛行に影響を及ぼすおそれのある行為は航空法により規制されている。","航空交通管制圏、航空交通情報圏、航空交通管制区内の特別管制空域等における模型航空機の飛行は禁止されている。"],a:0,e:"重さ100グラム未満の模型航空機でも、航空機の飛行に影響を及ぼすおそれのある行為は航空法で規制されています。具体的には次のとおりです。\n・航空交通管制圏、航空交通情報圏、航空交通管制区内の特別管制空域等では、模型航空機の飛行が禁止されています\n・空港等の周辺、航空路内の空域（高度150メートル以上）、高度250メートル以上の空域で飛ばすときは、国土交通省への事前の届出が必要です\n・国土交通省が緊急用務空域を指定したときは、無人航空機だけでなく模型航空機の飛行も禁止されます\nしたがって「模型航空機は緊急用務空域では飛行が禁止されない」という説明は誤りです。",ref:"教則 第3章 3.1.1 模型航空機に対する規制"},
  {cat:1,lvl:"common",q:"航空法により規制される無人航空機の飛行空域について、正しいものを１つ選べ。",o:["空港等の周辺の空域、緊急用務空域、地表又は水面から150メートル以上の高さの空域、人口集中地区（工業専用地域内の区域を除く。）の上空は、無人航空機の飛行が原則禁止されている。","空港等の周辺や人口集中地区の上空であっても、自分の土地の上空であれば許可なく飛行させることができる。","緊急用務空域は、ドクターヘリなど空港ではないが有人機が頻繁に離着陸する周辺の空域で、原則飛行が禁止されている。","人口集中地区の上空であっても、高度150メートル未満の飛行であれば許可なく飛行させることができる。"],a:0,e:"航空法で無人航空機の飛行が原則禁止されている空域は、次の4つです。\n・空港等の周辺の空域\n・緊急用務空域\n・地表または水面から150メートル以上の高さの空域\n・人口集中地区の上空\nこのうち人口集中地区については、令和8年7月の改正で「工業専用地域内の区域の上空を除く。」となりました。都市計画法第8条第1項第1号の工業専用地域内で飛ばす場合は、DID（人口集中地区）に関する許可手続き等が不要です。\nこれらの空域では、自分の土地の上空であっても飛ばせません。\nまた緊急用務空域は、捜索・救助その他の緊急用務を行う航空機の安全を守るため、国土交通省がその都度指定して公示する空域です。あらかじめ決まっている空域ではありません。",ref:"教則 第3章 3.1.1 飛行禁止空域"},
  {cat:1,lvl:"common",q:"無人航空機の飛行に関する空域の制限について、適切ではないものを１つ選べ。",o:["無人航空機は高度150メートル以上(地表からの高度)または空港周辺の空域の飛行は原則禁止されている。","高度150メートルの「高度」とは地表からの高度であるため、標高1,000ｍの山頂から垂直に100ｍ上昇させる場合は許可が不要である。","飛行禁止空域を飛行する場合には、当該空域を管轄する航空交通管制機関等と調整し、支障の有無を確認したうえで飛行の許可を受ける必要がある。","空港周辺の空域で飛行を行う場合は、当該空港の制限高より低い高度で飛行させる場合でも、必ず許可を取得する必要がある。"],a:3,e:"無人航空機は、高度150メートル以上（地表または水面からの高さ）の空域や、空港等の周辺の空域では原則として飛ばせません。無人航空機と有人の航空機が飛ぶ空域を分けて、安全を守るためです。\nこれらの空域を飛ぶときは、その空域を管轄する航空交通管制機関等と調整し、支障がないかを確認したうえで、飛行の許可を受ける必要があります。\nただし、各空港に決められている制限高以下で飛ばす場合は、許可なく飛ばせる可能性があります。そのため「制限高より低い高度でも必ず許可が必要」とは言えません。なお、地理院地図で紫色に示されている範囲の中は、制限高以下でも許可が必要です。",ref:"教則 第3章 3.1.1 飛行禁止空域（空港等の周辺・高度150m以上）"},
  {cat:1,lvl:"common",q:"「高度150メートル以上の飛行禁止空域」について、正しいものを１つ選べ。",o:["山岳部等、地形が起伏している場合でも、海抜飛行高度が一定であれば高度について心配する必要はない。","「高度１５０メートル以上の飛行禁止空域」とは、海抜高度が１５０メートル以上の空域を指す。","離陸した地点からの高度差が150メートル以上となる空域を指す。","無人航空機が飛行している直下の地表または水面からの高度差が150メートル以上の空域を指す。"],a:3,e:"「高度150メートル以上の飛行禁止空域」とは、無人航空機が飛んでいる真下の地表または水面からの高さの差が150メートル以上になる空域のことです。海抜（標高）で測った高さでも、離陸した地点からの高さの差でもありません。\nそのため、山岳部など起伏の激しい地形の上空を飛ばすときは、気づかないうちに真下の地表から150メートル以上の高さになってしまうことがあるので注意が必要です。",ref:"教則 第3章 3.1.1 飛行禁止空域（高度150m以上）"},
  {cat:1,lvl:"common",q:"緊急用務空域について、最も適切なものを１つ選べ。",o:["緊急用務空域は航空法で予め指定されている場所である。","無人航空機の操縦者は、飛行開始前に飛行させる空域が緊急用務空域に該当するか否かを確認する必要はない。","国土交通省は、緊急用務を行う航空機の飛行が想定される場合、その都度「緊急用務空域」を指定する。","重量が１００グラム未満であれば緊急用務空域でも許可なく飛行できる。"],a:2,e:"「緊急用務空域」は、災害等の規模に応じて、緊急用務を行う航空機が飛ぶことが想定される場合に、国土交通省がその都度指定する空域です。あらかじめ場所が決まっているものではありません。\nこの空域では無人航空機の飛行が原則禁止で、重さ100グラム未満の模型航空機も飛行禁止の対象になります。\n操縦者は、飛行を始める前に、飛ばす空域が緊急用務空域に当たるかどうかを確認することが義務づけられています。",ref:"教則 第3章 3.1.1 緊急用務空域"},
  {cat:1,lvl:"common",q:"「人口集中地区（DID：Densely Inhabited District）」について、最も適切なものを１つ選べ。",o:["総務省が毎月公表する人口推計に基づき、随時更新される地域である。","５年毎に実施される国勢調査の結果から一定の基準により設定される地域である。","国土交通省が毎年実施する人口密度の調査結果から一定の基準により設定される地域である。","１０年毎に実施される国勢調査の結果から一定の基準により設定される地域である。"],a:1,e:"「人口集中地区（DID：Densely Inhabited District）」は、5年ごとに行われる国勢調査の結果をもとに、一定の基準で設定される地域です。人口密度が特に高い地域を指します。\n国土交通省や市町村議会が指定するものではありませんし、人口推計によって随時更新されるものでもありません。",ref:"教則 第3章 3.1.2 無人航空機の飛行禁止空域（人口集中地区）"},
  {cat:1,lvl:"common",q:"人口集中地区での飛行について、最も適切なものを１つ選べ。",o:["人口集中地区の上空であっても、補助者を配置すれば許可なく飛行できる。","人口集中地区かどうかは、平成27年度の国勢調査の結果に基づき判断される。","高度150ｍ以上の空域は、人口集中地区には該当しない。","実際に人が住んでいない場所は、人口集中地区には該当しない。"],a:2,e:"人口集中地区かどうかは国勢調査の結果で決まりますが、5年ごとに更新されるため、平成27年度の国勢調査の結果に固定されるわけではありません（現在は令和2年の国勢調査の結果による人口集中地区が使われています）。\n見た目に人が住んでいない場所でも、国勢調査の結果で設定されていれば人口集中地区に当たります。また、補助者を置いても人口集中地区上空の飛行の許可が不要になることはありません。\n航空法上、高度150メートル以上の空域は人口集中地区には当たりません（この高さは別の飛行禁止空域なので、そちらの許可が必要です）。実際には、両方の許可を取って飛ばすケースが多くあります。\nなお、令和8年7月の改正により、都市計画法第8条第1項第1号の工業専用地域内で無人航空機を飛ばす場合は、DID（人口集中地区）に関する許可手続き等が不要になりました。",ref:"教則 第3章 3.1.2 無人航空機の飛行禁止空域（人口集中地区）"},
  {cat:1,lvl:"common",q:"規制対象となる無人航空機の飛行方法として、もっとも適切なものを一つ選べ。",o:["夜間飛行（日没後から日出まで）","速度40km/hを超える飛行","第三者又はその物件との間の距離が50メートル未満での飛行","無人航空機から物件を吊り下げて輸送する飛行"],a:0,e:"航空法で規制の対象になる飛ばし方は、次のようなものです。\n・夜間飛行（日没後から日出まで）\n・操縦者の目視外での飛行（目視外飛行）\n・第三者やその物件との距離が30メートル未満での飛行\n・祭礼、縁日、展示会など多数の人が集まる催しが行われている場所の上空での飛行\n・爆発物など危険物の輸送\n・無人航空機からの物件の投下\nこれらは、航空機の航行の安全と、地上や水上の人・物の安全を守るための規制です。\n飛行の速度、音が出ること、雨の日に飛ばすことは、航空法で承認が必要な飛ばし方には入っていません。",ref:"教則 第3章 3.1.1 規制対象となる飛行の空域及び方法（特定飛行）"},
  {cat:1,lvl:"common",q:"目視外飛行について、最も適切なものを１つ選べ。",o:["操縦者がコンタクトをして双眼鏡でドローンを確認しながら飛行を行う場合は目視外飛行に該当する。","操縦者がモニターを見ながら行う飛行であっても、補助者がドローンを目視していれば目視外飛行に該当しない。","操縦者が眼鏡を使用してドローンを視認しながら行う飛行は、目視外飛行に該当する。","目視外飛行を行う場合は、航空局の承認を取得し、必ず補助者を配置しなければいけない。"],a:0,e:"目視内飛行とは、操縦者が自分の肉眼で無人航空機を見ながら飛ばすことです。眼鏡やコンタクトレンズを使うのは「目視」に含まれますが、双眼鏡を使う場合は肉眼とはいえず、目視外飛行になります。FPVゴーグルを着けて飛ばす場合も目視外飛行です。\n補助者が見ていても、操縦者本人が見ていなければ目視外飛行となり、航空局の承認が必要です。\nなお、目視外飛行は、承認を受けたうえで一定の条件を満たせば、補助者を置かなくてよい場合があります。",ref:"教則 第3章 3.1.2 無人航空機の飛行の方法（目視外飛行）"},
  {cat:1,lvl:"common",q:"無人航空機の「目視による常時監視」について不適切なものを１つ選べ。",o:["操縦者がモニターにより監視しているとき、補助者が肉眼で監視していれば「目視による常時監視」と言える。","操縦者が双眼鏡やモニター(FPVを含む)で行う監視は「目視による常時監視」に含まれない。","「目視による常時監視」とは、操縦者自身が自分の目で無人航空機及びその周囲の状況を常に監視することをいう。","操縦者が眼鏡やコンタクトレンズを使用して行う監視は「目視による常時監視」に含まれる。"],a:0,e:"「目視による常時監視」とは、操縦者が自分の目で、無人航空機とその周りの状況を常に見ながら飛ばすことです。\n双眼鏡やモニター（FPVを含む）で見ることや、補助者が見ることは、これに含まれません。一方、眼鏡やコンタクトレンズを使って見ることは「目視」に含まれます。",ref:"教則 第3章 3.1.2 無人航空機の飛行の方法（目視による常時監視）"},
  {cat:1,lvl:"common",q:"無人航空機の昼間（日中）における飛行について、最も適切なものを１つ選べ。",o:["無人航空機の飛行範囲が照明等で十分照らされている場合は、昼間（日中）の飛行と言える。","昼間（日中）とは、現地において太陽の光が目視できる時間から目視できなくなる時間までを指す。","昼間（日中）とは、国立天文台が発表する日の出から日の入りの時刻までの間を指す。","昼間（日中）とは、気象庁が発表する日の出から日の入りの時刻までの間を指す。"],a:2,e:"昼間（日中）とは、国立天文台が発表する日の出から日の入りまでの間のことです。現地で操縦者が太陽の光の見え方から判断する時間帯でも、決まった時刻で一律に区切った時間帯でもありません。\nまた、飛ばす範囲が照明などで十分明るく照らされていても、昼間（日中）の飛行とはいえません。照明で十分照らすことは、機体の姿勢や向きを正確に見分けられる灯火がないときに、夜間飛行の承認で認められる代わりの措置という位置づけです。\n日の入りから日の出までの飛行（夜間飛行）には、航空法に基づく承認が必要です。",ref:"教則 第3章 3.1.2 無人航空機の飛行の方法（夜間飛行）"},
  {cat:1,lvl:"common",q:"無人航空機による「物件の投下」について最も適切なものを１つ選べ。",o:["輸送した物件を地上の人員に受け渡す行為は、物件の投下に含まれる。","物件の投下には、危険物に該当しない水の噴射も含まれる。","物件の投下には、無人航空機を使って物件を設置する（置く）行為も含まれる。","自身の土地の上空であれば、航空局の承認を受けずに物件の投下を行うことができる。"],a:1,e:"物件の投下には、水や農薬などの液体・霧状のものをまくことも含まれます。\n一方、無人航空機を使って物件を設置する（置く）行為や、物件を地表などに落とさずに地上の人へ手渡しする行為は、物件の投下には含まれません。\n無人航空機から物件を投下することは原則禁止で、自分の土地だからとか、操縦者の判断だからという理由で、承認なしに行えるものではありません。",ref:"教則 第3章 3.1.2 無人航空機の飛行の方法（物件投下）"},
  {cat:1,lvl:"common",q:"無人航空機から物件を投下させることについて、もっとも正しいものを１つ選べ。",o:["農薬等の液体を散布することは物件投下に含まれるが、水等の無害なものであれば物件投下とはならない。","水面に物件を置く行為は物件投下に含まれない。","液体を散布することは危害を加える恐れが少ないため、物件投下からは除かれる。","輸送した物件を地表に置く行為は、物件の投下に含まれる。"],a:1,e:"物件の投下には、水や農薬などの液体・霧状のものをまくことも含まれます。無害なものでも同じ扱いです。\n一方、無人航空機を使って、物件を地表などに落とさずに地上の人へ手渡しする行為や、運んだ物件を地表に置く行為は、物件の投下には含まれません。この「地表」には水面も含まれます。",ref:"教則 第3章 3.1.2 無人航空機の飛行の方法（物件投下）"},
  {cat:1,lvl:"common",q:"無人航空機による「危険物の輸送」について不適切なものを１つ選べ。",o:["危険物には、業務用機器(カメラ等)に用いられる電池は含まれない。","危険物には、無人航空機の飛行のために必要な燃料や電池、安全装置としてのパラシュートを開傘するために必要な火薬類や高圧ガスを含む。","危険物の輸送は規制対象となる飛行の方法に該当し、行う場合には国土交通大臣の承認が必要である。","危険物には、火薬類、高圧ガス、引火性液体、可燃性物質、酸化性物質類、毒物類、放射性物質、腐食性物質が含まれる。"],a:1,e:"「危険物」に当たるのは、火薬類、高圧ガス、引火性液体、可燃性物質、酸化性物質類、毒物類、放射性物質、腐食性物質などです。\nただし、その無人航空機を飛ばすために積んでいる物は「危険物」には当たりません。たとえば次のものは対象外です。\n・飛行に必要な燃料や電池\n・安全装置としてのパラシュートを開くために必要な火薬類や高圧ガス\n・業務用機器（カメラ等）に使う電池\nなお、危険物の輸送は規制対象となる飛ばし方に当たるため、行うには国土交通大臣の承認が必要です。",ref:"教則 第3章 規制対象となる飛行の方法（危険物の輸送）"},
  {cat:1,lvl:"common",q:"無人航空機の「催し場所上空」についての飛行規制について正しいものを１つ選べ。",o:["プロスポーツの試合や屋外コンサートは、主催者が安全管理を行っているため「多数の者の集合する催し」には該当しない。","「多数の者の集合する催し」には、集合する者の人数が一番の判断基準となる。","信号待ちや混雑により生じる人混み等は「多数の者の集合する催し」に該当する可能性が高い。","運動会、盆踊り大会、デモは「多数の者の集合する催し」に該当する可能性が高い。"],a:3,e:"「多数の者の集合する催し」とは、特定の場所や日時に開かれる、多くの人が集まるもののことです。当てはまるかどうかは、集まる人数や規模だけでなく、特定の場所や日時に開催されるものかどうかも合わせて総合的に判断されます。\n当てはまる例は次のとおりです。\n・祭礼、縁日、展示会\n・プロスポーツの試合、スポーツ大会、運動会\n・屋外で開催されるコンサート等のイベント、花火大会、盆踊り大会\n・マラソン、街頭パレード、屋外演説会、デモ（示威行為）\n一方、信号待ちや混雑でできる人混みのように、自然に発生したものは当てはまりません。",ref:"教則 第3章 3.1.2 無人航空機の飛行の方法（催し場所上空の飛行）"},
  {cat:1,lvl:"common",q:"航空法上の催し場所上空に該当する例として、もっとも正しいものを１つ選べ。",o:["第三者の立入管理措置が行われていることが明白である場所でのドローンショーの事前練習","信号待ちや混雑により自然発生的に生じた人混み","選挙等における屋外演説会","関係者のみが参加する屋外の結婚式会場"],a:2,e:"「催し場所」とは、人が集まるイベントの場所のことです。次のようなものが当てはまります。\n・祭礼、縁日、展示会\n・プロスポーツの試合、スポーツ大会、運動会\n・屋外で開催されるコンサート等のイベント、ドローンショー、花火大会、盆踊り大会\n・マラソン、街頭パレード、選挙等における屋外演説会、デモ\nそのため「選挙等における屋外演説会」が正解です。\n一方、次のものは催し場所に当てはまりません。\n・ドローンショーでも、自社敷地内や無人の競技場内など、第三者の立入管理措置（＝第三者が入らないように管理すること）が行われていることが明白な場所での事前練習や、企業向けの配信用撮影\n・関係者のみが参加する催し場所上空の飛行\n・信号待ちや混雑で自然発生的に生じた人混み",ref:"教則 第3章 3.1.1 催し場所上空の飛行（p.7）"},
  {cat:1,lvl:"common",q:"「十分な強度を有する紐等で係留した場合の例外」について正しいものを１つ選べ。",o:["30ｍのワイヤーで無人航空機を係留し、飛行可能な範囲内への立入管理等の措置を講じた場合であっても、催し場所上空の飛行承認は不要とはならない。","40ｍのワイヤーで無人航空機を係留し、飛行可能な範囲内への立入管理等の措置を講じた場合、人口集中地区に係る許可が不要となる。","人が紐等を持って移動しながら無人航空機を飛行させる場合も係留に該当し、立入管理等の措置を講じれば夜間飛行に係る承認が不要となる。","走行する自動車に10ｍ以下のワイヤーで無人航空機を係留し、飛行可能な範囲内への立入管理等の措置を講じた場合、目視外飛行に係る承認が不要となる。"],a:0,e:"十分な強度のある紐等（30ｍ以下）で無人航空機を係留し、飛べる範囲に第三者が入らないよう立入管理等の措置をとった場合、次の許可・承認が不要になります。\n・人口集中地区\n・夜間飛行\n・目視外飛行\n・第三者から30メートル以内の飛行\n・物件投下\n催し場所上空の飛行はこの例外に入っていません。そのため、30ｍのワイヤーで係留して立入管理等の措置をとっても、承認は必要なままです。これが正解です。\n他の選択肢が誤りである理由は次のとおりです。40ｍのワイヤーは「30ｍ以下」に収まりません。また、自動車や航空機など移動する物件に紐等を固定したり、人が紐等を持って移動しながら飛ばす行為（えい航）は、そもそも係留に当たりません。",ref:"教則 第3章 3.1.2 係留の例外（p.13）"},
  {cat:1,lvl:"common",q:"捜索又は救助のための特例における「捜索又は救助」の考え方として、もっとも適切なものを１つ選べ。",o:["被災地の孤立地域への生活必需品の輸送も含まれる可能性がある。","危険を伴う箇所での調査・点検のための防災訓練も含まれる可能性がある。","住民避難後の住宅の防犯対策のための飛行は含まれない。","人命や財産に急迫した危難のおそれがない場合であっても、災害に関連する飛行であれば含まれる可能性がある。"],a:0,e:"「捜索又は救助」とは、事故や災害などが起きたときに、人命や財産に急迫した危難（＝差し迫った危険）のおそれがある場合に、その危険を避けるためにとる措置のことです。特例が使えるのは、その措置をとることに緊急性がある飛行です。\n具体的には、次のものが特例の対象になり得ます。\n・被災者の捜索又は救助\n・被災地の孤立地域等への医薬品、衛生用品、食料品、飲料水等の生活必需品の輸送\n・危険を伴う箇所での調査・点検\n・住民避難後の住宅やその地域の防犯対策のための飛行\nそのため「生活必需品の輸送」が正解です。住民避難後の住宅の防犯対策も対象になり得るので、「含まれない」とするのは誤りです。防災訓練は緊急性があるとはいえないため、対象になりません。また、人命や財産に急迫した危難のおそれがあることが前提なので、それがない飛行は災害に関連していても対象外です。",ref:"教則 第3章 3.1.2 捜索又は救助等のための特例（p.13）"},
  {cat:1,lvl:"common",q:"「捜索、救助等のための特例」に関連する無人航空機の運用について、正しいものを１つ選べ。",o:["国や地方公共団体から依頼を受けた者が、事故、災害等で無人航空機を飛行させる場合、特例として飛行の許可・承認などの手続きは不要となるため、周囲の安全への配慮も不要となる。","事故、災害等に際し、国や地方公共団体から依頼を受けた者が無人航空機を飛行させる場合、特定飛行を行う場合であっても許可承認等の手続きが不要となる可能性がある。","この特例の対象は国や地方公共団体が自ら無人航空機を飛行させる場合に限られており、依頼を受けた民間の者による飛行は特例の対象とならない。","災害時の対応であって緊急性を有する場合は、国や地方公共団体にかかわらない独自の活動であっても、特定飛行に係る手続きが不要となる可能性がある。"],a:1,e:"事故や災害等に際して、人命や財産に急迫した危難（＝差し迫った危険）のおそれがある場合に、危難を避けるための措置として無人航空機を飛ばすときは、特例として飛行の空域や方法の規制が適用されず、許可承認等の手続きが不要になります。対象になるのは次の人です。\n・国や地方公共団体\n・国や地方公共団体から依頼を受けた者\n依頼を受けた民間の人も対象になるため、正解の記述のとおりです。\nただし、国や地方公共団体に関わらない独自の活動は特例の対象外で、国の飛行の許可・承認などの手続きが必要です。また、特例で許可承認が不要になった場合でも、周囲の安全に配慮して飛ばす必要があります。",ref:"教則 第3章 捜索、救助等のための特例"},
  {cat:1,lvl:"common",q:"無人航空機の飛行自粛要請について、正しいものを１つ選べ。",o:["飛行自粛要請空域にて飛行を行ったものは、10万円以下の罰金に処される可能性がある。","飛行自粛要請空域が設定された場合は、要請元である警察などの関係省庁のホームページ・Twitter（X）にて公示される。","無人航空機の飛行自粛要請は、各省庁が法令等に基づき自粛要請をし、それを国交省が取りまとめてホームページやTwitter(X)にて公示した規制である。","国土交通省は無人航空機の飛行自粛を要請することがあり、操縦者は飛行を開始する前に飛行自粛要請空域の確認と要請内容に基づく適切な対応が求められる。"],a:3,e:"飛行自粛要請は、法令等に基づく規制ではありません。警備上の観点等から、警察などの関係省庁等の要請を受けて、国土交通省が無人航空機の飛行の自粛を求めるものです。\n飛行自粛要請空域が設定される場合は、国土交通省のホームページ・Twitter（X）で公示されます。要請元である警察などのホームページで公示されるのではありません。\n操縦者は、飛行を始める前に、その空域が飛行自粛要請空域に当たるかどうかを確認し、要請内容に基づいて適切に対応することが必要です。",ref:"教則 第3章 無人航空機の飛行自粛要請"},
  {cat:1,lvl:"common",q:"「第三者」の定義について、最も適切なものを１つ選べ。",o:["無人航空機が計画外の挙動を示した場合に従うべき明確な指示と安全上の注意を受けていることは、間接関与者の要件の１つである。","無人航空機の飛行の目的に関与するかどうかを自ら決定していない者は、直接関与者ではなく間接関与者となる。","操縦者が無人航空機の飛行の目的の全部又は一部に関与していると判断した者は、直ちに間接関与者となる。","現に操縦はしていないが操縦する可能性のある者は、無人航空機の飛行に直接関与している者には含まれない。"],a:0,e:"「第三者」とは、無人航空機の飛行に直接も間接も関与していない人のことです。\n直接関与している人は次のとおりです。\n・操縦者\n・現に操縦はしていないが操縦する可能性のある人\n・補助者等、飛行の安全確保に必要な要員\n間接的に関与している人は、次のすべてに当てはまる人です。\n・飛行目的について、飛ばす人と共通の認識を持っている\n・計画外の挙動（＝予定外の動き）に対する明確な指示と安全上の注意を理解している\n・自ら飛行目的の一部に関与するかどうかを決められる\n正解の記述は、この間接関与者の要件の1つにあたります。\n他の選択肢が誤りである理由は次のとおりです。飛行の目的に関与するかどうかを自ら決めていない人は、間接関与者ではなく第三者になります。判断するのは本人であり、操縦者が関与していると判断しただけで間接関与者になるわけではありません。また、現に操縦はしていないが操縦する可能性のある人は、直接関与している者に含まれます。",ref:"教則 第3章 3.1.2 第三者及び第三者上空の定義（p.18）"},
  {cat:1,lvl:"common",q:"「第三者上空」について、適切なものを１つ選べ。",o:["飛行の安全確保に必要な補助者の上空は、第三者上空に含まれる。","無人航空機の飛行目的について共通の認識を持つ間接関与者の上空は、第三者上空に含まれる。","無人航空機の落下距離の範囲内に第三者がいる場合は第三者上空とみなされる。","移動車両の上空は、衝突から保護される状況であれば第三者の上空とはみなされない。"],a:2,e:"「第三者上空」とは、関与者以外の人（第三者）の上空のことです。第三者が乗り込んでいる移動中の車両等の上空も含まれます。\nここでいう「上空」は、第三者の直上だけを指すのではありません。無人航空機の落下距離（飛行範囲の外周から、製造者等が保証した落下距離）を踏まえ、機体が落下する可能性のある領域に第三者がいる場合は、その第三者の上空にあるものとみなされます。これが正解です。\n一方、飛行の安全確保に必要な補助者や、飛行目的について共通の認識を持つ間接関与者は関与者なので、その上空は第三者上空にはなりません。",ref:"教則 第3章 3.1.2 第三者及び第三者上空の定義（p.18）"},
  {cat:1,lvl:"common",q:"「立入管理措置」について、不適切なものを１つ選べ。",o:["「立入管理措置」には、補助者による監視及び口頭警告が含まれる。","「立入管理措置」を講じることができるか否かにより、特定飛行はカテゴリーⅡ飛行とカテゴリーⅢ飛行に区分される。","「立入管理措置」には、関係者以外の立入りを制限する旨の看板とコーン等による表示は含まれない。","無人航空機の飛行経路下において第三者の立入りを管理する措置を「立入管理措置」という。"],a:2,e:"「立入管理措置」とは、無人航空機の飛行経路の下に第三者が入らないように管理する措置のことです。例えば次のものが当てはまります。\n・関係者以外の立入りを制限する旨の看板\n・コーン等による表示\n・補助者による監視及び口頭警告\nつまり看板やコーン等による表示も立入管理措置に含まれるので、「含まれない」とする記述が不適切であり、これが正解です。\nなお、この措置ができるかどうかで、特定飛行はカテゴリーⅡ飛行とカテゴリーⅢ飛行に区分され、必要となる手続き等が変わります。",ref:"教則 第3章 立入管理措置"},
  {cat:1,lvl:"common",q:"航空交通管制区域について、正しいものを１つ選べ。",o:["航空交通管制区は、地表又は水面から200メートル以上の高さの空域で国が指定したもので、航空機は航空交通管制機関と連絡を取りながら飛行する。","航空交通管制区は、航空機の離着陸が頻繁に実施される空港等及びその周辺の空域で国が指定したもので、航空機は航空交通管制機関と連絡を取りながら飛行する。","航空交通管制区は、地表又は水面から150メートル以上の高さの空域で国が指定したもので、航空機は航空交通管制機関と連絡を取りながら飛行する。","航空交通管制区は、地表又は水面から300メートル以上の高さの空域で国が指定したもので、航空機は航空交通管制機関と連絡を取りながら飛行する。"],a:0,e:"航空交通管制区は、地表又は水面から200メートル以上の高さの空域のうち、国が指定した空域です。この区域では、計器飛行方式で飛ぶ航空機が航空交通管制機関と常時連絡を取り、飛行の方法等の指示に従って飛びます。150メートルでも300メートルでもなく、200メートルという数字がポイントです。\n名前の似た「航空交通管制圏」は、航空機の離着陸が頻繁に行われる空港等とその周辺の空域です。こちらは全ての航空機が航空交通管制機関と連絡を取り、飛行の方法や離着陸の順序等の指示に従って飛ぶ必要があります。",ref:"教則 第3章 航空機の運航ルール等（航空交通管制区・航空交通管制圏）"},
  {cat:1,lvl:"common",q:"空港の制限表面について、正しいものを１つ選べ。",o:["全ての空港に設定されている制限表面は、進入表面、水平表面、外側水平表面である。","全ての空港に設定されている制限表面は、進入表面、水平表面、転移表面、円錐表面である。","全ての空港に設定されている制限表面は、進入表面、水平表面、転移表面である。","全ての空港に設定されている制限表面は、進入表面、転移表面、円錐表面である。"],a:2,e:"制限表面とは、航空機が安全に離着陸できるように、空港周辺の一定の空間を障害物がない状態にしておくためのものです。\n全ての空港に設定されているのは、次の3つです。\n・進入表面…進入の最終段階と離陸時の安全を確保する\n・水平表面…旋回飛行等、低空飛行の安全を確保する\n・転移表面…進入をやり直す場合等、側面方向への飛行の安全を確保する\nそのため「進入表面・水平表面・転移表面」が正解です。\n円錐表面、延長進入表面、外側水平表面は、東京・成田・中部・関西国際空港及び政令で定める空港だけに設定されるため、これらを含む選択肢は誤りです。",ref:"教則 第3章 航空機の運航ルール等（制限表面）"},
  {cat:1,lvl:"common",q:"航空機が飛行する方式について、正しいものを１つ選べ。",o:["計器飛行方式（IFR）は航空交通管制機関が与える指示等に常時従う飛行の方式であり、高速で高高度を移動する旅客機は通常は計器飛行方式（IFR）で飛行する。","有視界飛行方式（VFR）は、航空交通管制機関が与える指示等に常時従って行う飛行の方式であり、高速で高高度を移動する旅客機は通常は有視界飛行方式（VFR）で飛行する。","有視界飛行方式（VFR）は、航空機の操縦者の判断に基づき飛行する方式であり、気象状態により有視界飛行方式（VFR）が出来なくなった場合は、有視界飛行方式（VFR）の航空機は必ず着陸をすることが求められる。","有視界飛行方式（VFR）は、航空機の操縦者の判断に基づき飛行する方式であり、小型機や回転翼航空機は有視界飛行方式（VFR）で飛行することが多いため、航空交通管制機関から指示を受けて飛行することはない。"],a:0,e:"航空機の飛行の方式には、「計器飛行方式（IFR）」と「有視界飛行方式（VFR）」の2つがあります。\n・計器飛行方式（IFR）…航空交通管制機関が与える指示等に常時従って飛ぶ方式です。高速で高高度を移動する旅客機は、通常この方式で飛びます。これが正解です。\n・有視界飛行方式（VFR）…航空機の操縦者の判断に基づいて飛ぶ方式です。ただし空港及びその周辺では、航空交通管制機関が与える指示等に従う必要があります。\n小型機や回転翼航空機はVFRで飛ぶことが多く、気象状態でVFRができなくなった場合は、計器飛行方式（IFR）で飛ぶこともあります。必ず着陸しなければならないわけではありません。",ref:"教則 第3章 航空機の運航ルール等（飛行の方式）"},
  {cat:1,lvl:"common",q:"航空機の機長の出発前の義務について、正しいものを１つ選べ。",o:["機長は出発前に、国土交通大臣から提供される航空情報を確認する義務がある。","機長は出発前に、国土交通大臣から提供される航空情報を確認するよう努めるものとされており、確認は義務ではない。","機長は出発前に航空情報を確認する義務はなく、飛行開始後に必要に応じて確認すれば足りる。","機長は出発前に、無人航空機の操縦者から提供される航空情報を確認する義務がある。"],a:0,e:"航空機の機長は、出発前に運航に必要な準備が整っていることを確認しなければなりません。これは努力目標ではなく義務で、飛行を始めてから確認すればよいというものでもありません。\nこの確認には、国土交通大臣から提供される航空情報の確認も含まれます。無人航空機の操縦者から提供されるものではありません。航空情報には、航空路の安全に関する情報や気象情報など、飛行に重要な情報が含まれています。",ref:"教則 第3章 3.1.1 航空機の運航ルール（p.7）"},
  {cat:1,lvl:"common",q:"無人航空機の操縦者が理解するべき航空機の運航ルールについて、正しいものを１つ選べ。",o:["航空機の操縦者は無人航空機を容易に視認して回避できるため、航空機側が回避することとされている。","無人航空機は航空機と比較して一般的には機動性が高いため、進路権は航空機が有する。","航空機と無人航空機が接近した場合、航空機の方が計器の性能が高いため、航空機側が避けることが望ましい。","航空機は無人航空機に対して一般的に機動性が高いため、進路権は無人航空機が有する。"],a:1,e:"航空機の航行の安全は最優先されるものです。航空機の側から無人航空機を見つけて避けるのは困難です。一方、無人航空機は一般的に機動性が高いと考えられるため、無人航空機の側が航空機との接近を前もって避けるのが妥当とされています。\nそのため、進路権を持つのは航空機です。「航空機側が避ける」「進路権は無人航空機が持つ」とする選択肢は逆になっています。",ref:"教則 第3章 航空法全般（航空機の運航ルール等）"},
  {cat:1,lvl:"common",q:"無人航空機登録制度の目的について、最も適切なものを１つ選べ。",o:["DIPSとの連携による飛行許可申請の手続きの負担軽減、迅速な許可承認書の発行。","無人航空機の操縦者の操縦技能の証明、技能証明の取得促進による操縦者の育成。","事故発生時の所有者把握、事故原因の究明、安全問題のある機体登録の拒否を通じての安全確保。","無人航空機の生産促進、競争力強化、無人航空機産業の国内市場拡大。"],a:2,e:"無人航空機登録制度の主なねらいは、次のとおりです。\n・事故が起きたときなどに所有者を把握すること\n・事故原因の究明など、安全確保上の措置を実施すること\n・安全上問題のある機体の登録を拒否すること\nこれらを通じて航空全体の安全を確保するのが目的です。その結果、無人航空機による不適切な飛行事案にも対応できるようになり、利活用の増加を安全に進められます。\n飛行許可申請の負担軽減や、操縦技能の証明、産業の市場拡大は、この制度の目的ではありません。",ref:"教則 第3章 3.1.2 無人航空機登録制度（p.13）"},
  {cat:1,lvl:"common",q:"無人航空機の登録について、適切ではないものを１つ選べ。",o:["無人航空機はリモートID機能を備えなくてもいい場合がある。","登録を受けた無人航空機には、登録記号を機体の見やすい箇所に表示しなければならない。","無人航空機の登録の有効期間は3年であり、所有者の氏名や住所に変更があった場合は変更の届出が必要である。","100グラム以上の無人航空機は必ず機体登録をしなければいけない。"],a:3,e:"100グラム以上でも登録が不要になる場合があるため、「必ず機体登録をしなければいけない」という記述が適切ではありません。これが正解です。\n登録の有効期間は3年です。所有者の氏名や住所に変更があった場合は、変更の届出が必要です。また、機体登録が不要な場合とリモートIDが不要な場合は別のものなので、混同しないよう注意しましょう。\n【機体登録が不要なケース】\n・100g未満\n・試験飛行の届出済み\n・屋内のみの飛行\n【リモートIDが不要なケース】\n・2022年6月19日までに手続きしたもの\n・リモートID特区の届出\n・係留しているもの（30m以内）\n・警察の秘匿業務",ref:"教則 第3章 3.1.2 無人航空機の登録（p.13）"},
  {cat:1,lvl:"common",q:"無人航空機の登録が受けられない条件について、最も適切なものを１つ選べ。",o:["製造者が安全性に問題があるとして回収を呼びかけている機体や、事故が多発していることが明らかな機体など、あらかじめ国土交通大臣が登録できないものとして指定した無人航空機。","遠隔操作による飛行の制御には支障がないものの、自動操縦の機能を備えておらず、あらかじめ設定した経路を自動で飛行することができない無人航空機。","衝突した際に安全を著しく損なうおそれはないが、表面に不要な装飾がされており奇抜なデザインの無人航空機。","日本国内に住所を有しない外国の製造者が製造し、国内の販売代理店を経由せずに輸入された無人航空機。"],a:0,e:"次の無人航空機は登録を受けられません。\n・製造者が安全性に懸念を示して回収を呼びかけている機体や、事故が頻繁に発生している機体など、国土交通大臣が登録できないものとして指定した機体\n・表面に不要な突起物があるなどして、地上の人などに衝突した際に安全を著しく損なうおそれがある機体\n・遠隔操作又は自動操縦による飛行の制御が著しく困難な機体\nそのため、国土交通大臣が指定した機体を挙げた選択肢が正解です。\n他の選択肢は、これらの理由に当てはまりません。飛行の制御に支障がなく自動操縦の機能がないだけの機体、安全を著しく損なうおそれがなくデザインが奇抜なだけの機体、外国の製造者が作って直接輸入した機体は、登録を受けられない理由として挙げられていません。",ref:"教則 第3章 3.1.2 登録を受けることができない無人航空機（p.13）"},
  {cat:1,lvl:"common",q:"次のうち、登録を受けた無人航空機の使用者の義務について最も適切なものを１つ選べ。",o:["当該無人航空機が安全上の問題から登録を受けることができない無人航空機とならないように整備や改造を行うことは、製造者のみの義務である。","使用者は、整備や改造をし、当該無人航空機が安全上の問題から登録を受けることができない無人航空機とならないようにしなければいけない。","当該無人航空機が安全上の問題から登録を受けることができない無人航空機とならないように整備や改造を行うことは、所有者のみの義務である。","使用者(所有者も含む)が、当該無人航空機が安全上の問題から登録を受けることができない無人航空機とならないように整備や改造を行うことは認められない。"],a:1,e:"登録を受けた無人航空機の使用者は、整備をし、必要に応じて改造をして、安全上の問題から登録を受けることができない機体にならないよう維持しなければなりません。これが使用者の義務です。あわせて、登録記号の機体への表示も維持する必要があります。\nこの義務は製造者だけ、所有者だけのものではありません。また、そのための整備や改造が認められないわけでもありません。",ref:"教則 第3章 3.1.2 無人航空機の登録（使用者の義務）（p.13）"},
  {cat:1,lvl:"common",q:"無人航空機のリモートID機能について、正しいものを１つ選べ。",o:["リモートID機能により発信される情報は、1分に1回発信される。","リモートID機能により発信される情報には、操縦者の技能証明番号が含まれている。","リモートID機能により発信される情報には、プライバシーの観点より、無人航空機の製造番号と登録記号のみが含まれている。","リモートID機能により発信される情報には、無人航空機の所有者や使用者の情報は含まれていない。"],a:3,e:"リモートID機能は、無人航空機の識別情報を電波で遠隔に発信するものです。発信される情報は次のとおりです。\n・静的情報…無人航空機の製造番号、登録記号\n・動的情報…位置、速度、高度、時刻\nこのように、所有者や使用者の情報は含まれません。これが正解です。\n他の選択肢が誤りである理由は次のとおりです。操縦者の技能証明番号は含まれません。製造番号と登録記号だけでなく、位置などの動的情報も含まれます。また、発信は1分に1回ではなく、1秒に1回以上行うことが求められています。",ref:"教則 第3章 無人航空機の登録制度（リモートID機能）"},
  {cat:1,lvl:"common",q:"無人航空機の機体認証及び無人航空機操縦者技能証明について、正しいものを１つ選べ。",o:["機体認証は第一種と第二種ともに3年で、技能証明の有効期間は一等が1年、二等は3年である。","第一種機体認証の有効期間は1年、第二種は3年、技能証明は一等及び二等ともに3年である。","技能証明の有効期間は一等及び二等ともに3年で、機体認証は第一種と第二種ともに1年である。","第一種機体認証の有効期間は3年、第二種は1年で、技能証明は一等及び二等ともに3年である。"],a:1,e:"飛行の安全を確保するには、使う機体が基準を満たしているかと、操縦者の技能を確認することが必要です。それを確かめるのが機体認証と技能証明の制度で、国があらかじめ基準に適合していることを証明します。\n有効期間は次のとおりです。\n・第一種機体認証（カテゴリーⅢ飛行に対応）…1年\n・第二種機体認証（カテゴリーⅡ飛行に対応）…3年\n・技能証明（一等・二等無人航空機操縦士ともに）…3年\nこの組み合わせのため、「第一種1年・第二種3年・技能証明3年」が正解です。\nなお、機体認証の検査は国又は国が登録した民間の検査機関が行い、技能証明の試験は国が指定した民間の試験機関が実施します。",ref:"教則 第3章 3.1.1 機体認証及び技能証明（p.7）"},
  {cat:1,lvl:"common",q:"機体認証を受けた無人航空機の運航ルールについて、以下の記述のうち不適切なものを1つ選べ。",o:["技能証明を受けた者が機体認証を受けた機体で、航空局の許可を取得せずに人口集中地区で飛行を行う場合は、当該機体の使用の条件の範囲内で飛行を行う必要がある。","使用の条件の範囲内であれば、機体認証を受けなくても、二等技能証明以上を所有している操縦者は、航空局の許可承認なしに、カテゴリーⅡBの特定飛行が認められる。","機体認証を受けた無人航空機は、特定飛行外であれば「使用条件等指定書」に従う必要はない。","機体認証の際には、最大離陸重量や飛行可能高度、飛行可能速度などの安全確保のための条件が「使用の条件」として指定され、使用条件等指定書が交付される。"],a:1,e:"機体認証を行うときは、安全性を確保するための条件（最大離陸重量、飛行可能高度、飛行可能速度等）が「使用の条件」として指定され、使用条件等指定書が交付されます。技能証明を受けた人が機体認証を受けた機体で特定飛行を行う場合は、この使用の条件の範囲内で飛ばさなければなりません（特定飛行以外の飛行、係留飛行、許可承認を受けた飛行は除きます）。\n一方、第二種以上の機体認証を受けていない機体では、二等技能証明以上を持つ操縦者でもカテゴリーⅡBの特定飛行はできません。そのため「機体認証を受けなくても認められる」という記述が不適切で、これが正解です。",ref:"教則 第3章 3.1.2 機体認証（使用の条件）"},
  {cat:1,lvl:"common",q:"無人航空機操縦者技能証明（技能証明）制度に関する以下の記述のうち、正しいものを１つ選べ。",o:["パワードリフト機（Powered-lift）の飛行にあたっては、回転翼航空機（マルチローター）及び回転翼航空機（ヘリコプター）の両方の種類の限定に係る資格が必要となる。","国が指定した民間試験機関（指定試験機関）による学科試験、実地試験及び身体検査により知識及び能力を判定し、これらの試験等に合格した場合には、国が技能証明を行う。","技能証明の有効期間は５年間であり、有効期間の満了前に更新の手続きを行うことで、引き続き技能証明を保有することができる。","技能証明は、一等無人航空機操縦士と二等無人航空機操縦士の２つの資格に区分され、それぞれの資格において、無人航空機の種類（３種類）及び飛行の方法（３種類）について限定をすることとしている。"],a:1,e:"技能証明は、無人航空機を操縦する知識と能力があることを国が証明する資格です。\n・試験を行うのは、国が指定した民間の機関（指定試験機関）です。学科試験・実地試験・身体検査に合格すると、国が技能証明を行います。これが正答です。\n・資格は一等と二等の2つに分かれます。機体の種類（6種類）と飛行の方法（3種類）について限定が付きます。種類が「3種類」というのは誤りです。\n・パワードリフト機（Powered-lift）を飛ばすには、回転翼航空機（マルチローター）と飛行機の両方の種類の限定が必要です。ヘリコプターではありません。\n・有効期間は5年ではなく3年で、更新の手続きが設けられています。",ref:"教則 第3章 3.1.2 技能証明制度（p.13）"},
  {cat:1,lvl:"common",q:"技能証明の交付手続きについて、以下の選択肢の中から最も適切なものを１つ選べ。",o:["技能証明を受けようとする者は「登録講習機関」が実施する学科試験、実地試験及び身体検査に合格した上で、国土交通大臣に技能証明書の交付の申請を行う。","技能証明試験に合格した者は、試験を実施した「指定試験機関」に対して技能証明書の交付の申請を行う。","学科試験が未受験または不合格の場合、「指定試験機関」が実施する実地試験を受けることはできない。","「登録講習機関」にて無人航空機講習（学科講習・実地講習）を修了した者は、技能証明試験の学科試験と実地試験が免除される。"],a:2,e:"技能証明を取るまでの流れは、指定試験機関（国が指定した民間の試験機関）が行う学科試験・実地試験・身体検査に合格し、そのうえで国土交通大臣に技能証明書の交付を申請する、という順序です。\n・学科試験を受けていない、または不合格の場合は、指定試験機関の実地試験を受けられません。これが正答です。\n・試験を行うのは登録講習機関ではなく指定試験機関です。交付を申請する相手も、指定試験機関ではなく国土交通大臣です。\n・登録講習機関（国に登録された講習機関）で無人航空機講習を修了すると免除されるのは実地試験だけで、学科試験は免除されません。",ref:"教則 第3章 3.1.2 技能証明制度（p.13）"},
  {cat:1,lvl:"common",q:"技能証明の資格要件について、以下の選択肢の中から最も適切なものを１つ選べ。",o:["認知症を患っている者は、無人航空機の飛行に支障を及ぼすおそれがあるため、技能証明の申請をすることができない。","１８歳に満たない者は、技能証明の申請をすることができない。","技能証明の申請は、１６歳未満や、技能証明が拒否された日から１年以内の者や、技能証明が取り消された日から２年以内の者はできない。","技能証明の申請は、技能証明を保留されている者や技能証明の効力を停止されている者は一律でできない。"],a:2,e:"次のどれかに当てはまる人は、技能証明の申請ができません。\n・16歳に満たない人\n・技能証明を拒否された日から1年以内の人、または技能証明を保留されている人\n・技能証明を取り消された日から2年以内の人、または技能証明の効力を停止されている人\n※あとの2つは、航空法等に違反する行為をした場合や、無人航空機の飛行にあたって非行または重大な過失があった場合によるものに限られます。だから、保留中や効力停止中の人が「一律に」申請できないわけではありません。年齢の下限も18歳ではなく16歳です。\nまた、次の人は技能証明試験に合格しても、技能証明を拒否されたり保留されたりすることがあります。\n・てんかんや認知症など、無人航空機の飛行に支障を及ぼすおそれがある病気にかかっている人\n・アルコールや大麻、覚せい剤等の中毒者\n・航空法等に違反する行為をした人\n・無人航空機の飛行にあたって非行または重大な過失があった人\nつまり認知症は、「申請そのものができない理由」ではなく「拒否・保留されることがある理由」です。",ref:"教則 第3章 3.1.2 技能証明の資格要件（p.13）"},
  {cat:1,lvl:"common",q:"技能証明の取消し等について、以下の選択肢の中から正しいものを１つ選べ。",o:["航空法等に違反する行為をした場合、技能証明の取消し又は２年以内の技能証明の効力の停止を受けることがある。","技能証明を受けた者が無人航空機の飛行に支障を及ぼすおそれがある病気にかかったことが判明した場合、技能証明の効力の停止を受けることはあるが、取消しを受けることはない。","アルコールや大麻、覚せい剤等の中毒者であることが判明した場合、技能証明の取消し又は１年以内の技能証明の効力の停止を受けることがある。","無人航空機の飛行に当たり非行があっただけでは、技能証明の取消しや効力停止を受けることはない。"],a:2,e:"技能証明を受けた人が次のどれかに当てはまると、技能証明の取消し、または1年以内の技能証明の効力の停止を受けることがあります。\n・無人航空機の飛行に支障を及ぼすおそれがある病気にかかったとき\n・アルコールや大麻、覚せい剤等の中毒者であることが判明したとき\n・航空法等に違反する行為をしたとき\n・無人航空機の飛行にあたって非行または重大な過失があったとき\n停止の期間は2年以内ではなく1年以内です。病気の場合も効力停止だけでなく取消しがあり得ますし、非行があっただけでも取消しや効力停止の対象になります。",ref:"教則 第3章 3.1.2 技能証明の取消し等（p.13）"},
  {cat:1,lvl:"common",q:"技能証明を有する者への行政処分として、以下の記述のうち最も適切なものを1つ選べ。",o:["今回、口頭注意に相当する点数を受けた者が、過去に口頭注意を受けていた場合、今回の点数に２点が加算され、最終的な処分内容が決定される。","点数が１５点以上となった場合の処分内容は、技能証明の効力の停止１年である。","常習的に違反行為等を行っている場合は１～３点の加重が行われる可能性がある。","処分等区分表において、技能証明の効力の停止が３ヶ月となるのは点数が９～11のときである。"],a:0,e:"過去に処分等を受けている人には、「過去に処分等を受けている場合の取扱表」に従って点数が加重されます。今回も過去も口頭注意（または文書警告）に相当する場合の加重は2点です。組合せによって加重は2〜6点になり、過去に取消しを受けている場合は取消しになります。これが正答です。\n・常習的に違反行為等を行っている場合の加重は、1〜3点ではなく3点です。\n・処分等区分表では、技能証明の効力の停止が3ヶ月になるのは6〜8点のときです。9〜11点は停止6ヶ月です。\n・15点以上のときは効力の停止1年ではなく、技能証明の取消しです。",ref:"教則 第3章 3.1.2 処分等区分表（p.13）"},
  {cat:1,lvl:"common",q:"無人航空機操縦者技能証明に係る行政処分に関する基準に定める「点数表」として、以下の記述のうち最も適切なものを1つ選べ。いずれもカテゴリーⅡにおける特定飛行を行っているものとする。",o:["飛行計画を通報せずに飛行させた場合の点数は3点である。","飛行日誌を携帯せずに飛行させた場合の点数は3点である。","技能証明書を携帯せずに飛行させた場合の点数は1点である。","第三者の飛行経路下への立入を確認したにも関わらず飛行を中止しなかった場合の点数は6点である。"],a:2,e:"カテゴリーⅡの特定飛行の場合、点数は次のとおりです。\n・技能証明書を携帯せずに飛行させた…1点（これが正答）\n・飛行日誌を携帯せずに飛行させた…3点ではなく6点\n・第三者の飛行経路下への立入を確認したのに飛行を中止しなかった…6点ではなく3点\n・飛行計画を通報せずに飛行させた…3点ではなく10点",ref:"教則 第3章 3.1.2 行政処分（点数表）（p.13）"},
  {cat:1,lvl:"common",q:"無人航空機操縦者技能証明に係る行政処分に関する基準に定める「点数表」として、以下の記述のうち最も適切なものを1つ選べ。いずれも機体認証を受けていない無人航空機の飛行とする。",o:["承認を受けずに屋内で目視外飛行を行った場合の点数は14点である。","機体登録を受けていない機体を屋外で飛行させた場合の点数は8点である。","承認を受けずに屋内で夜間飛行を行った場合の点数は10点である。","飲酒飛行をした場合の点数は16点である。"],a:1,e:"機体登録を受けていない機体を屋外で飛行させた場合の点数は8点です。これが正答です。飲酒飛行は16点ではなく15点です。\nまた、屋内での飛行はそもそも航空法の飛行規制の対象外です。夜間飛行や目視外飛行の承認も不要なので、承認がなくても違反にならず、点数も付きません。",ref:"教則 第3章 3.1.2 行政処分（点数表）（p.13）"},
  {cat:1,lvl:"common",q:"無人航空機の特定飛行について、以下の選択肢から最も適切なものを1つ選べ。",o:["飛行日誌の記載事項は、無人航空機の情報（登録記号、種類、型式、製造者・製造番号）及び飛行記録に限られ、日常点検記録や点検整備記録は含まれない。","飛行日誌の作成、携帯は、特定飛行を行わない者にも推奨される。","特定飛行を行う場合であっても、飛行日誌の携帯は法的義務ではなく推奨にとどまる。","飛行日誌は電子データでの保持が義務付けられており、特定飛行を行う際に速やかに参照、提示できるようにする。"],a:1,e:"特定飛行を行う人には、飛行日誌の携帯が義務づけられています。推奨ではなく法的な義務です。飛行日誌は紙でも電子データでもよく（電子データに限られません）、すぐに参照・提示できるようにしておきます。\n飛行日誌には次の内容を遅滞なく記載します。\n・無人航空機に関する情報（登録記号、種類、型式、製造者・製造番号等）\n・飛行記録（飛行の年月日、離着陸の場所と時刻、飛行時間、飛行させた人の氏名等）\n・日常点検記録\n・点検整備記録\n特定飛行にあたらない飛行でも、飛行日誌への記載は推奨されています。ただしこの場合は法的な義務ではありません。だから「特定飛行を行わない者にも推奨される」が正答です。",ref:"教則 第3章 飛行日誌（p.23）"},
  {cat:1,lvl:"common",q:"無人航空機の飛行形態について、適切ではないものを１つ選べ。",o:["立入管理措置を講じないで、人口集中地区で飛行を行うことは、カテゴリーⅢ飛行に該当する。","立入管理措置を講じたうえで、空港周辺の空域で無人航空機を飛行させることは、カテゴリーⅡA飛行に該当する。","立入管理措置を講じたうえで、１,０００gの無人航空機を目視外飛行させることは、カテゴリーⅡB飛行に該当する。","立入管理措置を講じたうえで、最大離陸重量２５ｋｇ以上の機体を人口集中地区で飛行させることは、カテゴリーⅡB飛行に該当する。"],a:3,e:"無人航空機の飛行形態には、カテゴリーⅠ飛行、カテゴリーⅡ飛行、カテゴリーⅢ飛行があります。カテゴリーⅡ飛行のうち、次のものはリスクが高いためカテゴリーⅡA飛行とされ、それ以外がカテゴリーⅡB飛行です。\n・空港周辺\n・高度150m以上\n・催し場所の上空\n・危険物の輸送\n・物件の投下\n・最大離陸重量25kg以上の無人航空機の特定飛行\nしたがって、最大離陸重量25kg以上の機体を人口集中地区で飛ばすのはカテゴリーⅡBではなくカテゴリーⅡAです。この記述が適切ではないので正答になります。\nまた、立入管理措置を講じない特定飛行はカテゴリーⅢ飛行にあたります。",ref:"教則 第3章 カテゴリー区分（p.14）"},
  {cat:1,lvl:"common",q:"カテゴリーⅡ飛行の取り扱いについて、以下の記述のうち最も適切なものを１つ選べ。",o:["カテゴリーⅡB飛行では、技能証明を受けた操縦者が機体認証を受けた無人航空機を、飛行マニュアルを作成し遵守して飛行を行えば、許可承認なしで飛行させることが可能である。","カテゴリーⅡA飛行では、技能証明を受けた操縦者であって、かつ機体認証を受けた無人航空機でなければ飛行を行うことができない。","カテゴリーⅡB飛行では、機体認証を受けた無人航空機であれば、技能証明を受けていない操縦者であっても許可承認なしで飛行させることが可能である。","カテゴリーⅡA飛行では、技能証明を受けた操縦者が機体認証を受けた無人航空機を、飛行マニュアルを作成し遵守して飛行を行えば、許可承認なしで飛行させることが可能である。"],a:0,e:"カテゴリーⅡ飛行にはⅡAとⅡBがあり、必要な要件と手続きが違います。\n・カテゴリーⅡB飛行…技能証明を受けた操縦者が機体認証を受けた無人航空機を飛ばす場合は、許可・承認なしで飛行できます。ただし安全確保措置として、必要な事項を盛り込んだ飛行マニュアルを作り、それを守ることが必要です。これが正答です。技能証明を持たない操縦者では、許可・承認なしというわけにはいきません。\n・カテゴリーⅡA飛行…技能証明を持つ操縦者が機体認証を受けた機体を飛ばす場合でも、「運航管理の方法」について国土交通大臣の審査を受け、飛行の許可・承認を得る必要があります。\nなお、どちらの場合も、技能証明と機体認証がなければ飛ばせないというわけではありません。許可・承認を得れば飛行できます。",ref:"教則 第3章 カテゴリーⅡA/ⅡB（p.15）"},
  {cat:1,lvl:"common",q:"特定飛行のカテゴリーⅢ飛行について、最も正しいものを１つ選べ。",o:["カテゴリーⅢ飛行では、一等無人航空機操縦士の技能証明と第一種機体認証を受けた機体がない場合でも、国土交通大臣の許可承認を受けることで飛行が可能となる。","カテゴリーⅢ飛行では、一等無人航空機操縦士の技能証明と第一種機体認証を受けた機体を用い、国土交通大臣の許可承認を受ける必要がある。","カテゴリーⅢ飛行では、一等無人航空機操縦士の技能証明と第一種機体認証を受けた機体を用いることで、国土交通大臣の許可承認が不要となる。","カテゴリーⅢ飛行では、二等無人航空機操縦士の技能証明と第二種機体認証を受けた機体を用いることで、国土交通大臣の許可承認を受けて飛行することができる。"],a:1,e:"カテゴリーⅢ飛行は最もリスクが高い飛行とされています。そのため、一等無人航空機操縦士の技能証明を受けた人が、第一種機体認証を受けた無人航空機を飛ばすことが求められます。そのうえで、運航管理の方法について国土交通大臣の審査を受け、飛行の許可・承認を受けることで飛行できます。\nつまり、一等の技能証明と第一種機体認証は前提となる条件なので、これらがないまま許可・承認だけで飛ぶことはできません。逆に、条件を満たしていても許可・承認が不要になることもありません。これらの手続きは、リスクを管理して飛行の安全を確保するためのものです。",ref:"教則 第3章 3.1.1 カテゴリーⅢ飛行"},
  {cat:1,lvl:"common",q:"カテゴリーⅢ飛行を行う際の運航管理体制について、以下の記述のうち正しいものを１つ選べ。",o:["カテゴリーⅢ飛行を行う場合には、一等無人航空機操縦士資格を有する操縦者が第一種機体認証を有する無人航空機を飛行させる必要はあるが、「運航管理の方法」についてマニュアルを作成し順守することで、飛行の許可・承認が不要となる。","カテゴリーⅢ飛行において、一等無人航空機操縦士資格を有していない操縦者が第一種機体認証を有していない無人航空機を飛行させる場合は「運航管理の方法」についてだけでなく、「操縦する者の技能」「使用する機体」についても国土交通大臣の審査を受け、飛行の許可・承認を得る必要がある。","カテゴリーⅢ飛行を行う場合には、一等無人航空機操縦士資格を有する操縦者が第一種機体認証を有する無人航空機を飛行させることが条件となり、あらかじめ「運航管理の方法」について国土交通大臣の審査を受け、飛行の許可・承認を得なければ飛行をさせることはできない。","カテゴリーⅢ飛行を行う場合には、第一種機体認証を有する無人航空機を使用していれば、二等無人航空機操縦士資格を有する操縦者であっても「運航管理の方法」の審査を受けることで飛行の許可・承認を得ることができる。"],a:2,e:"カテゴリーⅢ飛行では、一等無人航空機操縦士の資格を持つ操縦者が、第一種機体認証を受けた無人航空機を飛ばすことが条件です。そのうえで、事前に「運航管理の方法」について国土交通大臣の審査を受け、飛行の許可・承認を得なければ飛ばせません。これが正答です。\nこの審査では、次のようなことが確認されます。\n・リスクの分析と評価\n・非常時の対処方針や緊急着陸場所の設定などのリスク軽減策\n・飛行マニュアルの作成と遵守\n・賠償能力（適切な保険への加入等）\nマニュアルを作って守れば許可・承認が不要になる、ということはありません。また、一等の資格と第一種機体認証がそろっていなければ、そもそも飛行の許可・承認を得ることはできません（二等の資格ではカテゴリーⅢ飛行はできません）。",ref:"教則 第3章 3.1.1 カテゴリーⅢ飛行（運航管理の方法）"},
  {cat:1,lvl:"common",q:"「レベル3.5飛行の位置づけ」について、適切なものを１つ選べ。",o:["レベル3.5飛行は万が一のために第三者賠償責任保険への加入が必須であるため、移動中の第三者の上空も一時的であれば飛行できる。","レベル3.5飛行は補助者の配置や看板の設置は不要であるが、カメラでの立入管理措置は必要である。","レベル3.5飛行は一時的ではあるが移動車両上空の飛行ができるため、カテゴリーⅢに分類される。","レベル3.5飛行は、一定の要件を満たすことで立入管理措置そのものが不要となる飛行である。"],a:1,e:"レベル3.5飛行は、あくまでカテゴリーⅡ飛行です。次の2点に注意してください。\n・一定の要件を満たすことで、一時的な道路等の横断に限って移動中の車両等の上空を飛べるようにするものです。カテゴリーⅢ（レベル4）飛行のように、歩行者など第三者の上空を飛ぶことを認めるものではありません。\n・一定の要件を満たすことで、これまで求められていた立入管理措置のうち補助者の配置や看板の設置等を、機上カメラでの確認に置き換えるものです。立入管理措置そのものが不要になるわけではありません。\nつまり、補助者や看板は不要でも、カメラによる立入管理措置は必要です。これが正答です。",ref:"教則 第3章 3.1.2 レベル3.5飛行"},
  {cat:1,lvl:"common",q:"「レベル3.5飛行で作成すべき資料」について、もっとも適切なものを１つ選べ。",o:["作成した各種資料は、飛行の許可・承認の申請時に必ず国土交通省航空局へ提出しなければならない。","飛行範囲と落下距離の範囲内を立入管理区画として地図上に示した資料が必要である。","各種資料は航空局から提出を求められた際に直ちに作成する必要がある。","十分な飛行実績または機体の初期故障期間を超えたことを示す資料が必要である。"],a:1,e:"レベル3.5飛行を行うときは、レベル3飛行に必要な要件を満たしていることを示す次の資料を作る必要があります。あわせて、安全に飛ばすための運航条件等も事前に決めておきます。\n・飛行で想定されるリスクを十分に考えたうえで、安全な飛行ができる運航条件等を設定した資料\n・無人航空機の機能・性能や飛行形態に応じた追加基準に適合していることを示せる資料\n・操縦者について、飛行形態に応じた追加基準への適合性を、過去の飛行実績や訓練実績等で示した資料\n・飛行範囲と、その外周から製造者等が保証した落下距離の範囲内を、立入管理区画として地図上に示した資料（これが正答です）\n・想定される運用で十分な飛行実績（機体の初期故障期間を超えたもの）があることを示せる資料\nこれらの資料は、基本的に申請のときに提出する必要はありません。国土交通省航空局から求めがあったときに提出します。求められてから作るのではなく、あらかじめ作っておくものです。",ref:"教則 第3章 3.1.2 レベル3.5飛行"},
  {cat:1,lvl:"common",q:"「レベル3.5飛行の実施に求められる安全確保体制」について、もっとも適切なものを１つ選べ。",o:["レベル3.5飛行は、目視内飛行の限定解除を受けていなくても、技能証明を有していれば承認を受けることができる。","レベル3.5飛行では、万が一のために補償金額が1億円以上の第三者賠償責任保険への加入が必須である。","レベル3.5飛行では、飛行経路直下への第三者の立入りを防ぐため、補助者の配置と看板の設置が必須である。","レベル3.5飛行では、機体のカメラ映像を地上モニターで確認し、飛行経路下に第三者の立ち入りがないことを確認できることを事前に確認する必要がある。"],a:3,e:"レベル3.5飛行を行うには、特に次の3つの要件を満たす必要があります。\n・機上カメラと地上に設置するモニター等の設備で、進行方向の飛行経路の直下とその周辺に第三者の立入りがないことを確認できると、事前に確かめていること（これが正答です）\n・操縦者が無人航空機操縦者技能証明を持っていること。飛ばす無人航空機の種類・重量に対応したもので、目視内飛行の限定解除を受けたものである必要があります。\n・移動中の車両等との接触や交通障害等の不測の事態に備え、十分な補償ができる第三者賠償責任保険に加入していること。補償限度額は事業者が設定するので、1億円以上と決まっているわけではありません。",ref:"教則 第3章 3.1.2 レベル3.5飛行"},
  {cat:1,lvl:"common",q:"無人航空機の特定飛行を行う際の飛行計画通報に関する記述のうち、最も適切なものを1つ選べ。",o:["航空法の改正により、飛行計画通報は、特定飛行以外の飛行も義務付けられている。","飛行計画には無人航空機の登録記号、種類、飛行させる者の氏名と住所を記載する。","国土交通大臣から特定飛行の日時や経路の変更を指示された場合、操縦者はそれに従う必要がある。","飛行計画の通報は、特定飛行を行った後に遅滞なく行えばよい。"],a:2,e:"特定飛行をさせるときは、あらかじめ飛行計画を国土交通大臣に通報しなければなりません。飛行のあとに通報すればよいわけではありません。\n通報する内容は、無人航空機の登録記号、種類、飛行させる人の氏名、技能証明書番号、飛行の許可・承認の番号、飛行の目的、高度、速度等の詳しい情報です。ただし、飛行させる人の「住所」までは求められません。\n特定飛行にあたらない飛行については、通報は義務ではなく推奨です。\nまた、国土交通大臣から特定飛行の日時や経路の変更等の指示を受けたときは、その指示に従わなければなりません。これが正答です。",ref:"教則 第3章 3.1.2 飛行計画の通報等"},
  {cat:1,lvl:"common",q:"無人航空機の飛行中における禁止事項について、最も適切なものを１つ選べ。",o:["航空機が上空を飛んでいないことが明らかな場合、機体の性能の範囲内であれば、飛行高度に法的な制限はない。","アルコールの影響下での飛行は禁止されているが、風邪薬などの医薬品の影響による場合は禁止されていない。","第三者に向かって無人航空機を急接近させる飛行は、航空法で禁止されている。","飛行中は、無線操作が可能な範囲であれば目視外飛行も許可なく可能である。"],a:2,e:"人に向かって無人航空機を急接近させるなど、他人に迷惑を及ぼすような飛行は航空法で禁止されています。これが正答です。\n・無人航空機の飛行は、一定の高さの範囲内で、目視内で行う必要があります。目視外飛行や高度150m以上の飛行には、原則として航空局の許可・承認が必要です。航空機が飛んでいないからといって、高度が自由になるわけではありません。\n・アルコールの影響下だけでなく、薬物の影響下での飛行も一切禁止です。",ref:"教則 第3章 遵守事項（迷惑飛行の禁止等）"},
  {cat:1,lvl:"common",q:"無人航空機の飛行前に行うべき確認について、最も適切ではないものを１つ選べ。",o:["緊急用務空域の該当の有無","飛行に必要な気象情報","今日の運勢","バッテリーの残量"],a:2,e:"無人航空機の飛行前には、次のようなことを確認する必要があります。\n・機体の損傷や歪み\n・通信系統\n・プロペラ等の動力源\n・リモートID機能\n・飛行に必要な気象情報\n・燃料の搭載量またはバッテリーの残量\n・飛行空域や周囲の状況（他の航空機や無人航空機の飛行状況を含む）\n今日の運勢は、飛行前に確認すべき事項ではありません。だからこれが「最も適切ではないもの」＝正答です。",ref:"教則 第3章 遵守事項（飛行前確認）"},
  {cat:1,lvl:"common",q:"無人航空機の飛行についての罰則について、最も適切なものを１つ選べ。",o:["航空法令の規定に違反した場合、罰金刑となる可能性はあるが、懲役刑が科されることはない。","航空法令の規定に違反した場合でも、初回の違反であれば罰則が科されることはない。","航空法令の規定に違反した場合、懲役刑となる可能性がある。","技能証明を有する者が航空法令の規定に違反した場合、技能証明の取消し等の行政処分の対象となるが、罰則が科されることはない。"],a:2,e:"航空法令の規定に違反した場合は、懲役または罰金になる可能性があります。罰金だけで懲役はない、ということはありません。これが正答です。\n初めての違反であっても罰則の対象になります。また、技能証明を持っている人は、罰則に加えて、技能証明の取消し等の行政処分の対象にもなる可能性があります。行政処分だけで済むわけではありません。",ref:"教則 第3章 3.1.2 罰則"},
  {cat:1,lvl:"common",q:"航空法令に違反した場合の罰則について、以下の記述のうち最も適切なものを1つ選べ。",o:["事故が発生した場合に飛行を中止し負傷者を救護するなどの危険を防止するための措置を講じなかった場合、２年以下の懲役又は１００万円以下の罰金となる可能性がある。","規制対象となる飛行の区域又は方法に違反して飛行させた場合は、１年以下の懲役又は５０万円以下の罰金となる可能性がある。","航空機又は他の無人航空機との衝突防止をしなかった場合は、２年以下の懲役又は１００万円以下の罰金となる可能性がある。","アルコール又は薬物の影響下で無人航空機を飛行させた場合は、５０万円以下の罰金となる可能性がある。"],a:0,e:"罰則の主な区分は次のとおりです。\n【2年以下の懲役又は100万円以下の罰金】事故が発生したときに飛行を中止し、負傷者を救護するなど危険を防止する措置をとらなかった場合。これが正答です。\n【1年以下の懲役又は50万円以下の罰金】登録を受けていない無人航空機を飛行させた場合。\n【1年以下の懲役又は30万円以下の罰金】アルコール又は薬物の影響下で無人航空機を飛行させた場合。罰金だけではありません。\n【50万円以下の罰金】登録記号の表示やリモートIDの搭載をせずに飛行させた場合、規制対象となる飛行の区域又は方法に違反して飛行させた場合、飛行前の確認をせずに飛行させた場合、航空機や他の無人航空機との衝突防止をしなかった場合、他人に迷惑を及ぼす飛行を行った場合など。\n【30万円以下の罰金】飛行計画を通報せずに特定飛行を行った場合、事故が発生したのに報告をしない又はうその報告をした場合など。\n【10万円以下の罰金】技能証明を携帯せずに特定飛行を行った場合、飛行日誌を備えずに特定飛行を行った場合、飛行日誌に記載しない又はうその記載をした場合など。",ref:"教則 第3章 罰則"},
  {cat:1,lvl:"common",q:"航空法令に違反した場合の罰則について、以下の記述のうち正しいものを1つ選べ。",o:["登録記号の表示又はリモートIDの搭載をせずに飛行させた場合は、50万円以下の罰金が科せられる可能性がある。","技能証明を携帯せずに特定飛行を行った場合、30万円以下の罰金が科せられる可能性がある。","飛行計画を通報せずに特定飛行を行った場合、50万円以下の罰金が科せられる可能性がある。","アルコールまたは薬物の影響下で無人航空機を飛行させた場合、1年以下の懲役又は50万円以下の罰金が科せられる可能性がある。"],a:0,e:"罰則は違反の内容ごとに重さが決まっています。登録記号の表示やリモートID（＝機体の識別情報を電波で発信する仕組み）の搭載をせずに飛ばした場合は、50万円以下の罰金です。\n他の選択肢の罰則は次のとおりで、いずれも書かれている内容と違います。\n・アルコール又は薬物の影響下での飛行＝1年以下の懲役又は30万円以下の罰金\n・技能証明書を携帯せずに特定飛行（＝許可・承認が必要な飛ばし方）をした場合＝10万円以下の罰金\n・飛行計画を通報せずに特定飛行をした場合＝30万円以下の罰金",ref:"教則 第3章 3.1.2 罰則（p.13）"},
  {cat:1,lvl:"common",q:"小型無人機等飛行禁止法により飛行が禁止される対象について、適切ではないものを１つ選べ。",o:["小型無人機等飛行禁止法において、重要施設の敷地・区域の上空をレッド・ゾーン、その周囲おおむね1,000mの上空をイエロー・ゾーンという。","小型無人機等飛行禁止法において、対象施設は一時的に追加される場合がある。","飛行禁止の対象となる重要施設には、国の重要な施設、外国公館、防衛関係施設、原子力事業所などが含まれる。","空港は、航空法で規制されているため、小型無人機等飛行禁止法では対象施設とされていない。"],a:3,e:"小型無人機等飛行禁止法では、重要施設の敷地・区域の上空を「レッド・ゾーン」、その周りおおむね1,000mの上空を「イエロー・ゾーン」といいます。この1,000mは教則第5版（令和8年7月適用）で法改正が反映された数字で、従来の300mではありません。\n飛行禁止の対象となる重要施設は次のとおりです。\n・国の重要な施設等\n・外国公館等（外務大臣が指定）\n・防衛関係施設（防衛大臣が指定）\n・原子力事業所（国家公安委員会が指定）\n・空港（国土交通大臣が指定）\n空港もこのとおり対象施設に入っているので、「空港は対象ではない」という記述が誤りです。また、外国の要人が来日するときなどに、対象施設が一時的に追加されることもあります。",ref:"教則 第3章 3.2.1 小型無人機等飛行禁止法（p.29-30）"},
  {cat:1,lvl:"common",q:"小型無人機等飛行禁止法について、以下の選択肢の中から最も適切なものを１つ選べ。",o:["小型無人機等飛行禁止法では、重要施設の敷地・区域の上空のみが飛行禁止区域であり、その周囲の上空では飛行は禁止されていない。","航空法で規制がされているため、小型無人機等飛行禁止法の対象施設には空港は含まれていない。","小型無人機等飛行禁止法の規制対象には、100g未満のマルチローターも含まれる。","小型無人機等飛行禁止法の規制対象には、遠隔操作や自動操縦ができない気球、ハンググライダー、パラグライダーは該当しない。"],a:2,e:"小型無人機等飛行禁止法は、国会議事堂などの重要施設への危険を未然に防ぐため、重要施設とその周りおおむね1,000mの周辺地域の上空で小型無人機等を飛ばすことを禁止しています。この1,000mは教則第5版（令和8年7月適用）で法改正が反映された数字で、従来の300mではありません。\n航空法の「無人航空機」と違い、この法律の「小型無人機」は大きさや重さに関係なく対象になります。そのため100グラム未満のものも含まれ、これが答えです。人が機器を使って飛べる特定航空用機器（気球、ハンググライダー、パラグライダー等）も規制の対象です。\n飛行禁止の対象となる重要施設は次のとおりで、空港も含まれます。\n・国の重要な施設等\n・外国公館等（外務大臣が指定）\n・防衛関係施設（防衛大臣が指定）\n・空港（国土交通大臣が指定）\n・原子力事業所（国家公安委員会が指定）",ref:"教則 第3章 3.2.1 小型無人機等飛行禁止法（p.29-30）"},
  {cat:1,lvl:"common",q:"小型無人機等飛行禁止法により飛行が禁止される施設について、適切ではないものを１つ選べ。",o:["原子力事業所","空港","病院","外国公館"],a:2,e:"小型無人機等飛行禁止法では、重要施設の敷地・区域の上空（レッド・ゾーン）と、その周りおおむね1,000mの上空（イエロー・ゾーン）が飛行禁止区域になります。この1,000mは教則第5版（令和8年7月適用）で法改正が反映された数字で、従来の300mではありません。\n対象になる施設は具体的に決められていて、次のものが当たります。\n・国の重要な施設等\n・外国公館等\n・防衛関係施設\n・空港\n・原子力事業所\n病院はこの対象施設に入っていないため、これが答えです。なお、外国の要人の来日などに伴って、対象施設が一時的に追加されることもあります。",ref:"教則 第3章 3.2.1 小型無人機等飛行禁止法（p.29-30）"},
  {cat:1,lvl:"common",q:"小型無人機等飛行禁止法について、最も適切なものを１つ選べ。",o:["対象施設の敷地・区域の周辺おおむね300mの範囲の上空をイエローゾーンといい、飛行が禁止されている。","対象施設の敷地・区域の上空(レッドゾーン)で飛行を行った者は、1年以下の拘禁刑又は50万円以下の罰金に処される可能性がある。","小型無人機等飛行禁止法は、重量100g以上の無人航空機のみを対象としている。","飛行禁止の例外に当たる場合、都道府県公安委員会等への通報は不要となる。"],a:1,e:"対象施設の敷地・区域の上空（レッドゾーン）で飛ばした人や、警察官等の命令に従わなかった人は、1年以下の拘禁刑又は50万円以下の罰金になることがあります。\n他の選択肢が誤っている理由は次のとおりです。\n・イエローゾーンは敷地の周りおおむね1,000mの範囲の上空で、ここで飛ばすと6月以下の拘禁刑又は50万円以下の罰金です。教則第5版（令和8年7月適用）で改正が反映され、範囲は「おおむね1,000m」、刑は「拘禁刑」となりました。従来の300m・懲役ではありません。\n・この法律は機体の重さに関係なく適用されるので、100g以上の機体だけが対象ではありません。\n・飛行禁止の例外に当たる場合でも、都道府県公安委員会等への通報は必要です。",ref:"教則 第3章 3.2.1 小型無人機等飛行禁止法（違反に対する措置等）（p.31）"},
  {cat:1,lvl:"common",q:"小型無人機等の飛行禁止の例外に該当する者について、最も適切ではないものを１つ選べ。",o:["土地の所有者から同意を得た者が当該土地の上空において行う飛行","対象施設の管理者から同意を得た者による飛行","災害等で緊急性を要する飛行","地方公共団体の業務を実施するために行う飛行"],a:2,e:"飛行禁止の例外になるのは、次の3つに限られます。\n・対象施設の管理者、又はその同意を得た人による飛行\n・土地の所有者等、又はその同意を得た人が、その土地の上空で行う飛行\n・国又は地方公共団体が業務を実施するために行う飛行\n災害などで緊急性が求められる場合は、この例外に入っていません。そのため、これが答えです。\nまた、航空局の許可・承認を受けていても、機体認証（＝機体の安全性を国が確認する制度）や技能証明（＝操縦者の国家資格）を持っていても、小型無人機等を飛ばすことは原則としてできません。例外として認められた場合でも、都道府県公安委員会等への通報が必要です。",ref:"教則 第3章 3.2.1 小型無人機等飛行禁止法（p.29）"},
  {cat:1,lvl:"common",q:"無人航空機の無線設備利用に関するルールについて、適切なものを１つ選べ。",o:["日本国内で無人航空機の無線設備を使用する場合、国内の技術基準に合致した無線設備を用い、無線局を開設すれば、総務大臣の免許や登録を受ける必要はない。","日本国内で無人航空機の無線設備を使用する場合、海外の技術基準に合致した無線設備であれば、総務大臣の免許や登録を受けずに使用することができる。","日本国内で無人航空機の無線設備を使用する場合、国内の技術基準に合致した無線設備を用い、例外なく総務大臣の免許や登録を受け、無線局を開設する必要がある。","日本国内で無人航空機の無線設備を使用する場合、国内の技術基準に合致した無線設備を用い、微弱な無線局や一部の小電力の無線局を除き、原則、総務大臣の免許を受け、無線局を開設する必要がある。"],a:3,e:"日本国内で無人航空機の無線設備を使うときは、電波法令に基づいて、国内の技術基準に合った無線設備を使い、原則として総務大臣の免許を受けて無線局を開設する必要があります。使えるのは国内の技術基準に合った設備なので、海外の技術基準の設備をそのまま使うことはできません。\nただし、微弱な無線局や一部の小電力の無線局は例外で、免許は要りません。つまり「例外なく免許・登録が必要」でも「免許・登録はまったく不要」でもありません。なお、小電力の無線局であっても、技適マークが表示された適合表示無線設備である必要があります。",ref:"教則 第3章 3.2.2 電波法（p.30）"},
  {cat:1,lvl:"common",q:"無人航空機における微弱無線局と小電力の無線局について、不適切なものを１つ選べ。",o:["微弱無線局は、無線設備から500メートルの距離での電界強度が200μＶ／ｍ以下のものであり、周波数等が総務省告示で定められている。","微弱無線局や一部の小電力の無線局については、無線局の免許や登録を受けずに使用することができる。","小電力の無線局とは、空中線電力が1W以下で特定の用途に使用される一定の技術基準が定められた無線局で、Wi-FiやBluetooth等が該当する。","小電力の無線局は、技術基準適合証明等を受けた適合表示無線設備でなくても使用することができる。"],a:3,e:"微弱無線局や一部の小電力の無線局は、無線局の免許や登録を受けなくても使えます。ただし小電力の無線局は、技術基準適合証明等（＝技適マーク）を受けた適合表示無線設備を使う必要があります。そのため「適合表示無線設備でなくても使える」という記述が誤りで、これが答えです。\n・微弱無線局＝無線設備から500メートル離れた地点での電界強度が200μＶ／ｍ以下のもの。周波数などは総務省告示で決められています。\n・小電力の無線局＝空中線電力が1W以下で、特定の用途に使う一定の技術基準が決められた無線局。Wi-FiやBluetooth等が当たります。",ref:"教則 第3章 3.2.2 電波法（無線局の種類）（p.31）"},
  {cat:1,lvl:"common",q:"無人航空機におけるアマチュア無線とFPVの使用について、適切ではないものを１つ選べ。",o:["アマチュア無線は金銭上の利益のためでなく、専ら個人的な興味により行う自己訓練、通信及び技術研究のための無線通信であり、無人航空機での使用にはアマチュア無線技士の資格及びアマチュア無線局免許が必要である。","アマチュア無線を使用した無人航空機を、金銭上の利益を目的とした業務に利用することはできない。","5GHz帯のアマチュア無線は、周波数割当計画上、二次業務に割り当てられているため、一次業務の無線局(高速道路のETCシステム等)の付近での使用は避けるべきである。","金銭上の利益のためではなく、専ら個人的な興味により行う自己訓練、通信及び技術研究のためにアマチュア無線を使用する場合は、アマチュア無線技士の資格及びアマチュア無線局免許は不要となる。"],a:3,e:"アマチュア無線は、お金もうけのためではなく、もっぱら個人的な興味で行う自己訓練・通信・技術研究のための無線通信です。ここから次のことが決まります。\n・使うにはアマチュア無線技士の資格とアマチュア無線局免許が必要です。「資格も免許も不要」という記述は誤りで、これが答えです。\n・アマチュア無線を使った無人航空機を、金銭上の利益を目的とした業務に使うことはできません。\nアマチュア無線によるFPV（＝機体からの映像を見ながら操縦する飛ばし方）の無人航空機では、操縦に2.4GHz帯の免許不要局、画像伝送に5GHz帯のアマチュア無線局を使うことが多くあります。5GHz帯のアマチュア無線は周波数割当計画で二次業務に割り当てられているため、一次業務の無線局の運用に妨害を与えないように使う必要があります。",ref:"教則 第3章 電波法（アマチュア無線・FPV）"},
  {cat:1,lvl:"common",q:"無人航空機における携帯電話等の移動通信システムの利用について、最も適切なものを１つ選べ。",o:["無人航空機に携帯電話を搭載して利用する場合は、無人航空機の機体登録を行っていれば、携帯電話事業者への利用手続を行うことなく使用することができる。","携帯電話等の移動通信システムは、上空での利用を前提に設計されているため、無人航空機に搭載して利用しても地上の利用者への影響を考慮する必要はない。","無人航空機にSIMカードを挿入して利用する場合は、携帯電話事業者が提供する条件に対応した上空用プラン等の利用手続を行うことが必要である。","無人航空機にSIMカードを挿入して利用する場合は、航空局から特定飛行の許可・承認を受けていれば、上空用プラン等の利用手続は不要となる。"],a:2,e:"携帯電話などの移動通信システムは、地上で使うことを前提に作られています。そのため上空で使うと、通信品質が安定するかどうかや、地上の携帯電話等の利用に影響が出ないかが心配されてきました。こうした事情をふまえ、一定の条件のもとで使えば既にある無線局の運用などに支障を与えずに上空で使えるよう、制度が整えられています。\nそのため、携帯電話を無人航空機に載せて使う場合（機体にSIMカードを挿して使う場合を含む）は、携帯電話事業者が用意している条件に対応した上空用プラン等の利用手続を行う必要があります。機体登録をしていても、航空局から特定飛行の許可・承認を受けていても、この手続は必要です。",ref:"教則 第3章 3.2.2 電波法（p.30）"},
  {cat:1,lvl:"common",q:"飛行マニュアルに基づき、第三者から確保すべき水平距離（人又は物件との距離）は原則何m以上か。",o:["10m","20m","30m","50m"],a:2,e:"航空法では、人や物件との間に30m以上の距離をとって飛ばすことが原則として求められます。30m未満まで近づける飛行は特定飛行（＝許可・承認が必要な飛ばし方）になります。",ref:"教則 第3章 飛行の方法（p.14）"},
  {cat:1,lvl:"common",q:"飛行日誌について、正しい記載が義務付けられる3種の記録の組合せはどれか。",o:["飛行記録・日常点検記録・点検整備記録","飛行記録・日常点検記録・事故記録","飛行記録・定期点検記録・点検整備記録","飛行計画・日常点検記録・点検整備記録"],a:0,e:"飛行日誌は次の3つで構成されます。\n・飛行記録\n・日常点検記録\n・点検整備記録\n特定飛行（＝許可・承認が必要な飛ばし方）を行うときは、この飛行日誌を備え付けて記載することが義務です。",ref:"教則 第3章 飛行日誌（p.23）"},
  {cat:1,lvl:"common",q:"無人航空機の登録に関する記述として正しいものはどれか。",o:["登録の有効期間は5年で、更新を受けなければ効力を失う","登録の有効期間は3年で、更新を受けなければ効力を失う","登録の有効期間は1年で、更新を受けなければ効力を失う","登録の有効期間は3年で、更新を受けなくても効力は失われない"],a:1,e:"登録の有効期間は3年です。3年ごとに更新を受けないと効力を失います。また、所有者や使用者の氏名・住所が変わったときは、変更の届出も必要です。",ref:"教則 第3章 3.1.2 無人航空機の登録（p.13）"},
  {cat:1,lvl:"common",q:"アルコール又は薬物の影響下で無人航空機を飛行させた場合の罰則として正しいものはどれか。",o:["1年以下の懲役又は30万円以下の罰金","2年以下の懲役又は100万円以下の罰金","1年以下の懲役又は50万円以下の罰金","30万円以下の罰金"],a:0,e:"アルコールや薬物の影響を受けた状態で無人航空機を飛ばした場合は、1年以下の懲役又は30万円以下の罰金です。金額は50万円でも100万円でもなく、30万円以下である点に注意してください。",ref:"教則 第3章 3.1.2 罰則（p.13）"},
  {cat:1,lvl:"common",q:"登録を受けていない無人航空機を飛行させた場合の罰則として正しいものはどれか。",o:["1年以下の懲役又は50万円以下の罰金","2年以下の懲役又は100万円以下の罰金","1年以下の懲役又は30万円以下の罰金","50万円以下の罰金"],a:0,e:"登録を受けていない機体を飛ばした場合は、1年以下の懲役又は50万円以下の罰金です。",ref:"教則 第3章 3.1.2 罰則（p.13）"},
  {cat:1,lvl:"common",q:"飛行計画を通報せずに特定飛行を行った場合の罰則として正しいものはどれか。",o:["30万円以下の罰金","50万円以下の罰金","1年以下の懲役又は50万円以下の罰金","10万円以下の罰金"],a:0,e:"飛行計画を通報しないで特定飛行（＝許可・承認が必要な飛ばし方）を行った場合は、30万円以下の罰金です。事故の報告をしなかった場合も同じ30万円以下の罰金です。",ref:"教則 第3章 3.1.2 罰則（p.13）"},
  {cat:1,lvl:"common",q:"技能証明書を携帯せずに特定飛行を行った場合の罰則として正しいものはどれか。",o:["10万円以下の罰金","30万円以下の罰金","50万円以下の罰金","1年以下の懲役又は30万円以下の罰金"],a:0,e:"技能証明書を携帯せずに特定飛行（＝許可・承認が必要な飛ばし方）を行った場合や、飛行日誌を備えずに特定飛行を行った場合は、10万円以下の罰金です。",ref:"教則 第3章 3.1.2 罰則（p.13）"},
  {cat:1,lvl:"common",q:"行政処分の点数が15点以上となった場合の処分内容として正しいものはどれか。",o:["技能証明の効力の取消","効力の停止1年","文書警告","効力の停止3月"],a:0,e:"行政処分は、処分等区分表の点数に応じて次のように決まります。\n・15点以上＝技能証明の効力の取消\n・12〜14点＝効力の停止1年\n・6〜8点＝効力の停止3月\n・3〜5点＝文書警告\n・1〜2点＝口頭注意\n15点以上は一番重い「取消」に当たります。",ref:"教則 第3章 3.1.2 処分等区分表（p.13）"},
  {cat:1,lvl:"common",q:"国土交通大臣への報告義務がある無人航空機の事故について、人の死傷の対象範囲として正しいものはどれか。",o:["重傷以上","軽傷以上","程度を問わず全ての負傷","死亡のみ"],a:0,e:"国土交通大臣への報告義務がある事故のうち、人のけがは重傷以上が対象です。軽いけがまで全部が対象になるわけではありません。一方、物件の損壊は、第三者の所有物であれば規模や損害額に関係なくすべてが対象です。",ref:"教則 第3章 3.1.2 事故の定義（p.13）"},
  {cat:1,lvl:"common",q:"重大インシデントに該当するものとして正しいものはどれか。",o:["無人航空機の制御が不能となった事態","第三者に重傷を負わせる事故が発生したこと","飛行中の無人航空機により第三者の物件を損壊させたこと","着陸後に駐機中の無人航空機から発火したこと"],a:0,e:"重大インシデントに当たるのは次のような事態で、報告する義務があります。\n・航空機と衝突・接触するおそれがあったこと\n・重傷に至らない負傷をさせたこと\n・無人航空機の制御が不能になったこと\n・飛行中の発火 等\nこのため「制御が不能となった事態」が答えです。他の選択肢（第三者に重傷を負わせた、第三者の物件を壊した、着陸後に駐機中の機体から発火した）は、この定義に当てはまりません。発火は飛行中のものが対象です。",ref:"教則 第3章 3.1.2 重大インシデント（p.13）"},
  {cat:1,lvl:"common",q:"無線局の免許又は登録が不要となる小電力無線局の周波数帯の組合せとして正しいものはどれか。",o:["73MHz帯・920MHz帯・2.4GHz帯（小電力）","169MHz帯・2.4GHz帯・5.7GHz帯（小電力）","73MHz帯・169MHz帯・920MHz帯（小電力）","920MHz帯・2.4GHz帯・5.7GHz帯（小電力）"],a:0,e:"免許も登録もいらないのは、技適（＝国の技術基準に適合していると認められること）を受けた微弱無線局や小電力の無線局です。これに当たるのが73MHz帯・920MHz帯・2.4GHz帯など。一方、169MHz帯と5.7GHz帯を使う携帯局は免許が必要なので、これらを含む組合せは誤りです。",ref:"教則 第3章 3.2.2 電波法（p.30）"},
  {cat:1,lvl:"common",q:"169MHz帯・2.4GHz帯・5.7GHz帯の無人移動体画像伝送システム（携帯局）の運用に必要な無線従事者資格はどれか。",o:["第三級陸上特殊無線技士以上","技術基準適合証明を受けた機器であれば資格不要","第四級アマチュア無線技士以上","第二級陸上特殊無線技士以上"],a:0,e:"169MHz帯・2.4GHz帯・5.7GHz帯の無人移動体画像伝送システムは「携帯局」に当たります。飛ばすには、無線局の免許に加えて第三級陸上特殊無線技士以上の資格が必要です。技適を受けた機器を使っても、資格が不要になるわけではありません。",ref:"教則 第3章 3.2.2 電波法（p.30）"},
  {cat:1,lvl:"common",q:"高度150m以上でも飛行禁止空域から除外される例として正しいものはどれか。",o:["煙突・鉄塔等の構造物から30m以内の空域","煙突・鉄塔等の構造物から60m以内の空域","第三者の物件から30m以内の空域","煙突・鉄塔等の構造物の上空の全ての空域"],a:0,e:"煙突や鉄塔のような高い構造物の周りは、航空機が飛ぶことを想定していません。そのため、構造物から30m以内の空域は、高度150m以上でも飛行禁止空域から外れます。外れるのは30m以内までで、60m以内や構造物の上空すべてではありません。",ref:"教則 第3章 3.1.2 150m以上の例外（p.13）"},
  {cat:1,lvl:"common",q:"緊急用務空域における無人航空機の飛行について正しいものはどれか。",o:["許可・承認を受けていても飛行させてはならない","国土交通大臣の許可を受ければ飛行できる","100g未満の模型航空機であれば飛行させることができる","飛行前に許可・承認を受けていれば、そのまま飛行を継続できる"],a:0,e:"緊急用務空域は、消防や救助などの緊急用務にあたる航空機が活動する空域です。ここでは、許可・承認を受けていても飛ばしてはいけません。指定されたら、その空域での飛行は中止します。",ref:"教則 第3章 3.1.1 緊急用務空域（p.7）"},
  {cat:1,lvl:"common",q:"型式認証と機体認証の関係として正しいものはどれか。",o:["型式認証は設計・製造過程の基準適合を認証し、量産機の機体認証手続きの一部が省略できる","型式認証は個々の機体の現状について基準適合を検査し、機体ごとに受ける必要がある","型式認証を受けた型式の機体は、機体認証の手続きの全部が省略される","機体認証は設計・製造過程の基準適合を認証し、型式認証は個々の機体の現状を認証する"],a:0,e:"型式認証（第一種・第二種）は、その型式の「設計や製造の過程」が基準に合っていることを認める制度です。1機ずつの状態を調べるものではありません。型式認証を受けた型式の機体は、機体認証（＝1機ごとの認証）の手続きの一部を省けます。省けるのは一部で、全部ではありません。",ref:"教則 第3章 3.1.1 型式認証（p.7）"},
  {cat:1,lvl:"common",q:"無人航空機操縦者技能証明に付される限定として正しいものはどれか。",o:["機体の種類や昼間・目視内などの飛行の方法について限定が付され、限定変更で解除できる","機体の種類や飛行の方法について限定が付されるが、限定変更による解除はできない","飛行させる空域（空港周辺・150m以上等）について限定が付され、限定変更で解除できる","機体の種類には限定が付されるが、最大離陸重量についての限定は付されない"],a:0,e:"技能証明には、次の限定が付きます。\n・機体の種類（回転翼、飛行機など）\n・飛行の方法（昼間限定、目視内限定、最大離陸重量25kg未満限定など）\nこれらの限定は「限定変更」の手続きで解除できます。",ref:"教則 第3章 3.1.1 技能証明の限定（p.7）"},
  {cat:1,lvl:"common",q:"機体への登録記号の表示について正しいものはどれか。",o:["最大離陸重量25kg以上は25mm以上、25kg未満は3mm以上の文字高さで表示する","最大離陸重量に関わらず文字高さ3mm以上で表示する","最大離陸重量25kg以上は3mm以上、25kg未満は25mm以上の文字高さで表示する","リモートIDを搭載していれば登録記号の表示を省略できる"],a:0,e:"登録記号は機体にはっきり見えるように表示します。文字の高さは機体の重さで変わります。\n・最大離陸重量25kg以上：25mm以上\n・最大離陸重量25kg未満：3mm以上\n重さに関係なく一律というわけではなく、25kg以上の大きい機体ほど大きな文字が必要です。",ref:"教則 第3章 3.1.2 登録記号の表示（p.13）"},
  {cat:1,lvl:"common",q:"空域に関する「許可」と飛行の方法に関する「承認」の区別として正しいものはどれか。",o:["飛行禁止空域での飛行は許可、夜間や目視外などの飛行の方法は承認が必要","飛行禁止空域での飛行は承認、夜間や目視外などの飛行の方法は許可が必要","飛行禁止空域も飛行の方法も、いずれも『許可』を受ける必要がある","空域と方法の両方に該当する場合は、いずれか一方の手続きを受ければ足りる"],a:0,e:"手続きの呼び名が使い分けられています。\n・飛行禁止空域を飛ぶとき＝「許可」\n・夜間、目視外、人や物との距離、催し場所の上空といった飛ばし方＝「承認」\n空域と方法の両方に当てはまるときは、どちらか一方ではなく、両方を受けます。",ref:"教則 第3章 3.1.1 許可と承認（p.7）"},
  {cat:1,lvl:"common",q:"小型無人機等飛行禁止法における飛行禁止の範囲として正しいものはどれか。",o:["重要施設の敷地・区域上空（イエローゾーン）と、その周囲おおむね1,000mの上空（レッドゾーン）","重要施設の敷地・区域上空（レッドゾーン）と、その周囲おおむね1,000mの上空（イエローゾーン）","重要施設の敷地・区域上空（レッドゾーン）のみが禁止され、周辺地域の上空は禁止されない","重要施設の敷地・区域上空（レッドゾーン）と、その周囲おおむね300mの上空（イエローゾーン）"],a:1,e:"小型無人機等飛行禁止法では、次の2つの範囲で飛ばすことが禁止されています。\n・国会議事堂などの重要施設の敷地・区域の上空＝レッドゾーン\n・その周囲おおむね1,000mの上空＝イエローゾーン\n教則第5版（令和8年7月から適用）でこの法律の一部改正が反映され、周辺地域の範囲は「おおむね1,000m」と書かれています（従来の300mではありません）。施設の真上がレッド、その周りがイエローです。名前が逆になっている選択肢に注意してください。",ref:"教則 第3章 3.2.1 小型無人機等飛行禁止法（レッド・イエローゾーン）（p.30）"},
  {cat:1,lvl:"common",q:"リモートID機能の搭載が免除される場合の組合せとして正しいものはどれか。",o:["事前登録機体・30m以内の係留・届出済み特定区域・警察等の秘匿業務","事前登録機体・30m以内の係留・目視内飛行・警察等の秘匿業務","事前登録機体・50m以内の係留・届出済み特定区域・警察等の秘匿業務","事前登録機体・30m以内の係留・届出済み特定区域・消防等の緊急用務"],a:0,e:"リモートID機能を付けなくてよいのは、次の4つの場合だけです。\n・2022年6月19日までに事前登録した機体\n・30m以内の係留飛行\n・届出済みの特定区域での飛行\n・警察や海上保安庁などの秘匿を要する業務\n係留は50m以内ではなく30m以内です。屋内、趣味、目視内といった理由では免除されません。",ref:"教則 第3章 3.1.2 リモートID機能の搭載の義務（p.13）"},
  {cat:1,lvl:"one",q:"〔一等〕カテゴリーⅢ飛行の適切な管理と申請について、最も適切なものを１つ選べ。",o:["二等無人航空機操縦士の技能証明と第二種機体認証があれば、カテゴリーⅢ飛行を行うことができる。","カテゴリーⅢ飛行の申請は、飛行開始予定日の10開庁日前までに国土交通省航空局に提出する必要がある。","一等技能証明、第一種機体認証があれば、カテゴリーⅢ飛行では許可申請は不要である。","カテゴリーⅢ飛行の申請は、飛行開始予定日の20開庁日前までに国土交通省航空局に提出する必要がある。"],a:3,e:"カテゴリーⅢ飛行をするには、次のすべてが必要です。\n・一等無人航空機操縦士の技能証明を受けた人が飛ばすこと\n・第一種機体認証を受けた機体を使うこと\n・運航の管理が適切に行われることについて、国土交通大臣の許可・承認を受けること\n・リスクの分析と評価にもとづく非常時の対処方針や緊急着陸場所の設定など、リスクを減らす方法を書いた飛行マニュアルを出すこと\n申請は、飛行開始予定日の20開庁日前までに国土交通省航空局へ提出します。10開庁日前ではありません。",ref:"教則 第3章 航空法全般（カテゴリーⅢ飛行の許可・承認手続）"},
];
// ---- 第4章 システム（53問） ----
const Q_SYSTEM = [
  {cat:2,lvl:"common",q:"無人航空機の種類と特性について、最も適切なものを１つ選べ。",o:["飛行機は回転翼航空機に比べ、飛行速度が速く、エネルギー効率が高いため、長距離・長時間の飛行が可能である。パワードリフト機は最大離陸重量25kg以上のペイロードの大きい飛行機のことを指す。","回転翼航空機（マルチローター、ヘリコプター）は飛行機に比べ、長距離・長時間の飛行が可能で、飛行機は垂直離着陸やホバリングが可能、パワードリフト機は両者の特性を組み合わせたものである。","回転翼航空機（マルチローター、ヘリコプター）は垂直離着陸やホバリングが可能で、飛行機は速度とエネルギー効率に優れ長距離・長時間の飛行が可能、パワードリフト機は両者の特性を組み合わせたものである。","パワードリフト機は垂直離着陸やホバリングが可能で、回転翼航空機（マルチローター、ヘリコプター）は長距離・長時間の飛行に優れ、飛行機は両者の特性を組み合わせたものである。"],a:2,e:"無人航空機には、回転翼航空機（マルチローター、ヘリコプター）、飛行機、パワードリフト機などがあります。\n・回転翼航空機：垂直に離着陸でき、ホバリング（＝空中の一点に留まること）もできます\n・飛行機：垂直離着陸やホバリングはできませんが、回転翼航空機より速度が出てエネルギー効率が高く、長距離・長時間の飛行ができます\n・パワードリフト機：回転翼航空機のように垂直離着陸ができ、巡航中は飛行機のように前進飛行ができる、両方の特徴を合わせた機体です",ref:"教則 第4章 4.1.1 無人航空機の種類と特徴"},
  {cat:2,lvl:"common",q:"飛行機の飛行特性について、正しいものを１つ選べ。",o:["飛行機は回転翼航空機に比べてエネルギー効率が低く、長距離・長時間の飛行には適さない。","安全に飛行できる最低速度が決められており、それ未満での低速飛行ができない。","飛行中に故障等により推力を失った場合、すぐに墜落してしまうため、高い操縦技術が必要となる。","横方向の移動はバンクターン（旋回）で行うが、姿勢安定装置を使用しない場合はバンクターンの操作はラダーのみで行う。"],a:1,e:"飛行機は、速く飛べる・長時間飛べる・長距離を飛べる・エネルギー効率が高い、という特性があります。反対に、低速飛行や垂直離着陸はできず、離着陸には広い場所が必要です。安全に飛べる最低速度が決まっていて、それより遅くは飛べません。これが正答です。また、飛行機は滑空できるので、エンジン停止などで推力を失ってもすぐには墜落しません。横方向への移動はバンクターン（旋回）で行いますが、姿勢安定装置を使わない場合は、ラダーだけではなくエルロンとエレベーターの複合操作になります。",ref:"教則 第4章 4.1.2 飛行機"},
  {cat:2,lvl:"common",q:"大型機(飛行機)の特性について、適切ではないものを１つ選べ。",o:["大型機は慣性力が大きいことから、増速・減速・上昇・降下などに要する時間と距離が長くなる。","大型機は一般に小型の機体よりも騒音が大きいため、飛行ルート周囲への配慮が必要となる。","大型機はペイロードが大きいが、機体が大きい分、風の影響をより受けやすくなる。","大型機（最大離陸重量 25kg 以上）はペイロードを大きくすることができ、ガソリンエンジンなど推進動力の選択肢も広がるのでより長距離・長時間飛行も可能となる。"],a:2,e:"大型機は機体が大きいぶんペイロード（＝積める重さ）が大きく、長距離・長時間の飛行ができ、風の影響は受けにくい機体です。そのため「風の影響をより受けやすくなる」という記述が誤りです。一方で、事故が起きたときの影響が大きいため、操縦者の習熟度と安全意識が十分に高くなければなりません。さらに慣性力が大きいので、増速・減速・上昇・降下にかかる時間と距離が長くなり、障害物をよけたり緊急着陸地点を選んだりする場面では特に注意が必要です。騒音も一般に小型機より大きいので、飛行ルートの周りへの配慮も求められます。",ref:"教則 第4章 4.1.2 飛行機（大型機）"},
  {cat:2,lvl:"common",q:"回転翼航空機（ヘリコプター）の特性について、適切ではないものを１つ選べ。",o:["回転翼航空機（ヘリコプター）は垂直離着陸やホバリングが可能であるが、これには大きなエネルギー消費がともなう。","回転翼航空機(マルチローター)と比較して、回転翼航空機(ヘリコプター)は１組のローターで揚力を発生させるため、ローターの直径が大きく、空力的に効率良く揚力を発生させることができない。","回転翼航空機（ヘリコプター）には、ローターの回転面を傾けたり、ローターピッチ角を変えたりするために必要な機構として、スワッシュプレートがある。","回転翼航空機（ヘリコプター）には、ローターの反トルクを打ち消したり、機体の向き（ヨー方向）を変えたりする操縦に用いるテールローターが必要である。"],a:1,e:"ヘリコプターは垂直離着陸やホバリングができますが、そのぶんエネルギーを多く使い、風の影響も受けやすい機体です。揚力は1組のローターで生み出すためローターの直径が大きくなり、空力的には効率よく揚力を得られます。したがって「効率良く揚力を発生させることができない」という記述が誤りです。また、ローターの回転面を傾けたりローターピッチ角を変えたりするための機構（スワッシュプレート等）や、ローターの反トルクを打ち消して機体の向き（ヨー方向）を変えるためのテールローターも必要です。こうした点から、ヘリコプターの構造は複雑といえます。",ref:"教則 第4章 4.1.3 回転翼航空機（ヘリコプター）（p.35）"},
  {cat:2,lvl:"common",q:"回転翼航空機（ヘリコプター）の大型機に関する特性について、適切ではないものを１つ選べ。",o:["小型の機体と比較してエンジン騒音やローター騒音が大きくなる。","慣性力が大きいため、操縦時の機体挙動は早い。","大型機は事故発生時の影響が大きいことから、操縦者の習熟度及び安全意識が十分に高くなければならない。","ホバリングでは早めに操舵することが必要である。"],a:1,e:"最大離陸重量25kg以上の大型のヘリコプターは慣性力が大きいため、操舵しても機体の動きは遅れ気味になります。「機体挙動は早い」は逆なので、これが誤りです。動きが遅れるぶん、その場で位置を保つホバリングのときは早めに操舵する必要があります。また、大型の機体は一般に小型の機体よりエンジン騒音やローター騒音が大きくなります。事故が起きたときの影響も大きいので、操縦者の習熟度と安全意識が十分に高くなければなりません。",ref:"教則 第4章 4.1.3 回転翼航空機（ヘリコプター）（大型機）（p.35）"},
  {cat:2,lvl:"common",q:"回転翼航空機（マルチローター）について、最も適切なものを１つ選べ。",o:["ローターの回転面を傾けたり、ローターピッチ角を変えたりするためのスワッシュプレートを備えており、これにより上昇・降下や前後左右移動を行う。","機体外周に配置された各ローターの回転数を調整することで、上昇・降下や前後左右移動、ホバリングや水平回転をさせることが出来る。","各ローターの反トルクを打ち消したり、機体の向き（ヨー方向）を変えたりするために、機体後部にテールローターを装備している。","ローターの数が多いほどペイロードは増えるが、故障に対する耐性は低くなる。"],a:1,e:"マルチローターは、機体の外周に並べた複数のローターを高速で回して飛びます。姿勢や位置を安定させるためにフライトコントロールシステムで各ローターの回転数を制御し、上昇・降下、前後左右の移動、ホバリング、水平回転を行います。また、ローターの数が多いほど故障に強くなり、ペイロード（＝積める重さ）も増えます。なお、スワッシュプレートやテールローターはヘリコプターに必要な機構で、マルチローターには要りません。",ref:"教則 第4章 4.1.4 回転翼航空機（マルチローター）（p.35）"},
  {cat:2,lvl:"common",q:"回転翼航空機（マルチローター）の最大離陸重量 25kg 以上の大型機の特徴について、不適切なものを１つ選べ。",o:["機体の対角寸法やローターのサイズやモーターパワーも大きくなり、飛行時の慣性力も増加し、上昇・降下や加減速などに要する時間と距離が長くなる。","小型機と比べ、飛行時機体から発せられる騒音が大きくなり周囲への影響範囲も広がる。","機体が大きくなることで、小型機と比べてペイロードを大きくすることができる。","機体の対角寸法やローターのサイズやモーターパワーが大きくなることで、揚力が大きくなり、上昇・降下や加減速などに要する時間と距離が短くなる。"],a:3,e:"最大離陸重量25kg以上の大型のマルチローターは、機体の対角寸法もローターのサイズもモーターパワーも大きくなります。そのぶん飛行時の慣性力が増えるので、上昇・降下や加減速にかかる時間と距離は長くなります。「短くなる」は逆なので、これが誤りです。また、飛行時に機体から出る騒音も大きくなり、周りへ影響が及ぶ範囲も広がります。大型機を適切に操縦するには、こうした特性を理解しておく必要があります。",ref:"教則 第4章 4.1.4 回転翼航空機（マルチローター）（大型機）（p.35）"},
  {cat:2,lvl:"common",q:"無人航空機の夜間飛行における装備について、最も適切なものを１つ選べ。",o:["夜間飛行のため、無人航空機には姿勢と方向が正確に視認できる灯火を有することが求められるが、当該灯火を有していれば航空法に基づく夜間飛行の承認は不要である。","無人航空機の飛行範囲が照明等で十分照らされている場合であっても、機体には姿勢と方向が正確に視認できる灯火を有する必要がある。","無人航空機の夜間飛行においては、無人航空機の飛行範囲が照明等で十分照らされている場合は航空法に基づく夜間飛行の承認は不要である。","夜間飛行においては、ビジョンセンサーが正常に機能せず、姿勢が安定しにくくなる可能性がある。"],a:3,e:"夜間に飛ばす装備として、機体の姿勢と方向がはっきり見える灯火を付けることが求められます。ただし、飛行範囲が照明などで十分に照らされている場合は、この限りではありません。なお、どちらの場合でも航空法にもとづく夜間飛行の承認は必要です。また、ビジョンセンサーはカメラで撮った画像をもとに処理するのが一般的なので、夜間に対応していない場合は、衝突回避や姿勢安定といった安全機能が使えないことがある点に注意が必要です。",ref:"教則 第4章 4.2.1 夜間飛行の装備（p.36）"},
  {cat:2,lvl:"common",q:"無人航空機の夜間飛行について、最も適切なものを１つ選べ。",o:["夜間飛行のため、無人航空機は姿勢や方向が正確に視認できる灯火を有する必要があるが、無人航空機の飛行範囲が照明で十分照らされている場合は、この限りではない。","姿勢と方向が正確に視認できる灯火を有する無人航空機を用いた場合、離着陸地点、緊急着陸地点、飛行経路中の回避すべき障害物について視認するための地上照明は不要である。","夜間飛行の承認を受けていれば、無人航空機に姿勢や方向が視認できる灯火を装備する必要はない。","機体に搭載されたビジョンセンサーは、夜間でも昼間と同様に機能するため、衝突回避・姿勢安定などの安全機能をそのまま使用することができる。"],a:0,e:"夜間は機体の姿勢や進行方向を視認できないため、灯火を付けた機体が必要です。ただし、飛行範囲が照明等で十分に照らされている場合は、その限りではありません。\nどちらの場合も、日没後に飛ばすなら航空法に基づく夜間飛行の承認が必要です。\n夜間飛行では次の備えが求められます。\n・操縦者の手元で位置・高度・速度等の情報が把握できる送信機を使うことが望ましい\n・地形や人工物等の障害物が視認できないため、離着陸地点、計画的に用意する緊急着陸地点、飛行経路上で避けるべき障害物に地上から照明を当て、視認できるようにする\n・機体のビジョンセンサーはカメラで撮影した画像をもとにデータ処理するのが一般的で、夜間に対応していない場合は衝突回避・姿勢制御などの安全機能が使えない可能性がある",ref:"教則 第4章 4.2.1 夜間飛行の装備（p.36）"},
  {cat:2,lvl:"common",q:"目視外飛行のために必要な装備について、最も適切なものを１つ選べ。",o:["目視外飛行において、自動操縦システムを装備していれば、機体の不具合状況を地上で把握できる操縦装置は不要である。","目視外飛行において、補助者を配置する場合に限り、機体の針路、姿勢、高度、速度及び周辺の気象状況等を把握できる操縦装置が必要である。","目視外飛行において、補助者を配置していれば、機体カメラの装備は不要となる。","目視外飛行において、補助者を配置していても、不具合発生時に対応する危機回避機能（フェールセーフ機能）は必要である。"],a:3,e:"目視外飛行（＝機体を直接見ないで飛ばすこと）では、補助者がいてもいなくても、次の装備が必要です。\n・自動操縦システム\n・機体に搭載したカメラ\n・不具合の状況を地上で監視できる操縦装置\n・不具合が起きたときに対応する危機回避機能（フェールセーフ機能）\nどれも飛行中の安全を守るために欠かせない装備なので、「補助者がいるから不要」とはなりません。さらに補助者を置かない場合は、機体の針路・姿勢・高度・速度や周辺の気象状況などがわかる操縦装置などが追加で必要になります。",ref:"教則 第4章 4.2.2 目視外飛行の装備（p.37）"},
  {cat:2,lvl:"common",q:"以下の選択肢のうち、無人航空機の物件投下装置について、最も適切なものを１つ選べ。",o:["物件投下装置は、搭載位置や対象物が定められているため、投下装置の特性と機能を理解する必要性がある。","物件投下装置には搭載位置や対象とする物件の定めはないため、機体の任意の位置に取り付けて使用できる。","物件投下装置は、物件が揺れない構造となっているため、正しい取り付け位置であれば、飛行中の重心移動について考える必要性は低い。","物件投下用のウインチ機構で吊り下げることは、物件の揺れ、投下前後の重心の変化が著しいため行うべきではない。"],a:0,e:"物件投下装置は、取り付ける位置や投下する物件が決められています。そのため、その装置の特性と機能を理解しておく必要があります。また、物件が揺れない構造になっているわけではないので、飛行中に重心が動くことを考えて飛ばす必要があります。特に物件投下用のウインチ機構でぶら下げる場合は、物件の揺れや投下前後の重心の変化が大きいので注意が必要です。ただし注意が必要というだけで、「行うべきではない」とまでは言えません。",ref:"教則 第4章 4.4.5 物件投下のために装備される機器"},
  {cat:2,lvl:"common",q:"揚力発生の特徴についての記述として、適切ではないものを1つ選べ。",o:["迎角を大きくすると揚力も大きくなるが、大きくしすぎると、空気の流れは翼の表面から剥離し、揚力は減じ、抗力が増大し、失速を招く。","故障などによって飛行中に推力を失っても、滑空飛行状態になれば、すぐには墜落しない。","流れと垂直方向に作用する力を揚力といい、流れの方向に働く力を抗力という。","飛行機は失速状態になっても、急降下はしない。"],a:3,e:"空気の流れに対して垂直に働く力が揚力、流れと同じ向きに働く力が抗力です。翼やプロペラの迎角を大きくすると揚力も大きくなりますが、大きくしすぎると空気の流れが翼の表面からはがれ（剥離）、揚力が減って抗力が増え、失速を招きます。飛行中に失速すると機体は急降下を始めるので、「失速しても急降下はしない」は誤りです。故障などで飛行中に推力を失ってもすぐに墜落しないのは、滑空飛行の状態になった場合の話で、失速状態では急降下します。なお、上面のふくらみが下面より大きい翼の形は効率よく揚力を出せるため、翼型やローターの断面に使われています。",ref:"教則 第4章 4.3.1 無人航空機の飛行原理"},
  {cat:2,lvl:"common",q:"無人航空機の飛行に関する記述の中から、最も適切なものを１つ選べ。",o:["飛行機は基本的に、ピッチを変化させるための舵が「水平尾翼にあるエレベーター」、ロールを変化させるための舵が「主翼にあるエルロン」、ヨーを変化させる舵が「垂直尾翼にあるラダー」である。","機体の前後・上下を含む面に空気流入の向きを投影したときに、前後軸とのなす角を迎角といい、上方から空気が流入するときに迎角は正である。","飛行機は基本的に、ピッチを変化させるための舵が「水平尾翼にあるエレベーター」、ロールを変化させるための舵が「垂直尾翼にあるラダー」、ヨーを変化させる舵が「主翼にあるエルロン」である。","機体の前後・上下を含む面と空気流入の向きの面のなす角を横滑り角といい、機体左側から空気流入するときに横滑り角は正である。"],a:0,e:"飛行機の姿勢は、機首を上げ下げするピッチ、機体を左右に傾けるロール、機体の左右の回転を示すヨーの角度で表し、これらを変えることで飛ぶ向き（飛行速度の向き）を制御します。舵は次のとおりです。\n・ピッチ：水平尾翼にあるエレベーター\n・ロール：主翼にあるエルロン\n・ヨー：垂直尾翼にあるラダー\nエルロンとラダーを入れ替えた選択肢は誤りです。また、迎角は機体の前後・上下を含む面に空気の流入方向を投影したときに前後軸との間にできる角のことで、「下方」から空気が入るときが正です（上方ではありません）。横滑り角は、機体の前後・上下を含む面と空気の流入方向の面との間にできる角で、機体の「右」側から空気が入るときが正です（左側ではありません）。",ref:"教則 第4章 4.3.1 無人航空機の飛行原理"},
  {cat:2,lvl:"common",q:"回転翼航空機のローターの特徴について、もっとも適切なものを1つ選べ。",o:["マルチローターのブレードのピッチ角は固定であるため、各プロペラの回転数を変化させ、ピッチ、ロール、ヨーの運動を行う。","プロペラの回転により機体には反トルクが作用するが、マルチローターは偶数個のプロペラを全て同じ向きに回転させることで、反トルクを相殺する。","ヘリコプターはブレードのピッチ角を固定し、プロペラの回転数を変化させてピッチ、ロールの制御を行い、テールローターの回転数を変化させてヨーの制御を行う。","マルチローターはブレードのピッチ角を周期的に変化させる可変ピッチ機構を持ち、プロペラの回転数を一定に保ったままピッチ、ロール、ヨーの運動を行う。"],a:0,e:"プロペラが回ると、機体にはそれを逆向きに回そうとする力（反トルク）が働きます。マルチローターは偶数個のプロペラを半数ずつ逆向きに回して、この反トルクを打ち消しています（全部を同じ向きに回すのでは打ち消せません）。マルチローターのブレードのピッチ角は固定なので、各プロペラの回転数を変えることでピッチ・ロール・ヨーの動きを行います。一方ヘリコプターのメインローターは、1回転する間にブレードのピッチ角を周期的に変える可変ピッチ機構を持ち、そのピッチ角の変化でピッチとロールを制御し、テールローターの回転数を変えてヨーを制御します。",ref:"教則 第4章 4.3.1 無人航空機の飛行原理"},
