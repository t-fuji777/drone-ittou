  {cat:4,lvl:"common",q:"降雨・降雪時の無人航空機の飛行について、最も適切なものを１つ選べ。",o:["降雨時であっても、視程が確保でき機体を常時監視できる状態であれば、原則として飛行させて差し支えない。","機体内部に水が浸入して故障の原因となるほか視程も悪化するため、原則として飛行させない。","降雪は降雨と異なり機体内部に水が浸入するおそれがないため、降雪時の飛行に支障はない。","防水性能を有する機体であれば、降雨時でも浸水や視程の悪化を考慮することなく飛行させてよい。"],a:1,e:"雨や雪は、機体の中に水が入って電子機器などが故障したり墜落したりする原因になります。さらに視程（＝見通せる距離）が悪くなり、機体を見張ることも難しくなります。そのため、降雨・降雪時は原則として飛ばさない判断が必要です。雪も機体に付いて融ければ水分になり、浸水の原因になります。小雨だから、視程が確保できているから、という理由だけで飛ばしてよいとはいえません。",ref:"教則 第6章 6.2.2 気象（降雨・降雪）"},
  {cat:4,lvl:"common",q:"気温が高い環境で無人航空機を運航する場合の注意事項について、最も適切なものを１つ選べ。",o:["高温の影響を受けるのはバッテリーのみであり、モーターやESCの温度上昇を考慮する必要はない。","気温が高いほどバッテリーの化学反応が活発になるため、飛行可能時間が長くなり運航には有利である。","モーター、ESC（エレクトロニックスピードコントローラー）、バッテリー等が過熱しやすく、性能低下や故障のおそれがあるため注意が必要である。","機体は飛行中に受ける風により冷却されるため、地上で待機している間の温度上昇にのみ注意すれば、飛行中の過熱を考慮する必要はない。"],a:2,e:"夏場など気温が高い環境では、モーター、ESC（エレクトロニックスピードコントローラー）、バッテリー等が過熱しやすく、性能低下や故障の原因になります。機体の温度上昇に注意して運航する必要があります。熱の影響を受けるのはバッテリーだけではなく、モーターやESCにも及びます。飛行中に受ける風で過熱がいつも解消されるとは限らず、気温が高いほうが飛行時間の面で有利になるというのも誤りです。",ref:"教則 第6章 6.2.2 気象（気温）"},
  {cat:4,lvl:"common",q:"高度による風の変化について、最も適切なものを１つ選べ。",o:["風は地表面の摩擦の影響を受けるため一般に地上付近より上空の方が強く、地上の風速から上空の風の強さを見込んで飛行の判断を行う必要がある。","高度が上がるほど地表面の摩擦の影響が小さくなるため、上空の風は地上付近より弱くなる。","風速は高度によって変化しないため、地上で観測した風速をそのまま上空の風速とみなしてよい。","地上でほぼ無風であれば上空でも風は弱いと判断できるため、上空の風の強さを見込んで飛行の判断を行う必要はない。"],a:0,e:"地上付近の風は地表面との摩擦で弱められるため、一般に上空ほど風は強くなります。ですから、地上で風が弱くても上空では強い風が吹いていることがあり、地上で観測した風速から上空の風の強さを見込んで、飛ばすかどうかを判断する必要があります。摩擦の影響が小さくなる上空のほうが風が弱くなる、あるいは高度によらず風速は変わらない、というのは誤りです。",ref:"教則 第6章 6.2.2 気象（風）"},
  {cat:4,lvl:"common",q:"日本付近の四季の気圧配置と天気について、最も適切なものを１つ選べ。",o:["冬は西高東低の気圧配置となり、シベリア高気圧から吹き出す冷たい北西の季節風により、日本海側では雪の日が多くなる。","初夏には秋雨前線が、秋には梅雨前線が日本付近に停滞し、それぞれ長雨をもたらして雨の日が多くなる。","台風は冬に最も多く日本に接近・上陸するため、冬の運航では特に台風情報に注意する。","夏は南高北低の気圧配置となり、シベリア高気圧から吹き出す暖かく湿った南東の季節風により、蒸し暑い日が多くなる。"],a:0,e:"冬は、大陸のシベリア高気圧と東の低気圧によって西高東低の気圧配置になり、そこから吹き出す冷たい北西の季節風が日本海側に雪をもたらします。ほかの選択肢が誤りである理由は次のとおりです。\n・夏に日本を覆うのはシベリア高気圧ではなく太平洋高気圧\n・梅雨前線は初夏に、秋雨前線は秋に停滞して長雨をもたらすので、初夏に秋雨・秋に梅雨とするのは時期が逆\n・台風が日本に接近・上陸するのは主に夏から秋で、冬に最も多いわけではない",ref:"教則 第6章 6.2.1 日本の天気（気圧配置）"},
];

// ---- v74: 教則第5版で新設・変更された論点（7問） ----
const Q_LAW5 = [
  {cat:3,lvl:"common",q:"無人航空機の保険に関する記述として、最も適切なものを１つ選べ。",o:["カテゴリーⅡ飛行のうち、十分な補償が可能な第三者賠償責任保険への加入が求められるのは、レベル3.5飛行の場合に限られる。","カテゴリーⅡ飛行のうち、総重量25kg以上の無人航空機を飛行させる場合又はレベル3.5飛行の場合は、不測の事態が発生した場合に十分な補償が可能な第三者賠償責任保険に加入していることが求められる。","総重量25kg以上の無人航空機を飛行させる場合は、機体保険に加入していれば第三者賠償責任保険への加入は不要である。","無人航空機の保険には自動車の自賠責保険と同様の強制保険があり、すべての無人航空機の飛行について加入が義務付けられている。"],a:1,e:"無人航空機の保険には、自動車の自賠責保険のような強制保険はなく、すべて任意保険です。ただし万一のときの金銭的な負担は大きいので、自分の使い方に合った保険に入ることがすすめられています。令和8年7月の改正（教則第5版）で保険の付保範囲が広がり、カテゴリーⅡ飛行のうち次のどちらかにあてはまる場合は、不測の事態が起きたときに十分な補償ができる第三者賠償責任保険（＝他人に与えた損害を賠償するための保険）に加入していることが求められることになりました。\n・総重量25kg以上の無人航空機を飛行させる場合\n・レベル3.5飛行の場合\nつまり、レベル3.5飛行だけに限られるわけではありません。なお、機体保険は機体やカメラ自体の損傷に対する保険で、第三者に与えた損害の賠償には対応しません。",ref:"教則 第2章 2.3.3 保険（p.6）"},
  {cat:1,lvl:"common",q:"人口集中地区（DID）の上空における飛行の取扱いについて、最も適切なものを１つ選べ。",o:["工業専用地域内の区域であっても、人口集中地区に該当する場合はDIDに係る許可を受けなければ飛行させることができない。","都市計画法第8条第1項第1号の工業専用地域内の区域において無人航空機を飛行させる場合は、DIDに係る許可手続き等が不要である。","工業地域及び準工業地域内の区域において無人航空機を飛行させる場合も、同様にDIDに係る許可手続き等が不要である。","工業専用地域内の区域では、DIDに係る許可のほか、夜間飛行及び目視外飛行に係る承認手続きも不要となる。"],a:1,e:"令和8年7月の改正により、都市計画法第8条第1項第1号の工業専用地域内の区域で無人航空機を飛ばす場合は、DID（人口集中地区）に係る許可手続き等が不要になりました。飛行禁止空域の規定でも「国勢調査の結果を受け設定されている人口集中地区の上空（工業専用地域内の区域の上空を除く。）」と明記されています。対象は用途地域のうち工業専用地域だけで、工業地域や準工業地域は含まれません。また、不要になるのはDIDに係る許可手続き等だけです。夜間飛行や目視外飛行といった飛行の方法に係る承認、空港等の周辺の空域や高度150メートル以上の空域などほかの飛行禁止空域に係る許可は、別に必要です。",ref:"教則 第3章 3.1.2 無人航空機の飛行禁止空域（人口集中地区）"},
  {cat:1,lvl:"common",q:"航空法施行規則第236条の82第1項第2号の規定による農薬散布等の例外について、最も適切なものを1つ選べ。",o:["農薬等の空中散布は物件の投下には該当しないため、そもそも物件投下に係る承認手続きを要しない。","同号で定める要件を満たす場合であっても、承認手続きが不要となるのは危険物輸送及び物件投下に限られ、夜間飛行及び目視外飛行については別途承認を受ける必要がある。","同号で定める要件を満たす場合は、人口集中地区の上空における飛行に係る許可も含め、特定飛行に係る許可・承認の手続きがすべて不要である。","同号で定める要件を満たして農薬等の空中散布などを行う場合は、夜間飛行、目視外飛行、第三者から30メートル以内の飛行、危険物輸送及び物件投下に係る飛行の承認手続きが不要である。"],a:3,e:"令和8年7月の改正で、規制対象となる飛行の空域・方法の例外に「航空法施行規則第236条の82第1項第2号の規定による農薬散布等の例外」が追記されました。無人航空機で農薬等の空中散布などを行う場合で、同号が定める要件を満たすときは、次の承認手続きが不要になります。\n・夜間飛行\n・目視外飛行\n・第三者から30メートル以内の飛行\n・危険物輸送\n・物件投下\n不要になるのは飛行の方法に係る承認だけで、人口集中地区の上空のような空域に係る許可は含まれません。また、物件の投下には水や農薬等の液体・霧状のものをまくことも含まれるので、農薬の空中散布はそもそも物件投下にあたります。",ref:"教則 第3章 3.1.2(2)3)d 農薬散布等の例外（p.18）"},
  {cat:1,lvl:"common",q:"十分な強度を有する紐等で係留した場合の例外と、農薬等の空中散布などを行う場合の例外（航空法施行規則第236条の82第1項第2号）との違いについて、最も適切なものを1つ選べ。",o:["いずれの例外においても、多数の者の集合する催しが行われている場所の上空における飛行に係る承認手続きが不要となる。","係留の例外では危険物輸送に係る承認手続きが不要となるのに対し、農薬等の空中散布の例外では人口集中地区の上空における飛行に係る手続きが不要となる。","係留の例外では人口集中地区の上空における飛行に係る手続きが不要となるのに対し、農薬等の空中散布の例外では危険物輸送に係る承認手続きが不要となる。","いずれの例外においても、人口集中地区の上空における飛行及び危険物輸送に係る手続きがともに不要となる。"],a:2,e:"2つの例外は、手続きが不要になる範囲が違います。\n・係留の例外（十分な強度を有する紐等〔30メートル以下〕でつなぎ、飛行可能な範囲に第三者が入らないよう立入管理等の措置をとった場合）…人口集中地区、夜間飛行、目視外飛行、第三者から30メートル以内の飛行、物件投下に係る手続き等が不要\n・農薬等の空中散布の例外（令和8年7月の改正で追記。航空法施行規則第236条の82第1項第2号の要件を満たす場合）…夜間飛行、目視外飛行、第三者から30メートル以内の飛行、危険物輸送、物件投下に係る承認手続きが不要\n夜間飛行・目視外飛行・第三者から30メートル以内の飛行・物件投下は両方に共通します。違うのは、人口集中地区は係留の例外だけ、危険物輸送は農薬散布等の例外だけが対象という点です。なお、多数の者が集合する催しが行われている場所の上空を飛ぶことは、どちらの例外の対象にもなりません。",ref:"教則 第3章 3.1.2(2)3)c・d 規制対象となる飛行の空域及び方法の例外（p.18）"},
  {cat:1,lvl:"common",q:"無人航空機操縦者技能証明の更新の申請について、最も適切なものを１つ選べ。",o:["技能証明の更新を申請する者は、有効期間が満了する日の３月前から１月前までの間に、国土交通大臣に対し技能証明の更新を申請しなければならない。","技能証明の更新を申請する者は、有効期間が満了する日以前２月以内に、国土交通大臣に対し技能証明の更新を申請しなければならない。","技能証明の更新を申請する者は、有効期間が満了する日の６月前から１月前までの間に、国土交通大臣に対し技能証明の更新を申請しなければならない。","技能証明の更新を申請する者は、有効期間が満了した日から１年以内であれば、いつでも国土交通大臣に対し技能証明の更新を申請することができる。"],a:2,e:"技能証明（＝無人航空機を操縦する技能について国が行う証明）の有効期間は3年です。令和8年7月の改正（教則第5版）で更新の申請期間が見直され、更新する人は「有効期間が満了する日の6月前から1月前までの間」に国土交通大臣へ技能証明の更新を申請しなければならないことになりました。あわせて、「登録更新講習機関」が実施する無人航空機更新講習を、更新の申請をする日以前3月以内に修了しておく必要があります。有効期間が切れた後に、さかのぼって更新を申請できる制度ではありません。",ref:"教則 第3章 3.1.2(5)3) 技能証明の交付手続き（更新申請期間）"},
  {cat:1,lvl:"common",q:"無人航空機操縦者技能証明の更新に係る無人航空機更新講習について、最も適切なものを１つ選べ。",o:["無人航空機更新講習の修了は任意であり、これを修了していなくても有効期間が満了する日の６月前から１月前までの間に申請すれば技能証明は更新される。","「登録講習機関」が実施する無人航空機更新講習を、有効期間の更新の申請をする日以前３月以内に修了したうえで、更新を申請しなければならない。","「指定試験機関」が実施する無人航空機更新講習を、有効期間が満了する日以前１月以内に修了したうえで、更新を申請しなければならない。","「登録更新講習機関」が実施する無人航空機更新講習を、有効期間の更新の申請をする日以前３月以内に修了したうえで、更新を申請しなければならない。"],a:3,e:"技能証明を更新するには、次の2つが必要です。\n・「登録更新講習機関」が実施する無人航空機更新講習を、有効期間の更新の申請をする日以前3月以内に修了すること\n・有効期間が満了する日の6月前から1月前までの間に、国土交通大臣へ更新を申請すること（申請期間は令和8年7月の改正で見直されました）\n更新講習を実施するのは「登録更新講習機関」です。新規取得のときの無人航空機講習（学科講習・実地講習）を行う「登録講習機関」でも、試験を実施する「指定試験機関」でもありません。更新講習の修了は、更新申請に必ず必要な条件です。",ref:"教則 第3章 3.1.2(5)3) 技能証明の交付手続き（無人航空機更新講習）"},

//  選択肢生成ヘルパー（正解1＋誤答wrongN個をシャッフル出題）
//  - v69で全モード三択に統一（誤答2。本番の三肢択一に整合）。データは誤答3を保持し
//    セッション毎に2つを抽出するため、繰り返し学習で選択肢の組合せが変わる
//  - q.o[q.a] を必ず含め、誤答が足りない場合はある分だけ使う
//  - 返り値: { opts:[文章の配列], ans:正解の表示index }
// ============================================================
function make4(q, wrongN){
  const correct = q.o[q.a];
  const wrongs = q.o.filter((_,i)=>i!==q.a);
  const pickW = shuffle(wrongs).slice(0, wrongN==null?2:wrongN);
  const opts = shuffle([correct, ...pickW]);
  return { opts, ans: opts.indexOf(correct) };
}

// ---------- Persistent state ----------
const KEY="ittou_state_v1";
let S = { known:{}, wrong:{}, seen:{}, streak:0, lastDay:null, history:[], attempts:{}, cs:{}, daily:{}, box:{}, due:{} };

const dayN = () => Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/864e5);   // ローカル日付基準の日単位整数（Leitner の due 管理用。UTC境界だと日本では朝9時に日付が変わってしまう）

async function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) S = Object.assign(S, JSON.parse(raw));
  }catch(e){ /* first run */ }
  migrateBank();
  // v70: 旧形式（即時採点方式）の模試セッションは ansSel を持たず一括採点で全問未解答扱いになるため破棄
  if(S.session && S.session.mock && !S.session.ansSel){ delete S.session; save(); }
  // v70: 間隔反復（Leitner）の初期化を既存進捗から一度だけ行う
  if(!S.srInit){
    for(const id in S.wrong){ S.box[id]=0; S.due[id]=dayN(); }
    for(const id in S.known){ if(S.box[id]==null){ S.box[id]=3; S.due[id]=dayN()+3; } }
    S.srInit=true; save();
  }
  // 60日より古い日別カウンタを剪定
  const cutoff = Date.now()-60*864e5;
  for(const k in S.daily){ if(new Date(k).getTime()<cutoff) delete S.daily[k]; }
  dayTick();
}
// 日付処理（v70で実学習ベースに変更）:
//  - streak は「1問以上解答した日」の連続日数。起動しただけでは伸びない
//  - 連続が切れた状態で起動したら表示を 0 に（最初の解答で 1 から再開）
function dayTick(fromAnswer){
  const today = new Date().toDateString();
  const y = new Date(Date.now()-864e5).toDateString();
  if(S.lastDay && S.lastDay!==today && S.lastDay!==y && S.streak!==0){ S.streak=0; save(); }
  if(fromAnswer && S.lastDay!==today){
    S.streak = (S.lastDay===y ? S.streak+1 : 1);
    S.lastDay = today;
    save();
  }
  const el=document.querySelector("#streakN"); if(el) el.textContent=S.streak||0;
  const tn=document.querySelector("#todayN"); if(tn) tn.textContent=(S.daily[today]||{n:0}).n;
}
// 採点時の進捗更新（学習系の即時採点と模試の一括採点で共通・v70）:
//  - 習得(known)は連続2回正解で付与、誤答で剥奪（三択のまぐれ正解1回では習得にしない）
//  - 復習リスト(wrong)からの除外も連続2回正解が条件
//  - Leitner: 正解で box+1・次回出題日を 1→3→7→14→30日先に延長、誤答で box0・当日再出題対象
const SR_IV = {1:1, 2:3, 3:7, 4:14, 5:30};
function gradeOne(q, correct){
  S.seen[q.id]=true;
  S.attempts[q.id]=(S.attempts[q.id]||0)+1;
  const dk=new Date().toDateString();
  const d=S.daily[dk]||(S.daily[dk]={n:0,ok:0}); d.n++; if(correct) d.ok++;
  if(correct){
    S.cs[q.id]=(S.cs[q.id]||0)+1;
    if(S.cs[q.id]>=2){ S.known[q.id]=true; delete S.wrong[q.id]; }
    // box1〜5 は次回出題日を設定、box5（30日後）の復習にも正解したら box6=卒業（due 削除）
    const b=Math.min((S.box[q.id]||0)+1,6);
    S.box[q.id]=b;
    if(b<=5) S.due[q.id]=dayN()+SR_IV[b]; else delete S.due[q.id];
  } else {
    S.cs[q.id]=0;
    delete S.known[q.id];
    S.wrong[q.id]=true;
    // 誤答は翌日に再出題（v72。当日のままだと「今日の復習」の残数が解いても減らないため）
    S.box[q.id]=0; S.due[q.id]=dayN()+1;
  }
}
function dueList(){ const t=dayN(); return BANK.filter(q=>S.due[q.id]!=null && S.due[q.id]<=t && (S.box[q.id]||0)<=5); }
// 1日の復習上限（v72、v73で30問固定）。超過分は翌日以降へ自動繰越
const DUE_LIMIT=30;
function dueCap(){ return DUE_LIMIT; }
// 期限到来分から上限内で「分野バランス（母数比）＋弱い順」に抽出（v72）
function dueToday(){
  const all=dueList(), cap=dueCap();
  if(all.length<=cap) return shuffle(all);
  const weak=(a,b)=>((S.box[a.id]||0)-(S.box[b.id]||0))||((S.due[a.id]||0)-(S.due[b.id]||0));
  const pool={}; for(const c of [1,2,3,4,5]) pool[c]=all.filter(q=>q.cat===c).sort(weak);
  // 母数比で配分し、端数は最大剰余法で割り当てる
  const share=[1,2,3,4,5].map(c=>{ const ex=cap*byCat(c).length/BANK.length; return {c, ex, f:ex-Math.floor(ex), n:Math.min(Math.floor(ex), pool[c].length)}; });
  let left=cap-share.reduce((s,x)=>s+x.n,0);
  share.slice().sort((a,b)=>b.f-a.f).forEach(s=>{ if(left>0 && s.n<pool[s.c].length){ s.n++; left--; } });
  let pick=[]; share.forEach(s=>{ pick=pick.concat(pool[s.c].slice(0,s.n)); });
  if(pick.length<cap){   // その分野の期限到来が少ない場合は他分野の弱い問題で補填
    const used=new Set(pick.map(q=>q.id));
    pick=pick.concat(all.filter(q=>!used.has(q.id)).sort(weak).slice(0,cap-pick.length));
  }
  return shuffle(pick);
}

function saveSession(){
  if(!Q.list||!Q.list.length) return;
  if(Q.mode==="result") return;
  S.session={ ids:Q.list.map(q=>q.id), i:Q.i, correct:Q.correct, wrongIds:Q.wrongIds.slice(),
    mode:Q.mode, mock:Q.mock, learn:Q.learn, timer:Q.timer, n:BANK.length, ts:Date.now(),
    ansSel:Q.ansSel?Q.ansSel.slice():undefined, flags:Q.flags, times:Q.times?Q.times.slice():undefined };
  save();
}
function clearSession(){ if(S.session){ delete S.session; save(); } }
function hasResume(){ const s=S.session; return !!(s && s.ids && s.ids.length && (s.i||0) < s.ids.length); }
function discardSession(){ clearSession(); renderHome(); setNavActive("home"); }
function resumeSession(){
  const s=S.session;
  if(!s||!s.ids){ renderHome(); setNavActive("home"); return; }
  const list=s.ids.map(id=>BANK[id]).filter(Boolean);
  if(list.length<s.ids.length*0.5){ clearSession(); toast("再開データを更新できませんでした"); renderHome(); setNavActive("home"); return; }
  const i=Math.min(s.i||0, list.length-1);
  Q={ list, i, sel:null, answered:false, correct:s.correct||0, wrongIds:(s.wrongIds||[]).slice(),
      mode:s.mode||"cat", timer:s.timer||0, tInt:null, mock:!!s.mock, learn:!!s.learn, view4:snap4(list) };
  if(Q.mock){
    Q.ansSel=(s.ansSel&&s.ansSel.length===list.length)?s.ansSel.slice():Array(list.length).fill(null);
    Q.flags=s.flags||{};
    Q.times=(s.times&&s.times.length===list.length)?s.times.slice():Array(list.length).fill(0);
    // 再snapで選択済みテキストが表示選択肢から漏れた場合、誤答枠を1つ差し替えて表示整合を保つ
    Q.ansSel.forEach((sel,i)=>{
      if(sel==null) return;
      const v=Q.view4[i];
      if(v.opts.indexOf(sel)>=0) return;
      v.opts[(v.ans+1)%v.opts.length]=sel;
    });
  }
  renderQuiz();
  if(Q.mock && Q.timer>0){ tickTimer(); }
}

// ---------- 同一論点の近接出題を避ける並べ替え（v73） ----------
// 同じ論点（教則の同一節＝ref）の問題が連続すると、直前の解説を覚えているだけで
// 正解できてしまうため、出題順を組み替えて最低 MIN_GAP 問ぶん離す。
const TOPIC_GAP=6;
// 論点キー: 計算問題は公式名（ref の表記ゆれを吸収）、それ以外は教則の節（ページ番号を除去）
function topicKey(q){
  if(q.calc) return 'calc:'+q.calc;
  return String(q.ref||'').replace(/（p\.\d+[^）]*）/g,'').trim() || ('id'+q.id);
}
function spaceOut(list, minGap, keyFn){
  const gap = minGap==null ? TOPIC_GAP : minGap;
  const key = keyFn || topicKey;                       // v81: 公式パズルはカード番号をキーにする
  const pool=list.slice(), out=[], lastAt=Object.create(null), remain=Object.create(null);
  pool.forEach(q=>{ const k=key(q); remain[k]=(remain[k]||0)+1; });
  while(pool.length){
    let idx=-1, bestRemain=-1, fallback=0, bestAge=-1;
    for(let i=0;i<pool.length;i++){
      const k=key(pool[i]), la=lastAt[k];
      const age = (la===undefined) ? Infinity : out.length-la;
      if(age>=gap){
        // 十分離れている候補のうち「残り問題数が多い論点」を優先（末尾で同一論点が固まるのを防ぐ）
        if(remain[k]>bestRemain){ bestRemain=remain[k]; idx=i; }
      } else if(age>bestAge){ bestAge=age; fallback=i; }   // 全て近い場合は最も間隔が空くもの
    }
    if(idx<0) idx=fallback;
    const q=pool.splice(idx,1)[0], k=key(q);
    lastAt[k]=out.length; remain[k]--;
    out.push(q);
  }
  return out;
}

// 出題リストに対し、各問の選択肢スナップショット（opts/ans）を生成して保持。
// これにより「毎回ランダムな選択肢・配置」かつ採点が安定する。既定は3択（v69で全モード統一）。
function snap4(list, wrongN){ return list.map(q=>make4(q, wrongN)); }

function buildMock(){
  // 国家試験を想定：common50＋一等(非計算)15＋計算5＝70問（v62で比率化、v70で層化固定）
  // 分野構成を毎回固定（common50=規則24/システム12/操縦者6/リスク8、一等15=リスク11/システム3/その他1）し、
  // 回次間のスコア比較を可能にする。抽出は挑戦回数の少ない問題を優先し、連続受験で全問を一巡させる。
  const pickN=(pool,n)=>shuffle(pool).sort((a,b)=>(S.attempts[a.id]||0)-(S.attempts[b.id]||0)).slice(0,Math.min(n,pool.length));
  const fill=(sel,pool,n)=>{ if(sel.length<n){ const used=new Set(sel.map(q=>q.id)); sel=sel.concat(pickN(pool.filter(q=>!used.has(q.id)),n-sel.length)); } return sel; };
  let common=[];
  for(const [c,n] of [[1,24],[2,12],[3,6],[4,8]]) common=common.concat(pickN(BANK.filter(q=>q.lvl==="common"&&q.cat===c),n));
  common=fill(common,BANK.filter(q=>q.lvl==="common"),50);
  const oneNC=BANK.filter(q=>q.lvl==="one"&&q.cat!==5);
  let one=[];
  for(const [c,n] of [[4,11],[2,3],[3,1]]) one=one.concat(pickN(oneNC.filter(q=>q.cat===c),n));
  one=fill(one,oneNC,15);
  const calc=pickN(BANK.filter(q=>q.cat===5),5);
  return shuffle([...common,...one,...calc]);
}

function startQuiz(mode,cat){
  clearInterval(Q.tInt);   // 前回のタイマー（特に模試）が残って誤作動するのを防ぐ
  let list, learn=false, mock=false;
  if(mode==="mock"){ list=buildMock(); mock=true; }
  else if(mode==="cat"){ list=shuffle(byCat(cat)); }
  else if(mode==="review"){ list=shuffle(BANK.filter(q=>S.wrong[q.id])); }
  else if(mode==="learn"){ list=shuffle(learnList(cat)); learn=true; } // cat=null:全章 / 数値:その章。v68でランダム出題に変更
  else if(mode==="quick"){
    // クイック10問（v70）: 要復習 > 未定着(seen&&!known) > 未見 > 習得済み の優先度、同グループ内は挑戦回数昇順
    const pri=q=> S.wrong[q.id]?0 : (S.seen[q.id]&&!S.known[q.id])?1 : !S.seen[q.id]?2 : 3;
    list=shuffle(BANK).sort((a,b)=>pri(a)-pri(b)||(S.attempts[a.id]||0)-(S.attempts[b.id]||0)).slice(0,10);
    learn=true;
  }
  else if(mode==="due"){
    // 今日の復習（Leitner・v70／v72で上限＋分野バランス）
    list=dueToday();
    learn=true;
  }
  else { toast("対象の問題がありません"); return; }
  if(!list.length){ toast("対象の問題がありません"); return; }
  list=spaceOut(list);   // 同一論点が近接しないよう並べ替える（v73）
  Q={list,i:0,sel:null,answered:false,correct:0,wrongIds:[],mode,timer:0,tInt:null,mock,learn,view4:snap4(list)};
  if(Q.mock){
    Q.ansSel=Array(list.length).fill(null);   // 選択肢テキストで保持（再開時の再シャッフルに耐える）
    Q.flags={}; Q.times=Array(list.length).fill(0);
    Q.timer=75*60; tickTimer();
  }
  renderQuiz();
}

// 学習モード：教則の順番（章順→章内はid順）で並べる。calc=null で全章、数値でその章のみ。
function learnList(cat){
  if(cat){ return BANK.filter(q=>q.cat===cat).slice().sort((a,b)=>a.id-b.id); }
  // 全章：LEARN_ORDER（教則章順）に従い、各章内はid昇順
  let out=[];
  for(const c of LEARN_ORDER){ out=out.concat(BANK.filter(q=>q.cat===c).slice().sort((a,b)=>a.id-b.id)); }
  return out;
}
function fmtTimer(t){ const m=Math.floor(t/60),s=t%60; return `${m}:${String(s).padStart(2,'0')}`; }
// タイマーは startQuiz / resumeSession でのみ起動する。renderQuiz からは呼ばない
// （毎問 interval を張り直すと端数秒が破棄され、模試の実時間が75分を超えて延びるため）。
function tickTimer(){
  clearInterval(Q.tInt);
  Q.tInt=setInterval(()=>{
    Q.timer--; const el=$("#qtimer");
    if(el){
      el.textContent=fmtTimer(Q.timer);
      // ペース警告（v70）: 想定消化数（経過時間×70問/75分）に2問以上遅れたら警告色
      if(Q.mock && Q.ansSel){
        const expect=Math.floor((75*60-Q.timer)/(75*60)*Q.list.length);
        const done=Q.ansSel.filter(x=>x!=null).length;
        el.classList.toggle('warn', done<=expect-2);
      }
    }
    if(Q.timer<=0){ clearInterval(Q.tInt); finishQuiz(); }
  },1000);
}

function closeCalc(){ var m=$("#calcModalOv"); if(m && m.parentNode) m.parentNode.removeChild(m); }
function calcShow(){ var t=calcDispText(); var ds=document.querySelectorAll('.calc-disp'); for(var i=0;i<ds.length;i++) ds[i].textContent=t; }
function toggleCalc(){ const p=$("#calcPad"); if(p) p.style.display = (p.style.display==='none'?'block':'none'); }
// iPhone純正電卓に寄せた入力挙動（v71）:
//  - 「.」は数値の先頭なら「0.」として開始、1つの数値内で2つ目は無視
//  - 演算子の連打は直前の演算子を置き換え
//  - 「＝」直後に数字/小数点/√/( を押すと新規計算を開始、演算子なら結果に続けて計算
let calcEq=false;   // 直前が「＝」の結果表示か
function calcCurNum(){ const m=calcExpr.match(/(\d*\.?\d*)$/); return m?m[0]:''; }
function calcKey(k){
  if(calcExpr==='エラー'){ calcExpr=''; calcEq=false; }
  const isDigit=/^[0-9]$/.test(k), isOp=(k==='+'||k==='-'||k==='*'||k==='/');
  if(calcEq){
    if(isDigit||k==='.'||k==='√'||k==='(') calcExpr='';
    calcEq=false;
  }
  if(k==='.'){
    const cur=calcCurNum();
    if(cur.indexOf('.')>=0){ calcShow(); return; }
    calcExpr += (cur===''?'0.':'.');
    calcShow(); return;
  }
  if(isOp && /[+\-*/]$/.test(calcExpr)){ calcExpr=calcExpr.slice(0,-1)+k; calcShow(); return; }
  calcExpr += (k==='√'?'√(':k);
  calcShow();
}
function calcClear(){ calcExpr=''; calcEq=false; calcShow(); }
function calcDel(){ if(calcExpr==='エラー') calcExpr=''; else calcExpr=calcExpr.slice(0,-1); calcEq=false; calcShow(); }
function calcEqual(){
  if(!calcExpr){ calcShow(); return; }   // 空（表示0）で＝は何もしない
  try{
    let e=calcExpr.replace(/√/g,'Math.sqrt').replace(/×/g,'*').replace(/÷/g,'/');
    e=e.replace(/(^|[^\d.])0+(?=\d)/g,'$1');   // 先頭ゼロを正規化（strict mode の8進リテラル禁止で「05」等がエラーになるのを防ぐ）
    if(!/^[0-9+\-*/().\sMathsqrt]*$/.test(e)){ calcExpr='エラー'; calcShow(); return; }
    // v79: 閉じ括弧を書かずに＝を押してもエラーにしない
    //   ・末尾の演算子は無視（「5+」→「5」）
    //   ・足りない「)」を自動で補う（「√(16」→「√(16)」）
    e=e.replace(/[+\-*\/]+$/,"");
    if(!e){ calcExpr=''; calcEq=false; calcShow(); return; }
    const nOpen=(e.match(/\(/g)||[]).length, nClose=(e.match(/\)/g)||[]).length;
    if(nOpen>nClose) e += ")".repeat(nOpen-nClose);
    const r=Function('"use strict";return ('+e+')')();
    calcExpr=(r==null||Number.isNaN(r)||!Number.isFinite(r)||Math.abs(r)>=1e15)?'エラー':String(Math.round(r*1e6)/1e6);
    calcEq = calcExpr!=='エラー';
  }catch(_){ calcExpr='エラー'; calcEq=false; }
  calcShow();
}
// 現在の数値（＝の結果表示中は結果全体、入力中は末尾の数値）をコピー（v71）
function calcCopyText(){
  if(calcExpr===''||calcExpr==='エラー') return null;
  if(calcEq) return calcExpr;
  return calcCurNum() || calcExpr;
}
function calcCopy(){
  const t=calcCopyText();
  if(t==null){ toast('コピーする数値がありません'); return; }
  const done=()=>toast('コピーしました: '+t);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done, ()=>calcCopyFallback(t,done));
  } else calcCopyFallback(t,done);
}
function calcCopyFallback(t,done){
  try{
    const ta=document.createElement('textarea');
    ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta); done();
  }catch(e){ toast('コピーできません'); }
}
function fmtQ(q){
  let t = q.q.replace(/\n/g,"<br>");
  /* 計算問題の公式表示は撤去（出題で答えを示さない） */
  return t;
}

function choose(idx){

function nextQ(){
  const q=Q.list[Q.i];
  const v=Q.view4[Q.i];
  if(!Q.answered){
    // grade（表示上の正解index v.ans と選択 Q.sel を比較）。進捗更新は gradeOne に集約（v70）
    Q.answered=true;
    const correct = Q.sel===v.ans;
    if(correct) Q.correct++; else Q.wrongIds.push(q.id);
    gradeOne(q, correct);
    dayTick(true);
    save();
    document.querySelectorAll(".opt").forEach(o=>{
      const i=+o.dataset.i; o.classList.add("disabled");
      if(i===v.ans) o.classList.add("correct");
      else if(i===Q.sel) o.classList.add("wrong");
    });
    // 計算問題は解説の下に該当する公式カード全文を添付（v70）
    let fmlBlock='';
    if(q.cat===5 && q.calc){
      const ci=FORMULA_CARDS.findIndex(c=>c.term.indexOf(q.calc)>=0);
      if(ci>=0) fmlBlock=`<div class="formula" style="margin-top:10px;background:var(--panel2);border-radius:10px;padding:10px 12px">${fmlHTML(FORMULA_CARDS[ci].formula)}${casesHTML(FORMULA_CARDS[ci])}</div>`;
    }
    $("#exp").innerHTML=`<div class="explain ${correct?'ok':'ng'}">
      <div class="res">${correct?'✓ 正解':'✗ 不正解'} — 正答は ${"ABCD"[v.ans]}</div>
      <div class="body">${q.e.replace(/\n/g,"<br>")}</div>
      <div class="ref">📖 ${q.ref}</div>${fmlBlock}</div>`;
    const last = Q.i>=Q.list.length-1;
    $("#nextBtn").textContent = last ? "結果を見る" : "次の問題 →";
    $("#nextBtn").disabled=false;
  } else {
    Q.i++; Q.sel=null; Q.answered=false;
    if(Q.i>=Q.list.length){ finishQuiz(); } else renderQuiz();
  }
}

function quitQuiz(){
  // clearInterval は確定後に行う（confirm キャンセル時に模試タイマーが止まったままになるのを防ぐ）
  if(Q.learn){ clearInterval(Q.tInt); renderHome(); setNavActive("home"); return; }
  if(confirm("演習を中断してホームに戻りますか？")){
    if(Q.mock){ mockLeave(); saveSession(); }   // 滞在時間と最新の残時間を保存（再開時の巻き戻り防止）
    clearInterval(Q.tInt); renderHome(); setNavActive("home");
  }
}

function finishQuiz(){
  Tview="result"; clearInterval(Q.tInt); clearSession();

// ---------- 模試の一括採点と結果（v70） ----------
let MRV=null;   // 見直し画面用スナップショット（メモリのみ）
function finishMock(){
  mockLeave();
  mockStClose();
  const total=Q.list.length;
  Q.correct=0; Q.wrongIds=[];
  let answeredN=0;
  Q.list.forEach((q,i)=>{
    const sel=Q.ansSel[i];
    const ok = sel!=null && sel===q.o[q.a];
    if(ok) Q.correct++; else Q.wrongIds.push(q.id);
    if(sel!=null){ answeredN++; gradeOne(q, ok); }   // 未解答は採点上のみ不正解（進捗データには触れない）
  });
  if(answeredN>0) dayTick(true);
  const correct=Q.correct, wrong=total-correct, pct=Math.round(correct/total*100);
  const pass=pct>=90;
  const timeUsed=Math.min(75*60, 75*60-Math.max(0,Q.timer));
  // 分野別集計（正答率と所要時間）
  const byCat={};
  for(const c of [1,2,5,3,4]){
    const sub=Q.list.map((q,i)=>({q,i})).filter(x=>x.q.cat===c);
    if(!sub.length) continue;
    const wr=sub.filter(x=>Q.wrongIds.includes(x.q.id)).length;
    byCat[c]={ok:sub.length-wr, n:sub.length, sec:sub.reduce((s,x)=>s+(Q.times[x.i]||0),0)};
  }
  S.history.push({t:Date.now(),mode:'mock',total,correct,pct,mock:true,timeUsed,byCat,wrongIds:Q.wrongIds.slice()});
  if(S.history.length>50) S.history=S.history.slice(-50);
  save();
  // 表示
  const un=total-answeredN;
  const note = pass?"合格基準（90%）クリア！この調子で本番に臨みましょう。":"本番は各分野で高い正答率が必要。見直しで誤答の中身を確認しましょう。";
  let rows="";
  for(const c of [1,2,5,3,4]){
    const b=byCat[c]; if(!b) continue;
    const p=Math.round(b.ok/b.n*100), col=p>=90?'var(--good)':'var(--bad)';
    rows+=`<div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px"><span>${CATS[c].short}</span><span style="color:${col}">${b.ok}/${b.n}・${p}%　<span style="color:var(--sub)">平均${Math.round(b.sec/b.n)}秒/問</span></span></div>
      <div style="height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-bottom:9px"><i style="display:block;height:100%;width:${p}%;background:${col};border-radius:3px"></i></div>`;
  }
  let h=`<div class="screen result">
    <div class="big ${pass?'pass':'fail'}">${pct}%</div>
    <div class="verdict">${pass?'🎉 合格ライン':'もう一歩'}</div>
    <div class="desc">${note}${un?`<br>未解答 ${un}問は不正解として採点しました。`:''}</div>
    <div class="rstat">
      <div class="box ok"><div class="n">${correct}</div><div class="l">正解</div></div>
      <div class="box ng"><div class="n">${wrong}</div><div class="l">不正解</div></div>
      <div class="box"><div class="n">${Math.floor(timeUsed/60)}<span style="font-size:13px">分</span></div><div class="l">所要時間</div></div>
    </div>
    <div class="ref-card" style="text-align:left;margin-top:4px"><h3 style="color:var(--ink);font-size:13px">分野別 正答率・ペース</h3>
      <div style="margin-top:8px">${rows}</div>
      <div class="note" style="margin-top:2px">全体平均 ${answeredN?Math.round(timeUsed/answeredN):0}秒/問（本番の目安は約64秒/問）</div></div>
    <div class="actions" style="flex-direction:column">
      <button class="btn primary" onclick="renderMockReview(true)">間違えた${Q.wrongIds.length}問を見直す（解説つき）</button>
      <button class="btn ghost" onclick="renderMockReview(false)">全問を見直す</button>
      ${Q.wrongIds.length?`<button class="btn bad" onclick="reviewThese()">間違えた問題を解き直す</button>`:''}
      <button class="btn ghost" onclick="renderHome();setNavActive('home')">ホームへ戻る</button>
    </div></div>`;
  MRV={list:Q.list, view4:Q.view4, ansSel:Q.ansSel.slice(), wrongIds:Q.wrongIds.slice(), html:h};
  main.innerHTML=h; main.scrollTop=0; refreshHeader();
}
// 模試の見直し画面: 出題時の選択肢構成のまま、自分の解答と正答・解説を対比表示（v70）
function renderMockReview(wrongOnly){

  main.innerHTML=h; main.scrollTop=0;

function flipDeck(){ D.flipped=!D.flipped; $("#flash").classList.toggle("flipped",D.flipped); }
function nextDeck(){
  if(D.i+1 >= D.list.length){
    // 一周したら再シャッフル（直前のカードが先頭に来ないように）
    const last = D.list[D.i];
    let next = shuffle(D.list);
    if(next.length>1 && next[0]===last){ [next[0],next[next.length-1]]=[next[next.length-1],next[0]]; }
    D.list = next; D.i = 0;
  } else {
    D.i++;
  }
  D.flipped=false; renderDeck();
}
function prevDeck(){ if(D.i>0){ D.i--; D.flipped=false; renderDeck(); } }

// v85: 記号パレット。毎回この順で全部表示し、何度でも使える（答えのヒントにならない）
const PUZ_OPS = ["(", ")", ")³", "√", "×", "÷", "+", "∝", "＝", "1"];
// v97: 固定表示する部品は無い（＝も∝も選択式）
const PUZ_REL = [];
// 単語プールの個数（カードによらず一定）
const PUZ_POOL_N = 10;

let P={i:0,list:[],poolCard:null,pool:[],sel:[],state:"",firstTry:true,correct:0};

function startPuzzle(){
  clearInterval(Q.tInt);
  // v97: 同じ公式カードの出題を続けて解く（基本式→パターン違い）。カードの順序だけシャッフルする。
  const cards=shuffle([...new Set(PUZZLES.map(p=>p.card))]);
  const list=[]; cards.forEach(c=>PUZZLES.forEach(p=>{ if(p.card===c) list.push(p); }));
  P={i:0,list:list,poolCard:null,pool:[],sel:[],state:"",firstTry:true,correct:0};
  puzzSetup(); renderPuzzle(true);
}
// v83: ＝と∝は固定表示。それ以外（左辺の用語も含む）が選択式の部品。
const puzAns = p => p.all.filter(t=>PUZ_REL.indexOf(t)<0);
// 「文言(記号)」のセット表記か（＝【単語】側）。演算子・数値リテラルは【記号】側になる
const puzIsTerm = t => /^[^()]+\(.+\)$/.test(t);
// v83: 部品は「文言(記号)」を上下2段に分けて表示する
function puzChip(t){
  const m=/^([^()]+)\((.+)\)$/.exec(t);
  return m ? `<span class="pw">${m[1]}</span><span class="ps">${m[2]}</span>` : `<span class="ps">${t}</span>`;
}
function puzzSetup(){
  const p=P.list[P.i];
  // v97: プールは**カード単位**。同じカードの出題を続けて解く間は作り直さない（そのままの状態で次の型へ）。
  //      個数は PUZ_POOL_N で固定なので、正解に使う部品の数が漏れない。
  //      記号（PUZ_OPS）は毎回すべて固定パレットで出し、何度でも使える。
  if(P.poolCard!==p.card){
    const terms=[];
    P.list.forEach(x=>{ if(x.card===p.card) puzAns(x).forEach(t=>{ if(puzIsTerm(t)&&terms.indexOf(t)<0) terms.push(t); }); });
    const has=t=>terms.indexOf(t)>=0;
    const need=Math.max(0, PUZ_POOL_N-terms.length);
    // 誤答は「正解の部品と紛らわしいもの」（PUZ_SIB）を優先し、足りない分だけカード別プールから補う
    const sib=[];
    terms.forEach(t=>(PUZ_SIB[t]||[]).forEach(x=>{ if(!has(x)&&sib.indexOf(x)<0) sib.push(x); }));
    const extra=shuffle(sib).slice(0, need);
    if(extra.length<need){
      const rest=(PUZ_DISTRACT[p.card]||[]).filter(t=>!has(t)&&extra.indexOf(t)<0);
      extra.push(...shuffle(rest).slice(0, need-extra.length));
    }
    P.pool=shuffle([...terms, ...extra]); P.poolCard=p.card;
  }
  P.sel=[]; P.state=""; P.firstTry=true;
}
function renderPuzzle(reset, toFb){
  Tview="puzzle";
  const p=P.list[P.i], total=P.list.length, keep=main.scrollTop;   // reset は出題が切り替わるときだけ true
  // 解答欄は空スロットを出さない（部品数のヒントを与えない・v75）。
  // ＝と∝は固定表示のまま並べ、選んだ部品を左から順に埋めていく（v83）。
  let f=0;
  const slots = p.all.map(t=>{
    if(PUZ_REL.indexOf(t)>=0) return `<span class="puz-rel">${t}</span>`;
    const j=f++;
    return j<P.sel.length ? `<span class="puz-slot filled">${puzChip(P.sel[j])}</span>` : "";
  }).join("")
  // 正解の部品数を超えて選んだぶんも末尾に表示する（見えないと「正しい式なのに不正解」になり操作が効かないように見える）
  + P.sel.slice(f).map(t=>`<span class="puz-slot filled">${puzChip(t)}</span>`).join("");
  const hint = P.sel.length ? "" : `<div class="puz-empty">下の部品をタップして式を組み立ててください</div>`;
  // v84/85: 部品は【記号】（固定パレット・1段）と【単語】（毎回変わる候補）に上下で分けて並べる
  const dis=P.state?'disabled':'';
  const ops=PUZ_OPS.map((t,k)=>`<button onclick="puzzPick('o',${k})" ${dis}>${puzChip(t)}</button>`).join("");
  const words=P.pool.map((t,k)=>`<button onclick="puzzPick('w',${k})" ${dis}>${puzChip(t)}</button>`).join("");
  const pool=`<div class="puz-cap">記号</div><div class="puz-pool ops">${ops}</div>`
            +`<div class="puz-cap">単語</div><div class="puz-pool">${words}</div>`;
  let fb="";
  if(P.state==="ok"){
    fb=`<div class="explain ok" style="margin-top:14px"><div class="res">正解</div>
      <div class="formula" style="margin-top:8px;background:var(--panel2);border-radius:10px;padding:10px 12px">${fmlHTML(FORMULA_CARDS[p.card].formula)}${casesHTML(FORMULA_CARDS[p.card])}</div></div>
      <div class="actions"><button class="btn primary" onclick="puzzNext()">${P.i>=total-1?'結果を見る':'次の公式 →'}</button></div>`;
  } else if(P.state==="ng"){
    fb=`<div class="explain ng" style="margin-top:14px"><div class="res">不正解</div>
      <div style="font-size:13px;margin-top:6px;line-height:1.7;overflow-wrap:anywhere">正しい式：${p.all.join(" ")}</div></div>
      <div class="actions">
        <button class="btn ghost" onclick="puzzRetry()">もう一度</button>
        <button class="btn primary" onclick="puzzNext()">${P.i>=total-1?'結果を見る':'次の公式 →'}</button>
      </div>`;
  }
  let h=`<div class="screen">
    <div class="qhead"><div class="qcount">${P.i+1}<small> / ${total}</small> <span style="font-size:11px;color:var(--sub);font-weight:600">公式カード（選択式）</span></div>
      <button class="btn ghost" style="flex:none;padding:9px 14px;font-size:12px" onclick="renderHome();setNavActive('home')">終了</button></div>
    <div class="qmini-bar"><i style="width:${P.i/total*100}%"></i></div>
    <div class="qcard"><div class="qnum">${p.name}</div>
      <div class="puz-slots ${P.state}">${slots}</div>${hint}</div>
    ${pool}
    <div class="actions" style="margin-top:14px;gap:8px">
      <button class="btn ghost" style="flex:.55" onclick="puzzUndo()" ${(!P.sel.length||P.state)?'disabled':''}>1つ戻す</button>
      <button class="btn ghost" style="flex:.55" onclick="puzzRetry()" ${(!P.sel.length||P.state)?'disabled':''}>リセット</button>
      <button class="btn primary" style="flex:.9" onclick="puzzJudge()" ${(!P.sel.length||P.state)?'disabled':''}>判定する</button>
    </div>${fb}</div>`;
  main.innerHTML=h; main.scrollTop = reset ? 0 : keep; fitFH(main);
  // 判定した直後は、結果と「次の公式 →」ができるだけ同時に見える位置までスクロールする
  if(toFb){
    const ex=main.querySelector('.explain'), acts=[...main.querySelectorAll('.actions')].pop();
    if(ex){
      const mr=main.getBoundingClientRect();
      const toTop = ex.getBoundingClientRect().top - mr.top - 8;                       // 「正解」を上端に合わせる量
      const toBtm = acts ? acts.getBoundingClientRect().bottom - mr.bottom + 14 : toTop; // ボタン下端を見せる量
      // 結果の見出しが隠れない範囲（枠の内側余白16pxまで）で、できるだけボタンを見せる
      const d = Math.min(toTop + 16, toBtm);
      if(d > 0) main.scrollTop += d;
    }
  }
}
function puzzPick(src,k){
  if(P.state) return;
  // v85: 記号も単語も何度でも選べる（使用回数がヒントにならないようにするため）
  P.sel.push(src==='o' ? PUZ_OPS[k] : P.pool[k]);   // v75: 自動判定はしない（部品数から答えが割れるため）
  renderPuzzle();
}
function puzzJudge(){
  if(P.state||!P.sel.length) return;
  const p=P.list[P.i], ans=puzAns(p), got=P.sel;
  const ok = got.length===ans.length && got.every((t,i)=>t===ans[i]);
  if(ok){ if(P.firstTry) P.correct++; P.state="ok"; }
  else { P.state="ng"; P.firstTry=false; }
  renderPuzzle(false, true);
}
function puzzUndo(){ if(P.state||!P.sel.length) return; P.sel.pop(); renderPuzzle(); }
function puzzRetry(){ P.sel=[]; P.state=""; renderPuzzle(); }
function puzzNext(){
  if(P.i>=P.list.length-1){ renderPuzzleResult(); return; }
  const prev=P.list[P.i].card;
  P.i++; puzzSetup();
  renderPuzzle(P.list[P.i].card!==prev);   // カードが変わるときだけ先頭へ戻す
}
function renderPuzzleResult(){
  Tview="puzzle";
  const total=P.list.length||PUZZLES.length;
  let h=`<div class="screen result">
    <div class="big ${P.correct===total?'pass':'fail'}">${P.correct}<span style="font-size:20px;font-weight:800"> / ${total}</span></div>
    <div class="verdict">公式カード（選択式） 一巡完了</div>
    <div class="desc">初回で正しく組み立てられた公式：${P.correct} / ${total}</div>
    <div class="actions" style="flex-direction:column">
      <button class="btn primary" onclick="startPuzzle()">もう一巡</button>
      <button class="btn ghost" onclick="renderHome();setNavActive('home')">ホームへ戻る</button>
    </div></div>`;
  main.innerHTML=h; main.scrollTop=0;
}
