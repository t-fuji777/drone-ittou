  {cat:2,lvl:"common",q:"回転翼航空機（マルチローター）について、その動きと関連する用語について、最も適切なものを１つ選べ。",o:["機体の前後左右移動は、指示した側のローターの回転数を上げ、反対側のローター回転数を下げることで機体が指示した方向に傾き、指示した方向に機体が移動する。","機体重量よりも大きな揚力を維持し、対地高度が安定した状態を継続するとホバリングとなる。","右もしくは左回転を指示すると、指示した回転方向のローターの回転数が上がりトルクバランスが崩れ、指示した方向の回転が始まる。","機体に備わる全てのローターを回転させ回転数を増加させていくと、上昇し始める。"],a:3,e:"すべてのモーターを回して回転数を増やし、機体重量以上の揚力を得ると上昇し始めます。\n・ホバリング…機体重量と揚力が釣り合い、対地高度が一定した状態を保つこと\n・降下…ホバリング状態からローターの回転数を下げる\n・前後左右への移動…指示した側のローターの回転数を下げ、反対側のローターの回転数を上げると機体が傾き、ローター推力の合力が指示した方向へ傾くので、その方向へ移動する\n・水平回転…揚力を得ている状態で右又は左の回転を指示すると、指示した回転方向のモーターの回転数が落ちてトルクのバランスが崩れ、回転が始まる",ref:"教則 第4章 4.3.1 無人航空機の飛行原理"},
  {cat:2,lvl:"common",q:"無人航空機におけるペイロードの積載とその影響について、不適切なものを1つ選べ。",o:["ペイロードの有無によって機体の重心位置が著しく変化しないよう注意が必要である。","飛行機については、離着陸エリアの広さによってもペイロードが制限される可能性がある。","ペイロードの最大積載量とペイロード搭載時の飛行性能は取扱説明書に記載されていても、飛行高度、大気状態によって異なることがある。","機体に安全に飛行できるペイロードの最大積載量が定められている場合、機体重量が変化しても航空機の飛行特性は変化しにくい。"],a:3,e:"無人航空機では、ペイロード（＝機体に積む荷物や機材）が飛行特性に大きく影響します。機体重量が変われば、安定性・飛行性能・運動性能といった飛行特性は変化するので、「変化しにくい」は誤りです。特に重心位置の変化は影響が大きいため、ペイロードの有無で重心位置が大きくずれないよう注意が必要です。最大積載量や積んだときの飛行性能は取扱説明書に書かれていても、飛行高度や大気の状態によって変わることがあります。また飛行機は垂直に離着陸できず滑走路が必要で、機体重量が大きいほど長い滑走距離がいります。そのため性能上は積めても、離着陸エリアが狭い場合はペイロードを調整する必要があります。",ref:"教則 第4章 4.3.3 無人航空機へのペイロード搭載"},
  {cat:2,lvl:"common",q:"以下の選択肢から、送信機から無人航空機への指令の流れに関する最も適切なものを１つ選べ。",o:["送信機からの指令は、機体受信機→モーター等の順で直接送られ、機体メインコントローラーは経由しない。","送信機からの指令は、機体メインコントローラー→機体受信機→モーター等の順で送られる。","送信機からの指令は、機体受信機→機体メインコントローラー→モーター等の順で送られる。","送信機側の部品であるメインコントローラーからの指令を、機体の受信機で受け取り、モーターなどを駆動させて機体を操縦する。"],a:2,e:"送信機から出した指令は、まず機体の受信機が受け取ります。受信機はその情報を機体に装備されているメインコントローラーへ送り、そこからモーターなどが駆動されて機体を操縦できます。つまり「機体受信機→機体メインコントローラー→モーター等」の順です。メインコントローラーは送信機側ではなく機体側の部品で、受信機からモーターへ直接送られるわけでもありません。",ref:"教則 第4章 4.4.2 無人航空機の主たる構成要素"},
  {cat:2,lvl:"common",q:"以下の無人航空機のモーターやESC（エレクトロニックスピードコントローラー）に関する説明の中から、最も適切なものを１つ選べ。",o:["ESCは機体側に取り付けられている部品で、モーターの回転数を制御し、ローターの回転数を増減させることで揚力や推力を調整している。","ESCはバッテリーの残量を監視するためのデバイスであり、モーターの回転数の制御には関与しない。","ESCは操縦機側に取り付けられている部品で、モーターの回転数を制御し、ローターの回転数を増減させることで揚力や推力を調整している。","ESCは機体側に取り付けられている部品で、モーターの回転数を常に一定に保つためのデバイスであり、揚力や推力の調整には関与しない。"],a:0,e:"無人航空機を飛ばすには揚力と推力の細かい調整が必要で、そのカギがモーターの回転数の制御です。ESC（エレクトロニックスピードコントローラー）はこのモーターの回転数を制御する部品で、モーターが回すローターの回転数を増減させることで揚力や推力を変えています。ESCは機体側に取り付けられている部品であり、送信機（操縦機）側の部品ではありません。",ref:"教則 第4章 4.4.2 無人航空機の主たる構成要素"},
  {cat:2,lvl:"common",q:"以下の選択肢のうち、送信機のモードについて正しく説明しているものを１つ選べ。",o:["回転翼航空機の上昇下降は、モード1のとき右スティックの上下操作、モード2のとき左スティックの上下操作である。","回転翼航空機の左右移動は、モード1のとき右スティックの左右操作、モード2のとき左スティックの左右操作である。","回転翼航空機の前後移動は、モード1のとき右スティックの上下操作、モード2のとき左スティックの上下操作である。","回転翼航空機の左右旋回は、モード1のとき右スティックの左右操作、モード2のとき左スティックの左右操作である。"],a:0,e:"モード1とモード2で共通なのは次の2つです。\n・左右旋回：左スティックの左右操作\n・左右移動：右スティックの左右操作\n一方、上昇下降と前後移動はモードによってスティックが反対になります。\n・上昇下降：モード1は右スティックの上下操作、モード2は左スティックの上下操作\n・前後移動：モード1は左スティックの上下操作、モード2は右スティックの上下操作",ref:"教則 第4章 操縦装置（送信機のモード）"},
  {cat:2,lvl:"common",q:"以下の選択肢から、無人航空機の操作について正しく説明しているものを１つ選べ。",o:["回転翼航空機の操作では、上下操作をエレベーター、前後移動操作をスロットル、左右移動操作をエルロン、左右旋回操作をラダーという。","回転翼航空機の操作では、上下操作をスロットル、前後移動操作をエレベーター、左右移動操作をラダー、左右旋回操作をエルロンという。","回転翼航空機の操作では、上下操作をスロットル、前後移動操作をエレベーター、左右移動操作をエルロン、左右旋回操作をラダーという。","マルチローターの操作では、上下操作をスロットル、前後移動操作をエルロン、左右移動操作をエレベーター、左右旋回操作をラダーという。"],a:2,e:"マルチローター（回転翼航空機）の操作の呼び方は次のとおりです。\n・上下操作：スロットル\n・前後移動操作：エレベーター\n・左右移動操作：エルロン\n・左右旋回操作：ラダー",ref:"教則 第4章 4.4.3 送信機"},
  {cat:2,lvl:"common",q:"以下の選択肢のうち、送信機のアンテナから発射される電波について、最も適切なものを1つ選べ。",o:["アンテナの角度は調整できるので、操縦時の送信機の持ち方や無人航空機の位置を考慮して最適なアンテナ角度を設定する必要がある。","送信機の持ち方や無人航空機の位置によって電波の受信状態が変わることはないため、アンテナの角度を調整する必要はない。","送信機のアンテナから発射される電波の強さは、方向により異なることはない。","送信機のアンテナは、その先端を無人航空機に向けたときに最も強い電波を発射する。"],a:0,e:"送信機のアンテナから出る電波は、向きによって強さが変わります。そのため、操縦するときの送信機の持ち方や無人航空機の位置を考えて、アンテナの角度を最適に合わせる必要があります。なお、アンテナの角度が無人航空機の飛行速度や高度に直接影響を与えることはありません。",ref:"教則 第4章 4.4 機体の構成（送信機）"},
  {cat:2,lvl:"common",q:"以下の選択肢から、無人航空機の機体の動力源に関する特徴について正しく説明しているものを１つ選べ。",o:["電動機のメリットは振動や騒音が少なく軽量化が可能で、飛行時間が長いという特徴がある。一方、エンジン機は飛行時間が短く、騒音が大きいというデメリットがある。","電動機のメリットは振動や騒音が少なく軽量化が可能だが、飛行時間が短いというデメリットがある。一方、エンジン機のメリットは飛行時間が長く長距離飛行が可能だが、騒音が大きいというデメリットがある。","エンジン機のメリットは振動や騒音が少なく軽量化が可能で、飛行時間が長いという特徴がある。一方、電動機は騒音が大きく、飛行時間が短いというデメリットがある。","エンジン機のメリットは、振動や騒音が少なく軽量化が可能だが、飛行時間が短いというデメリットがある。一方、電動機は飛行時間が長く長距離飛行が可能だが、騒音が大きいというデメリットがある。"],a:1,e:"無人航空機の動力源としてよく使われる電動機とエンジン機は、それぞれ長所と短所が違います。\n・電動機：振動や騒音が少なく軽くできるが、飛行時間が短い\n・エンジン機：飛行時間が長く長距離を飛べるが、電動機に比べて騒音が大きい\nそれぞれの特性を理解し、目的に合わせて最適な動力源を選ぶことが大切です。",ref:"教則 第4章 機体の特徴（動力源）"},
  {cat:2,lvl:"common",q:"以下の選択肢から、エンジン機について最も適切なものを１つ選べ。",o:["エンジンにはガソリンエンジンやグローエンジンなど複数の種類があるが、使用する燃料はいずれのエンジンでも共通である。","エンジン機は、エンジンの回転を動力にローターを回転させ揚力と推力を得ている。","エンジンの種類により、潤滑方式、着火温度は異なるが、燃焼サイクルは一定である。","オイル等を混ぜた混合燃料を使用する場合、指定された混合比よりオイルを多めにする分には問題ない。"],a:1,e:"エンジン機は、エンジンの回転を動力にしてローターを回し、揚力と推力を得ています。エンジンにはガソリンエンジン、ディーゼルエンジン、ジェットエンジン、グローエンジンなどの種類があり、潤滑方式・燃焼サイクル・着火温度がそれぞれ違います。ですから使う燃料も共通ではなく、エンジンごとに対応した燃料を適切に扱う必要があります。オイルなどを混ぜた混合燃料を使う場合は、指定された混合比のとおりに使うことが必要です（多めにしてよいわけではありません）。",ref:"教則 第4章 4.4 機体の構成（機体の動力源）"},
  {cat:2,lvl:"common",q:"無人航空機のバッテリーについて、適切ではないものを１つ選べ。",o:["１セル当たりの電圧が3.7Vのバッテリーを4セルで構成した場合、そのバッテリーの電圧は14.8Vとなる。","電圧降下は抵抗(Ω)×電流(A)で計算される。","バッテリーの電圧は、セル当たりの電圧とセル数で決まる。","１セル当たりの電圧が3.7Vのとき、複数セルで構成されるバッテリーでもオームの法則より電圧は変わらない。"],a:3,e:"バッテリーの電圧は、1セルあたりの電圧とセル数で決まります。1セル3.7V（リチウムポリマーバッテリーの場合）を4セルで構成すれば、3.7V×4＝14.8Vがそのバッテリーの電圧です。セル数が増えれば電圧も変わるので、「複数セルで構成されても電圧は変わらない」は誤りです。なお、電圧降下は抵抗（Ω）×電流（A）で計算します。",ref:"教則 第4章 4.4 機体の構成（バッテリー）"},
  {cat:2,lvl:"common",q:"以下の無人航空機で使われる電気・電子用語の説明の中から、適切ではないものを１つ選べ。",o:["電圧降下は、抵抗（R）×電流（A）で計算され、電池の残量が減ると電池の電圧は下がる。","容量(Ah)は、電流（A）×時間（h）で計算され、満充電から終止電圧になるまでに使用できる仕事量(出力)の総量を表す。","容量（Ah）は、満充電から終止電圧になるまでの間に使用できる電気量の総量を表す。","出力は、放電時電圧（V）×電流（A）で計算され、出力が一定の場合、電池残量が少なくなると、放電時電圧が低下するため、電流は増大する。"],a:1,e:"容量（Ah）は電流（A）×時間（h）で求め、満充電から、決められた最低電圧（終止電圧）になるまでの間に使える「電気量」の総量を表します。仕事量（出力）の総量ではないので、その言い方は誤りです。出力は放電時電圧（V）×電流（A）で求め、単位時間当たりのエネルギー量を表します。電圧降下は抵抗（R）×電流（A）で計算し、電池の残量が減ると電池の電圧も下がります。",ref:"教則 第4章 4.4 機体の構成（バッテリー）"},
  {cat:2,lvl:"common",q:"以下の選択肢から、リチウムポリマーバッテリーの特性について適切ではないものを１つ選べ。",o:["リチウムポリマーバッテリーはエネルギー密度が高く、自己放電が少ない。","リチウムポリマーバッテリーの電解質は不燃物である。","リチウムポリマーバッテリーは見かけの放電容量が減少する現象が起きにくい。","リチウムポリマーバッテリーはゲル状のポリマー電解質を有したバッテリーである。"],a:1,e:"リチウムポリマーバッテリーは、ゲル状のポリマー電解質を使ったバッテリーで、無人航空機の電源として多く使われています。主な特性は次のとおりです。\n・エネルギー密度が高い\n・電圧が高い\n・自己放電が少ない\n・メモリ効果（＝継ぎ足し充電などで浅い充放電を行うと、見かけの放電容量が減る現象）が小さい\n一方で、電解質は燃える物（可燃物）です。不燃物ではないので、取り扱いには注意が必要です。",ref:"教則 第4章 機体の構成（リチウムポリマーバッテリー）"},
  {cat:2,lvl:"common",q:"以下の選択肢のうち、リチウムポリマーバッテリーの取り扱いについて最も適切ではないものを１つ選べ。",o:["複数のセルで構成されたリチウムポリマーバッテリーは、セル間の充電量のバランスを補正しながら充電することが重要である。","セル間の充電量のバランスが著しく崩れたまま充電を行うと、一部のセルが過放電状態となり、バッテリー全体の劣化が進む。","複数のセルで構成されたリチウムポリマーバッテリーは、効率的な放電のため、セル間の電圧差を生じさせるように充電することが重要である。","バランスコネクタがついているものは、充電時にそのコネクタを充電器へ接続することが重要である。"],a:2,e:"リチウムポリマーバッテリーは複数のセルでできており、各セルの充電量のバランスを適切に保つことが大切です。バランスが大きく崩れたまま充電すると、セル間の電圧差によって一部のセルが過放電状態になり、バッテリー全体の劣化が進みます。そのため、バランスコネクタが付いているものは、充電時にそのコネクタも充電器につなぎ、セル間のバランスを補正しながら充電することがすすめられています。「セル間の電圧差を生じさせるように充電する」は逆であり、誤りです。",ref:"教則 第4章 無人航空機のシステム（バッテリーの取扱い）"},
  {cat:2,lvl:"common",q:"以下の選択肢から、リチウムポリマーバッテリーの取り扱い上の注意点について正しく説明しているものを１つ選べ。",o:["リチウムポリマーバッテリーは、強い衝撃に対して耐性があり、衝撃により発火する可能性は低い。","リチウムポリマーバッテリーは、過充電には注意が必要であるが、過放電により劣化が進むことはない。","バッテリーのコネクタの端子が短絡した場合、発火する可能性がある。","リチウムポリマーバッテリーは充電が進むとガスを発生させ膨らむが、これは通常の現象である。"],a:2,e:"リチウムポリマーバッテリーの取り扱いで注意が必要なのは、次の点です。\n・過放電、過充電\n・バッテリーへの強い衝撃\n・コネクタの端子の短絡（ショート）\nこれらが起きると劣化が進んで寿命が短くなることがあり、内部でガスが発生してバッテリーが膨らむ原因にもなります。さらに発火する可能性もあるため、十分な注意が必要です。",ref:"教則 第4章 4.4 機体の構成（バッテリー）"},
  {cat:2,lvl:"common",q:"以下の選択肢のうち、電波の性質について正しく説明しているものを1つ選べ。",o:["電波の電力密度は、進行距離の2乗に比例して増加する。","電波は２つの異なる媒質間を進行するとき、反射や屈折が起こり、常に入射角と反射角の大きさは等しくなる。","電波は高周波数であるほど、障害物をより回り込むことができる。","干渉とは、2 つ以上の波が重なり弱め合うことを指し、強め合うことについては干渉とは言わない。"],a:1,e:"電波は、進む先に障害物がなければまっすぐ進みます。性質の異なる2つの媒質の間を進むときには反射や屈折が起こり、このとき常に反射の法則（入射角と反射角の大きさが等しい）が成り立ちます。ほかの性質は次のとおりです。\n・回折：周波数が低い（波長が長い）ほど障害物を回り込めます。高周波数ほど回り込めるわけではありません。\n・干渉：2つ以上の波が重なって強め合ったり弱め合ったりすることで、弱め合う場合だけを指すのではありません。\n・電力密度：進行距離の2乗に反比例して減ります。2乗に比例して増えるのではありません。",ref:"教則 第4章 4.4 機体以外の要素技術（電波）"},
  {cat:2,lvl:"common",q:"以下の選択肢のうち、無人航空機の運航に使用される電波の周波数帯について不適切なものを1つ選べ。",o:["電波の周波数帯や出力、使用するアンテナの特性、変調方式、伝送速度などによって通信可能な距離は変動しないように調整されている。","2.4GHz 帯は無線LANなどでも広く使用されている周波数帯であり、混信や電波干渉に注意が必要である。","無人航空機の運航において使用されている主な電波の周波数帯は、2.4GHz 帯、5.7GHz 帯、920MHz 帯、73MHz 帯、169MHz 帯である。","169MHz 帯は主に 2.4GHz 帯及び 5.7GHz 帯の無人移動体画像伝送システムの無線局のバックアップ回線として使用される。"],a:0,e:"無人航空機で主に使われる電波の周波数帯は、次の5つです。\n・2.4GHz帯\n・5.7GHz帯\n・920MHz帯\n・73MHz帯\n・169MHz帯\nこのうち169MHz帯は、2.4GHz帯と5.7GHz帯の無人移動体画像伝送システムの無線局のバックアップ回線として使われます。\nそして、どこまで届くか（通信可能な距離）は、電波の周波数帯や出力、使うアンテナの特性、変調方式、伝送速度などによって変わります。「変動しないように調整されている」わけではないので、これが不適切な記述です。",ref:"教則 第4章 4.4 機体以外の要素技術（電波）"},
  {cat:2,lvl:"common",q:"以下の選択肢のうち、フレネルゾーンについて適切ではないものを１つ選べ。",o:["フレネルゾーン内に壁や建物などの障害物があると、受信電界強度が確保されず通信エラーが起こることがある。","フレネルゾーンの半径を考慮してアンテナの高さを決めるときには、地面や海面も障害物として考える。","フレネルゾーンの半径は周波数が高い、またはお互いの距離が短くなればなるほど小さくなる。","無線通信での「見通しが良い」という表現は、アンテナ間が物理的に見えていることを指す。"],a:3,e:"フレネルゾーンは、送信アンテナと受信アンテナの間の最短距離を中心とした楕円体（細長い卵のような形）の空間です。無線通信でいう「見通しが良い」とは、このフレネルゾーンが確保されている状態のことで、単にアンテナ同士が物理的に見えていることではありません。だから正答の記述が誤りです。\n他の選択肢が正しい理由は次のとおりです。\n・フレネルゾーンの中に壁や建物などの障害物があると、受信電界強度が確保できず、通信エラーが起きたり通信距離が短くなったりします。\n・フレネルゾーンの半径は、周波数が高い（波長が短い）ほど、またお互いの距離が短いほど小さくなります。\n・地面や海面も障害物になるので、それを考えてアンテナの高さを確保する必要があります。",ref:"教則 第4章 4.4.1 電波"},
  {cat:2,lvl:"common",q:"以下の選択肢のうち、マルチパスについて適切ではないものを1つ選べ。",o:["マルチパスによって電波が弱くなり一時的に操縦不能になった場合は、送信機をできるだけ高い位置に持ちアンテナの向きを変えることが適切な判断である。","マルチパスは、送信アンテナから放射された電波が山や建物などにより反射、屈折することで発生する。","マルチパスは電波が複数経路を通る現象で、電波到達までにわずかな遅れが生じ、一時的な操縦不能の一因となる。","マルチパスによって電波が弱くなり一時的に操縦不能になった場合は、電波到達の遅延をリセットするため、送信機の電源を一度切ることが適切な判断である。"],a:3,e:"マルチパスは、送信アンテナから出た電波が山や建物などで反射・屈折し、複数の経路を通って伝わる現象です。そのため電波が届くまでにわずかな遅れが生じ、一時的に操縦不能になる原因のひとつになります。\nマルチパスで電波が弱くなり、一時的に操縦できなくなったときは、送信機をできるだけ高い位置に持ち、アンテナの向きを変えて操縦の復帰を試みることが推奨されます。送信機の電源を切るのは適切な対応ではないので、正答の記述が誤りです。",ref:"教則 第4章 4.4.1 電波"},
  {cat:2,lvl:"common",q:"以下の選択肢の中から、GPSやGNSSについて最も適切なものを1つ選べ。",o:["４基の人工衛星から受信ができれば、それ以上の人工衛星から受信しても、安定性は一定である。","GNSSとは米国のGPSのみを指す名称であり、ロシアのGLONASSや日本の準天頂衛星（QZSS）は含まれない。","GNSSは最低3個以上の人工衛星からの信号を同時に受信することでその位置を計算する。","GNSSは最低4個以上の人工衛星からの信号を同時に受信することでその位置を計算する。"],a:3,e:"GPS（Global Positioning System）は、アメリカ国防総省が航空機などの航法支援用に開発したシステムです。このGPSに加えて、\n・ロシアのGLONASS\n・欧州のGalileo\n・日本の準天頂衛星QZSS\nなどをまとめてGNSS（Global Navigation Satellite System：全球測位衛星システム）と呼びます。GPSだけを指す名前ではありません。\nGNSSは、機体に付けた受信機が最低4個以上の衛星からの信号を同時に受け取って位置を計算します。3個では足りません。また、安定して飛ばすには、より多くの衛星から信号を受け取れるほうが望ましく、4個で頭打ちというわけでもありません。",ref:"教則 第4章 無人航空機のシステム（GNSSの特徴）"},
  {cat:2,lvl:"common",q:"以下の選択肢の中から、GNSSの測位精度に影響を及ぼす要素について適切ではないものを1つ選べ。",o:["GNSSの測位精度は、衛星に搭載された時計の精度や受信環境のノイズにも影響される。","一般的に位置精度は、高度方向の誤差に比べ、水平方向の誤差の方が小さい。","GNSSは最低4個以上の人工衛星からの信号を同時に受信することができれば、それ以上の人工衛星から受信をしても精度は向上しない。","障害物などによるマルチパスはGNSSの測位精度に影響を及ぼす。"],a:2,e:"GNSSの測位精度は、次のようなものに影響されます。\n・衛星に載っている時計の精度\n・捕捉しているGNSS衛星の数\n・障害物などによるマルチパス\n・受信環境のノイズ\n安定して飛ばすには、より多くの衛星から信号を受け取れるほうが望ましいので、「4個受信できればそれ以上は精度が上がらない」とする正答の記述は誤りです。\nまた、位置の誤差は一般に、水平方向に比べて高度方向のほうが大きくなります。",ref:"教則 第4章 4.4.3 GNSS"},
  {cat:2,lvl:"common",q:"以下の選択肢の中から、GPSの測位技術について最も適切なものを1つ選べ。",o:["DGPS(Differential Global Positioning System)は地上側の移動する２つの受信機を使用して数mレベルの精度の高い測位が可能となる技術である。","RTK(Real Time Kinematic)やDGPS(Differential Global Positioning System)は、移動局の受信機１つのみを使用して、数cm～数mレベルの精度の高い測位が可能となる技術である。","GPS測位における単独の受信機での測位精度は数cmレベルであるため、RTKやDGPSといった測位方式を用いる必要はない。","RTK(Real Time Kinematic)は既知点である固定局と移動局の２つの受信機を使用して数cmレベルの精度の高い測位が可能となる技術である。"],a:3,e:"GPSで受信機1つだけを使う測位の精度は、数十mのレベルです。そこで、位置が分かっている場所に置いた固定局と、動く移動局の2つの受信機を使う方式が確立されています。\n・RTK（Real Time Kinematic）\n・DGPS（Differential Global Positioning System）\nこれらを使うと、数cm〜数mレベルの高い精度で測位できます。正答のとおり、RTKは固定局と移動局の2つの受信機で数cmレベルの測位ができます。受信機1つだけでこの精度が出るわけではなく、単独の受信機の精度が数cmということもないので、他の選択肢は誤りです。",ref:"教則 第4章 無人航空機のシステム（GNSSの測位技術）"},
  {cat:2,lvl:"common",q:"以下の無人航空機の飛行に用いられるセンサの説明の中から、適切ではないものを１つ選べ。",o:["超音波センサは音波の反射時間から高度を計測する。","気圧センサは、気圧の変化を歪みゲージを利用して読み取り、高度を計測する。","ジャイロセンサは機体の角速度を計測する。","LiDARはレーザー光を地上に照射したときの出力値から高度を計測する。"],a:3,e:"高度を測るセンサには気圧センサ、超音波センサ、LiDARなどがあり、測り方はそれぞれ次のとおりです。\n・気圧センサ：気圧の変化から測る\n・超音波センサ：音波が反射して戻るまでの時間から測る\n・LiDAR：レーザー光を照射してから反射して戻るまでの時間から測る\nLiDARは「出力値」ではなく「反射して戻るまでの時間」で高度を測るので、正答の記述が誤りです。",ref:"教則 第4章 4.4 機体の構成"},
  {cat:2,lvl:"common",q:"以下の選択肢の中から、リチウムポリマーバッテリーの保管、交換、廃棄について適切ではないものを1つ選べ。",o:["満充電の状態での保管または飛行後の放電状態での保管が推奨される。","長期間使用しない時は充電60%を目安に保管する。","外部に損傷があるバッテリーや膨らみが生じたバッテリーは使用せず、新しいものに交換する。","バッテリーを高温（35℃超）になる環境で保管してはいけない。"],a:0,e:"リチウムポリマーバッテリーは、長期間使わないときは充電60%を目安に保管し、短絡（ショート）や衝撃、高温、水濡れを避けることが大切です。満充電のままの保管や、飛行後に放電しきった状態のままの長期保管は、バッテリーの劣化を早めるため推奨されません。だから正答の記述が誤りです。\nまた、損傷があるものや膨らんでしまったバッテリーは使わず、適切に交換・廃棄する必要があります。",ref:"教則 第4章 無人航空機のシステム（バッテリーの保管・交換・廃棄）"},
  {cat:2,lvl:"common",q:"以下の選択肢の中から、エンジン機の整備について適切ではないものを1つ選べ。",o:["エンジンの整備知識が不足している場合は、専門の整備業者に依頼する。","エンジンの整備技能があれば、メーカーの整備項目は参考資料とし、自身で内容を決めるべきである。","整備で異常が確認された場合は、飛行を行う前に修理等の必要な措置を講じる。","一定の総飛行時間毎に、メーカーの整備手順に従って整備を実施する。"],a:1,e:"エンジン機の整備は、一定の総飛行時間ごとに、メーカーが定めた整備手順に従って行う必要があります。整備の技能があっても、メーカーの整備項目を参考資料あつかいにして自分の判断で内容を決めるのは適切ではないので、正答の記述が誤りです。\nエンジンの整備に関する知識や技能が足りないときは、専門の整備業者に依頼しましょう。",ref:"教則 第4章 4.5.2 エンジン機における整備・点検"},
  {cat:2,lvl:"common",q:"事業で使用したリチウムポリマーバッテリーの廃棄方法として正しいものはどれか。",o:["産業廃棄物として法律に則り廃棄する","一般廃棄物として法律に則り廃棄する","完全に放電させた上で不燃ごみとして廃棄する","販売店の回収ボックスに投入して廃棄する"],a:0,e:"事業（仕事）で使ったリチウムポリマーバッテリーは、産業廃棄物として法律に従って廃棄します。一般廃棄物や不燃ごみではありません。なお、運航で生じる廃棄物は、各自治体のルールに従って処分します。",ref:"教則 第4章 4.6.1 バッテリーの廃棄（p.50）"},
  {cat:2,lvl:"common",q:"回転翼航空機（ヘリコプター）のテールローターの役割として正しいものはどれか。",o:["メインローターの反トルクを打ち消し、ヨー方向（機首の向き）の制御に用いる","メインローターの反トルクを打ち消し、ピッチ方向（機首の上げ下げ）の制御に用いる","メインローターとともに揚力の大部分を生み出し、上昇・降下の推力の制御に用いる","メインローターの反トルクを利用して、機体の左右移動（ロール方向）の制御に用いる"],a:0,e:"ヘリコプターは、メインローターが回ると機体が逆向きに回ろうとする力（反トルク）が生じます。これをテールローターで打ち消し、さらにテールローターの推力を変えることで、ヨー（機首の向き）の姿勢制御を行います。ピッチやロールの制御に使うものでも、揚力の大部分を生み出すものでもありません。",ref:"教則 第4章 4.1.3 回転翼航空機（ヘリコプター）（p.35）"},
  {cat:2,lvl:"common",q:"920MHz帯の電波の特徴として正しいものはどれか。",o:["回折しやすく障害物の影響を受けにくいため比較的遠くまで届く","直進性が強く回折しにくいため、障害物の陰には回り込まず見通し内でのみ届く","回折しやすく障害物の影響を受けにくいため、大容量の映像伝送に最も適する","回折しやすく障害物の影響を受けにくいが、伝送距離は2.4GHz帯より短い"],a:0,e:"920MHz帯は周波数が低いため回折しやすく（＝障害物の陰に回り込みやすく）、障害物の影響を受けにくいので、比較的遠くまで届きます。「直進性が強く回折しにくい」という記述は、この特徴と逆なので誤りです。なお、免許不要の小電力無線局として利用できます。",ref:"教則 第4章 4.5.1 電波（周波数帯・920MHz）（p.47）"},
  {cat:2,lvl:"common",q:"水平定常飛行中の飛行機（固定翼）にはたらく主な4つの力の組合せとして正しいものはどれか。",o:["揚力・重力・推力・抗力","揚力・重力・推力・遠心力","揚力・浮力・推力・抗力","揚力・重力・摩擦力・抗力"],a:0,e:"固定翼機（飛行機）には、揚力・重力（重量）・推力・抗力の4つの力がはたらきます。水平定常飛行では、この4つがつり合っている状態です。",ref:"教則 第4章 4.3.1 飛行機にはたらく力（p.38）"},
  {cat:2,lvl:"common",q:"標準大気における海面上（高度0m）の標準大気圧と空気密度の組合せとして正しいものはどれか。",o:["約1013hPa・約1.225kg/m³","約1013hPa・約1.025kg/m³","約101.3hPa・約1.225kg/m³","約760hPa・約1.225kg/m³"],a:0,e:"標準大気では、海面上（高度0m）の標準大気圧は約1013hPa、空気密度は約1.225kg/m³です。高度が上がると空気密度は下がります（1000m上がるごとに約0.9倍）。",ref:"教則 第4章 4.3.5 飛行性能の基本的な計算（標準大気）（p.39）"},
  {cat:2,lvl:"common",q:"GNSSを構成する衛星測位システムの組合せとして正しいものはどれか。",o:["米国のGPS・ロシアのGLONASS・欧州のGalileo・日本のQZSS","米国のGPS・欧州のGLONASS・ロシアのGalileo・日本のQZSS","米国のGLONASS・ロシアのGPS・欧州のGalileo・日本のQZSS","米国のGPS・ロシアのGLONASS・欧州のQZSS・日本のGalileo"],a:0,e:"GNSS（全球測位衛星システム）は、米国のGPSに加えて、\n・ロシアのGLONASS\n・欧州のGalileo\n・日本の準天頂衛星QZSS\nなどをまとめた呼び方です。国とシステム名を入れ替えた選択肢は誤りです。GNSSは、最低4個以上の衛星から信号を受け取って位置を計算します。",ref:"教則 第4章 4.5.3 GNSS（p.50）"},
  {cat:2,lvl:"one",q:"〔一等〕以下の選択肢のうち、電波の特性及びそれらが無人航空機の通信等にどのように利用されているかについて最も適切なものを１つ選べ。",o:["超短波は、極超短波に比べて、直進性が強いが、多少の山や建物の陰には回り込んで伝わる特性を持つ。","極超短波は、超短波に比べて、直進性が強いが、多少の山や建物の陰には回り込んで伝わる特性を持つ。","極超短波は、マイクロ波に比べて、直進性が強いが、多少の山や建物の陰には回り込んで伝わる特性を持つ。","マイクロ波は、極超短波に比べて直進性が弱く、山や建物の陰に回り込んで伝わりやすい特性を持つ。"],a:1,e:"電波は波長によって性質が変わります。\n・波長が長いほど：直進性が弱く、伝えられる情報量が小さく、減衰しにくい\n・波長が短いほど：直進性が強く、伝えられる情報量が大きく、減衰しやすい\n直進性は、超短波 → 極超短波 → マイクロ波 の順に強くなります。\n無人航空機の制御用通信によく使われる極超短波（周波数300MHz〜3GHz、波長10cm〜1m）は、直進性は強いものの、多少の山や建物の陰には回り込んで伝わります。これが正答です。\nマイクロ波（周波数3〜30GHz、波長1〜10cm）は直進性が強く、特定の方向に向けて発射するのに適していて、伝えられる情報量がとても大きいため、衛星通信や衛星放送などに使われます。\nしたがって「超短波のほうが極超短波より直進性が強い」「極超短波のほうがマイクロ波より直進性が強い」「マイクロ波は極超短波より直進性が弱い」は、いずれも順序が逆で誤りです。",ref:"教則 第4章 4.5.1 電波の特性（p.47）"},
  {cat:2,lvl:"one",q:"〔一等〕無人航空機の機体の故障や事故の分析について適切ではないものを１つ選べ。",o:["フライトデータ等の記録を残しておくことは、事故や故障の原因究明に役立ち、安全性の向上につながる。","飛行軌跡や機体の情報(フライトデータ)を記録している機種もあり、事故の原因分析を詳細に確認することが可能である。","機体の異常情報を機体本体のランプや音で知らせる機能を有している機体は多く、取扱説明書で点灯が表している意味を理解することは重要である。","無人航空機の事故や故障の原因調査は、操縦者の証言に依るところが大きく、フライトデータの重要性は低い。"],a:3,e:"多くの無人航空機は、機体の異常を機体本体や送信機のランプ・音で知らせる機能を持っています。取扱説明書で、その表示が何を意味するのかを理解しておくことが大切です。\nまた、飛行軌跡や機体の情報（フライトデータ）を記録している機種もあり、事故の原因を詳しく分析できます。事故や故障の原因調査では、操縦者の証言だけでなくフライトデータも客観的な情報として役に立ち、安全性を高めるためにフライトデータを記録しておくことが推奨されています。だから「フライトデータの重要性は低い」とする正答の記述が誤りです。",ref:"教則 第4章 機体の整備・点検（故障・事故の分析、フライトデータの記録）"},
  {cat:2,lvl:"one",q:"〔一等〕以下の選択肢から、無人航空機における送信機の信号や電波混信についての最も適切なものを１つ選べ。",o:["周辺の電波の使用状況を事前に確認する測定器のようなものは存在しないため、飛行させながら混信の有無を確認する。","高圧送電線の近くでは電磁波によるノイズの影響を受けないため、送電線からの距離を飛行時に考慮する必要はない。","無人航空機で使用される送信機の電波は、無線ＬＡＮやＷｉ‐Ｆｉのような微弱な電波からの干渉は受けにくいため、混信を考慮する必要はない。","同じ周波数帯の電波が同時かつ複数使用されているような場所では複数の電波が干渉して混信による誤作動が起きる可能性がある。"],a:3,e:"送信機の信号は、無人航空機を飛ばすうえで重要な役割を果たします。同じ周波数帯の電波が同時に複数使われている場所では、電波どうしが干渉して混信が起き、誤作動につながることがあります。これが正答です。\nそのため、飛ばす前に測定器などで周辺の電波の状態を確認しておくことが望ましく、「確認する手段がない」というのは誤りです。また、無線LANやWi-Fi、高圧送電線の影響も考える必要があり、こうした環境で飛ばすときは十分な注意が必要です。",ref:"教則 第4章 4.4.3 送信機（電波混信）（p.44）"},
  {cat:2,lvl:"one",q:"〔一等〕電波環境の調査について、最も適切なものを１つ選べ。",o:["電波環境の調査は、無線局が散在する市街地よりも郊外での飛行時に特に重要である。","無人航空機で使用している周波数と同じ電波の使用状況や他設備からのノイズは、飛行終了後に確認すれば十分である。","無人航空機で使用している周波数と同じ電波の使用状況や他設備からのノイズは、スペクトラムアナライザで確認できる。","無人航空機で使用している周波数と同じ電波の使用状況や他設備からのノイズは、GNSS受信機の受信状況で確認できる。"],a:2,e:"無人航空機の通信環境は、外から来る電波や、他の設備・機器から出るノイズの影響を受けます。そのため、自分が使っている周波数と同じ電波がどれだけ使われているか、他の設備からノイズが出ていないかの確認には、スペクトラムアナライザを使います。\n特に、無線局があちこちにある市街地で飛ばすときは、飛行前にこの調査をしておくことが重要です。飛行終了後に確認すれば十分、というものではありません。",ref:"教則 第4章 4.5.1 電波（電波環境の調査）〔一等〕（p.48）"},
  {cat:2,lvl:"one",q:"〔一等〕カテゴリーⅢ飛行を行う際に理解が必要な無人航空機の飛行性能や影響を与える要因について、最も適切なものを１つ選べ。",o:["機体認証を受けた機体は一定の安全基準への適合が確認されているため、操縦者が飛行性能を理解する必要はない。","上昇性能や着陸性能などの飛行性能は、機体重量の影響は受けるが、空気密度や風などの大気状態の影響は受けない。","上昇性能、着陸性能などの飛行性能は、大気状態や機体重量などの要因によって影響を受ける。","上昇性能や着陸性能などの飛行性能は、空気密度が低いほど向上するため、高地での飛行は有利になる。"],a:2,e:"カテゴリーⅢ飛行を行うときは、無人航空機の飛行性能と、それに影響する要因を理解しておく必要があります。\n・飛行性能：離陸性能、上昇性能、加速性能、巡航性能、旋回性能、降下性能、着陸性能など\n・影響する要因：機体重量、飛行速度、空気密度や風などの大気状態など\n飛行性能はこれらの要因によって大きく変わります。だから「大気状態の影響は受けない」「機体認証を受けていれば操縦者が飛行性能を理解しなくてよい」という記述は誤りです。適切に飛ばすには、これらの要素を理解して管理することが求められます。",ref:"教則 第4章 無人航空機の飛行性能〔一等〕"},
  {cat:2,lvl:"one",q:"〔一等〕固定翼機が失速（ストール）する主な条件として正しいものは。",o:["対気速度が失速速度を超え、翼下面の流れが剥離する","迎角（AoA）が臨界迎角を超え、翼上面の流れが剥離する","迎角（AoA）が臨界迎角を下回り、翼上面の流れが加速する","エンジン出力が急減し、翼下面の流れが剥離する"],a:1,e:"失速（ストール）は、迎角（AoA＝翼が空気の流れに対して向いている角度）が臨界迎角（失速迎角）を超えたときに、翼の上面の流れが翼からはがれ（剥離し）、揚力が急に減る現象です。直接の原因は速度ではなく迎角です。",ref:"教則 第4章 失速〔一等〕（p.38）"},
  {cat:2,lvl:"one",q:"〔一等〕標準大気において高度が1000m増加したときの空気密度の変化として正しいものはどれか。",o:["約1.1倍になる","約0.9倍になる","変化しない","約0.74倍になる"],a:1,e:"標準大気では、高度が1000m上がるごとに空気密度は約0.9倍になります。高度3000mでは地上の約0.74倍です。\n空気密度が下がると、同じ揚力・推力を得るのに、より高い速度や回転数が必要になります。",ref:"教則 第4章 4.3.5 飛行性能の基本的な計算〔一等〕（p.39）"},
  {cat:2,lvl:"one",q:"〔一等〕フライトコントロールシステムを構成するIMU（慣性計測装置）の説明として正しいものはどれか。",o:["衛星からの電波を受信し、3次元の位置と移動速度を測定する装置","3軸のジャイロと3方向の加速度センサ等で3次元の角速度と加速度を検出する装置","3軸の地磁気センサ等で機体の方位と姿勢を検出する装置","気圧センサ等で気圧高度と昇降の速度を検出する装置"],a:1,e:"IMU（慣性計測装置）は、3軸のジャイロセンサと3方向の加速度センサ等でできていて、3次元の角速度と加速度を検出する装置です。メーカーによっては気圧センサを含む場合もあります。",ref:"教則 第4章 4.4.1 フライトコントロールシステム〔一等〕（p.41）"},
  {cat:2,lvl:"one",q:"〔一等〕満充電のリチウムポリマーバッテリーで急上昇させた直後に残量が減ったように見える主な原因はどれか。",o:["大電流が流れたことによる一時的な電圧低下","大電流が流れたことによるセルの恒久的な劣化","急上昇の負荷による残量計測機能の故障","低温による放電能力の一時的な低下"],a:0,e:"急上昇させると大きな電流が流れ、そのときだけ電圧が下がるため、残量が減ったように見えます。あくまで一時的なもので、セルが永久に劣化したわけではありません。\nなお冬季は放電能力が下がるため、飛行時間が半分になることがあります。",ref:"教則 第4章 4.4.6 バッテリーのトラブル〔一等〕（p.46）"},
];
// ---- 第5章 操縦者及び運航体制（24問） ----
const Q_PILOT = [
  {cat:3,lvl:"common",q:"国土交通省への無人航空機の飛行申請について、最も適切なものを１つ選べ。",o:["カテゴリーⅡ飛行の申請は、飛行開始予定日の20開庁日前までに提出する必要がある。","カテゴリーⅠ飛行の申請は、飛行開始予定日の10開庁日前までに提出する必要がある。","カテゴリーⅡ飛行の申請は、飛行開始予定日の3開庁日前までに提出する必要がある。","カテゴリーⅡ飛行の申請は、飛行開始予定日の10開庁日前までに提出する必要がある。"],a:3,e:"無人航空機の飛行には、リスクに応じた安全確保の措置や、国土交通大臣の許可・承認が求められます。\nカテゴリーⅡ飛行の申請は、飛行を始める予定日の10開庁日前までに申請書を出す必要があります。\nなお、カテゴリーⅠ飛行は国土交通省への飛行申請が不要です。",ref:"教則 第5章 無人航空機の操縦者及び運航体制（飛行申請の手続き）"},
  {cat:3,lvl:"common",q:"無人航空機のセキュリティについて、正しいものを１つ選べ。",o:["機体認証を受けた機体を使用することは、無人航空機のサイバーセキュリティ対策となる。","航空法に基づく機体認証・型式認証に係る安全基準には、サイバーセキュリティの観点からの適合性は含まれていない。","遠隔操作ではなく自動操縦されている無人航空機は、ハッキングされるリスクが少ないため、無人航空機のサイバーセキュリティ対策となる。","無人航空機のセキュリティ対策は機体の物理的な盗難防止のみを指し、プログラムの不正な書き換えの防止は含まれない。"],a:0,e:"無人航空機には盗難や悪用のリスクがあり、これらから守るためのセキュリティ対策が必要です。対策は機体の物理的な盗難防止だけではありません。プログラムに基づいて自動又は自律で飛ぶ機体については、プログラムを勝手に書き換えられて悪用されるのを防ぐことも含まれます。\n航空法に基づく機体認証・型式認証の安全基準では、サイバーセキュリティにも配慮されています。そのため認証を受けた機体は一定のサイバーセキュリティ対策がされており、リスクを減らす対策になります。",ref:"教則 第5章 5.1.4 セキュリティ（p.55）"},
  {cat:3,lvl:"common",q:"アルコール又は薬物に関する規定とその注意点について、正しいものを１つ選べ。",o:["アルコール検知器の使用は、飲酒を行った直後には有効だが、前日の飲酒については検知できない。","少量の飲酒であれば操縦への影響はないため、飛行直前の飲酒は認められている。","前日に飲酒した場合でも、睡眠前に大量の水を飲んだ場合は、翌日のアルコールの影響はないと考えてよい。","前夜に飲酒した場合でも、翌日の操縦時にアルコールの影響を受けている可能性があり、アルコール検知器の利用が有用である。"],a:3,e:"アルコールが体から完全に抜けるまでには時間がかかります。そのため前の夜に飲んだ場合でも、翌日の操縦時にアルコールの影響を受けている可能性があります。アルコール検知器を活用し、適切なタイミングで飛行を始めることが大切です。\nなお、寝る前に大量の水を飲んでも、翌日にアルコールの影響を受ける可能性はあります。",ref:"教則 第5章 5.3.2 アルコール又は薬物に関する規定（p.61）"},
  {cat:3,lvl:"common",q:"無人航空機の自動操縦におけるヒューマンエラーについて、最も適切なものを１つ選べ。",o:["自動操縦ではフライトコントローラーが全ての判断を行うため、操縦者による飛行経路の事前確認は不要である。","自動操縦では、ヒューマンエラーによる事故はなく、全て機器による通信障害や予期せぬエラーによる。","ウェイポイント設定時、飛行経路上の障害物の確認不足によって衝突や墜落が発生する可能性がある。","ウェイポイント設定時、飛行経路上の障害物の確認は機体が自動で行い、回避をする。"],a:2,e:"自動操縦では、飛行経路を作るためにウェイポイント（経過点）を設定します。このとき飛行経路上の障害物の確認が足りないと、衝突や墜落といった事故が起きることがあります。\nこれは機器の不具合ではなく人のミス（ヒューマンエラー）によるものなので、事前に現地で障害物を確認しておくことが大切です。",ref:"教則 第5章 無人航空機の操縦者及び運航体制（ヒューマンエラー）"},
  {cat:3,lvl:"common",q:"操縦者のパフォーマンスの低下とその対策について、最も適切なものを１つ選べ。",o:["疲労は、操縦者自身にしかわからないことであるため、運航の計画に対策を組み込むことは困難である。","疲労や高いストレスは飛行の安全を妨げるため、適切な飛行時間管理とストレス軽減策を講じる必要がある。","熟練の操縦者とは疲労が溜まっていても、安全な飛行ができる者のことを指す。","疲労やストレスの影響は操縦経験を積むことで克服できるため、特段の対策は不要である。"],a:1,e:"操縦者が疲れていたり、強いストレスを抱えていたりする状態は、安全な飛行を妨げる要因になります。次のような対策が必要です。\n・飛行時間を適切に管理して疲労を防ぐ\n・適切なコミュニケーションでストレスを減らす\nこれらの対策は、飛行計画の作成、運航体制づくり、飛行前の準備、飛行中・飛行後の対応といった、運航全般に関わる計画に組み込むべきものです。\n熟練の操縦者とは、疲労が溜まっていても飛べる人のことではなく、疲労を管理し、状況に応じて飛行計画を中止できる人のことです。",ref:"教則 第5章 5.3.1 操縦者のパフォーマンスの低下（p.61）"},
  {cat:3,lvl:"common",q:"無人航空機の飛行における補助者の役割について、適切ではないものを１つ選べ。",o:["補助者は飛行経路や範囲に応じて配置され、第三者の立ち入り管理を行う。","補助者は技能・知識を有している必要があることから技能証明を受けた者のみがなれる。","補助者は飛行準備を行うほか、飛行経路周辺の地上や空域の安全確認を行う。","補助者はあらかじめ決められた手段で操縦者と連絡を取り、危険予知の警告や緊急着陸地点への誘導を行う。"],a:1,e:"補助者は次のような役割を担います。\n・飛行の準備\n・飛行経路周辺の地上や空域の安全確認\n・第三者の立ち入り管理\n・あらかじめ決められた手段で操縦者と連絡を取り、危険予知の警告や緊急着陸地点への誘導を行う\n・着陸後の機体回収や安全点検の補助\nこれらの役割を果たすため、飛行経路や範囲に応じた補助者の数や配置、一人ひとりの担当範囲と役割、異常運航時の対応方法も決めておく必要があります。\nなお、技能証明を持っていない人でも補助者になることはできます。",ref:"教則 第5章 補助者の役割（p.62）"},
  {cat:3,lvl:"common",q:"機体のフェールセーフ機能について、最も適切なものを１つ選べ。",o:["フェールセーフ機能発動時の動作を操縦者がホバリングや着陸などから設定できる機体は、フェールセーフ機能を有する機体とは言えない。","バッテリー残量が不足し飛行が継続できない場合、その場に着陸する機体は、フェールセーフ機能を有する機体とは言えない。","フェールセーフ機能とは、ホームポイントに自動帰還する機能のみを指し、その場でのホバリングや着陸は含まれない。","電波の不具合時にその場でホバリングする機能を有する機体は、フェールセーフ機能を有する機体と言える。"],a:3,e:"フェールセーフ機能は、送信電波の不具合や電源容量の減少などで飛行を続けられない場合や、続けられなくなりそうな場合に、自動帰還モードへ切り替わって離陸地点へ飛行するなどの動作をする機能です。\nバッテリー残量が極端に少ない場合などは、その場で自動着陸を試みます。機体によっては、フェールセーフ機能が働いたときの動作を、ホバリング・その地点での着陸・自動帰還などから選んで設定できるものもあります。\nこれらは、飛行中の異常事態に対応して安全を確保するための機能です。",ref:"教則 第5章 5.2.2 フェールセーフ機能（p.59）"},
  {cat:3,lvl:"common",q:"回転翼航空機（マルチローター）の離着陸時に特に注意すべき事項について、最も適切なものを１つ選べ。",o:["ホバリング状態は、機体が一定の高度と位置を継続的に維持する状態で、方位センサ、地磁気センサ、GNSS 受信機、気圧センサなどは必須である。","回転翼から発せられる吹きおろしの気流が地面付近で滞留し、揚力が減少する現象を「地面効果」という。","垂直降下中にボルテックス・リング・ステートに陥った場合は、水平方向の移動は加えず、垂直降下のまま出力を上げることで揚力を回復させる。","吹きおろした空気が再び吸い込まれ、回転翼の上下で空気の再循環が発生し急激に揚力を失う現象を「ボルテックス・リング・ステート」といい機体を垂直降下させる時に発生する可能性が高い。"],a:3,e:"マルチローターを垂直に降下させるときは、吹きおろした空気をふたたび吸い込んでしまい、回転翼の上下で空気の再循環が起きて急に揚力を失う「ボルテックス・リング・ステート」が発生しやすくなります。降下の際は水平方向の移動も合わせて操作することが、墜落の防止策になります。\nなお、機体重量1.5kgほどの機体では、離陸直後から対地高度1m程度までの間は「地面効果」で揚力が増す現象が起こりやすくなります。\nまた、GNSSを使わないホバリングも可能ですが、その場合は機体周辺の気流の影響で水平位置が不安定になるため、エレベーター操作及びエルロン操作で水平位置を安定させます。",ref:"教則 第5章 無人航空機の操縦者及び運航体制（離着陸時の操作）"},
  {cat:3,lvl:"common",q:"ヘリコプターの離着陸について最も適切なものを１つ選べ。",o:["離着陸直前は機体が水平となるため、テール部が地面に接触するリスクを軽減する方法として傾斜地を選定する。","十分にローター回転が上昇してから地面効果外まで垂直方向に急上昇させること。","ローター半径以下の高度では、地面効果の影響が顕著となる。","着陸時は地面効果範囲内で長時間ホバリングを行い、機体を安定させてから接地する。"],a:2,e:"回転翼航空機（ヘリコプター）の離着陸では、ローターの回転を十分に上げることが必要です。地面効果の範囲内では機体が不安定になるため、速やかに機体を上昇させます。ただし、垂直方向の急上昇は避ける必要があります。\nローター半径以下の高度では地面効果の影響が大きく出るため、その範囲でのホバリングは避け、速やかに着陸します。\nそのほかの注意点は次のとおりです。\n・滑りやすい場所での離着陸は避ける\n・視界をさえぎる砂埃等が飛散する砂地や乾燥した土地での離陸は避ける\n・離着陸の直前は機体が水平になり、傾斜地ではテール部などが地面に接触するおそれがあるため、水平な場所を選ぶ",ref:"教則 第5章 5.2.1 ヘリコプターの離着陸（p.56）"},
  {cat:3,lvl:"common",q:"無人航空機の飛行に関連する保険について、最も適切なものを１つ選べ。",o:["損害賠償責任保険は、機体やカメラ自体の損傷に対しても補償する保険である。","損害賠償責任保険は、無人航空機運航による損害（対物・対人）に対応する保険である。","機体保険は、無人航空機により損害を与えた物件に対して補償する保険である。","無人航空機を飛行させる際は、法令により損害賠償責任保険への加入が義務付けられている。"],a:1,e:"無人航空機を飛ばす場合、第三者への損害賠償能力を確保しておくことが重要とされています。保険には次のものがあります。\n・損害賠償責任保険…無人航空機を運航したことで生じた損害（対物・対人）に対応する保険\n・機体保険…機体やカメラ自体の損傷に対する保険。機体が見つからない場合は保険が使えないケースもある\n荷物輸送では、運ぶ荷物が保険の対象に含まれるかを確認することが大切です。\n無人航空機の保険には、自動車の自賠責のような強制保険はなく、すべて任意保険です。法令で一律に加入が義務づけられているわけではありません。\nただし、令和8年7月の改正（教則第5版）で保険の付保範囲が広がり、カテゴリーⅡ飛行のうち総重量25kg以上の無人航空機を飛ばす場合、又はレベル3.5飛行の場合には、不測の事態が起きたときに十分な補償ができる第三者賠償責任保険への加入が求められます。",ref:"教則 第5章 5.1.4 保険及びセキュリティ（p.55）／第2章 2.3.3 保険（p.6）"},
  {cat:3,lvl:"common",q:"無人航空機の事故発生時(負傷者あり)に運航者が行うべき行動として、適切ではないものを１つ選べ。",o:["負傷者がいる場合には、第一にその負傷者の救護、救急車の手配を行う。","事故の日時や場所などの必要事項の国土交通大臣への報告は、負傷者の救護等の措置を講じた後に行う。","負傷者の有無にかかわらず、事故が発生した場合には直ちに無人航空機の飛行を中止する。","事故発生時においては、国土交通大臣に報告しない場合は罰則があるが、救護しなかったことについて罰則は明記されていない。"],a:3,e:"事故が起きたときは、まず直ちに飛行を中止し、負傷者の救護や緊急通報、事故の状況に応じた警察・消防への通報など、危険を防ぐための措置をとります。そのあとで、事故の日時や場所などの必要事項を国土交通大臣に報告します。\n報告しなかった場合だけでなく、救護等の措置をとらなかった場合にも航空法上の罰則があります。",ref:"教則 第5章 5.1.2 異常事態発生時の措置（p.52）"},
  {cat:3,lvl:"common",q:"以下の選択肢の中から、無人航空機の運航に関する安全点検のプロセスについて適切ではないものを１つ選べ。",o:["飛行前の点検ではバッテリーのチェックや機体の異常チェックなど、無人航空機が正常に飛行できることを最終確認する。","点検は飛行前後に行うもので、飛行中に行う点検はないことが望ましい。","運航終了後の点検として、無人航空機やバッテリーを安全に保管するための確認や、飛行日誌の作成などが挙げられる。","運航当日の準備では、必要な装置や設備の設置を行い、飛行に必要な許可・承認や機体登録等の有効期間が切れていないかを確認する。"],a:1,e:"安全点検のプロセスは次のとおりです。\n・運航当日の準備…必要な装置や設備を設置し、飛行に必要な許可・承認や機体登録等の有効期間が切れていないかを確認する\n・飛行前の点検…機体を飛ばす前に毎回行う最終点検。バッテリーや機体に異常がないかなど、正常に飛べることを最終確認する\n・飛行中の点検…飛行中の機体の状態や、飛行している機体の周囲の状況を確認する\n・飛行後の点検…着陸したあとに、各部品の摩耗等の状態を確認する\n・運航終了後の点検…機体やバッテリーを安全に保管するための確認や、飛行日誌の作成などを行う\n・異常事態発生時の点検…危機回避行動を行い、安全に着陸するための項目を確認する\nこのように、飛行中に行う点検も存在します。",ref:"教則 第5章 5.1.2 運航時の点検及び確認事項（p.52）"},
  {cat:3,lvl:"common",q:"TEM (Threat and Error Management)、CRM (Crew Resource Management)について、正しいものを１つ選べ。",o:["スレット（Threat）とは、操縦者のエラーによって生じる望ましくない航空機の状態のことをいう。","エラーにつながりかねないスレットの早期把握・管理することは「TEM」の考え方に含まれる。","CRMスキルとは、状況認識、意思決定、ワークロード管理、チームワーク、コミュニケーションの5つに操縦技能を加えた6つの能力をいう。","スレットに適切に対処できず、安全マージンの低下した状態を「TEM」という。"],a:1,e:"事故等を防ぐには、操縦技量（テクニカルスキル）を上げるだけではヒューマンエラーを完全になくすことはできません。そこで、使えるすべての人的リソース・ハードウェア・情報を活用する「CRM（Crew Resource Management）」という考え方が有効とされています。\nCRMの効果を最大限に発揮するために取り入れられているのが「TEM（Threat and Error Management）」という手法です。\n・スレット（Threat）…エラー（Error）を誘発する要因のこと（気象の変化、疲労、機材の不具合など）\n・UAS（Undesired Aircraft State）…スレットに適切に対処できず、安全マージンが低下した、望ましくない航空機の状態\nTEMは、使えるすべてのリソースを活用してスレットの発生状況を早めに把握・管理し、万一エラーやUASに至っても事故等に至らないよう適切に対処しようとする手法です。\nTEMを効果的に実践するための能力は、状況認識・意思決定・ワークロード管理・チームワーク・コミュニケーションの5つのCRMスキル（ノンテクニカルスキル）で、操縦技能は含まれません。",ref:"教則 第5章 5.4.1 CRM・TEM（p.62）"},
  {cat:3,lvl:"common",q:"無人航空機の操縦方法（自動操縦と手動操縦）について、最も適切なものを１つ選べ。",o:["自動操縦は再現性の低い飛行となるため、経過観察が必要とされる用地の飛行には適さない。","手動操縦は高い再現性を求められる操縦には不向きである。","ウェイポイントは地図上の位置情報の設定はできるが、機体の向きや高度、速度など詳細な設定はできない。","自動操縦ができる機体であれば、不具合発生時にも手動操縦が必要となることはない。"],a:1,e:"自動操縦では、アプリケーションソフトの地図情報に、あらかじめ複数のウェイポイント（経過点）を設定して飛行経路を作れます。そのため再現性の高い飛行ができ、経過観察が必要な用地、離島への輸送、生育状況を把握する耕作地などの飛行に利用されます。ウェイポイントは地図上の位置情報だけでなく、機体の向きや高度、速度なども細かく設定できます。\n一方、手動操縦では操縦者の習熟度に応じて、飛行高度の微調整、回転半径や航行速度の調整、遠隔地での高精度な着陸といった細かい操作が行えますが、高い再現性を求められる操縦には向いていません。\nまた、自動操縦ができる機体でも、不具合が起きたときは手動での操縦が必要になる場合があるため、手動操縦の必要性が低いとは言えません。",ref:"教則 第5章 5.2.2 手動操縦及び自動操縦（p.59）"},
  {cat:3,lvl:"common",q:"ガソリンエンジンで駆動する機体の運用について、最も適切なものを1つ選べ。",o:["ガソリンエンジンで駆動する機体のガソリンは航空法上の危険物に該当する。","機体の振動が大きいため、ネジ類等が緩みやすい。","ガソリンを車で運搬する場合は、消防法で定められた32リットル以下の専用の容器で運搬することが必要である。","給油の際は、エンジンを停止し機体が十分に冷えていれば、周囲の火気に注意する必要はない。"],a:1,e:"ガソリンを車で運ぶ場合は、消防法により22リットル以下の専用の容器を使う必要があります。\nまた、エンジンで駆動する機体は振動が大きくなるため、ネジ類の緩みなどには特に注意を払い、定期的に点検する必要があります。\nなお、無人航空機を飛ばすために必要な燃料としてのガソリンは、航空法上の危険物には当たりません。ガソリンは引火しやすいため、給油の際は周囲の火気に十分注意します。",ref:"教則 第5章 5.1.2 ガソリンエンジン機の注意事項（p.52）"},
  {cat:3,lvl:"common",q:"手動操縦におけるヒューマンエラーの傾向について、適切ではないものを１つ選べ。",o:["機体と操縦者との距離が離れた場合には、機体付近の障害物との距離差が掴みにくくなり、機体が障害物に接触しやすい状況となる。","機体をあらゆる方向に向けても確実に意図した方向や高度に制御できる訓練はヒューマンエラー回避の対策となる。","操縦経験の浅い操縦者が操作を行うと、意図しない方向に飛行してしまう場合がある。","操縦者の視線と回転翼航空機の正面方向が異なる場合であっても、機体が自動で方向を処理するため、意図しない方向に飛行する可能性は低い。"],a:3,e:"手動操縦のヒューマンエラーの傾向として、操縦経験の浅い操縦者が操作すると、意図しない方向に飛んでしまう場合があります。特に次のような場合は注意が必要です。\n・操縦者の視線と回転翼航空機の正面方向が異なる場合\n・機体と操縦者との距離が離れた場合…機体付近の障害物との距離差がつかみにくくなり、接触しやすい状況になる\nこれらのリスクを避けるには、機体をあらゆる方向に向けても確実に意図した方向や高度に制御できる訓練や、指定された距離での着陸訓練が有効です。",ref:"教則 第5章 5.2.2 手動操縦のヒューマンエラー（p.59）"},
  {cat:3,lvl:"common",q:"以下の選択肢の中から、無人航空機の運航に関する安全点検のプロセスについて適切ではないものを１つ選べ。",o:["飛行後の点検とは、無人航空機が飛行を終えて着陸したあとに行うべき点検であり、飛行の結果、無人航空機の各部品の摩耗等の状態を確認する。","飛行中の点検では、飛行中の機体の状態や、飛行している機体の周囲の状況を確認する。","運航当日の準備では、必要な装置や設備の設置を行い、飛行に必要な許可・承認や機体登録等の有効期間が切れていないかを確認するが、連日で飛行する場合は、省略ができる。","異常事態発生時の措置として、事故発生時は直ちに無人航空機の飛行を中止し、負傷者がいる場合は救護・通報を行う。"],a:2,e:"飛ばす当日の準備では、必要な装置や設備を設置し、飛行に必要な許可・承認や機体登録などの有効期間が切れていないかを確認します。連日飛ばす場合でも、この確認を省くことはできません。そのため「連日なら省略できる」という記述が誤りです。\nほかの選択肢は正しい内容です。\n・飛行中の点検＝飛んでいる機体の状態と、機体の周りの状況を確認します\n・飛行後の点検＝着陸したあとに行う点検で、各部品のすり減りなどを確認します\n・異常が起きたとき＝あらかじめ決めておいた手順に従って危険を避ける行動をとり、事故が起きたらすぐに飛行を中止して、危険を防ぐための措置をとります",ref:"教則 第5章 5.1.2 運航時の点検及び確認事項（p.52）"},
  {cat:3,lvl:"common",q:"ペイロードを搭載あるいは物件投下時における注意事項について、最も適切なものを１つ選べ。",o:["ペイロードを搭載すると機体の重量は変わるが、重心位置は変わらないため、飛行特性への影響は考慮しなくてよい。","物件投下を行う際の高度は、補助者の有無に関わらず原則1m以内で行う必要がある。","補助者を配置しない場合、物件投下を行う際の高度は原則1m以内である。","補助者を配置しない場合、物件投下を行う際の高度は原則30m以内である。"],a:2,e:"物件投下は、補助者（＝周囲の安全を見張る人）を置かない場合、原則として高度1m以内で行います。ポイントは「補助者を置かない場合」という条件が付くことと、高度が30mではなく1m以内であることです。\nまた、ペイロード（＝機体に載せる荷物や機材）を積むと、機体の重さだけでなく重心の位置も変わります。飛び方の特性に影響するので注意が必要です。",ref:"教則 第5章 操縦者及び運航体制（ペイロードの搭載・物件投下）"},
  {cat:3,lvl:"common",q:"飛行機の離着陸について最も適切なものを１つ選べ。",o:["離陸方向は原則として向かい風を選ぶ。","滑走路として使用するエリアは、水はけを考慮して緩やかな傾斜地を選ぶことが望ましい。","着陸操縦は、降下速度を遅くする必要があるため、追い風方向で行うことが望ましい。","滑走路に草が伸びている場合でも、機体の高さ以下であれば刈り取らずに使用してよい。"],a:0,e:"飛行機の離着陸は、向かい風の方向を選ぶのが原則です。追い風で離着陸すると、失速する危険や、滑走路から外れる危険があるためです。着陸のときも、向かい風の方向に滑走できるエリアを確保してから着陸操作に入ります。\nまた、滑走路に使う場所は、水平で草などが伸びていない所を選ぶことが大切です。草が伸びているとプロペラに当たり、飛べなくなることがあります。",ref:"教則 第5章 5.2.1 飛行機の離着陸（p.56）"},
  {cat:3,lvl:"common",q:"自動操縦と手動操縦の切り替えにおける操作上の注意と対応について、最も適切なものを１つ選べ。",o:["何らかの原因で不安定な飛行と判断した場合は、手動操縦はせずその場に着陸させることが望ましい。","手動操縦に切り替えた後は、バッテリーの消耗を抑えるため、ホバリングはせずに直ちに作業飛行に移ることが望ましい。","作業指示による手動操作への切り替えは危険なため行うべきではない。","手動操縦に切り替えた後は、ホバリングをして機体の安定性や周囲の安全を確認する。"],a:3,e:"自動操縦から手動操縦に切り替える場面としては、作業の指示で手動に切り替えるときや、何かの原因で飛び方が不安定だと判断したときなどが考えられます。\n手動に切り替えたあとは、次のことが求められます。\n・急に速度が落ちたり失速したりした場合に備えて、操作の準備をしておく\n・障害物に近づかないよう、機体の向きを確認する\n・ホバリングをして、機体が安定しているか、周りが安全かを確認する",ref:"教則 第5章 5.2.2 自動操縦と手動操縦の切り替え（p.59）"},
  {cat:3,lvl:"common",q:"ガソリンエンジン機の燃料運搬に関する注意として正しいものはどれか。",o:["ガソリンは危険物のため、乗用車等で運ぶ場合は消防法で定められた専用の容器（22リットル以下）で運搬する","ガソリンは危険物のため、乗用車等で運ぶ場合は消防法で定められた専用の容器（30リットル以下）で運搬する","ガソリンは危険物のため、乗用車等で運ぶ場合は道路交通法で定められた専用の容器（22リットル以下）で運搬する","ガソリンは危険物のため、乗用車等で運ぶ場合は灯油用と同様のポリ容器（22リットル以下）で運搬する"],a:0,e:"ガソリンは危険物にあたるため、乗用車などで運ぶときは、消防法で決められた専用の容器（22リットル以下）を使います。容量は30リットルではなく22リットル以下、根拠となる法律は道路交通法ではなく消防法で、灯油用のポリ容器で代用することもできません。\nなお、エンジン機は振動が大きいため、ネジ類が緩んでいないかの点検も大切です。",ref:"教則 第5章 5.1.2 ガソリンエンジン機の注意事項（p.52）"},
  {cat:3,lvl:"common",q:"無人航空機を飛行させる際の服装として適切でないものはどれか。",o:["露出が多く動きにくい服装","動きやすい服装","素肌の露出が少ない服装","関係者と容易にわかる服装"],a:0,e:"飛ばすときの服装は、次の3点を満たすものにします。\n・動きやすいこと\n・素肌（頭部を含む）の露出が少ないこと\n・関係者だとすぐに分かること\n必要に応じて、ヘルメットや保護メガネなども準備します。「露出が多く動きにくい服装」はこれに当てはまらないので、適切ではありません。",ref:"教則 第2章 2.2.6 服装に対する注意（p.4）"},
  {cat:3,lvl:"common",q:"TEMを効果的に実践するためのCRMスキル（ノンテクニカルスキル）に含まれないものはどれか。",o:["機体の操縦技量（テクニカルスキル）","状況認識","意思決定","コミュニケーション"],a:0,e:"CRMスキル（ノンテクニカルスキル＝操縦の腕前以外の能力）は、次の5つです。\n・状況認識\n・意思決定\n・ワークロード管理\n・チームワーク\n・コミュニケーション\n機体の操縦技量はテクニカルスキルであり、これら5つとは別のものです。",ref:"教則 第5章 5.4.1 CRM（p.62）"},
  {cat:3,lvl:"one",q:"〔一等〕カテゴリーⅢ飛行のリスク評価結果による保険、セキュリティについて、最も適切なものを１つ選べ。",o:["カテゴリーⅢ飛行では、飛行の形態に応じたリスク評価の結果にかかわらず、必要な保険への加入が法令で義務付けられている。","カテゴリーⅢ飛行の許可・承認の審査では、無人航空機を飛行させる者が賠償能力を有することの確認は行われない。","飛行の形態に応じたリスク評価結果に基づき、必要な保険に加入することが望ましい。","無人航空機の選定において、機体にセキュリティ対策が講じられていれば、リスク評価を実施する必要はない。"],a:2,e:"カテゴリーⅢ飛行は、第三者の上空を飛ぶリスクの高い運航です。そのため、飛行の許可・承認の審査にあわせて、無人航空機を飛ばす人に賠償能力があるかどうかの確認が行われます。\n保険については、飛行の形態に応じたリスク評価を行い、その結果をもとに必要な保険に入ることが「望ましい」とされています。リスク評価の結果にかかわらず法令で義務付けられているわけではありません。\nまた、機体を選ぶときも、リスク評価の結果をふまえて、必要なセキュリティ対策がとられているかを考える必要があります。",ref:"教則 第5章 5.1.4 保険及びセキュリティ（p.55）"},
];
// ---- 第6章 運航上のリスク管理（56問） ----
const Q_RISK = [
  {cat:4,lvl:"common",q:"無人航空機の運航中の事故・インシデントへの対応について正しいものを１つ選べ。",o:["航空機と衝突又は接触するおそれがあったと認めたときは、国土交通大臣への報告対象となる事故に該当する。","操縦者自身が軽傷を負った場合は、国土交通大臣への報告対象となる事故に該当する。","操縦者自身の車と衝突した場合、国土交通大臣への報告対象となる事故等には該当しない。","保管中にバッテリーが発火した場合は、国土交通大臣への報告対象となる重大インシデントに該当する。"],a:2,e:"国土交通大臣への報告が必要な「事故」は、次の3つです。\n・無人航空機による人の死傷（重傷以上）\n・第三者が所有する物件の損壊\n・航空機との衝突または接触\n報告が必要な「重大インシデント」は、次の4つです。\n・無人航空機による人の負傷（軽傷）\n・機体の制御が効かなくなった事態\n・機体が飛行中に発火した事態\n・航空機と衝突または接触するおそれがあったと認めたとき\n操縦者自身の車は「第三者が所有する物件」に当たらないため、報告が必要な事故等にはあたりません。",ref:"教則 第6章 事故・重大インシデントへの対応"},
  {cat:4,lvl:"common",q:"無人航空機運用時の気象に関する注意事項について、最も適切なものを１つ選べ。",o:["広い運動場のような場所では、強い日射により上昇気流がおこり、つむじ風が発生する可能性がある。","上空の風は地上付近よりも常に弱いため、高度を上げるほど風の影響は小さくなる。","低温時は化学反応が進みにくく、バッテリーの持続時間（飛行可能時間）が普段より長くなる。","太陽光パネルやアスファルト・コンクリートの地面が多い場所では、下降気流が発生しやすいため、飛行には注意が必要である。"],a:0,e:"飛ばすときは、気温や地形によって気流が変わることに注意が必要です。\n・広い運動場のような場所や、太陽光パネル・アスファルト・コンクリートなどの広い地面は、強い日射で暖められると上昇気流が起きやすく、つむじ風が発生することがあります（下降気流ではありません）\n・低温のときは電池内部の化学反応が進みにくく、バッテリーの持続時間（飛べる時間）が普段より短くなることがあります（長くはなりません）\n・上空は地表面との摩擦の影響が小さいため、一般に地上付近より風が強くなります（常に弱いわけではありません）",ref:"教則 第6章 気象の基礎知識（地形の影響・上昇気流）"},
  {cat:4,lvl:"common",q:"風に関する記述のうち、最も適切なものを１つ選べ。",o:["海陸風の特徴として、地表付近において、日中は暖まりやすい陸上から海上に向かって風が吹き、夜間は冷めにくい海上から陸地に向かって風が吹くことが挙げられる。","山谷風の特徴として、昼間は日射で暖められた空気が山から降りる山風が吹き、夜間は冷えた空気が谷を這い上がる谷風が吹くことが挙げられる。","季節風の特徴として、日本付近では夏は大陸から海洋に向かって風が吹き、冬は海洋から大陸に向かって風が吹くことが挙げられる。","ビル風の特徴として、周辺の風より風速が速く継続して吹いていることが挙げられる。"],a:3,e:"それぞれの風の特徴は次のとおりです。\n・ビル風＝高層ビルなど容積の大きい建物が近くに集まる場所やその周辺で起きる風です。周りの風より風速が速く、続けて吹きます。建物群の配置や構成によって吹く風の種類が変わります（剥離流、吹き降ろし、逆流、谷間風、街路風など）\n・海陸風＝海と陸の気温差で生じる局地的な風です。地表付近では、日中は暖まりやすい陸上に向かって（海から陸へ）、夜間は冷めにくい海上に向かって（陸から海へ）吹きます。風が入れ替わるときはほぼ無風になり、朝凪・夕凪と呼ばれます\n・山谷風＝山岳地帯に現れる風です。昼間は日射で暖められた空気が谷を這い上がる谷風、夜間は冷えた空気が山から降りる山風が吹きます\n・季節風＝日本付近では、夏は海洋から大陸へ、冬は大陸から海洋へ吹きます\n誤りの選択肢は、海陸風・山谷風・季節風の向きがいずれも逆になっています。",ref:"教則 第6章 気象の基礎知識（海陸風・山谷風・ビル風）"},
  {cat:4,lvl:"common",q:"無人航空機の飛行を実施する際の気象状況の判断について、最も適切なものを１つ選べ。",o:["霧雨であれば飛行は可能である。","霧の発生時は飛行の延期や中止が望ましい。","雷鳴が聞こえても、降雨がなければ飛行を継続してよい。","霧の発生時は視認性が低下するが、自動操縦ができる無人航空機であれば問題ない。"],a:1,e:"無人航空機の飛行は、気象条件に大きく左右されます。雨のとき、雪のとき、霧が出ているとき、雷鳴が聞こえるときは、安全を考えて飛行を延期または中止することが望ましいとされています。霧が出ていると視界が悪くなるため、自動操縦ができる機体であっても飛ばすのは避けるべきです。",ref:"教則 第6章 6.2.2 気象（霧）（p.72）"},
  {cat:4,lvl:"common",q:"回転翼航空機（ヘリコプター）の運航の特徴について、適切ではないものを１つ選べ。",o:["回転翼航空機（ヘリコプター）は、垂直降下時や低速での前進飛行時に、ボルテックス・リング・ステートが発生しやすい。","オートローテーション機構がある場合、動力が停止しても条件によっては軟着陸が可能である。","前進させながら降下することは、ボルテックス・リング・ステートの予防になる。","垂直上昇は前進させながら上昇させる方法に比べ、必要パワーを削減できる。"],a:3,e:"回転翼航空機（ヘリコプター）は、垂直に降下するときや、低速で前進しているときに、ボルテックス・リング・ステート（＝急に高度が下がって回復できなくなる現象）が起きやすくなります。そのため、前進しながら降下することが予防に有効です。\n上昇についても、前進させながら上昇したほうが必要なパワーを減らせます。つまり垂直上昇は避けるのが望ましく、「垂直上昇のほうが必要パワーを削減できる」という記述は誤りです。\nオートローテーション機構がある場合は、動力が止まっても、高度などの条件が揃えば軟着陸ができます。",ref:"教則 第6章 6.3.2 回転翼航空機（ヘリコプター）（p.75）"},
  {cat:4,lvl:"common",q:"前線について、最も適切なものを１つ選べ。",o:["温暖前線が近づくと気温、湿度は次第に高くなり、雨もやむ。","停滞前線は移動速度が速く、付近の悪天候は長続きしない。","寒冷前線付近では、発達した積乱雲が発生する。","閉塞前線は低気圧の勢力が強くなる時に見られる。"],a:2,e:"前線ごとの特徴は次のとおりです。\n・寒冷前線＝発達した積乱雲ができ、突風や雷を伴って、短時間で断続的に強い雨が降ります\n・温暖前線＝層状の雲が次第に広がります。前線が近づくと気温・湿度は次第に高くなり、弱い雨が絶え間なく降ります（ときには雷雨を伴うこともあります）。雨がやむわけではありません\n・閉塞前線＝寒冷前線が温暖前線に追いついてできる前線です。閉塞が進むと、低気圧の勢力は次第に弱くなります\n・停滞前線＝寒気と暖気の勢力がほぼ釣り合っているため、ほとんど動きません。付近では悪天候が長く続くことが多いです",ref:"教則 第6章 気象の基礎知識（前線）"},
  {cat:4,lvl:"common",q:"無人航空機の飛行におけるリスク管理について、最も適切ではないものを１つ選べ。",o:["ハザードによって生じる「リスク」を評価したうえで、「リスク」の発生確率をゼロにすることが重要である。","「リスク」の結果となる被害を軽減する措置を講じることで、「リスク」を許容可能な程度まで低減することが重要である。","リスク管理の考え方は特にカテゴリーⅢ飛行において重要となるが、その他の飛行においても理解したうえで安全に配慮した飛行を行うことが重要である。","事故等につながりかねない危険性のある要素である「ハザード」を具体的に可能な限り多く特定することは重要である。"],a:0,e:"飛行にあたっては、法令などの基準や要件に適合させることに加えて、運航上のリスクを管理することが安全確保のうえでとても重要です。進め方は次のとおりです。\n・運航の形態に応じて、事故などにつながりかねない危険な要素（ハザード）を、できるだけ多く具体的に洗い出す\n・そこから生じるリスクを評価する\n・発生する確率を下げるか、被害を軽減する措置をとって、リスクを許容できる程度まで下げる\nただし、リスクをゼロにすることはできません。それを理解したうえで対策をとる必要があるため、「発生確率をゼロにすることが重要」という記述は適切ではありません。",ref:"教則 第6章 リスク管理の基礎（p.63）"},
  {cat:4,lvl:"common",q:"無人航空機の飛行における気象の影響について、最も適切なものを１つ選べ。",o:["離陸から着陸まで、支障のある気象状況にならないことを確認した後に飛行を開始するべきである。","飛行中に天候が悪化した場合でも、当初の飛行計画どおり飛行を完了させることを優先するべきである。","テレビでの天気予報を参照することで、無人航空機の飛行に必要な気象情報を得ることができる。","防水性能を有している機体であれば、雨の中でも安全な飛行が可能である。"],a:0,e:"安全に飛ばすには、気象の影響を理解して、適切に対処する必要があります。離陸から着陸まで、支障のある気象状況にならないことを確認したうえで、飛行を始めなければなりません。\nまた、目視で飛行の状況や他の物件との安全な距離が確認できない雲の中や濃い霧などの気象状態では、飛ばしてはいけません。一般的な天気予報だけに頼らず、飛行に影響する具体的な気象情報を自分で入手し、分析する必要があります。",ref:"教則 第6章 気象情報の活用（p.69）"},
  {cat:4,lvl:"common",q:"飛行空域の安全マージンについて、最も適切なものを１つ選べ。",o:["飛行範囲に危険半径（高度と同じ数値又は30ｍのいずれか短い方）を加えた範囲を、立入管理措置を講じて無人地帯とした後、飛行する。","飛行範囲に危険半径（高度と同じ数値又は30ｍのいずれか長い方）を加えた範囲を、立入管理措置を講じて無人地帯とした後、飛行する。","ジオフェンス機能を使用することで危険半径を小さくすることができる。","緊急時に必要な一時的な着陸スペースは、飛行中に機体カメラで確認し選定する。"],a:1,e:"安全マージンを確保した飛行とは、飛行範囲に危険半径を加えた範囲を、立入管理措置（＝人が立ち入らないようにする措置）を講じて無人地帯にしたうえで飛ばすことです。危険半径は「高度と同じ数値」か「30m」のうち、長いほうを使います（短いほうではありません）。\nジオフェンス機能は飛行範囲から外に出るのを防ぐのに役立ちますが、危険半径を小さくしてよい理由にはなりません。また、緊急時に一時的に着陸できる場所は、前もって確認・確保しておく必要があります。",ref:"教則 第6章 6.1.1 安全マージン〔一等〕（p.63）"},
  {cat:4,lvl:"common",q:"無人航空機の飛行におけるリスク評価とリスク軽減策について、最も適切ではないものを１つ選べ。",o:["送信機との通信断絶というハザードによる墜落というリスクに対して、墜落時にパラシュートが開くことは、事象発生による被害の軽減に寄与する。","送信機との通信断絶というハザードによる墜落というリスクに対して、飛行前に飛行空域の電波環境を確認することは、事象の発生確率を低減することに寄与する。","送信機との通信断絶というハザードによる墜落というリスクに対して、飛行高度を高く設定することは、事象発生による被害の軽減に寄与する。","送信機との通信断絶というハザードによる墜落というリスクに対して、フェールセーフ機能による自動帰還が作動することは、事象の発生確率を低減することに寄与する。"],a:2,e:"運航の形態に応じて、事故などにつながりかねないハザードをできるだけ多く洗い出し、そこから生じるリスクを評価したうえで、許容できる程度まで下げる必要があります。対策には次の2種類があり、どちらも検討します。\n・事象が起こる確率を下げる対策\n・事象が起きたときの被害を軽減する対策\n送信機との通信が切れて墜落するケースでは、飛行前に飛行空域の電波環境を確認することや、フェールセーフ機能による自動帰還は、発生確率を下げる対策です。墜落時にパラシュートが開くことは、被害を軽減する対策です。一方、飛行高度を高く設定しても被害が軽くなるわけではないため、これが誤りです。",ref:"教則 第6章 6.1.4 ハザードとリスク（p.65）"},
  {cat:4,lvl:"common",q:"飛行計画に関する説明の中から最も適切なものを１つ選べ。",o:["飛行経路の設定における緊急用務空域の確認は、飛行前日に行えば十分である。","無人航空機の離着陸地点以外の飛行経路下に係る自治体や関係者・権利者への周知や承諾は不要である。","着陸予定地点に着陸できないリスクがある場合でも、緊急着陸地点は飛行開始後に検討すればよい。","離着陸場の選定には、人の立ち入りやコンパスエラーの原因となる構造物がないかを確認する。"],a:3,e:"飛行計画をつくるときは、飛行経路と飛行範囲を決めたうえで、自治体などの関係者・権利者に知らせたり、承諾を得たりする必要がある場合があります。離着陸場を選ぶときは、人が立ち入らないか、コンパスエラーの原因になる構造物がないかを確認します。\n飛行経路を決めるときは、電力施設・緊急用務空域・航空機の往来なども考えに入れます。着陸予定地点に降りられず、離陸地点まで戻るだけの飛行可能距離が確保できないなどのリスクがある場合は、事前に緊急着陸地点を確保しておくべきです。\nまた、機体の物理的な障害、その飛行範囲に特有の現象、制度面の規制、前もって予想できる状況の変化などを想定して、確認事項をつくることが求められます。",ref:"教則 第6章 飛行計画の立案"},
  {cat:4,lvl:"common",q:"日本の天気について、適切ではないものを１つ選べ。",o:["冬は日本海側に大雪をもたらすが、これはシベリア高気圧が優勢になるためである。","春と秋はシベリア高気圧と太平洋高気圧の勢力が入れ替わるときで、このとき日本付近に両気団の境界ができて前線が停滞し、広い範囲に悪い天気をもたらし、１週間くらい雨が降り続くことがある。","日本の天気を支配するのは、冬のシベリア高気圧と夏の太平洋高気圧である。","春と秋はシベリア高気圧と太平洋高気圧の勢力が入れ替わるときで、このとき日本の広い範囲に良い天気をもたらし、１か月ほど視界良好な日となる。"],a:3,e:"日本の天気を左右するのは、冬のシベリア高気圧と夏の太平洋高気圧です。春と秋は、この2つの勢力が入れ替わる時期にあたります。\nこのとき日本付近には両方の気団の境目ができて前線が停滞し、広い範囲に悪い天気をもたらします。1週間くらい雨が降り続き、雲が低くなったり視程が悪くなったりします（正確には、オホーツク海高気圧と太平洋高気圧の間に前線が停滞します）。そのため「良い天気が1か月ほど続く」という記述は適切ではありません。\n冬に日本海側で大雪になるのは、シベリア高気圧が優勢になるためです。このときの天気図は西側に高気圧、東側に低気圧という気圧配置になるため、西高東低と呼ばれます。",ref:"教則 第6章 6.2.1 日本の天気（季節）"},
  {cat:4,lvl:"common",q:"天気図の解釈に関する以下の記述の中から最も適切なものを１つ選べ。",o:["現在使用されている天気図上の気圧の単位はヘクトパスカル（hPa）で標準大気圧（１気圧）=1013hPaである。","高気圧の中心部では上昇気流が発生し、一般的に天気は良い。","等圧線の間隔が広いところほど気圧差が大きく、風が強く吹く。","天気記号に付いた矢の向きが風が吹いていく方向を示している。"],a:0,e:"天気図で使う気圧の単位はヘクトパスカル（hPa）で、標準大気圧（1気圧）は1013hPaです。\nほかの選択肢が誤っている点は次のとおりです。\n・等圧線の間隔は「狭い」ほど気圧差が大きく、風が強く吹きます（広いところ、ではありません）\n・天気記号に付いた矢の向きは、風が吹いて「くる」方向を示します\n・高気圧の中心部では下降気流が起き、天気は一般に良好です（上昇気流ではありません）",ref:"教則 第6章 気象の基礎知識（天気図の見方）"},
  {cat:4,lvl:"common",q:"無人航空機の運航に関するハザードとリスクについて、最も適切なものを１つ選べ。",o:["発生事象のリスクは、被害の発生確率と被害の大きさにより計量する。","発生事象のリスクは、結果の重大性は考慮せず、予測される頻度のみにより計量する。","リスクとハザードは同義語であり、事故等につながる可能性のある危険要素を指す。","「ハザード」とは事故等につながる可能性のある危険要素を指すが、潜在的なものは「リスク」という。"],a:0,e:"「ハザード」は、事故などにつながるおそれのある危険要素のことです（表に出ていない潜在的なものも含みます）。「リスク」は、無人航空機の運航の安全に影響する何らかの出来事が起きる可能性のことです。同じ意味の言葉ではありません。\n発生する出来事のリスクは、次の2つで測ります。\n・予測される頻度（＝被害の発生確率）\n・結果の重大性（＝被害の大きさ）\n頻度だけでは測らないので、「重大性は考慮しない」という説明は誤りです。",ref:"教則 第6章 6.1.4 ハザードとリスク"},
  {cat:4,lvl:"common",q:"回転翼航空機（マルチローター）の特徴について、適切ではないものを１つ選べ。",o:["地面効果範囲内の飛行時間はできるだけ長くする。","フライトコントロールシステムにより安定した飛行ができる。","複数のローターを回転させることにより揚力を得て垂直上昇する。","各ローターの回転数を制御することにより、機体の姿勢や移動方向を制御する。"],a:0,e:"マルチローターは、複数のローターを機体の周りに備え、それを回して揚力を得て垂直に上昇します。各ローターの回転数を制御することで機体の姿勢や進む方向を変え、フライトコントロールシステムのはたらきで安定した飛行ができます。ここまでは正しい説明です。\n誤りは「地面効果範囲内の飛行時間はできるだけ長くする」という部分で、正しくは地面効果の範囲内を飛ぶ時間はできるだけ短くすることが望ましいとされています。",ref:"教則 第6章 6.3.3 回転翼航空機（マルチローター）"},
  {cat:4,lvl:"common",q:"ダウンバーストについて、適切ではないものを１つ選べ。",o:["ダウンバーストは数１００mから１０kmまで広がることがある。","直径が４km程度以下の下降流はマイクロバーストと呼ばれ、範囲は小さいが下降流はダウンバーストより強烈なことがある。","ダウンバーストとは、積乱雲に発生する強烈な下降流が地表にぶつかり、水平方向にドーナツ状に渦を巻きながら四方に広がってゆく状態を指す。","ダウンバーストの広がりには、直径が4km程度の小さいものもあるが、発生時間が1日以上と長く、小さいため観測網でも検知されない。"],a:3,e:"ダウンバーストは、積乱雲や積雲の中で生じた強烈な下降流が地表にぶつかり、水平方向にドーナツ状の渦を巻きながら四方へ広がる現象です。広がりは数百mから10kmにもおよびます。\n・直径4km程度以下の下降流はマイクロバーストと呼ばれ、範囲は小さいものの、下降流はダウンバーストより強烈なことがあります\n・発生時間は数分から10分程度のものが多く、通常の観測網では探知されない局地的な現象です\nしたがって「発生時間が1日以上と長い」という記述が誤りです。",ref:"教則 第6章 6.2.2 ダウンバースト"},
  {cat:4,lvl:"common",q:"目視外飛行の運航で求められる無人航空機の要件について、最も適切なものを１つ選べ。",o:["補助者を配置する場合、機体に設置したカメラ等により機体の外の様子が監視できる必要はない。","補助者を配置しない場合、立入管理区画の有無に関わらず、第三者に危害を加えないことを製造事業者等が証明した機能を有することは必要である。","自動操縦システムを装備していない機体であっても、カメラ映像を常時監視していれば目視外飛行を行うことができる。","補助者の有無に関わらず、電波断絶時、離陸地点まで自動的に戻る機能や空中で位置を維持する機能を有していることは必要である。"],a:3,e:"目視外飛行（＝機体を直接見ないで飛ばすこと）では、使う機体に要件があります。補助者がいるかどうかに関係なく、\n・自動操縦システムを装備していること\n・電波が途切れたときに自動で離陸地点まで戻る機能や、空中で位置を保つ機能があること\n・機体に付けたカメラなどで機体の外の様子を監視できること\nが求められます。カメラ映像を見ているだけでは足りません。\n補助者を置かない場合は要件がさらに追加され、第三者に危害を加えないことを製造事業者などが証明した機能が必要になりますが、その代わりの措置として立入管理区画（＝人が入らないよう管理する区画）を設定することもできます。そのため「立入管理区画の有無に関わらず必要」とはいえません。",ref:"教則 第6章 6.4.2 目視外飛行"},
  {cat:4,lvl:"common",q:"飛行機の運航の特徴について、適切ではないものを１つ選べ。",o:["離着陸は向かい風となる方向に行うことが基本である。","回転翼航空機と比べて、飛行中の最小旋回半径が大きくなることが特徴である。","着陸は失速しないように速度を上げて行う。","上空待機を行う場合はサークルを描くように旋回飛行を行う。"],a:2,e:"飛行機の着陸は、失速しない程度まで速度を「下げて」行います。速度を上げて着陸するわけではないので、この記述が誤りです。\nほかは正しい説明です。\n・離着陸は向かい風になる方向へ行うのが基本です\n・上空で待機するときはサークルを描くように旋回します\n・回転翼航空機はその場で水平に向きを変えられますが、飛行機はできないため、最小旋回半径が大きくなります",ref:"教則 第6章 6.3.1 飛行機"},
  {cat:4,lvl:"common",q:"大型機（最大離陸重量 25kg 以上）の運航の特徴について、適切ではないものを１つ選べ。",o:["一般に小型の機体よりも騒音が大きくなるため、飛行経路の周囲への配慮が必要である。","緊急着陸地点の選定も小型機よりは広い範囲が要求される。","大型機の慣性力は大きく、増減速や昇降に時間と距離が必要で、障害物回避に注意が必要である。","大型機の運航では、性能が高いため、操縦者の運航への習熟度は必要ではない。"],a:3,e:"大型機（最大離陸重量25kg以上）は慣性力が大きいため、加速・減速・上昇・降下に必要な時間と距離が長くなり、障害物を避けるときに特に注意が必要です。\n・緊急着陸地点は小型機より広い範囲が求められます\n・一般に小型の機体より騒音が大きいので、飛行経路の周囲への配慮が必要です\n・操縦者には運航への十分な習熟度と高い安全運航意識が求められます\nつまり「性能が高いので習熟度は必要ない」という記述が誤りです。",ref:"教則 第6章 6.3.4 大型機（最大離陸重量25kg以上）"},
  {cat:4,lvl:"common",q:"無人航空機の飛行経路設定について、正しいものを１つ選べ。",o:["目視限界域の飛行では、機体と障害物との距離差が曖昧になりやすいため、事前に飛行経路付近の障害物との距離を現地で確認しておくことが望ましい。","目視限界域の飛行では、機体と障害物との距離差が曖昧になりやすいが、補助者を配置すれば飛行経路付近の障害物との距離を事前に現地で確認する必要はない。","事前に現場を確認したうえで設定した飛行経路は、飛行前に周囲の状況が変化した場合であっても、当初の経路のまま変更せずに飛行することが望ましい。","飛行経路は、障害となる建物を避けられるよう設定すれば足り、鳥などの動く障害物からの妨害までは考慮する必要はない。"],a:0,e:"飛行経路は、飛ぶ高度と経路の両方について、障害となる建物や鳥などの妨害を避けられるように設定します。障害物の近くを飛ばざるを得ない経路のときは、機体の性能に応じて安全な距離を保つようにします。\n操縦者の目視が限界に近くなる飛行では、機体と障害物との距離の差が分かりにくくなるため、事前に現地で飛行経路付近の障害物との距離を確認しておくことが望ましいとされています。必要と判断したときは補助者を配置しますが、補助者を置けば現地確認を省いてよいわけではありません。また、事前に現場を確認して決めた経路でも、飛行前の周囲の状況によっては変更が必要になることがあります。",ref:"教則 第6章 6.1.3 経路設定"},
  {cat:4,lvl:"common",q:"気温が低い環境での運航リスクとして正しいものはどれか。",o:["低温ではバッテリー内部抵抗が減少し、利用可能容量が増加して飛行時間が長くなる","低温でバッテリー容量・電圧が低下し、飛行時間が短くなる","低温では空気密度が低下して揚力が得にくくなり、飛行時間が短くなる","低温では空気密度が増加して揚力が得やすくなるため、飛行時間は長くなる"],a:1,e:"気温が低いと、バッテリーの内部抵抗が増えるなどして、使える容量と電圧が下がります。その結果、飛行時間は想定より短くなります。「内部抵抗が減って容量が増える」という説明は逆なので誤りです。",ref:"教則 第6章 気象（気温）（p.73）"},
  {cat:4,lvl:"common",q:"海陸風の説明として正しいものはどれか。",o:["海と陸の気温差で生じ、日中は海から陸へ向かって吹く","海と陸の気温差で生じ、風向が入れ替わる朝夕には海風と陸風が重なって風が最も強くなる","海と陸の気温差が大きくなる夜間のみ発生し、日中は発生しない","日中は陸から海へ、夜間は海から陸へ吹く"],a:0,e:"海陸風は、海と陸の気温差によって起こる局地的な風です。\n・日中は陸のほうが暖まるため、海から陸へ向かう「海風」が吹きます\n・夜間は逆に、海へ向かう「陸風」が吹きます\n・海風と陸風が入れ替わるときは風がほとんど止み、朝凪・夕凪と呼ばれます\nしたがって、入れ替わりの時間に風が最も強くなるわけではなく、夜間だけ発生するものでもありません。日中と夜間の向きも、選択肢のように逆ではありません。",ref:"教則 第6章 6.2.2 気象（海陸風）（p.72）"},
  {cat:4,lvl:"common",q:"10種雲形のうち上層雲に分類される雲の組合せとして正しいものはどれか。",o:["巻雲・巻層雲・巻積雲","巻雲・巻層雲・高積雲","巻雲・高層雲・巻積雲","巻層雲・巻積雲・高層雲"],a:0,e:"10種雲形の分け方は次のとおりです。\n・上層雲：巻雲・巻層雲・巻積雲\n・中層雲：高層雲・乱層雲・高積雲\n・低層と発達する雲：積雲・積乱雲・層積雲・層雲\n高積雲や高層雲は中層雲なので、これらが混ざった組合せは上層雲の答えとして誤りです。",ref:"教則 第6章 6.2.2 気象（雲）（p.72）"},
  {cat:4,lvl:"common",q:"北半球における高気圧・低気圧周辺の風として正しいものはどれか。",o:["高気圧は時計回りに吹き出し、低気圧は反時計回りに吹き込む","高気圧は反時計回りに吹き出し、低気圧は時計回りに吹き込む","高気圧は時計回りに吹き込み、低気圧は反時計回りに吹き出す","高気圧は反時計回りに吹き込み、低気圧は時計回りに吹き出す"],a:0,e:"北半球では、高気圧からは時計回りに風が吹き出し（下降気流で晴れやすい）、低気圧へは反時計回りに風が吹き込みます（上昇気流で天気が崩れやすい）。回る向きと、吹き出す・吹き込むの組合せをセットで覚えます。",ref:"教則 第6章 6.2.2 気象（高気圧・低気圧）（p.72）"},
  {cat:4,lvl:"common",q:"ウインドシアの説明として正しいものはどれか。",o:["短い距離・時間で風向や風速が急に変化する現象で、姿勢を崩す要因となる","長い距離・時間をかけて風向や風速が緩やかに変化する現象で、姿勢への影響は小さい","海上や山岳部など地形の影響がある場所のみで発生し、平地の離着陸時には注意する必要はない","風速のみが急に変化する現象で、風向の変化はウインドシアには含まれない"],a:0,e:"ウインドシアは、短い距離・短い時間のうちに風向や風速が急に変わる現象です。風速だけでなく風向の変化も含みます。揚力が急に変わって機体の姿勢を崩しやすいため、特に離着陸時は注意が必要です。",ref:"教則 第6章 6.2.2 気象（ウインドシア）（p.72）"},
  {cat:4,lvl:"common",q:"前線の種類として正しい組合せはどれか。",o:["寒冷前線・温暖前線・停滞前線・閉塞前線","寒冷前線・温暖前線・停滞前線","寒冷前線・温暖前線・閉塞前線・梅雨前線","寒冷前線・温暖前線・停滞前線・秋雨前線"],a:0,e:"前線は、寒冷前線・温暖前線・停滞前線・閉塞前線の4種類です。梅雨前線や秋雨前線は停滞前線の一種で、独立した種類としては数えません。",ref:"教則 第6章 6.2.1 前線（p.69）"},
  {cat:4,lvl:"one",q:"〔一等〕目視外飛行におけるリスク軽減策と運航計画の立案について、最も適切なものを１つ選べ。",o:["補助者は飛行状況と気象状況の変化を監視し、操縦者へ助言を行う。","補助者を配置しない場合、飛行前に飛行させようとする経路及びその周囲についての現場確認は必要ない。","補助者は飛行開始時に状況を確認すればよく、飛行中の常時監視は不要である。","補助者を配置する場合、事故が発生したときのみ連絡が取れる体制であればよい。"],a:0,e:"目視外飛行でのリスク軽減策と運航計画では、補助者を置く場合、飛行の状況や周囲の気象の変化などを常に監視できる双眼鏡などを持った補助者を配置し、操縦者へ必要な助言を行います。飛行開始時に確認するだけでは足りません。\n・操縦者と補助者は常時連絡が取れることも求められます（事故が起きたときだけ連絡が取れればよい、ではありません）\n・補助者を置くかどうかに関わらず、飛行前に、飛ばそうとする経路とその周辺について、不測の事態が起きたときに適切な安全上の措置を取れる状態かどうか、現場確認を行うことが推奨されています",ref:"教則 第6章 6.4.2 目視外飛行〔一等〕（p.80）"},
  {cat:4,lvl:"one",q:"〔一等〕カテゴリーⅢ飛行のリスク管理に関する次の記述のうち、最も適切なものを１つ選べ。",o:["リスク評価については、「安全確保措置検討のための無人航空機の運航リスク評価ガイドライン」（公益財団法人福島イノベーション・コースト構想推進機構 福島ロボットテストフィールド発行）を活用することが推奨されている。","リスク評価については、「安全確保措置検討のための無人航空機の運航リスク評価ガイドライン」（国土交通省航空局発行）を活用することが推奨されている。","リスク評価については、飛行形態に関係なく一律のリスク評価手法と軽減策が適用され、特別なガイドラインは必要ない。","リスク評価は国土交通省航空局が実施するため、申請者自らがリスクの分析及び評価を行う必要はない。"],a:0,e:"カテゴリーⅢ飛行の運航管理は、飛行形態に応じたリスクの分析と評価をもとに行い、その結果に基づく軽減策を講じる必要があります。飛行形態に関係なく一律、というものではありません。\nこのリスク評価には「安全確保措置検討のための無人航空機の運航リスク評価ガイドライン」を活用することが推奨されています。発行元は公益財団法人福島イノベーション・コースト構想推進機構 福島ロボットテストフィールドで、国土交通省航空局ではありません。",ref:"教則 第6章 6.1.6 リスク評価ガイドライン〔一等〕（p.65）"},
  {cat:4,lvl:"one",q:"〔一等〕飛行機の飛行計画について、最も適切なものを１つ選べ。",o:["緊急着陸は垂直に降下して行うため、緊急着陸地点は狭い範囲のエリアで足りる。","高度に応じた風速と風向きを確認するサイトやアプリ等はないため、事実上、地上風速以外確認の方法がない。","着陸は失速しないように高速度で滑走路に確実に進入させる。","離着陸においては向かい風で行うため風向の予測と風向に適した滑走路の確保が必要となる。"],a:3,e:"飛行機の飛行計画では、気象・経路・緊急着陸地点の確保が重要です。離陸と着陸は向かい風で行うのが一般的なので、風向きを予測し、その風向きに合った滑走路を確保する必要があります。\n・緊急着陸は滑空して行うため、広い範囲のエリアが必要です（垂直に降りるわけではありません）\n・着陸は失速しない程度の低い速度で滑走路へ確実に進入させ、安全に接地させます（高速度ではありません）\n・地上の風速だけでなく上空の風の確認も重要で、高度に応じた風速や風向きを調べられるサイト等も存在します\nまた、飛行計画が正しく設定されているか複数の人でチェックする運航者の体制も重要です。",ref:"教則 第6章 6.3.1 飛行機（p.74）"},
  {cat:4,lvl:"one",q:"〔一等〕大型機の運航計画立案におけるリスク軽減策の留意点について、適切ではないものを１つ選べ。",o:["緊急着陸地点は、第三者の進入が少ない場所（河川敷、農地など）を選定する。","進行方向を変えるときは、時間的、距離的な余裕を考慮した飛行経路と速度を設定する。","大型機は機体の慣性力が大きいことから、飛行速度に応じた障害物回避に必要な時間や距離を事前に把握する。","離着陸地点及び飛行経路周辺の飛行騒音については、大型機であり仕方がないものとして対応の検討は不要である。"],a:3,e:"大型機は機体の慣性力が大きいため、進行方向を変えるときは時間的・距離的な余裕を考えた飛行経路と速度を設定することが重要です。飛行速度に応じて、障害物を避けるのに必要な時間や距離も事前に把握しておきます。緊急着陸地点は、第三者が入ってきにくい場所（河川敷、農地など）を選びます。\n飛行騒音についても、飛行経路の近隣エリアへ事前に説明・調整を行うことが留意すべき要素とされています。「大型機だから仕方がない」として対応を検討しないのは適切ではありません。",ref:"教則 第6章 6.3.4 大型機〔一等〕（p.78）"},
  {cat:4,lvl:"one",q:"〔一等〕カテゴリーⅢ飛行における緊急時対応手順について、適切ではないものを１つ選べ。",o:["緊急対応が求められた場合に備えて、予め対応手順を設定する。","緊急時の対応手順を設定し、速やかに当該対応が実施できるよう訓練を実施する必要がある。","機体が発火した際の消火方法について、予め検討しておく。","緊急連絡網の作成は、緊急対応手順の設定時に考慮する必要性は低い。"],a:3,e:"カテゴリーⅢ飛行では、リスクの分析と評価を行い、その結果に基づく軽減策を講じる必要があります。緊急対応が必要になったときに備えて、あらかじめ対応手順を決めておき、すぐに実施できるよう訓練することが求められます。\nそのときに考えておく項目には、次のようなものがあります。\n・GNSSによる位置の安定機能を使わない飛行訓練\n・機体の寸法に応じた緊急着陸地点の確保\n・フェールセーフ機能が働かない飛行距離などの把握\n・墜落時の安全の優先順位をはっきりさせること\n・機体が発火したときの消火方法\n・緊急連絡網の作成\n緊急連絡網もこの中に含まれるため、「考慮する必要性は低い」という記述が誤りです。",ref:"教則 第6章 6.1.2 カテゴリーⅢ飛行において追加となる安全確保〔一等〕（p.64）"},
  {cat:4,lvl:"one",q:"〔一等〕カテゴリーⅢ飛行におけるリスク評価における「無人航空機の飛行マニュアルの作成・遵守」について最も適切なものを１つ選べ。",o:["飛行マニュアルは作成して提出すれば足り、飛行時にその内容を遵守することまでは求められない。","飛行形態に応じてリスクの分析及び評価を行い、その結果を記載するが、リスク軽減策の内容までは求められない。","飛行形態に応じたリスク分析及び評価は航空局が行い、その結果に基づき、リスク軽減策の内容を記載することが求められる。","飛行形態に応じてリスクの分析及び評価を行い、その結果に基づくリスク軽減策の内容を記載することが求められる。"],a:3,e:"適切な運航管理の体制を保つため、飛行形態（どのような飛ばし方をするか）に応じてリスクの分析と評価を行い、その結果に基づくリスク軽減策の内容などを書いた飛行マニュアルを作り、それを守ることが求められます。\n・軽減策の内容まで書く必要があります（評価結果を書くだけでは足りません）\n・作って提出するだけでなく、飛行時に内容を守るところまでが求められます\n・リスクの分析と評価は主に申請者側が行います（航空局が代わりに行うわけではありません）",ref:"教則 第6章 6.1.2 カテゴリーⅢ飛行において追加となる安全確保〔一等〕（p.64）"},
  {cat:4,lvl:"one",q:"〔一等〕カテゴリーⅢ飛行における自動操縦に関する注意点について、最も適切なものを１つ選べ。",o:["野生動物からの妨害に対する防御策は、実際に妨害を受けた時点で検討する。","自動操縦中の飛行状況の監視は、機体が設定経路を逸脱した場合にのみ行う。","手動操縦への切り替えを速やかに行える体制を整えておく。","緊急着陸地点や不時着エリアは、飛行経路からの逸脱が生じた時点で操縦者が判断して設定する。"],a:2,e:"カテゴリーⅢ飛行（第三者の上空を飛ばす飛行）で自動操縦を使うときは、次のことをあらかじめ準備しておきます。\n・飛行経路の設定\n・緊急着陸地点や不時着エリアの選定\n・野生動物からの妨害に対する防御策\n・手動操縦へすぐ切り替えられる体制の整備\nどれも安全に飛ばすための大事なポイントで、「前もって」用意しておくものです。だから、妨害を受けてから防御策を考える、経路を外れてから緊急着陸地点を決める、といった後回しの対応は適切ではありません。",ref:"教則 第6章 6.1.2 カテゴリーⅢ飛行において追加となる安全確保〔一等〕（p.64）"},
  {cat:4,lvl:"one",q:"〔一等〕以下の選択肢から、リスク評価の基本的なコンセプトについて適切ではないものを1つ選べ。",o:["機体や外部システムの異常等の影響で想定飛行空間を外れて飛行してしまうことに備える空間として「想定外飛行空間」を設定する。","想定飛行空間を「オペレーション空間」という。","「想定飛行空間」は、飛行目的、システムの性能、環境に応じて設定される飛行範囲である。","「オペレーション空間」は、想定飛行空間と想定外飛行空間を合わせた空間である。"],a:1,e:"リスク評価では、飛ぶ空間を2つに分けて考えます。\n・想定飛行空間：飛行目的、システムの性能、環境に応じて決めた、飛ばす予定の範囲\n・想定外飛行空間：機体や外部システムの異常などで想定飛行空間を外れて飛んでしまうことに備えて設定する空間\nこの2つを合わせた空間が「オペレーション空間」です。想定飛行空間だけを指す言葉ではないので、この選択肢が誤りです。",ref:"教則 第6章 6.1.6 リスク評価ガイドライン〔一等〕（p.65）"},
  {cat:4,lvl:"one",q:"〔一等〕目視外飛行におけるリスク軽減の検討要素について、以下のうち最も適切なものを１つ選べ。",o:["立入管理区画に道路、鉄道、家屋等、第三者が存在する可能性を排除できない場所が含まれる場合には、飛行計画を取りやめることが推奨される。","補助者を配置しない場合、緊急時の対応と緊急着陸地点は、飛行中に状況に応じて決定してよい。","補助者を配置しない場合、飛行経路直下やその周辺の状況の確認は、飛行開始前に行っておけば飛行中は不要である。","補助者を配置する場合、補助者にも機体の特性を理解させておく。"],a:3,e:"目視外飛行でリスクを減らすときの考え方です。\n・補助者を置く場合は、補助者にも機体の特性を理解してもらう必要があります\n・補助者がいる場合もいない場合も、緊急時の対応と緊急着陸地点はあらかじめ決めておくことが望まれます（飛行中に状況を見て決める、では遅すぎます）\n・立入管理区画に道路、鉄道、家屋など、第三者がいる可能性を消しきれない場所が含まれるときは、まず第三者の立入りを制限する方法を追加で講じます。それでも安全が確保できないときに、飛行計画の中止などを検討します\n最初から取りやめを推奨しているわけではないので、その選択肢は適切ではありません。",ref:"教則 第6章 6.4.2 目視外飛行〔一等〕（p.80）"},
  {cat:4,lvl:"one",q:"〔一等〕飛行機のリスク軽減策に関連した運航計画の要素について、最も適切なものを１つ選べ。",o:["緊急着陸地点は、飛行中断の可能性がある場合のみ事前に選定する必要がある。","離陸及び着陸地点は、取扱説明書等に推奨距離が記載されていない場合は、操縦者及び補助者と20m以上離れることが推奨されている。","離陸後は高度を上げるため、取扱説明書等で指定された上昇角度以上の角度をとることが推奨されている。","旋回は、取扱説明書等で指定された旋回半径より小さい半径で行うことが推奨されている。"],a:1,e:"飛行機（固定翼）の運航計画では、リスクを減らす工夫が大切です。\n・離着陸地点は、操縦者や補助者から20m以上離すことが推奨されます。取扱説明書などに推奨距離が書かれている場合は、その指示に従います\n・飛行中は、取扱説明書などで指定された上昇角度、旋回半径、速度などを守ります。指定より大きい上昇角度や、指定より小さい旋回半径で飛ばすのは誤りです\n・飛行の中断はいつでも起こりうるものと考えて、緊急着陸地点を事前に選んでおきます。中断の可能性があるときだけ選べばよい、というものではありません",ref:"教則 第6章 6.3.1 飛行機（p.74）"},
  {cat:4,lvl:"one",q:"〔一等〕カテゴリーⅢ飛行における経路設定について、適切ではないものを１つ選べ。",o:["ジオフェンス機能の設定において、当日の他の航空機との空域調整結果が反映されていることを確認する。","第三者の立入りが多い場所を通る経路は、可能な限り飛行経路として設定しない。","経路設定に必要となる機体の機能や安全対策は、事前の検証を省略しない。","飛行経路付近に緊急着陸地点や不時着エリアを予め設定する必要はない。"],a:3,e:"カテゴリーⅢ飛行では、飛び方に応じてリスクを分析・評価し、その結果に基づいて対策をとります。経路設定の具体的な対策は次のとおりです。\n・第三者の立入りが少ない経路を、できる限り選ぶ\n・飛行経路の近くに、緊急着陸地点や不時着エリアをあらかじめ設定する\n・経路から外れないように、ジオフェンス機能（決めたエリアから出ないようにする機能）を設定する\nこれらに必要な機体の機能や安全対策は、事前に検証しておく必要があります。またジオフェンス機能を設定するときは、その日の他の航空機との空域調整の結果が反映されているかを確認します。したがって「緊急着陸地点や不時着エリアを予め設定する必要はない」が誤りです。",ref:"教則 第6章 6.1.3 経路設定〔一等〕（p.64）"},
  {cat:4,lvl:"one",q:"〔一等〕回転翼航空機（マルチローター）におけるリスク軽減策を踏まえた運航計画の立案の際の留意要素について、最も適切なものを１つ選べ。",o:["離陸地点は操縦者及び補助者との距離を3m以上保つか、機体の取扱説明書に推奨距離が記載されている場合はその指示に従う。","飛行中断に備えた緊急着陸地点は、飛行経路から十分に離れた場所に選定する。","離陸地点は操縦者及び補助者との距離を1m以上保つか、機体の取扱説明書に推奨距離が記載されている場合はその指示に従う。","飛行経路での最高飛行高度の設定は、飛行中に状況を判断してから行う。"],a:0,e:"マルチローターでは、離陸地点と操縦者・補助者との距離を3m以上とるようにします。機体の取扱説明書に推奨距離が書かれている場合は、その指示に従います。1m以上ではありません。\nまた、飛行を中断することになった場合に備えて、緊急着陸地点は飛行経路上またはその近くに事前に選んでおくことが重要です（経路から十分に離れた場所、ではありません）。飛行経路での最高飛行高度も、飛行中ではなく飛行前に決めます。",ref:"教則 第6章 6.3.3 回転翼航空機（マルチローター）（p.77）"},
  {cat:4,lvl:"one",q:"〔一等〕回転翼航空機（ヘリコプター）の運航計画立案に関する注意点について、適切ではないものを１つ選べ。",o:["離着陸地点は取扱説明書に推奨距離が記載されていない場合は、操縦者及び補助者と20m以上離れることが推奨される。","離陸後はゆっくりと地面効果内に留まり、機体状況を確認する。","離陸及び着陸地点は周囲の物件から30ｍ以上離すことができる場所を選定する。","機体を上昇させる場合は、取扱説明書等で指定された上昇率以内で飛行させる。"],a:1,e:"ヘリコプターでは、離陸後は速やかに地面効果の外まで上昇し、機体の状態確認も地面効果の外で行います。地面効果の中にゆっくり留まって確認するのは誤りです。\nそのほかの注意点は次のとおりです。\n・離陸及び着陸地点は、周囲の物件から30m以上離せる場所を選ぶ。距離が確保できないときは、補助者を置くなどの安全対策をとる\n・取扱説明書に推奨距離の記載がない場合、離着陸地点は操縦者や補助者から20m以上離すことが推奨される\n・上昇させるときは、取扱説明書などで指定された上昇率以内で飛ばす\n・オートローテーション機能を積んだ機体を使うときは、その機能が働く条件を運航の計画に入れておく",ref:"教則 第6章 6.3.2 回転翼航空機（ヘリコプター）〔一等〕（p.75）"},
  {cat:4,lvl:"one",q:"〔一等〕カテゴリーⅢ飛行の離着陸に関する注意点として、最も適切なものを１つ選べ。",o:["離着陸エリア上空周辺に電線などの障害物がない、又は回避できる空域を選ぶ。","離着陸時にローターから発せられる風で周囲の物が飛ばされるおそれは、離着陸エリアの選定にあたり考慮しなくてよい。","離着陸エリアは、地面効果を抑制するため、壁面や構造物が存在することが望ましい。","カテゴリーⅢ飛行は第三者上空の飛行を前提とするため、離着陸エリアは第三者の直上となる場所を選んでもよい。"],a:0,e:"カテゴリーⅢ飛行の離着陸は、近くに第三者がいる可能性が高いため、第三者の安全がより損なわれないようにすることが大切です。\n・離着陸エリアの上空やその周辺に、電線などの障害物がない、または避けられる空域を選ぶことが推奨されます\n・離着陸時にローターの風で周囲の物が飛ばされることは避けるべきで、考えなくてよいものではありません\n・近くの壁面や構造物のせいで機体が不安定になるような場所は、離着陸エリアから外す必要があります。壁や構造物があるほうが望ましい、ではありません\nこうした考え方からすると、第三者の真上を離着陸エリアに選んでよいことにもなりません。",ref:"教則 第6章 カテゴリーⅢ飛行の飛行形態に応じたリスク評価（離着陸）"},
  {cat:4,lvl:"one",q:"〔一等〕回転翼航空機（マルチローター）の使用機体と飛行計画を元にしたリスク軽減策の検討要素について、最も適切なものを１つ選べ。",o:["離着陸時に機体と操縦者及び補助者との間に確保する距離は、1m以上を目安とする。","地面効果範囲内の飛行時間を延ばす。","自動帰還時の高度を着陸地点における必要最低限の高さに設定する。","緊急着陸地点の安全確保の方法を飛行前に検討する。"],a:3,e:"マルチローターでリスクを減らすために考えることとしては、離着陸時に機体と操縦者、補助者、周囲の物件との間に安全な距離を確保することや、地面効果の範囲内で飛ぶ時間を短くすることが挙げられます（時間を延ばすのは逆です）。\n緊急着陸地点をどうやって安全に確保するかは、飛行前に検討しておくことが重要です。飛行中に考えるような対応は、かえってリスクを大きくするおそれがあります。\nなお、自動帰還のときの高度は、障害物などを避けられる安全な高さに設定します。着陸地点で必要な最低限の高さ、ではありません。",ref:"教則 第6章 機体の種類に応じた運航リスクの評価（マルチローター）"},
  {cat:4,lvl:"one",q:"〔一等〕回転翼航空機（ヘリコプター）のリスク軽減策について、最も適切なものを１つ選べ。",o:["ボルテックス・リング・ステートを予防できる降下方法として、垂直降下をする。","緊急着陸地点の安全確保方法を飛行前に検討する。","地面効果範囲内での飛行時間をできる限り長くする。","離着陸時に操縦者及び補助者との間に確保する距離は、取扱説明書等に推奨距離の記載がない場合、3m以上を目安とする。"],a:1,e:"ヘリコプターでリスクを減らす方法です。\n・ボルテックス・リング・ステートを防げる降下の仕方を選ぶことが重要です。前進させながら降下するのが予防に有効で、垂直に降下するのは予防になりません\n・離陸及び着陸のときは、機体と操縦者、補助者、周囲の物件との間に必要な安全距離を確保する\n・地面効果の範囲内で飛ぶ時間は短くする（長くするのは逆です）\n緊急着陸地点をどうやって安全に確保するかは、飛行前に検討しておきます。",ref:"教則 第6章 機体の種類に応じた運航リスクの評価（ヘリコプター）"},
  {cat:4,lvl:"one",q:"〔一等〕カテゴリーⅢ飛行の飛行形態に応じたリスク評価において、適切な機体選定に関する注意点について、適切ではないものを１つ選べ。",o:["地上の第三者への被害を軽減させる対策として、セキュリティに考慮することは関係がない。","落下時にパラシュートが展開する機体を使用することは、地上の第三者への被害を軽減させる対策となる。","必要最低限の数より多くのプロペラ及びモーターを有する機体は、冗長性のある機体と言える。","衝撃エネルギーを軽減できる機能を有する機体を選定することは、地上の第三者への被害の可能性を低減する対策となる。"],a:0,e:"地上の第三者への被害の可能性を減らすには、冗長性を持つ機体や、衝撃エネルギーを減らせる機能を持つ機体を選びます。\n・必要最低限の数より多くのプロペラとモーターを持つ機体は、冗長性のある機体といえます\n・落下したときにパラシュートが開く機能を持つ機体も、被害を減らす対策になります\nさらに、コントロールを奪われることや、飛行経路の設定を書き換えられることを防ぐなど、セキュリティに配慮することも、地上の第三者への被害を減らす対策になります。したがって「セキュリティに考慮することは関係がない」は誤りです。",ref:"教則 第6章 カテゴリーⅢ飛行の飛行形態に応じたリスク評価（機体選定）"},
  {cat:4,lvl:"one",q:"〔一等〕「無人航空機の飛行に関する許可・承認の審査要領（カテゴリーⅢ飛行）」におけるリスクの分析及び評価において考慮すべき事項として、適切ではないものを１つ選べ。",o:["使用する無人航空機の情報","無人航空機を飛行させる者の技能証明及び訓練の内容","使用する無人航空機の価格","飛行経路における人との衝突リスク（地上リスク）及び航空機との衝突リスク（空中リスク）"],a:2,e:"「無人航空機の飛行に関する許可・承認の審査要領（カテゴリーⅢ飛行）」では、国の許可・承認を受けるための申請をするとき、飛び方に応じてリスクの分析と評価を行い、その結果を出すことが求められます。そこで考える事項は次のとおりです。\n・飛行の日時、飛行する空域とその地域、飛行させる者と運航体制、使用する無人航空機、飛行の目的、飛行の方法を含む運航計画\n・飛行経路での人との衝突リスク（地上リスク）と、航空機との衝突リスク（空中リスク）\n・電波環境（無線通信ネットワークを使って操縦する場合のみ）\n・使用条件等指定書で指定された使用の条件等、使用する無人航空機の情報\n・飛行させる者の無人航空機操縦者技能証明と訓練の内容\n・飛行させる者を補助する者などを含めた運航体制\n使用する無人航空機の価格は、この中に含まれていません。",ref:"教則 第6章 無人航空機の運航リスクの評価（許可・承認の審査要領 カテゴリーⅢ飛行）"},
  {cat:4,lvl:"one",q:"〔一等〕運航形態：高度２５０mの山の頂上から街の様子を撮影する。そのため、山から離れた際、高度１５０m以上になる可能性がある。\n昼間、目視外、１５０m以上の飛行であり、人口集中地区には該当せず、立入管理措置は講じないものとする。\n上記の運航形態において、最も適切なリスク対応を１つ選べ。",o:["上空は電波が届きにくいため、GNSSをOFFにして飛行させる。","航空機の接近を確認した場合は、上昇して回避することとする。","管制塔と情報を共有し、航空機の飛行情報を考慮して飛行計画を立てる。","CRMを活用し、安全を確保する。"],a:2,e:"150m以上の高さを飛ばす場合は、航空機とぶつからないようにすることが何より大事です。そのため、管制塔と情報を共有し、航空機の飛行情報をふまえて飛行計画を立てることが、事故防止のために重要になります。\n・CRMは、チームとしての安全管理の考え方や、コミュニケーションの技術を高める手法です。150m以上の飛行での事故防止という観点では、ここでの答えとして適切ではありません\n・GNSSをOFFにすることに特に意味はありません\n・航空機が近づいてきたときは、上昇ではなく、下降や着陸などで避けます",ref:"教則 第6章 6.1.6 リスク評価手法（空中リスク）（p.69）"},
  {cat:4,lvl:"one",q:"〔一等〕運航形態：高層ビル周辺にて、無人航空機による点検業務のため飛行させることとなった。\n飛行に関する許可申請は行っている。\n昼間、目視外、１５０m以下の飛行とする。\n上記の運航形態において、最も適切なリスク対応を１つ選べ。",o:["自動操縦設定にすることで、精密な飛行経路での飛行が可能となり、安全を確保できる。","ビル風は地上付近のみで発生するため、高度を上げて飛行すれば風の影響は考慮しなくてよい。","立入管理措置を講じ、飛行経路に補助者を配置する。","ビル風による影響を避けるため、風の影響を受けにくい25キロ以上の大型機を使用する。"],a:2,e:"高層ビルの周りでは、ほかの選択肢は次の理由で適切ではありません。\n・25キロ以上の大型機は小回りが利きにくく、周囲に障害物があるときはかえって安全の確保が難しくなります\n・高層ビルの付近はマルチパスの影響を受けやすいため、自動操縦には向きません\n・ビル風は高いところでも起き、風向きや風の強さが大きく乱れるので注意が必要です\n選択肢の中でいちばん安全な対策は、立入管理措置（第三者が飛行エリアに入らないようにする措置）を講じたうえで、飛行経路に補助者を置くことです。",ref:"教則 第6章 6.1.6 リスク軽減策〔一等〕（p.65）"},
  {cat:4,lvl:"one",q:"〔一等〕運航形態：マラソン大会において、赤外線カメラを搭載した無人航空機で走者を撮影し、熱中症予防に活用することとなった。当日は、昼間、目視外、１５０m以下の飛行とする。\n上記の運航形態において、最も適切なリスク対応を１つ選べ。",o:["ジオフェンス機能を設定しておく。","コース全体を見渡せる補助者を配置する。","観客のスマートフォンの電波干渉を避けるため、GNSSをOFFにして飛行させる。","万が一墜落することを想定し、墜落時のダメージ軽減のために、パラシュートを装備しておく。"],a:3,e:"万一墜落することを想定して、落ちたときのダメージを減らすためにパラシュートを装備しておくのが、この中では最も適切です。\n・ジオフェンス機能は仮想のフェンスで、決めたエリアから出ないようにするためのものです。マラソン大会のように広い範囲を飛ばす場合には使いにくいものです\n・補助者の配置も安全対策として必要ですが、人の上空を飛ばす状況が想定されるため、これだけでは不十分です\n・GNSSをOFFにしても、電波干渉への対策にはなりません",ref:"教則 第6章 6.3.3 回転翼航空機（マルチローター）（安全装備）（p.77）"},
  {cat:4,lvl:"one",q:"〔一等〕運航形態：無人航空機一等資格を取得している操縦者が、一等機体認証を受けた無人航空機（マルチローター）を使用し、人の住む山（人口集中地区ではない）を越えた町に、荷物を配送する。\nその飛行経路には、国道が走っており、その上空を横切ることは避けられない。\n昼間、目視外、１５０m以下の飛行であり立入管理措置は講じないものとする。\n上記の運航形態において、最も適切なリスク対応を１つ選べ。",o:["オートローテーション機能を理解し、飛行訓練を実施しておく。","山間部は電波が届きにくいため、GNSSをOFFにして飛行させる。","飛行経路内に第三者がいないことを確認する補助者を配置する。","自動帰還時の高度を障害物等が回避できる安全な高さに設定する。"],a:3,e:"今回は立入管理措置（第三者が飛行エリアに入らないようにする措置）を講じないため、飛行経路の中を見張る補助者は配置しない前提でリスクを考える必要があります。\n・オートローテーション機能はヘリコプターの機能で、マルチローターにはありません\n・GNSSをOFFにすることに特に意味はありません\n山を越える飛行になるので、自動帰還のときの高度を、障害物などを避けられる安全な高さに設定しておくことが、今回のリスク対応としてふさわしいといえます。",ref:"教則 第6章 6.4.2 目視外飛行〔一等〕（p.80）"},
  {cat:4,lvl:"one",q:"〔一等〕運航形態：山林において25キロ以上の大型機のマルチコプターを使用し、資材の運搬を行う。昼間、目視外、１５０m以下の飛行で立入管理措置は講じないものとする。\n上記の運航形態において、最も適切なリスク対応を１つ選べ。",o:["大型機は慣性力が小さいため、障害物の直前で急停止できるよう飛行計画を立てる。","オートローテーションができる機体を選定する。","着陸地点を含む飛行経路近隣エリアへの事前説明、調整を計画する。","ジオフェンス機能を設定しておく。"],a:2,e:"大型機は騒音が問題になることがあるため、着陸地点を含む飛行経路の近くのエリアに、事前の説明と調整を計画しておくことが必要です。\n・オートローテーション機能はヘリコプターが持っている場合があるもので、マルチコプターは持っていません\n・ジオフェンス機能は仮想のフェンスで、決めたエリアから出ないようにするためのものです。資材の運搬のように広い範囲を飛ばす場合は使い勝手がよくありません\n・大型機は慣性力が大きく、急に速度を上げ下げしたり止まったりするには時間と距離がかかります。慣性力が小さいわけではないので、障害物の直前で急停止する前提の計画は誤りです",ref:"教則 第6章 6.3.4 大型機〔一等〕（p.78）"},
  {cat:4,lvl:"one",q:"〔一等〕運航形態：飛行機を使用して農薬散布のための飛行を行う。\n昼間、目視内、１５０m以下で、補助者なしとする。\n上記の運航形態において、最も適切なリスク対応を１つ選べ。",o:["失速速度以下の速度で飛行させ、安全を確保する。","地面効果範囲内の時間は、安全のためなるべく長くする。","旋回させる時、取扱説明書で指定されたバンク角以上で飛行させる。","取扱説明書で指定された上昇角度以内で飛行させる。"],a:3,e:"飛行機（固定翼）は、取扱説明書で指定された上昇角度以内で飛ばすことが適切な対応です。\n・地面効果は回転翼航空機で起こる現象です\n・旋回するときは、取扱説明書で指定されたバンク角以内で飛ばす必要があります（以上、ではありません）\n・飛行機は失速速度以下では飛び続けられず、失速してしまいます",ref:"教則 第6章 6.3.1 飛行機（p.74）"},
  {cat:4,lvl:"one",q:"〔一等〕運航形態：夜間に山の畑の警備のため、無人航空機を飛行させる。飛行エリアは、畑の持ち主の畑のみで、夜間、目視内、１５０m以下、空港の近くでもなく、人口集中地区でもないものとする。\n上記の運航形態において、最も適切なリスク対応を１つ選べ。",o:["不具合が発生した際、フェールセーフ機能が作動するようにしておく。","周囲の明かりを確認しやすくするため、機体の灯火は消灯して飛行させる。","飛行高度の1/2と同じ半径内に第三者が存在しない状況でのみ飛行を実施する。","離着陸地点や、回避すべき障害物がある地点に照明を設置する。"],a:3,e:"夜間飛行という条件を考えると、離着陸地点や、避けるべき障害物がある地点に照明を設置することが、この中で最も適切です。\n・フェールセーフ機能は安全対策として有効ですが、特に目視外飛行の運航で重要になるものです\n・第三者がいてはいけない範囲は、単純に飛行高度の1/2の半径とはいえません\n・夜間は機体の姿勢や向きを把握するために灯火が必要で、消灯して飛ばすのは危険です",ref:"教則 第6章 6.4.1 夜間飛行（p.79）"},
  {cat:4,lvl:"one",q:"〔一等〕運航形態：海岸より海に向かって飛行させ、風景の撮影を行う。昼間、目視外、１５０m以下で、補助者なしとする。\n上記の運航形態において、最も適切なリスク対応を１つ選べ。",o:["航空機から視認しやすいよう灯火を装備する。","万が一墜落することを想定し、墜落時のダメージ軽減のために、パラシュートを装備しておく。","海の上空は電波が届きにくいため、GNSSをOFFにして飛行させる。","海上には障害物がないため、フェールセーフ機能の設定は解除して飛行させる。"],a:0,e:"補助者を置かない目視外飛行では、航空機から見つけてもらいやすくするため、灯火の装備が求められています。\n・パラシュートは、今回のように海の上空を飛ぶケースでは、安全対策という観点からは重要度が低くなります\n・海の上空でGNSSをOFFにすることも、あまり関係がありません\n・フェールセーフ機能を解除すると、電波が途切れたときなどのリスクがかえって高まるため不適切です",ref:"教則 第6章 6.4.2 目視外飛行〔一等〕（p.80）"},
  {cat:4,lvl:"one",q:"〔一等〕運航形態：ある挙式の撮影依頼を受け、屋外チャペルでの挙式撮影を行うことになった。\n当日は、参列者も多く参加予定をしており、その上空飛行も予定している。\n昼間、目視内、１５０m以下の飛行であり、立入管理措置は講じないものとする。\n上記の運航形態において、最も適切なリスク対応を１つ選べ。",o:["長時間撮影ができるようにエンジン駆動の無人航空機を使用する。","参列者の上空を飛行する時間を短くするため、最大速度で飛行させる。","自動飛行の設定を行うことで、より正確な飛行が可能となり、より安全な状況で行うことができる。","万が一墜落することを想定し、墜落時のダメージ軽減のために、パラシュートを装備しておく。"],a:3,e:"参列者の上空を飛ばすので、第三者（＝飛行に関わっていない人）の上を飛ぶことが想定される場面です。そのため、万が一落ちたときのダメージを小さくできるパラシュートの装備が有効です。\n・エンジンで動く機体を選ぶことは、安全を確保するうえでは重要ではありません\n・自動飛行も、挙式の撮影という目的から考えると特に有効とはいえません\n・最大速度で飛ばすと、ぶつかったときの運動エネルギーが大きくなり、かえって危険です",ref:"教則 第6章 6.1.2 カテゴリーⅢ飛行において追加となる安全確保〔一等〕（p.64）"},
  {cat:4,lvl:"one",q:"〔一等〕運航形態：回転翼航空機（マルチコプター）で屋外イベントの撮影をする。\n目視外、昼間、高度１５０m以下での飛行であり、立入管理措置は講じる。\n上記の運航形態において、最も適切なリスク対応を１つ選べ。",o:["機体を軽量化するため、プロペラガードを外して飛行させる。","イベント参加者のスマホの電波影響を考え、GNSSをOFFにして飛行させる。","イベント中は緊急着陸がしにくいと考えられるので、いつもよりバッテリーを多く用意しておく。","飛行速度と風速の和が７ｍ／ｓ以上の状態では飛行させない。"],a:3,e:"催し場所の上空を飛ばすときは、接触したときの被害を小さくするためプロペラガードを付けることが求められています。軽量化のために外すのは不適切です。\n・GNSSをOFFにしても、電波の影響を受けたときの対策としては不十分です\n・バッテリーを多く用意することも、特別なリスク対応にはなりません\n一方、「飛行速度と風速の和が７ｍ／ｓ以上の状態では飛行させない」ことは、飛行マニュアルでも求められている内容です。",ref:"教則 第6章 6.1.5 無人航空機の運航リスクの評価（p.65）"},
  {cat:4,lvl:"one",q:"〔一等〕回転翼航空機（ヘリコプター）のオートローテーション機構の説明として正しいものはどれか。",o:["動力が停止しても軟着陸を可能にする機構である","動力が停止した際にエンジンを自動で再始動させる機構である","動力が停止した際に自動で離陸地点へ帰還する機構である","どの高度・速度からでも操作なしで自動的に軟着陸できる機構である"],a:0,e:"オートローテーション機構が付いていれば、動力が止まっても軟着陸ができます。ただし、この状態に入るには必要な操作があり、入れる飛行高度の範囲と速度の範囲も決まっています。どの高度・速度からでも操作なしで軟着陸できるわけではありません。",ref:"教則 第6章 6.3.2 回転翼航空機（ヘリコプター）〔一等〕（p.75）"},
  {cat:4,lvl:"one",q:"〔一等〕安全確保措置のロバスト性の評価として正しいものはどれか。",o:["安全性の水準と保証の水準の低い方に準じて評価する","安全性の水準のみで評価し、保証の水準は勘案しない","安全性の水準と保証の水準の高い方に準じて評価する","保証の水準のみで評価し、安全性の水準は勘案しない"],a:0,e:"ロバスト性は、次の2つを両方みて、低い方に合わせて評価します。\n・安全性の水準（どれだけ安全性が増すか）\n・保証の水準（それをどうやって証明するか）\n水準は低・中・高の3段階です。どちらか片方だけで決めたり、高い方に合わせたりはしません。",ref:"教則 第6章 6.1.6 ロバスト性（p.68）"},
];
// ---- 計算〔一等〕（27問） ----
const Q_CALC = [
  {cat:5,lvl:"one",calc:"水平到達距離",q:"高度70mを水平飛行する飛行速度10m/sのドローンが、揚力を失い、落下を始めるとき、地上に落下するまでの水平距離を求めよ。重力加速度は9.8m/s²とする。また空気抵抗は無視する。",fml:"x = V × √(2h ÷ g)",o:["約26.7m","約142.9m","約37.8m","約18.9m"],a:2,e:"揚力を失って落ち始めてから地面に着くまでに、どれだけ横に進むかを求めます。使う公式は水平到達距離の x = v√(2h÷g) です。\nx = 10×√((2×70)÷9.8) = 10×√14.29 ≒ 約37.8m となります。",ref:"公式集 水平到達距離 x=v√(2h/g)"},
  {cat:5,lvl:"one",calc:"旋回半径",q:"旋回半径が290m、速度が30m/sのときのバンク角として最も適切なものを１つ選べ。\nなお重力加速度は9.8m/s²、tan10°は0.18、tan17°は0.32、tan20°は0.36とする。",fml:"r = V² ÷ (g × tanφ)",o:["10°","17°","20°","25°"],a:1,e:"旋回半径の公式 r = V²÷(g×tanφ) にあてはめると、290 = 30²÷(9.8×tanφ) となります。\ntanφ について解くと、tanφ = 900÷(9.8×290) ≒ 0.317 です。\n問題文で tan17°＝0.32 と示されているので、バンク角は17°が最も適切です。",ref:"公式集 旋回半径 r=V²/(g×tanφ)"},
  {cat:5,lvl:"one",calc:"推力",q:"回転角速度を1.3倍にしたとき、ドローンの推力は何倍になるか。空気密度は一定とする。適切なものを１つ選べ。",fml:"T ∝ ρ × ω²",o:["1.14倍","1.3倍","1.69倍","2.6倍"],a:2,e:"推力は空気密度に比例し、回転角速度の2乗に比例します。空気密度は一定なので、回転角速度が1.3倍になると、推力は 1.3² = 1.69倍 になります。",ref:"公式集 推力 T∝ρω²"},
  {cat:5,lvl:"one",calc:"揚力",q:"A高度で飛行していた飛行機は、現在B高度で飛行している。\nB高度の空気密度は、A高度の0.9倍である。\nA高度で水平定常飛行を行っていたときの飛行機の速度が40km/hとするとき、「①B高度で水平定常飛行を行うときの速度」と「②A高度とB高度の比較について」として最も適切なものを１つ選べ。",fml:"W = L ∝ ρ × V²",o:["①42.2km/h　②A高度はB高度よりも高い","①42.2km/h　②A高度はB高度よりも低い","①44.4km/h　②A高度はB高度よりも高い","①37.9km/h　②A高度はB高度よりも低い"],a:1,e:"水平定常飛行では、揚力と機体の重さが釣り合っています。揚力は空気密度に比例し、速度の2乗に比例します。\n①空気密度が0.9倍のB高度で同じ揚力を出すには、1 = 0.9×(速度の倍率)² より、速度を 1÷√0.9 ≒ 1.054倍にする必要があります。40km/h×1.054 ≒ 約42.2km/h です。\n②空気密度は高度が上がるほど小さくなります。空気密度が大きいA高度は、B高度よりも低いといえます。",ref:"公式集 揚力 W=L∝ρV²"},
  {cat:5,lvl:"one",calc:"水平到達距離",q:"地上に落下するまでの水平到達距離が最も短い場合を選択せよ。重力加速度は9.8m/s²とする。また空気抵抗は無視する。",fml:"x = V × √(2h ÷ g)",o:["高度85mを水平飛行する飛行速度12m/sのドローンが、揚力を失い、落下を始めるとき","高度50mを水平飛行する飛行速度20m/sのドローンが、揚力を失い、落下を始めるとき","高度120mを水平飛行する飛行速度8m/sのドローンが、揚力を失い、落下を始めるとき","高度170mを水平飛行する飛行速度5m/sのドローンが、揚力を失い、落下を始めるとき"],a:3,e:"水平到達距離の公式 x = v√(2h÷g) で、4つを計算して比べます。\n・高度85m・12m/s：12×√((2×85)÷9.8) ≒ 50.0m\n・高度50m・20m/s：20×√((2×50)÷9.8) ≒ 63.9m\n・高度170m・5m/s：5×√((2×170)÷9.8) ≒ 29.5m\n・高度120m・8m/s：8×√((2×120)÷9.8) ≒ 39.6m\nいちばん短いのは、高度170m・飛行速度5m/sの場合です。",ref:"公式集 水平到達距離 x=v√(2h/g)"},
  {cat:5,lvl:"one",calc:"滑空角",q:"ある飛行機が揚抗比7で定常滑空飛行を行っている。このときの滑空角を求めよ。\ntan8°=0.143、tan10°=0.176、tan15°=0.268とする。",fml:"tanγ = 1 ÷ 揚抗比",o:["7°","15°","8°","10°"],a:2,e:"滑空角γは tanγ = 1÷揚抗比 で求めます。tanγ = 1÷7 ≒ 0.143 です。問題文で tan8°＝0.143 と示されているので、滑空角は8°が最も適切です。",ref:"公式集 滑空角 tanγ=1/揚抗比"},
  {cat:5,lvl:"one",calc:"揚力",q:"50km/hで水平定常飛行ができる飛行機(重量12kg)に3kgの荷物を載せた。この時の飛行機が水平定常飛行するのに必要な速度として、最も適切なものを１つ選べ。なお空気密度は一定とする。",fml:"W = L ∝ ρ × V²",o:["約78.1km/h","約62.5km/h","約44.7km/h","約55.9km/h"],a:3,e:"荷物を載せると重さが12kgから15kgになり、15÷12 = 1.25倍になります。水平定常飛行では揚力と重さが釣り合い、揚力は速度の2乗に比例するので、1.25 = (速度の倍率)² より、速度は√1.25倍必要です。\n50km/h×√1.25 ≒ 約55.9km/h となります。",ref:"公式集 揚力 W=L∝ρV²"},
  {cat:5,lvl:"one",calc:"水平到達距離",q:"最大高度70mで飛行する計画がある。万が一揚力を失い落下することを想定し、地上に落下するまでの水平到達距離を20mに抑えたい。このときドローンの最高速度は何m/sを限度にするべきか。重力加速度は9.8m/s²とし、空気抵抗は無視する。また風速も0とする。",fml:"x = V × √(2h ÷ g)",o:["約5.3m/s","約75.6m/s","約7.5m/s","約1.4m/s"],a:0,e:"水平到達距離の公式 x = v√(2h÷g) に、抑えたい距離20mと高度70mを入れます。\n20 = v×√((2×70)÷9.8) = v×約3.78\nvについて解くと v ≒ 5.29m/s です。最高速度を約5.3m/sまでに抑えれば、水平到達距離を20mに抑えられます（理論値）。",ref:"公式集 水平到達距離 x=v√(2h/g)"},
  {cat:5,lvl:"one",calc:"推力",q:"改造前の機体(1.3kg)に0.2kgのカメラを取り付けた。\n改造前のホバリング時の回転角速度が660rad/sのとき、カメラを取り付けた後のホバリング時の回転角速度として、最も適切なものを１つ選べ。空気密度は一定とする。",fml:"T ∝ ρ × ω²",o:["約614rad/s","約762rad/s","約879rad/s","約709rad/s"],a:3,e:"カメラを付けると機体の重さが1.3kgから1.5kgになるので、ホバリングに必要な推力も1.5/1.3倍になります。推力は回転角速度の2乗に比例するので、1.5/1.3 = (回転角速度の倍率)² より、回転角速度は√(1.5/1.3)倍必要です。\n660rad/s×√(1.5/1.3) ≒ 約709rad/s となります。",ref:"公式集 推力 T∝ρω²"},
  {cat:5,lvl:"one",calc:"揚力",q:"飛行機において、空気密度が1.1倍、速度が0.9倍になったとき、揚力は何倍になるか。",fml:"W = L ∝ ρ × V²",o:["約0.74倍","約0.89倍","約0.99倍","約1.09倍"],a:1,e:"揚力は空気密度に比例し、速度の2乗に比例します。1.1×0.9² = 1.1×0.81 = 0.891 なので、揚力は約0.89倍になります。",ref:"公式集 揚力 W=L∝ρV²"},
  {cat:5,lvl:"one",calc:"滑空距離",q:"揚抗比13である飛行機のエンジンを停止し、滑空飛行で980m先まで飛ばしたい。エンジンを停止するタイミングは高度何mのときか、最も適切なものを1つ選べ。",fml:"d = h × (L/D)",o:["約12,740m","約7.5m","約75.4m","約754m"],a:2,e:"滑空距離＝高度×揚抗比 です。980m＝高度×13 なので、高度＝980÷13≒75.4m となります。滑空距離から必要な高度を逆に求めるときは、高度＝滑空距離÷揚抗比 で計算します。",ref:"公式集 滑空距離 d=h×(L/D)"},
  {cat:5,lvl:"one",calc:"推力",q:"高度B地点は、高度A地点の空気密度の0.97倍である。A地点でドローンがホバリングする回転角速度の何倍で、B地点でこのドローンはホバリングできるか。最も適切なものを1つ選べ。",fml:"T ∝ ρ × ω²",o:["約1.02倍","約0.97倍","約1.03倍","約0.98倍"],a:0,e:"ホバリング中は 機体重量＝推力 です。推力は空気密度ρに比例し、回転角速度ωの2乗に比例します（T∝ρω²）。\n同じ推力を保つには 1＝0.97×ω² より ω＝√(1/0.97)≒1.02 です。回転角速度を約1.02倍にすれば、B地点でもホバリングできます。",ref:"公式集 推力 T∝ρω²"},
  {cat:5,lvl:"one",calc:"水平到達距離",q:"高度98mを水平飛行する飛行速度20m/sの無人航空機が、揚力を失い落下を始める場合、地上に墜落するまでの水平距離として最も適切なものを選べ。\n重力加速度は9.8m/s²とする。また空気抵抗は無視する。",fml:"x = V × √(2h ÷ g)",o:["約89.4m","約63.2m","約8.9m","約400m"],a:0,e:"公式 x=v√(2h/g) を使います。ルートの中は 2×高度÷重力加速度 です。\nx=20×√(2×98÷9.8)=20×√20≒20×4.47≒89.4m となります。",ref:"公式集 水平到達距離 x=v√(2h/g)"},
  {cat:5,lvl:"one",calc:"揚力",q:"水平定常飛行をしている飛行機の飛行速度が1.7倍になったとき、当該飛行機の揚力は何倍になるか。また当該機体の高度はどうなるか。空気密度は一定とする。",fml:"W = L ∝ ρ × V²",o:["揚力は約2.89倍になるが、高度は変わらない","揚力は約1.3倍になり、機体は上昇する","揚力は約1.7倍になり、機体は上昇する","揚力は約2.89倍になり、機体は上昇する"],a:3,e:"揚力は空気密度に比例し、飛行速度の2乗に比例します（L∝ρV²）。速度が1.7倍になると、揚力は1.7²=2.89倍になります。さらに、揚力が機体の重さを上回るので、機体は上昇します。",ref:"公式集 揚力 L∝ρV²"},
  {cat:5,lvl:"one",calc:"消費パワー",q:"回転角速度を1.3倍にしたとき、ドローンの消費パワーは何倍になるか。最も適切なものを1つ選べ。",fml:"P ∝ ρ × ω³",o:["約3.9倍","約1.7倍","約2.2倍","約1.3倍"],a:2,e:"消費パワーは回転角速度の3乗に比例します（P∝ρω³）。1.3³=2.197 なので、消費パワーは約2.2倍になります。",ref:"公式集 消費パワー P∝ρω³"},
  {cat:5,lvl:"one",calc:"波長",q:"2.4GHzの周波数の電波の波長として、適切なものを選べ。なお光速度は3×10⁸m/sとする。",fml:"λ = c ÷ f",o:["約0.125m","約1.25m","約0.0125m","約8m"],a:0,e:"波長λ＝光速÷周波数 です。周波数はHzに直して計算します（2.4GHz＝2.4×10⁹Hz）。\nλ=(3×10⁸)÷(2.4×10⁹)=0.125m（12.5cm）となります。",ref:"公式集 波長 λ=c/f"},
  {cat:5,lvl:"one",calc:"水平到達距離",q:"最高速度10m/sの無人航空機が、万が一揚力を失い落下することを想定し、地上に落下するまでの水平距離を30mに抑えたい。このとき高度は何mを限度にするべきか。重力加速度は9.8m/s²とし、空気抵抗は無視する。また風速も0とする。",fml:"x = V × √(2h ÷ g)",o:["約14.7m","約88.2m","約44.1m","約29.4m"],a:2,e:"落ちたときに横へ飛ぶ距離は、公式 x=v√(2h/g) で求めます（x=水平距離、v=速度、h=高度、g=重力加速度）。\n・30=10×√(2×高度÷9.8)\n・両辺を10で割ると 3=√(2×高度÷9.8)、2乗して 3²=2×高度÷9.8\n・高度=9×9.8÷2=44.1m\nつまり高度44.1m以下にすれば、水平に飛ぶ距離を30mに抑えられます（理論値）。",ref:"公式集 水平到達距離 x=v√(2h/g)"},
  {cat:5,lvl:"one",calc:"フレネルゾーン",q:"送受信アンテナ間の距離が50mで、アンテナ間の中心地点におけるフレネルゾーン半径として適切なものを選べ。使用周波数は2.4GHzである。また光速度は3×10⁸m/sとする。",fml:"R = √((λ × D1 × D2) ÷ D)",o:["約1.25m","約2.50m","約3.95m","約1.56m"],a:0,e:"まず電波の波長λを出します。\nλ＝光速÷周波数=(3×10⁸)÷(2.4×10⁹)=0.125m\n次にフレネルゾーン半径を R=√((λ×D1×D2)÷D) で出します。アンテナ間50mの中心なので D1=D2=25m です。\nR=√((0.125×25×25)÷50)=√1.5625=1.25m\n半径は中心地点（D1=D2）でいちばん大きくなります。",ref:"公式集 フレネルゾーン r=√((λ×D1×D2)/D)"},
  {cat:5,lvl:"one",calc:"推力",q:"回転角速度が480rad/sから520rad/sに変わり、空気密度が1.22kg/m³から1.18kg/m³に変わった。\nこのとき、ドローンの推力は何倍になるか。最も適切なものを1つ選べ。",fml:"T ∝ ρ × ω²",o:["約1.14倍","約1.05倍","約0.82倍","約1.21倍"],a:0,e:"推力は空気密度ρに比例し、回転角速度ωの2乗に比例します（T∝ρω²）。\n・空気密度は 1.18÷1.22 倍\n・回転角速度は 520÷480 倍で、推力にはその2乗が効く\n・(1.18÷1.22)×(520÷480)²≒0.967×1.174≒1.14\nよって推力は約1.14倍になります。",ref:"公式集 推力 T∝ρω²"},
  {cat:5,lvl:"one",calc:"揚力",q:"B高度はA高度の1.1倍の空気密度である。A高度において30km/hで水平定常飛行できる飛行機（重量7kg）がある。\nこの飛行機がB高度でプラス1kgの荷物を積んで飛行を行うとき、水平定常飛行できる速度として、最も適切なものを1つ選べ。",fml:"W = L ∝ ρ × V²",o:["約28.6km/h","約26.8km/h","約30.6km/h","約33.6km/h"],a:2,e:"まっすぐ水平に飛んでいるとき（水平定常飛行）は、機体の重さ＝揚力です。揚力は空気密度と速度の2乗に比例します（W=L∝ρV²）。\n・重さは 8÷7 倍（7kg＋荷物1kg）\n・空気密度は1.1倍\n・8/7=1.1×(V'/V)² より V'/V=√((8/7)÷1.1)≒1.02\n・30km/h×1.02≒約30.6km/h\n※この式は簡略化した近似である点に注意してください。",ref:"公式集 揚力 W=L∝ρV²"},
  {cat:5,lvl:"one",calc:"フレネルゾーン",q:"送受信アンテナ間の距離が1000mで、アンテナ間の中心地点におけるフレネルゾーン半径の60%の値として最も適切なものを１つ選べ。使用周波数は5.7GHzである。また光速度は3×10⁸m/sとする。",fml:"R = √((λ × D1 × D2) ÷ D)",o:["約2.18m","約3.63m","約1.54m","約7.89m"],a:0,e:"まず波長λを出します。\nλ＝光速÷周波数=(3×10⁸)÷(5.7×10⁹)≒0.0526m\n次にフレネルゾーン半径を R=√((λ×D1×D2)÷D) で出します。中心地点なので D1=D2=500m、D=1000m です。\nR=√((0.0526×500×500)÷1000)≒3.63m\n聞かれているのはこの60%なので、3.63×0.6≒2.18mが答えです（3.63mは60%をかける前の半径そのものの値です）。",ref:"公式集 フレネルゾーン R=√((λ×D1×D2)/D)"},
  {cat:5,lvl:"one",calc:"消費パワー",q:"総重量1.3kgのドローンがホバリングするときの消費パワーが110Wである。\nこのドローンの総重量が1.5kgになったとき、ホバリングするときの消費パワーとして、適切なものを１つ選べ。\n空気密度は一定とする。",fml:"P ∝ ρ × ω³",o:["約146W","約127W","約136W","約118W"],a:2,e:"重さが 1.5÷1.3 倍になると、浮かぶのに必要な推力も 1.5÷1.3 倍になります。\n・推力は回転角速度ωの2乗に比例するので、ωは√(1.5/1.3)倍\n・消費パワーはωの3乗に比例するので、(√(1.5/1.3))³≒1.24倍\n・110W×1.24≒136W\nよって約136Wです。",ref:"公式集 消費パワー P∝ρω³"},
  {cat:5,lvl:"one",calc:"滑空距離",q:"飛行機が滑空によって進むことのできる距離として最も長いものを１つ選べ。",fml:"d = h × (L/D)",o:["揚抗比が14で高度が89mの飛行機","揚抗比が9で高度が103mの飛行機","揚抗比が11で高度が95mの飛行機","揚抗比が13で高度が78mの飛行機"],a:0,e:"滑空で進める距離は「揚抗比×高度」で求めます。それぞれ計算すると、\n・揚抗比9×高度103m=927m\n・揚抗比11×高度95m=1045m\n・揚抗比13×高度78m=1014m\n・揚抗比14×高度89m=1246m\nいちばん長いのは、揚抗比14で高度89mの飛行機です。",ref:"公式集 滑空距離 滑空距離=揚抗比×高度"},
  {cat:5,lvl:"one",calc:"旋回半径",q:"旋回半径が210m、バンク角が11°のときの飛行速度として適切なものを１つ選べ。\nなお重力加速度は9.8m/s²、tan11°は0.19とする。",fml:"r = V² ÷ (g × tanφ)",o:["約45.4m/s","約19.8m/s","約10.6m/s","約104.1m/s"],a:1,e:"旋回半径の公式 r=V²÷(g×tanφ) に数字を当てはめます（r=旋回半径、V=速度、g=重力加速度、φ=バンク角）。\n・210=V²÷(9.8×0.19)\n・V²=210×9.8×0.19=391.02\n・V=√391.02≒19.8m/s",ref:"公式集 旋回半径 r=V²/(g·tanφ)"},
  {cat:5,lvl:"one",calc:"旋回半径",q:"飛行速度が15m/s、バンク角が13°の場合の旋回半径として適切なものを１つ選べ。\nなお重力加速度は9.8m/s²、tan13°は0.23とする。",fml:"r = V² ÷ (g × tanφ)",o:["約10.0m","約6.7m","約507.2m","約99.8m"],a:3,e:"旋回半径の公式 r=V²÷(g×tanφ) に数字を当てはめます。\nr=15²÷(9.8×0.23)=225÷2.254≒99.8m",ref:"公式集 旋回半径 r=V²/(g·tanφ)"},
  {cat:5,lvl:"one",calc:"消費パワー",q:"空気密度が0.95倍になったとき、ホバリングをするための消費パワーは何倍となるか。最も適切なものを１つ選べ。",fml:"P ∝ ρ × ω³",o:["約1.08倍","約0.95倍","約1.03倍","約1.11倍"],a:2,e:"ホバリング中は、必要な推力は変わりません。推力は 空気密度×ω² に比例するので、1=0.95×ω² となり、回転角速度ωは√(1/0.95)倍に上げる必要があります。\n消費パワーは 空気密度×ω³ に比例するので、0.95×(√(1/0.95))³=√(1/0.95)≒1.03倍。\nよって約1.03倍です。",ref:"公式集 消費パワー P∝ρω³"},
  {cat:5,lvl:"one",calc:"定常旋回飛行の揚力",q:"バンク角が15°の定常旋回飛行を行うためには、水平定常飛行の何倍の揚力が必要か。\ntan15°= 0.268、cos15°=0.966とする。",fml:"L = W ÷ cosφ",o:["約1.04倍","約1.27倍","約0.97倍","約3.73倍"],a:0,e:"旋回中に必要な揚力は「水平定常飛行の揚力(機体重量)÷cosφ」で求めます。\n水平定常飛行の揚力を1とすると、1÷cos15°=1÷0.966≒1.035。\nよって約1.04倍です。tan15°はこの計算では使いません。",ref:"公式集 定常旋回飛行の揚力 L=W/cosφ"},
];

// ---- v64: Excel追記分（規則6・システム2） ----
const Q_RULES2 = [
  {cat:1,lvl:"common",q:"航空法に基づく「空港等の周辺の空域」について、正しいものを１つ選べ。",o:["「空港等の周辺の空域」にヘリポートは含まれない。","「空港等の周辺の空域」に円錐表面の上空の空域は含まれない。","「空港等の周辺の空域」に水平表面の下の空域は含まれない。","「空港等の周辺の空域」に進入表面の下の空域は含まれない。"],a:2,e:"「空港等の周辺の空域」は、航空法で無人航空機の飛行が原則禁止されている空域で、空港やヘリポートなどの周りに設定されています（ヘリポートも含まれます）。\n禁止されるのは、次の各表面の「上空」です。\n・進入表面\n・転移表面\n・水平表面\n・延長進入表面\n・円錐表面\n・外側水平表面\n航空機の離着陸が頻繁に行われる空港では、これに加えて進入表面または転移表面の「下」の空域も飛行禁止になります。\nこの例外を除けば、各表面の下の空域の飛行は禁止されていません。だから「水平表面の下の空域は含まれない」が正しい説明になります。",ref:"教則 第3章 無人航空機の飛行禁止空域（空港等の周辺の空域）"},
  {cat:1,lvl:"common",q:"無人航空機と「人又は物件」の間の距離について適切ではないものを１つ選べ。",o:["「人又は物件」とは、第三者又は第三者の物件を指し、無人航空機を飛行させる者及びその関係者並びにその物件は該当しない。","「物件」とは、自動車やビル、土地や自然物（樹木、雑草等）を含む。","無人航空機と第三者の「人又は物件」との間には、原則として30ｍ以上の距離を保って飛行させなければならない。","「物件」から30ｍ以上の距離を保つことができない場合、それが関係者の所有する「物件(自動車や建物)」であれば、航空局の承認は不要である。"],a:1,e:"「人又は物件」とは、第三者と第三者の物件のことです。飛行させる人やその関係者、そして関係者の物件は当てはまりません。\n「物件」に当たるのは、中に人がいることが想定される機器や、建築物などある程度の大きさがある工作物です。\n・自動車やビル → 物件に当たる\n・土地や自然物（樹木、雑草など）→ 物件に当たらない\nしたがって、土地や自然物まで含めている記述が誤りです。",ref:"教則 第3章 無人航空機の飛行の方法（人又は物件との距離）"},
  {cat:1,lvl:"common",q:"「第三者上空の飛行」とはみなさない飛行について、適切ではないものを１つ選べ。",o:["レベル3.5飛行における一時的な二輪車上空の飛行","レベル3.5飛行の要件を満たした上での一時的な移動中の自動車上空の飛行","停車中の観光バスの上空","屋内にいる第三者の上空"],a:0,e:"飛行が終わるまでの間、第三者の状況と飛び方が次のどちらかに当てはまるときは、第三者の上空を飛んでいるとはみなされません。\n・第三者が遮蔽物に覆われていて、機体がぶつかっても守られる状況にあるとき（屋内にいる場合や、移動していない車両等の中にいる場合など）\n・第三者が移動中の車両等（ぶつかっても第三者が守られる状況にある場合に限る）の中にいて、必要な要件を満たしたうえでレベル3.5飛行として一時的にその上空を飛ぶとき\n二輪車は、ぶつかったときに乗っている人が守られません。そのため二輪車の上空を飛ぶことは、第三者上空の飛行に当たります。",ref:"教則 第3章 第三者及び第三者上空の定義（レベル3.5飛行）"},
  {cat:1,lvl:"common",q:"無人航空機の登録制度について、最も適切なものを１つ選べ。",o:["リモートID機器は、取り外しができないように機体に内蔵されている必要がある。","リモート ID 機能による識別情報は、１分に１回以上発信することとされている。","リモート ID 機能により発信される情報には、無人航空機の製造番号、登録記号、位置、速度、高度、時刻などの情報が含まれている。","登録制度は、事故発生時などにおける所有者把握を目的にしているため、リモート ID 機能により発信される情報には、所有者や使用者の情報も含まれている。"],a:2,e:"リモートID機能は、機体を見分けるための情報を電波で遠くへ発信する仕組みです。機器は技術規格書に沿って開発・製造され、機体に組み込む内蔵型と、後から取り付ける外付型があります（内蔵に限られません）。\n発信される情報は次のとおりです。\n・静的情報：製造番号、登録記号\n・動的情報：位置、速度、高度、時刻など\n所有者や使用者の情報は発信されません。また、発信は1秒に1回以上です（1分に1回ではありません）。",ref:"教則 第3章 無人航空機の登録制度（リモートID機能）"},
  {cat:1,lvl:"common",q:"無人航空機の操縦について、アルコール又は薬物の影響下で正常な飛行ができないおそれがある間に飛行することについて、正しいものを１つ選べ。",o:["アルコールとはアルコール飲料を指し、アルコールを含む食べ物については除かれる。","アルコールの影響は時間の経過とともに低減するため、飲酒後8時間が経過した場合は、飛行は禁止されない。","医薬品であっても正常な飛行ができないおそれがある場合は、飛行が禁止される。","体内のアルコール濃度が、道路交通法における酒気帯び運転の基準値未満の場合は、飛行は禁止されない。"],a:2,e:"アルコールや薬物の影響で正常な飛行ができないおそれがある間は、無人航空機を飛ばすことが禁止されています。\nここでいう「薬物」は、麻薬や覚醒剤などの規制薬物だけではなく、医薬品も含みます。ですから医薬品であっても、正常に飛ばせないおそれがあれば飛行できません。\nまた、アルコールが体に与える影響は、その人の体質やその日の体調で変わります。体内に残っているアルコールがごくわずかでも正常な飛行に影響するおそれがあり、航空法等にアルコール濃度による除外の決まりはありません。",ref:"教則 第3章 遵守事項（アルコール又は薬物の影響下の飛行禁止）"},
  {cat:1,lvl:"common",q:"無人航空機に関する事故が発生した場合の措置について、適切ではないものを１つ選べ。",o:["国土交通大臣に報告すべき事故には、関係者の所有する物件の破損も含まれる。","国土交通大臣に報告すべき事故には、操縦者自身の重傷も含まれる。","事故が発生した場合は、直ちに飛行を中止し、負傷者の救護など危険を防止するための措置を講じなければならない。","国土交通大臣に報告すべき事故には、第三者の所有する物件への軽微な損傷も含まれる。"],a:0,e:"国土交通大臣に報告しなければならない事故は、無人航空機による人の死傷または物件の損壊です。\n・人の死傷：操縦者・関係者・第三者を問わず、重傷以上が対象\n・物件の損壊：第三者の所有物が対象。傷の大きさや損害額を問わず、すべての損傷が対象\n関係者が持っている物件の破損は、報告すべき事故には当たりません。\nなお事故が起きたときは、直ちに飛行をやめ、けが人の救護など危険を防ぐための措置をとる必要があります。",ref:"教則 第3章 無人航空機の運航ルール（事故等の場合の措置）"},
];
const Q_SYSTEM2 = [
  {cat:2,lvl:"common",q:"フライトコントロールシステムとその構成デバイスについて、最も適切なものを１つ選べ。",o:["加速度センサは、風などで機体が傾いたときに、無人航空機の傾きや向きの変化を検出し、フライトコントロールシステムに情報を伝える。","地磁気センサは、地球の磁力を検出して、機体が向いている方向を測定するセンサーである。","気圧センサは、気圧の変化を検出して、機体の水平方向の位置を測定するセンサーである。","ジャイロセンサは３次元の慣性運動を検出する装置であり、無人航空機の速度の変化量を検出するセンサーである。"],a:1,e:"それぞれのセンサの役割は次のとおりです。\n・地磁気センサ：地球の磁力を検出して、機体が向いている方向を測る（これが正解）\n・ジャイロセンサ：1秒あたりに何度回ったか（回転角度の変化）を検出する装置。風などで機体が傾いたときに、傾きや向きの変化を捉える\n・加速度センサ：3次元の慣性運動（直交3軸方向の並進運動）を検出する装置で、速度の変化量を検出する\n・気圧センサ：気圧の変化から高度を測る（水平方向の位置ではありません）\nつまり他の選択肢は、ジャイロと加速度センサの説明が入れ替わっていたり、気圧センサを水平方向の位置測定としていたりする点が誤りです。",ref:"教則 第4章 無人航空機の主たる構成要素（フライトコントロールシステム）"},
  {cat:2,lvl:"common",q:"以下の無人航空機のモーターやローターに関する説明の中から、最も適切なものを１つ選べ。",o:["ブラシモーターは、モーター内部の清掃やブラシの交換が不要で、メンテナンスが容易である。","ブラシモーターはブラシの摩耗がないため、ブラシレスモーターに比べて耐久性に優れている。","ブラシレスモーターは、モーター内部の清掃、ブラシの交換が不要で、静音性や耐久性もある。","マルチローターにおいて、ローターは反時計回転（CCW：カウンタークロックワイズ）のみに合わせた形状となっている。"],a:2,e:"ブラシレスモーターは、名前のとおりブラシ（電気の接触部）がないモーターです。内部の清掃やブラシ交換が要らず整備が楽で、静かで長持ちします。\n反対にブラシモーターは、ブラシがすり減るため、清掃や交換などの整備が必要です。\nまたローターは、回転方向（時計回転＝CW／反時計回転＝CCW）に合わせた形になっており、モーターの回転方向に合わせて取り付ける必要があります。CCW用だけということはありません。",ref:"教則 第4章 無人航空機の主たる構成要素（モーター・ローター）"},
];

// ---- v66: カバレッジ監査ギャップ埋め（規則1・操縦者3・リスク7、3視点検証済み） ----
const Q_RULES3 = [
  {cat:1,lvl:"common",q:"航空法以外の法令等による無人航空機の飛行の制限について、最も適切なものを1つ選べ。",o:["航空法のほかにも、その他の法令等や地方公共団体が定める条例に基づき、無人航空機の利用方法が制限されたり、都市公園や施設の上空など特定の場所における飛行が制限されたりする場合がある。","その他の法令等や条例の一覧は国土交通省ホームページに掲載されているため、条例による飛行の制限に関する最新の情報についても、地方公共団体ではなく国土交通省に確認することとされている。","航空法に基づく飛行の許可・承認を受けた飛行については、都市公園や施設の上空など特定の場所であっても、その他の法令等や条例による飛行の制限を受けることはない。","無人航空機の飛行を制限する法令は航空法及び小型無人機等飛行禁止法に限られており、地方公共団体が定める条例により飛行が制限されることはない。"],a:0,e:"無人航空機の飛行を制限するのは航空法だけではありません。小型無人機等飛行禁止法や電波法のほか、その他の法令等や地方公共団体が定める条例によって、使い方が制限されたり、都市公園や施設の上空など特定の場所での飛行が制限されたりすることがあります。\nこうした法令等や条例の一覧は国土交通省のホームページに載っていますが、条例の最新情報は地方公共団体に確認する必要があります。\nしたがって「条例で飛行が制限されることはない」「航空法の許可・承認を受けていれば他の制限は受けない」とする記述は誤りです。",ref:"教則 第3章 3.2.3 その他の法令等（p.32）"},
];
const Q_PILOT2 = [
  {cat:3,lvl:"common",q:"飛行中に電源容量（バッテリー残量）の減少などにより飛行の継続ができない場合又はそれが予想される場合の機体の動作及び操縦者の対応について、最も適切なものを1つ選べ。",o:["あらかじめ設定されたフェールセーフ機能によりまずその場での自動着陸を試み、バッテリー残量が極端に少ない場合などには自動帰還モードへ切り替わって離陸地点へ飛行する。","あらかじめ設定されたフェールセーフ機能により自動帰還モードへ切り替わって離陸地点へ飛行し、さらにバッテリー残量が極端に少ない場合などにはその場で自動着陸を試みる。","緊急時には必ず離陸地点まで機体を帰還させてから着陸させなければならず、離陸地点以外の場所へ不時着させることは認められない。","バッテリーは残量が減少しても電圧の低下は緩やかであるため、残量表示がゼロに近づくまで飛行を継続しても出力が急激に弱まるおそれはない。"],a:1,e:"電波が届かなくなったり、バッテリー残量が減って飛び続けられない（またはその見込みの）ときは、あらかじめ設定しておいたフェールセーフ機能（＝異常時に機体が自動で安全側の動作をする仕組み）が働きます。動きの順番は次のとおりです。\n・まず自動帰還モードに切り替わり、離陸地点へ戻ろうとする\n・バッテリー残量が極端に少ないときは、その場で自動着陸を試みる\n緊急時は「必ず離陸地点まで戻す」ことを前提にせず、近くの安全な無人地帯へ速やかに不時着させます。また、バッテリーは残量が減って電圧が下がると出力が急に弱まり、墜落の原因になります。残量がゼロになるまで飛ばし続けるのは適切ではありません。緊急時にどう対応するかは、あらかじめ手順を考えておく必要があります。",ref:"教則 第5章 5.2.3 緊急時の対応（p.59）"},
  {cat:3,lvl:"common",q:"GNSSの電波を受信しにくい環境における無人航空機の操縦について、最も適切なものを1つ選べ。",o:["高層ビルの付近や橋梁の下などではGNSSの電波を受信しにくく位置保持機能が正常に働かないことがあるため、GNSSに依存しない手動操縦の技量を身につけておく必要がある。","位置保持機能が働かない場合でも、自動操縦に切り替えれば安全に飛行を継続できるため、手動操縦の技量を身につける必要性は低い。","GNSSの電波を受信できない場所では機体は直ちに飛行不能となるため、操縦技量にかかわらず飛行させることはできない。","高層ビルの付近や橋梁の下などでGNSSの電波を受信しにくい場合でも、位置保持機能は気圧センサ等により正常に維持されるため、開けた場所と同様の操縦で飛行を継続できる。"],a:0,e:"高層ビルのそばや橋の下などは、GNSS（＝人工衛星の電波で位置を測る仕組み）の電波を受信しにくく、その場にとどまる位置保持機能がうまく働かないことがあります。こうした場所でも安全に飛ばせるよう、GNSSに頼らない手動操縦の技量を身につけておく必要があります。自動操縦もGNSSなどの位置情報を使うので、位置保持機能の代わりにはなりません。また、GNSSを受信できなくても手動操縦で飛ばすこと自体はでき、すぐに飛行不能になるわけでもありません。",ref:"教則 第5章 5.2.2 手動操縦及び自動操縦（p.59）"},
  {cat:3,lvl:"common",q:"無人航空機の操縦者の心得について、最も適切なものを1つ選べ。",o:["近所や飛行経験のある場所を飛行させる場合には、飛行環境を熟知しているため、業務のための飛行であっても改めて飛行計画を立てる必要はない。","レクリエーション目的で飛行させる場合でも、業務のために飛行させる場合と同様に、安全に飛行するためのルールに関する情報、リソース、ツールを入手し、事前の準備を怠らないことが求められる。","危険な状況になった後にそれを乗り切ることの方が、危険な状況になる前にそれを察知して回避することよりも重要である。","無人航空機の事故の多くは飛行中の操作ミスが直接の原因であり、飛行前の準備不足が事故の原因となることはほとんどない。"],a:1,e:"無人航空機の事故は、飛ばす前のいろいろな準備不足が直接または間接の原因になっていることが多いため、事前の準備を怠らないことが求められます。安全に飛行するためのルールの情報・リソース・ツールをそろえることは、レクリエーション目的の飛行でも業務のための飛行でも同じように必要です。また、危険な状況になってから切り抜けることよりも、危険になる前に察知して避けることのほうが大切です。近所や飛ばした経験のある場所でも、飛行計画は必ず立てることとされています。",ref:"教則 第2章 2.1.3 準備を怠らない（p.2）"},
];
const Q_RISK2 = [
  {cat:4,lvl:"common",q:"山岳地帯で発生する山谷風について、最も適切なものを１つ選べ。",o:["山谷風は季節風の一種であり、風向は昼夜ではなく季節単位で入れ替わるため、同じ日のうちに風向が変化することはない。","日中は山頂から谷に向かって吹き降りる「山風」が吹き、夜間は谷から山の斜面を這い上がる「谷風」が吹く。","山谷風は海岸付近に現れる局地的な風であり、日中は海から陸に向かう風が、夜間は陸から海に向かう風が吹く。","日中は日射により暖められた空気が谷から山の斜面を這い上がる「谷風」が吹き、夜間は冷えた空気が山の斜面から谷に向かって吹き降りる「山風」が吹く。"],a:3,e:"山谷風は、山岳地帯に現れる局地的な風です。\n・日中…日ざしで暖められた空気が谷から山の斜面を這い上がる「谷風」が吹く\n・夜間…冷えた空気が山の斜面から谷へ吹き降りる「山風」が吹く\n昼と夜で風向きが入れ替わるので、山岳地帯で飛ばすときは時間帯による風の変化を考えておく必要があります。日中が山風・夜間が谷風とするのは逆です。また、季節単位で風向きが変わる季節風とも別のものです。",ref:"教則 第6章 6.2.2 気象（山谷風）"},
  {cat:4,lvl:"one",q:"〔一等〕航空機等との空中衝突リスクの軽減策について、最も適切なものを１つ選べ。",o:["戦術的軽減策とは運航前に飛行の時間や空域を制限して他の航空機等と時間的・空間的に分離することをいい、戦略的軽減策とは運航中に他の航空機等を検知して回避することをいう。","無人航空機は低高度を飛行することが多く航空機等と遭遇するおそれは小さいため、空中衝突リスクは評価の対象とせず、地上の第三者に対するリスクの軽減策のみを検討すればよい。","機体にパラシュートを装備することは、運航中に他の航空機等との衝突を回避するための戦術的軽減策に該当する。","軽減策には、運航前に飛行の時間や空域を制限して他の航空機等と時間的・空間的に分離する戦略的軽減策と、運航中に他の航空機等を検知して回避する戦術的軽減策がある。"],a:3,e:"航空機等との空中衝突リスクを減らす対策は、次の2つに分かれます。\n・戦略的軽減策…運航前に飛行の時間帯や空域を制限し、他の航空機等と時間的・空間的に分離して衝突の可能性を下げる\n・戦術的軽減策…運航中に他の航空機等を検知して回避する\n運航前の時間的・空間的な分離は戦略的軽減策なので、これを戦術的軽減策と呼ぶのは誤りです。また、空中衝突リスクも評価・軽減の対象です。パラシュートは墜落したときの地上の被害を減らす装備であって、空中衝突を避けるためのものではありません。",ref:"教則 第6章 6.1.6 リスク評価手法（空中リスク）"},
  {cat:4,lvl:"common",q:"飛行中に雷や積乱雲に遭遇するおそれがある場合の対応について、最も適切なものを１つ選べ。",o:["積乱雲が接近した場合でも、雲より低い高度まで下降すれば安全に飛行を継続できる。","積乱雲の接近時は、機体を上空でホバリングさせて雲が通過するのを待つことが最も安全である。","落雷は機体の故障や墜落に直結するため、積乱雲が近づいてきた場合は速やかに機体を着陸させ、飛行を中止する。","落雷のおそれがある場合であっても、雷鳴が聞こえるまでは飛行を継続してよく、積乱雲が近づいてきた段階で飛行を中止する必要はない。"],a:2,e:"落雷を受けると、機体の故障や墜落に直結します。そのため、雷鳴が聞こえたときや積乱雲が近づいてきたときは、速やかに機体を着陸させて飛行を中止する必要があります。積乱雲の付近では落雷のほかに突風や強い雨も起きるので、高度を下げて飛び続けたり、上空で待機したりするのは危険で不適切です。小型の無人航空機でも落雷の影響は受けます。",ref:"教則 第6章 6.2.2 気象（雷）"},
