などの条件が同じであれば、√2≒1.4倍のプロペラ回転角速度が必要で、消費パワーは√23≒２.８倍になる。飛行機において、機体重量が２倍になると、揚力が２倍必要になり、同じ迎角で飛行するためには√2≒1.4倍の飛行速度が必要になる。飛行中に速度を落としていくと、揚力を得るためには迎角を大きくしなければならない。しかし、迎角が大きくなりすぎると失速する。すなわち、飛行機には最低飛行速度（失速速度）が存在する。飛行速度の増加が必要ということは最低速度もそれに比例して増加することを意味する。すなわち、飛行機の機体重量が2倍になると、最低速度は1.4倍となる。","ペイロード（荷物）を積むなどして飛行機の機体重量が2倍になると、必要な揚力も2倍になります。高度などほかの条件が同じなら、√2≒1.4倍の機体速度が必要です。\n\n回転翼航空機の場合、機体重量が2倍になると必要な推力も2倍になります。高度などの条件が同じなら、プロペラの回転角速度は√2≒1.4倍必要になり、消費パワーは√2³≒2.8倍になります。\n\n飛行機で機体重量が2倍になると揚力が2倍必要になり、同じ迎角（＝翼が空気の流れに対して傾いている角度）のまま飛ぶには√2≒1.4倍の飛行速度が必要です。\n飛行中に速度を落としていくと、揚力を保つために迎角を大きくする必要があります。しかし迎角が大きくなりすぎると失速します。つまり飛行機には、これ以上遅く飛べないという最低飛行速度（失速速度）があります。\n必要な飛行速度が上がるということは、最低速度も同じ割合で上がるということです。したがって、飛行機の機体重量が2倍になると最低速度は1.4倍になります。"],["4.3 飛行原理と飛行性能 飛行機の旋回半径","飛行機がバンク角（ロール角）𝜙の定常旋回飛行を行うためには、力のつり合いから、水平定常飛行と比べて1/𝑐𝑜𝑠𝜙倍の揚力が必要であり、飛行速度𝑉、旋回半径𝑟、重力加速度𝑔の間に以下の関係がある。𝑉2𝑟=𝑔tan𝜙例えば、飛行速度10m/s、バンク角20°の場合の旋回半径𝑟は、重力加速度𝑔≒9.8m/𝑠2、tan20°≒0.36であるので、以下のように求められる。41𝑟=𝑉2𝑔tan𝜙=1029.8×0.36≒28mまた、cos20°≒0.94であるので、1.06倍の揚力が必要である。","飛行機がバンク角（ロール角）φで定常旋回飛行をするときは、力のつり合いから、水平定常飛行のときと比べて1/cosφ倍の揚力が必要です。このとき飛行速度V、旋回半径r、重力加速度gの間に次の関係があります。\n・V²/r ＝ g tanφ\n\n例えば飛行速度10m/s、バンク角20°の場合の旋回半径rは、重力加速度g≒9.8m/s²、tan20°≒0.36なので次のように求められます。\n・r ＝ V²/(g tanφ) ＝ 10²/(9.8×0.36) ≒ 28m\n\nまた、cos20°≒0.94なので、必要な揚力は1.06倍になります。"],["4.3 飛行原理と飛行性能 飛行機の滑空距離","飛行機の滑空時に飛行経路が水平面となす角を滑空角（降下角）とよぶ。無推力の定常滑空飛行状態での滑空角𝛾は、揚力𝐿、抗力𝐷によって以下のように求められる。tan𝛾=1𝐿/𝐷よって、ある高度ℎからの滑空距離𝑑は以下のように求められる。𝑑=ℎtan𝛾=ℎ⋅𝐿/𝐷ここで、𝐿/𝐷は揚抗比である。例えば、揚抗比15の無推力の定常滑空飛行状態であれば、滑空角𝛾は𝛾=tan−1115≒3.8°となり、高度ℎ=100mからの滑空距離𝑑は、𝑑=100×15=1500mとなる。","飛行機が滑空するとき、飛行経路が水平面となす角を滑空角（降下角）といいます。\n推力なしで一定の状態を保って滑空しているとき（無推力の定常滑空飛行）の滑空角γは、揚力Lと抗力Dから次のように求められます。\n・tanγ ＝ 1/(L/D)\n\nしたがって、ある高度hからの滑空距離dは次のように求められます。\n・d ＝ h/tanγ ＝ h×(L/D)\n\nここでL/Dは揚抗比（＝揚力と抗力の比）です。\n\n例えば揚抗比15で無推力の定常滑空飛行をしている場合、滑空角γは\n・γ ＝ tan⁻¹(1/15) ≒ 3.8°\nとなり、高度h＝100mからの滑空距離dは\n・d ＝ 100×15 ＝ 1500m\nとなります。"],["4.3 飛行原理と飛行性能 水平到達距離（水平投射の場合）","高度ℎを飛行する飛行速度𝑣の無人航空機が、揚力を失い落下を始める場合を考える。無人航空機を質点とみなせるものとし、空気抵抗は無視できると仮定すると、落下開始地点から地上に墜落するまでの水平距離𝑥は、𝑥=𝑣√2ℎ𝑔で求めることができる。但し、𝑔は重力加速度である。","高度hを飛行速度vで飛んでいる無人航空機が、揚力を失って落下を始める場合を考えます。\n機体を1つの点（質点）とみなし、空気抵抗は無視できるものと仮定すると、落下を始めた地点から地上に墜落するまでに進む水平距離xは、次の式で求められます。\n・x ＝ v×√(2h/g)\nここでgは重力加速度です。"],["4.4 機体の構成 フライトコントロールシステムの基礎","フライトコントロールシステムは、搭載されている各種センサ(GNSS、ジャイロ、加速度、方位、高度等)からの情報や送信機から発信された情報を処理し機体を制御するための信号を送るシステムである。なお、センサ類は、キャリブレーションを必要とするものが多いため、各機体で指定された方法で、キャリブレーションが正しく行われているかを常に注意する必要がある。フライトコントロールシステムを構成する一般的なデバイスには以下のものがある。42種類機能・特徴GNSS(GlobalNavigationSatelliteSystem)人工衛星の電波を受信し、機体の地球上での位置・高度を取得するデバイス。（ＧＰＳ（GlobalPositioningSystem)等）ジャイロセンサ回転角速度を測定するデバイス。","フライトコントロールシステムは、機体に載っている各種センサ（GNSS、ジャイロ、加速度、方位、高度など）からの情報と、送信機から送られてきた情報を処理し、機体を制御するための信号を送るシステムです。\nセンサ類はキャリブレーション（＝測定の基準を合わせる調整）が必要なものが多いので、機体ごとに指定された方法でキャリブレーションが正しく行われているか、常に注意する必要があります。\n\nフライトコントロールシステムを構成する代表的なデバイスには次のものがあります。\n・GNSS（Global Navigation Satellite System）：人工衛星の電波を受信して、機体の地球上での位置・高度を取得するデバイス。GPS（Global Positioning System）などがこれにあたります。\n・ジャイロセンサ：回転角速度を測定するデバイス。"],["4.4 機体の構成 フライトコントロールシステムの基礎","加速度センサ加速度を測定するデバイス。IMU(InertialMeasurementUnit)3軸のジャイロセンサと３方向の加速度センサ等によって３次元の角速度と加速度を検出する装置。また、メーカーによっては気圧センサを含む場合もある。地磁気センサ機体が向いている方向を地磁気を用いて取得するデバイス。高度センサレーザーや気圧センサなどを用い地上からの高度を取得するデバイス。メインコントローラーGNSSなどの各種センサの情報と送信機の指令をもとに、機体の姿勢を制御するデバイス。送信機操作の指令を機体へ送信する、又は機体情報を受信するデバイス。レシーバー送信機の情報を受け取る受信機又は送受信機。","フライトコントロールシステムを構成する代表的なデバイスの続きです。\n・加速度センサ：加速度を測定するデバイス。\n・IMU（Inertial Measurement Unit）：3軸のジャイロセンサと3方向の加速度センサなどによって、3次元の角速度と加速度を検出する装置。メーカーによっては気圧センサを含む場合もあります。\n・地磁気センサ：地磁気を使って、機体が向いている方向を取得するデバイス。\n・高度センサ：レーザーや気圧センサなどを使い、地上からの高度を取得するデバイス。\n・メインコントローラー：GNSSなど各種センサの情報と送信機の指令をもとに、機体の姿勢を制御するデバイス。\n・送信機：操作の指令を機体へ送る、または機体の情報を受け取るデバイス。\n・レシーバー：送信機の情報を受け取る受信機、または送受信機。"],["4.4 機体の構成 ジャイロセンサ","ジャイロセンサは、単位時間当たりの回転角度の変化を検出する装置であり、これにより、風などで機体が傾いたときに、無人航空機の傾きや向きの変化を検出し、フライトコントロールシステムに情報を伝える。","ジャイロセンサは、単位時間あたりに回転角度がどれだけ変化したかを検出する装置です。\nこれによって、風などで機体が傾いたときに、無人航空機の傾きや向きの変化を検出し、その情報をフライトコントロールシステムに伝えます。"],["4.4 機体の構成 加速度センサ","加速度センサは３次元の慣性運動（直行３軸方向の並進運動）を検出する装置であり、無人航空機の速度の変化量を検出するセンサである。ジャイロセンサと合わせて機体の姿勢を制御する。","加速度センサは、3次元の慣性運動（直交する3軸方向の並進運動）を検出する装置で、無人航空機の速度の変化量を検出するセンサです。\nジャイロセンサと組み合わせて、機体の姿勢を制御します。"],["4.4 機体の構成 地磁気センサ","地磁気センサは、地球の磁力を検出して方位を測定する。","地磁気センサは、地球の磁力を検出して方位を測定します。"],["4.4 機体の構成 高度センサ","高度の計測には主に以下のセンサがある。気圧センサは、気圧の変化を歪みゲージを利用して読み取り、高度を計測する。超音波センサは音波の反射時間から高度を計測する。LiDARはレーザー光(赤外線)を照射し反射時間から高度を計測する。43無人航空機の主たる構成要素","高度を計測するセンサには、主に次のものがあります。\n・気圧センサ：気圧の変化を歪みゲージで読み取り、高度を計測します。\n・超音波センサ：音波が反射して戻るまでの時間から高度を計測します。\n・LiDAR：レーザー光（赤外線）を照射し、反射して戻るまでの時間から高度を計測します。"],["4.4 機体の構成 バッテリー","バッテリーに関係する用語、単位、求め方及びその概要は以下のとおりである。用語単位求め方概要電圧Ｖセル当たりの電圧（V）×セル数※電圧降下は抵抗（Ω）×電流（A）⚫電圧は、セル当たりの電圧（リチウムポリマーバッテリーなら3.7V）とセル数で決まる。また、電池残量（現時点で放電できる電気量）が減ると電池の電圧は下がる。⚫放電（飛行）中の電圧降下は、バッテリーの内部抵抗によって決まる。出力Ｗ放電時電圧（V）×電流（A）⚫単位時間当たりのエネルギー量を表す。⚫出力を一定に維持しようとする場合、電池残量が少なくなると、放電時電圧が低下するため、必要となる電流は増大する。容量Ah電流（A）×時間（h）⚫満充電から、電圧が決められた最低電圧（終止電圧）になるまでの間に、利用できる電気量。","バッテリーに関係する用語・単位・求め方は次のとおりです。\n\n【電圧】単位：V\n・求め方：セル当たりの電圧（V）×セル数。なお電圧降下は、抵抗（Ω）×電流（A）で求めます。\n・電圧は、セル当たりの電圧（リチウムポリマーバッテリーなら3.7V）とセル数で決まります。\n・電池残量（今の時点で放電できる電気量）が減ると、電池の電圧は下がります。\n・放電（飛行）中の電圧降下の大きさは、バッテリーの内部抵抗で決まります。\n\n【出力】単位：W\n・求め方：放電時電圧（V）×電流（A）\n・単位時間あたりのエネルギー量を表します。\n・出力を一定に保とうとする場合、電池残量が少なくなると放電時の電圧が下がるため、必要な電流は増えます。\n\n【容量】単位：Ah\n・求め方：電流（A）×時間（h）\n・満充電の状態から、電圧が決められた最低電圧（終止電圧）に下がるまでの間に使える電気量です。"],["4.4 機体の構成 バッテリー","⚫放電時の電流の大きさや温度によって、利用可能な容量は変化する。エネルギー容量Wh放電時電圧(V)×電流(A)×時間(h)⚫容量と同様に、電流や温度によってエネルギー容量は変化する。充電率%現時点で放電できる電気量(Ah)満充電時に放電できる電気量(Ah）⚫満充電で放電できる電気量と現時点で放電できる電気量の比率を表す。⚫0%は仕様上の完全放電状態を、100%は満充電状態を表す。","・利用できる容量は、放電するときの電流の大きさや温度によって変わります。\n\n【エネルギー容量】単位：Wh\n・求め方：放電時電圧（V）×電流（A）×時間（h）\n・容量と同じように、電流や温度によってエネルギー容量は変わります。\n\n【充電率】単位：％\n・求め方：今の時点で放電できる電気量（Ah）÷ 満充電時に放電できる電気量（Ah）\n・満充電で放電できる電気量と、今の時点で放電できる電気量の比率を表します。\n・0％は仕様上の完全放電状態、100％は満充電状態を表します。"],["4.4 機体の構成 モーター、ローター（プロペラ）","電動の無人航空機においてローターを駆動するモーターには、ブラシモーターとブラシレスモーターがあり、ブラシレスモーターの特徴は、メンテナンスが容易（モーター内部の清掃、ブラシの交換が不要等）、静音、長寿命であることが挙げられる。また、ローターは通常回転方向（時計回転（CW：クロックワイズ）／反時計回転（CCW：カウンタークロックワイズ））に合わせた形状となっており、モーターの回転方向に合わせて取り付けるよう注意が必要である。","電動の無人航空機でローターを回すモーターには、ブラシモーターとブラシレスモーターがあります。\nブラシレスモーターの特徴は次のとおりです。\n・メンテナンスが簡単（モーター内部の清掃やブラシの交換が不要など）\n・静音\n・長寿命\n\nまた、ローターは通常、回転方向（時計回転＝CW：クロックワイズ／反時計回転＝CCW：カウンタークロックワイズ）に合わせた形になっています。そのため、モーターの回転方向に合わせて取り付けるよう注意が必要です。"],["4.4 機体の構成 ESC(エレクトロニックスピードコントローラー)","モーターの回転数はESC(エレクトロニックスピードコントローラー)により制御されており、モーターで駆動されたローターの回転数を増減させることにより揚力や推力を変化させている。44送信機","モーターの回転数は、ESC（エレクトロニックスピードコントローラー）が制御しています。\nモーターで回されたローターの回転数を上げ下げすることで、揚力や推力を変化させています。"],["4.4 機体の構成 送信機から無人航空機へ送信される指令の流れ","無人航空機への指令は送信機から機体へ送られる。機体では、受信機が指令を受け取りメインコントローラーからモーター又はサーボを駆動させ機体を操縦している。","無人航空機への指令は、送信機から機体へ送られます。\n機体側では受信機がその指令を受け取り、メインコントローラーがモーターまたはサーボを動かすことで、機体を操縦しています。"],["4.4 機体の構成 送信機の信号〔一等〕","送信機の信号は、同じ周波数帯の電波が同時かつ複数使用されているような場所では複数の電波が干渉して混信による誤作動が起きる可能性がある。電波混信の予防として飛行させる前に測定器などで周辺の電波の状態を確認することが望ましい。無人航空機で使用される送信機からの電波だけでなく、無線ＬＡＮやＷｉ‐Ｆｉ、高圧送電線の影響を受ける場合もあるため、周辺環境の確認が必要である。","送信機の信号は、同じ周波数帯の電波が同時に複数使われているような場所では、複数の電波が干渉し、混信によって誤作動が起きる可能性があります。\n電波の混信を防ぐため、飛行させる前に測定器などで周辺の電波の状態を確認することが望ましいです。\nまた、無人航空機の送信機からの電波だけでなく、無線LANやWi‑Fi、高圧送電線の影響を受ける場合もあるため、周辺環境の確認が必要です。"],["4.4 機体の構成 送信機の操縦と機能","無人航空機は、送信機のスティックを操作して、機体の重心を中心とする3軸の回転（ピッチ（機体の左右を軸とした回転）、ロール（機体の前後を軸とした回転）、ヨー（機体の上下を軸とした回転））やローターの推力の増減といった機体の動きの制御を行う。以下のとおりスティック操作による機体の動きの割り当てはモードにより異なる。また、スティックのニュートラル位置を調整するためのトリムスイッチがある場合もある。①回転翼航空機の場合(a)スロットル：ローターの推力（揚力）の増減（機体の上昇・降下）（モード１）右側スティックの上下操作（モード2）左側スティックの上下操作(b)エレベーター：ピッチ方向の操作（機体の前後移動）（モード１）左側スティックの上下操作（モード２）右側スティックの上下操作（c）エルロン：ロール方向の操作（機体の左右移動）（モード1／モード２）右側スティックの左右操作(d)ラダー：ヨー方向の操作（機首の左右旋回）（モード１／モード２）左側スティックの左右操作②飛行機の場合(a)スロットル：プロペラの推力の増減（機体の速度変化）（モード１）右側スティックの上下操作（モード2）左側スティックの上下操作(b)エレベーター：ピッチ方向の操作（機体の上昇・降下）（モード１）左側スティックの上下操作（モード２）右側スティックの上下操作（c）エルロン：ロール方向の操作（機体の左右旋回）（モード1／モード２）右側スティックの左右操作(d)ラダー：ヨー方向の操作（機体の左右旋回）（モード１／モード２）左側スティックの左右操作45機体の動力源","無人航空機は、送信機のスティックを操作して機体の動きを制御します。制御するのは、機体の重心を中心とした3軸の回転と、ローターの推力の増減です。3軸の回転とは次の3つです。\n・ピッチ：機体の左右を軸とした回転\n・ロール：機体の前後を軸とした回転\n・ヨー：機体の上下を軸とした回転\n\nスティック操作にどの動きを割り当てるかは、モードによって異なります（次のとおり）。また、スティックのニュートラル位置（中立の位置）を調整するトリムスイッチが付いている場合もあります。\n\n①回転翼航空機の場合\n・スロットル：ローターの推力（揚力）の増減＝機体の上昇・降下 → モード1は右側スティックの上下操作、モード2は左側スティックの上下操作\n・エレベーター：ピッチ方向の操作＝機体の前後移動 → モード1は左側スティックの上下操作、モード2は右側スティックの上下操作\n・エルロン：ロール方向の操作＝機体の左右移動 → モード1／モード2とも右側スティックの左右操作\n・ラダー：ヨー方向の操作＝機首の左右旋回 → モード1／モード2とも左側スティックの左右操作\n\n②飛行機の場合\n・スロットル：プロペラの推力の増減＝機体の速度変化 → モード1は右側スティックの上下操作、モード2は左側スティックの上下操作\n・エレベーター：ピッチ方向の操作＝機体の上昇・降下 → モード1は左側スティックの上下操作、モード2は右側スティックの上下操作\n・エルロン：ロール方向の操作＝機体の左右旋回 → モード1／モード2とも右側スティックの左右操作\n・ラダー：ヨー方向の操作＝機体の左右旋回 → モード1／モード2とも左側スティックの左右操作"],["4.4 機体の構成 機体の動力源","無人航空機の機体の動力源として主に、電動かエンジンが使用されている。電動機のメリットは、振動、騒音が少ないため軽量化できるが、飛行時間が短いというデメリットがある。エンジン機のメリットは、飛行時間が長く長距離飛行が可能であるが、エンジンによる騒音が電動に比べ大きいというデメリットある。","無人航空機の動力源としては、主に電動かエンジンが使われています。\n・電動機：振動や騒音が少ないため軽量化できるのがメリット。一方、飛行時間が短いのがデメリットです。\n・エンジン機：飛行時間が長く、長距離飛行ができるのがメリット。一方、エンジンによる騒音が電動に比べて大きいのがデメリットです。"],["4.4 機体の構成 リチウムポリマーバッテリーの特徴","リチウムポリマーバッテリーはゲル状のポリマー電解質を採用したバッテリーであり、多くの無人航空機に使用されている。リチウムポリマーバッテリーには、エネルギー密度が高い、電圧が高い、自己放電が少ない、メモリ効果（継ぎ足し充電などで浅い充放電を行った場合に見かけの放電容量が減少する現象）が小さい、電解質が可燃物である等の特徴がある。満充電のリチウムポリマーバッテリーを使用し無人航空機を急上昇させた場合、直後にバッテリー残量が減った様に見えることがある。これはバッテリーから大きな電流が流れたことで一時的な電圧低下が生じたことによるものである。","リチウムポリマーバッテリーは、ゲル状のポリマー電解質を使ったバッテリーで、多くの無人航空機に使われています。\n主な特徴は次のとおりです。\n・エネルギー密度が高い\n・電圧が高い\n・自己放電が少ない\n・メモリ効果（＝継ぎ足し充電などで浅い充放電を繰り返したときに、見かけの放電容量が減ってしまう現象）が小さい\n・電解質が可燃物である\n\nなお、満充電のリチウムポリマーバッテリーを使って無人航空機を急上昇させると、その直後にバッテリー残量が減ったように見えることがあります。これは、バッテリーから大きな電流が流れたことで一時的に電圧が下がったために起きる現象です。"],["4.4 機体の構成 リチウムポリマーバッテリーの取り扱い上の注意点","リチウムポリマーバッテリーの取り扱い上の注意点として以下のものが挙げられる。⚫充電器は満充電になると充電を停止するが、過充電となる場合がある。⚫過放電や過充電を行うと、急速に劣化が進み、寿命が短くなる。⚫過放電や過充電の状態では、通常利用時よりも多くのガスがバッテリー内部に発生し、バッテリーを膨らませる原因となる。⚫バッテリーが強い衝撃を受けた場合、発火する可能性がある。⚫バッテリーが短絡した場合、発火する可能性がある。","リチウムポリマーバッテリー（リポバッテリー）を扱うときの注意点は、次のとおりです。\n・充電器は満充電になると充電を止めますが、それでも過充電になる場合があります。\n・過放電や過充電をすると、劣化が急速に進み、寿命が短くなります。\n・過放電や過充電の状態では、普通に使うときよりも多くのガスがバッテリーの内部で発生し、バッテリーがふくらむ原因になります。\n・バッテリーが強い衝撃を受けると、発火する可能性があります。\n・バッテリーが短絡（ショート）すると、発火する可能性があります。"],["4.4 機体の構成 複数のセルで構成されたリチウムポリマーバッテリーの取扱上の注意","セル間の充電量のバランスを補正しながら充電することが重要である。バランスが著しく崩れたまま充電を行うとセル間の電圧差が生じ、セルによって過放電となる現象が起こり、急速に劣化が進む。そのため、セル間の充電量のバランスをとるバランスコネクタがついているタイプは、充電時にそのコネクタを充電器へ接続することが重要である。","複数のセル（電池の最小単位）でできたリチウムポリマーバッテリーは、セルどうしの充電量のバランスを整えながら充電することが重要です。\nバランスが大きく崩れたまま充電すると、セルの間に電圧の差が生まれ、セルによっては過放電になる現象が起こり、劣化が急速に進みます。\nそのため、セル間の充電量のバランスをとる「バランスコネクタ」が付いているタイプは、充電するときにそのコネクタを充電器につなぐことが重要です。"],["4.4 機体の構成 エンジン","エンジン機は、エンジンの回転を動力にローター又はプロペラを回転させ揚力と推力を得ている。エ46ンジンにはガソリンエンジン、ディーゼルエンジン、ジェットエンジン、グローエンジンなどの種類がある。エンジンの種類により、潤滑方式、燃焼サイクル、着火温度等が異なる。燃料にも種類があり、それぞれのエンジンでメーカーが指定する燃料を適切に扱う必要がある。燃料にオイル等を混ぜた混合燃料を使用する場合は、指定された混合比での使用が必要である。物件投下のために装備される機器無人航空機で物件投下する機器は、救命機器等を機体から投下する装置や農薬散布のために液体や粒剤を散布する装置などがある。物件投下装置は、意図せず物件が落下しない構造となっているが、搭載方法や投下手順が定められているため、物件投下装置の特性と機能を熟知しなければならない。特に、物件投下用のウインチ機構で吊り下げる場合は、物件の揺れ、投下前後の重心の変化に注意しなければならない。","エンジン機は、エンジンの回転を動力にしてローターやプロペラを回し、揚力と推力を得ています。\nエンジンには、ガソリンエンジン、ディーゼルエンジン、ジェットエンジン、グローエンジンなどの種類があります。種類によって、潤滑方式・燃焼サイクル・着火温度などが違います。\n燃料にも種類があるので、それぞれのエンジンでメーカーが指定する燃料を適切に扱う必要があります。燃料にオイルなどを混ぜた混合燃料を使う場合は、指定された混合比で使う必要があります。\n\n【物件投下のために装備される機器】\n無人航空機で物件投下をする機器には、救命機器などを機体から投下する装置や、農薬散布のために液体・粒剤をまく装置などがあります。\n物件投下装置は、意図せず物件が落ちない構造になっていますが、搭載のしかたや投下の手順が定められているため、その装置の特性と機能をよく知っておく必要があります。\n特に、物件投下用のウインチ機構で吊り下げる場合は、物件の揺れと、投下の前後で重心が変わることに注意する必要があります。"],["4.4 機体の構成 エンジン","農薬を散布する装置は、決められた飛行速度、飛行高度など使用の詳細が定められている。風などの影響で農薬を対象区域外に飛散させないよう注意しなければならない。機体又はバッテリーの故障及び事故の分析","農薬をまく装置は、飛行速度や飛行高度など、使い方の詳細が定められています。\n風などの影響で、農薬を対象の区域の外へ飛散させないように注意する必要があります。\n（このあとは「機体又はバッテリーの故障及び事故の分析」の内容に続きます。）"],["4.4 機体の構成 機体の故障や事故の分析〔一等〕","無人航空機の多くは、機体の異常情報を機体本体または送信機のランプや音などで知らせる機能を有している。また、飛行軌跡や機体の情報(フライトデータ)を記録している機種もあり、事故の原因分析を詳細に確認することも可能である。事故や故障の原因調査は、機体や飛行の安全性を向上させる重要な要素であるので、フライトデータを記録することが推奨される。","無人航空機の多くは、機体の異常の情報を、機体本体や送信機のランプ・音などで知らせる機能を持っています。\nまた、飛行の軌跡や機体の情報（フライトデータ）を記録している機種もあり、事故の原因分析を詳しく確認することもできます。\n事故や故障の原因調査は、機体や飛行の安全性を高めるための重要な要素なので、フライトデータを記録することが推奨されます。"],["4.4 機体の構成 リチウムポリマーバッテリーに関わる電気的なトラブル","リチウムポリマーバッテリーに関わる主な電気的トラブルを以下に示す。⚫冬季の飛行では飛行時間が半減することがある。気温が低下すると放電能力が極端に低下するためである。⚫リチウムポリマーバッテリーは高密度なエネルギーを大容量で出力できるが、バッテリー残量が減り、電圧低下してくると急激に出力が弱くなり、墜落の原因となるので注意する。","リチウムポリマーバッテリーに関わる主な電気的トラブルは、次のとおりです。\n・冬の飛行では、飛行時間が半分になることがあります。気温が下がると放電能力が極端に低下するためです。\n・リチウムポリマーバッテリーは、高密度なエネルギーを大容量で出力できますが、残量が減って電圧が下がってくると急に出力が弱くなり、墜落の原因になるので注意します。"],["4.5 機体以外の要素技術 直進、反射、屈折、回折、干渉、減衰","電波の性質の種類と特徴は以下のとおりである。電波には障害物等の後ろに回り込む回折という性質、異なる媒質にぶつかると透過、反射あるいは屈折する性質、周波数の近い電波が重なると電波干渉が発生しお互いを減衰させる性質などがある。2.4GHzの電波は回折しにくく直進性が高いため障害物の影響を受けやすくなる。性質の種類性質の特徴直進電波は、進行方向に障害物が無い場合は直進する。反射、屈折電波は、２つの異なる媒質間を進行するとき、反射や屈折が起こる。常に反射の法則（入射角と反射角の大きさは等しい）が成り立つ。回折電波は、周波数が低い（波長が長い）ほど、より障害物を回り込むことができるようになる。干渉電波は、2つ以上の波が重なると、強め合ったり、弱め合ったりする。","電波の性質の種類と特徴は、次のとおりです。\n電波には、\n・障害物などの後ろに回り込む「回折」という性質\n・異なる媒質（物質）にぶつかると透過・反射・屈折する性質\n・周波数の近い電波が重なると電波干渉が起き、お互いを減衰させる（弱め合う）性質\nなどがあります。\n2.4GHzの電波は回折しにくく直進性が高いため、障害物の影響を受けやすくなります。\n\n性質ごとの特徴\n・直進：進行方向に障害物がなければ、電波はまっすぐ進みます。\n・反射、屈折：2つの異なる媒質の間を進むとき、反射や屈折が起こります。反射の法則（入射角と反射角の大きさは等しい）は常に成り立ちます。\n・回折：周波数が低い（波長が長い）ほど、障害物をより大きく回り込めるようになります。\n・干渉：2つ以上の波が重なると、強め合ったり、弱め合ったりします。"],["4.5 機体以外の要素技術 直進、反射、屈折、回折、干渉、減衰","減衰電波は、進行距離の２乗に反比例する形で電力密度が減少する（進行距離が2倍になると電波の電力密度は1/4になる）。周波数により特性は異なるものの、電波は水中では吸収されて大きく減衰される。","減衰：電波の電力密度は、進んだ距離の2乗に反比例して減っていきます（進んだ距離が2倍になると、電力密度は1/4になります）。\nまた、周波数によって特性は異なりますが、電波は水中では吸収されて大きく減衰します。"],["4.5 機体以外の要素技術 マルチパス","送信アンテナから放射された電波が山や建物などによる反射、屈折等により複数の経路を通って伝搬される現象をマルチパスという。反射屈折した電波は、到達するまでにわずかな遅れを生じ、一時的に操縦不能になる要因の一つとなっている。マルチパスによって電波が弱くなり一時的に操縦不能になった場合は送信機をできるだけ高い位置に持ちアンテナの向きを変えて操縦の復帰を試みる。","送信アンテナから出た電波が、山や建物などによる反射・屈折などで複数の経路を通って伝わる現象を「マルチパス」といいます。\n反射・屈折した電波は、届くまでにわずかな遅れが生じるため、一時的に操縦不能になる要因の一つになっています。\nマルチパスによって電波が弱くなり、一時的に操縦不能になった場合は、送信機をできるだけ高い位置に持ち、アンテナの向きを変えて操縦の復帰を試みます。"],["4.5 機体以外の要素技術 フレネルゾーン","フレネルゾーンとは無線通信などで、電力損失をすることなく電波が到達するために必要とする領域のことをいう。無線通信での「見通しが良い」という表現は、フレネルゾーンがしっかり確保されている状態であることを意味する。フレネルゾーンは、送信と受信のアンテナ間の最短距離を中心とした楕円体の空間で、この空間は無限に広がるが、電波伝搬で重要なのは第1フレネルゾーンと呼ばれる部分である。このフレネルゾーン内に壁や建物などの障害物があると、受信電界強度が確保されず通信エラーが起こり、障害物がない状態に比べて通信距離が短くなる。このフレネルゾーンの半径は周波数が高く（波長が短く）又はお互いの距離が短くなればなるほど小さくなる（2.4GHz帯、5.7GHz帯の場合、2地点が100m離れたケースでは2m以下）。地面も障害物となるため、フレネルゾーンの半径を考慮してアンテナの高さを十分に確保する必要がある。","フレネルゾーンとは、無線通信などで、電力を損失することなく電波が届くために必要となる領域のことです。無線通信で「見通しが良い」という表現は、フレネルゾーンがしっかり確保されている状態を意味します。\nフレネルゾーンは、送信アンテナと受信アンテナの間の最短距離を中心とした楕円体の空間です。この空間は無限に広がりますが、電波伝搬で重要なのは「第1フレネルゾーン」と呼ばれる部分です。\nこのフレネルゾーンの中に壁や建物などの障害物があると、受信電界強度が確保できず通信エラーが起こり、障害物がない状態に比べて通信距離が短くなります。\nフレネルゾーンの半径は、周波数が高い（波長が短い）ほど、またお互いの距離が短いほど小さくなります（2.4GHz帯・5.7GHz帯の場合、2地点が100m離れているケースでは2m以下）。\n地面も障害物になるため、フレネルゾーンの半径を考えて、アンテナの高さを十分に確保する必要があります。"],["4.5 機体以外の要素技術 無⼈航空機の運航において使⽤されている電波の周波数帯・用途","無人航空機の運航において使用されている主な電波の周波数帯は、2.4GHz帯、5.7GHz帯、920MHz帯、73MHz帯、169MHz帯である。169MHz帯は主に2.4GHz帯及び5.7GHz帯の無人移動体画像伝送システムの無線局のバックアップ回線として使用される。電波の周波数帯や出力、使用するアンテナの特性、変調方式、伝送速度などによって通信可能な距離は変動する。48","無人航空機の運航で使われている主な電波の周波数帯は、2.4GHz帯・5.7GHz帯・920MHz帯・73MHz帯・169MHz帯です。\nこのうち169MHz帯は、主に2.4GHz帯および5.7GHz帯の無人移動体画像伝送システムの無線局のバックアップ回線として使われます。\n通信できる距離は、電波の周波数帯や出力、使うアンテナの特性、変調方式、伝送速度などによって変わります。"],["4.5 機体以外の要素技術 無⼈航空機以外も含めた⽇本の電波の利⽤状況〔一等〕","電波の特性として、波長が長いほど直進性が弱く情報伝達容量が小さくなるが減衰はしにくい。逆に波長が短いほど直進性が強く情報伝達容量が大きくなるが減衰はしやすい。無人航空機の制御用通信に多く使用される極超短波は１０ｃｍ～１ｍの波長（周波数300MHz～3GHz）で、超短波(波長1～１０m、周波数30～300MHz)に比べて直進性が更に強くなるが、多少の山や建物の陰には回り込んで伝わることができる。伝送できる情報量が大きく、小型のアンテナと送受信設備で通信できることから、携帯電話や業務用無線、アマチュア無線、無人航空機など多種多様な移動通信システムを中心に、地上デジタルＴＶ、空港監視レーダー、電子タグ、電子レンジ等幅広く利用される。","電波の特性として、波長が長いほど直進性が弱く、伝えられる情報量も小さくなりますが、減衰はしにくくなります。逆に、波長が短いほど直進性が強く、伝えられる情報量も大きくなりますが、減衰はしやすくなります。\n無人航空機の制御用通信によく使われるのは「極超短波」で、波長は10cm〜1m（周波数300MHz〜3GHz）です。超短波（波長1〜10m、周波数30〜300MHz）に比べて直進性がさらに強くなりますが、多少の山や建物の陰なら回り込んで伝わることができます。\n伝えられる情報量が大きく、小型のアンテナと送受信設備で通信できるため、携帯電話・業務用無線・アマチュア無線・無人航空機など多種多様な移動通信システムを中心に、地上デジタルTV、空港監視レーダー、電子タグ、電子レンジなどにも幅広く使われています。"],["4.5 機体以外の要素技術 無⼈航空機以外も含めた⽇本の電波の利⽤状況〔一等〕","マイクロ波は１～１０ｃｍの波長（周波数3～30GHz）で、直進性が強い性質を持つため特定の方向に向けて発射するのに適している。伝送できる情報量が非常に大きいことから、衛星通信、衛星放送や無人航空機の画像伝送、無線ＬＡＮに利用される。レーダーもマイクロ波の直進性を活用したシステムで、気象レーダーや船舶用レーダー等に利用される。","「マイクロ波」は波長1〜10cm（周波数3〜30GHz）で、直進性が強い性質を持つため、特定の方向へ向けて発射するのに適しています。\n伝えられる情報量が非常に大きいことから、衛星通信、衛星放送、無人航空機の画像伝送、無線LANに使われます。\nレーダーもマイクロ波の直進性を活かしたシステムで、気象レーダーや船舶用レーダーなどに使われます。"],["4.5 機体以外の要素技術 電波の送信、受信に関わる基本的な技術","送信機のアンテナから発射される電波の強さは、方向により異なる（無指向性のアンテナの場合は、アンテナの周囲に対して同様に発射される）。アンテナの角度は調整できるので、操縦時の送信機の持ち方や無人航空機の位置を考慮して最適なアンテナ角度を設定する必要がある。","送信機のアンテナから発射される電波の強さは、方向によって違います（無指向性のアンテナの場合は、アンテナの周囲に対して同じように発射されます）。\nアンテナの角度は調整できるので、操縦するときの送信機の持ち方や、無人航空機の位置を考えて、最適なアンテナ角度を設定する必要があります。"],["4.5 機体以外の要素技術 電波の特性に伴って発⽣する運航上のトラブルの調査・分析〔一等〕","外来電波や他の設備・機器からのノイズにより無線設備の通信環境が不安定になることがある。電波環境の調査として、スペクトラムアナライザを用いて、使用している周波数と同じ電波が現地エリアで使用されている状況や、他の設備・機器からノイズが発生していないかを確認する方法がある。様々な無線局が散在する市街地での飛行のためには、電波環境の調査は非常に重要である。","外から来る電波や、ほかの設備・機器から出るノイズによって、無線設備の通信環境が不安定になることがあります。\n電波環境の調査としては、スペクトラムアナライザを使って、自分が使う周波数と同じ電波が現地のエリアで使われている状況や、ほかの設備・機器からノイズが出ていないかを確認する方法があります。\nさまざまな無線局が散在する市街地で飛ばすためには、電波環境の調査がとても重要です。"],["4.5 機体以外の要素技術 電波と通信に関わる基本的な計算〔一等〕","カテゴリーⅢ飛行を行うにあたっては、電波と通信に関わる基本的な計算（周波数帯や送受信間距離を踏まえ必要となるアンテナの高さ等）について理解しておく必要がある。","カテゴリーⅢ飛行を行うには、電波と通信に関わる基本的な計算（周波数帯や、送信側と受信側の距離をふまえて必要になるアンテナの高さなど）を理解しておく必要があります。"],["4.5 機体以外の要素技術 フレネルゾーン半径と必要なアンテナの高さ","フレネルゾーンの半径：R(m)、送受信アンテナ間距離：D（ｍ）、使用周波数ｆ（Ｈｚ）、波長：λ（ｍ）とすると、これらの間には以下の関係がある。𝑅=√𝜆×(𝐷2)2×1𝐷上記式を用いた、送受信アンテナ間距離：100m、使用周波数：2.4GHzのときのフレネルゾーンの49半径の具体的な導出方法を以下に示す。上記の前提条件より、⚫送受信アンテナ間距離：D＝100ｍ⚫使用周波数：ｆ＝2.4×10９Hz⚫波長：λ=（3×108）÷(2.4×10９)=0.125ｍ(光の速度を3×108ｍ/sとした場合)と求めることができる。以上より、フレネルゾーンの半径Rは、𝑅=√𝜆×(𝐷2)2×1𝐷＝√𝜆×𝐷4=√0.125×1004≒1.77𝑚よって理想的なアンテナの高さは1.77ｍ以上となる。","記号を次のように決めます。\n・フレネルゾーンの半径：R（m）\n・送受信アンテナ間の距離：D（m）\n・使用周波数：f（Hz）\n・波長：λ（m）\nこれらの間には、次の関係があります。\nR＝√（λ×(D/2)²×(1/D)）\n\n【計算例】送受信アンテナ間の距離100m、使用周波数2.4GHzのときの半径を求めます。\n・D＝100m\n・f＝2.4×10⁹Hz\n・λ＝(3×10⁸)÷(2.4×10⁹)＝0.125m（光の速度を3×10⁸m/sとした場合）\nよって、\nR＝√（λ×(D/2)²×(1/D)）＝√（λ×D÷4）＝√（0.125×100÷4）≒1.77m\nしたがって、理想的なアンテナの高さは1.77m以上となります。"],["4.5 機体以外の要素技術 フレネルゾーン半径と必要なアンテナの高さ","なお、実際にはフレネルゾーン半径の60％以上のアンテナ高さが確保できていれば、フレネルゾーンに障害物がない場合と同等の通信品質を確保できるといわれている。この条件にて必要なアンテナの高さを計算すると、1.77×0.6≒1.1ｍ以上となる。磁気方位","なお実際には、フレネルゾーン半径の60％以上のアンテナ高さが確保できていれば、フレネルゾーンに障害物がない場合と同じくらいの通信品質を確保できるといわれています。\nこの条件で必要なアンテナの高さを計算すると、1.77×0.6≒1.1m以上となります。\n（このあとは「磁気方位」の内容に続きます。）"],["4.5 機体以外の要素技術 地磁気センサの役割","地磁気センサにより、地球の磁気を検出することで機体の向き(方位)や姿勢を知ることができる。地磁気センサは正常な方位を計測しない場合があるが、それは磁力線が示す北（磁北）と地図の北に偏角が生じるためである。","地磁気センサは、地球の磁気を検出することで、機体の向き（方位）や姿勢を知ることができます。\n地磁気センサが正常な方位を計測しない場合がありますが、これは磁力線が示す北（磁北）と、地図の北との間に偏角が生じるためです。"],["4.5 機体以外の要素技術 飛行環境において磁気に注意すべき構造物や環境","地磁気の検出には、鉄や電流が影響を与える。一般的に影響を与えるものは、高圧線や変電所、電波塔、鉄材を多く使用された建物、新幹線や電車の鉄道、自動車、鉄板など鉄材が多く埋め込まれた場所などがあげられる。機体の姿勢や進行方向に影響を与える場合がある。","地磁気の検出には、鉄や電流が影響を与えます。\n一般的に影響を与えるものとしては、高圧線や変電所、電波塔、鉄材を多く使った建物、新幹線や電車の鉄道、自動車、鉄板など鉄材が多く埋め込まれた場所などがあげられます。\nこれらは、機体の姿勢や進行方向に影響を与える場合があります。"],["4.5 機体以外の要素技術 無人航空機の磁気キャリブレーション","無人航空機の磁気キャリブレーションとは、飛行前にその場所の地磁気を検出して方位を取得し、GNSS機能やメインコントローラーに認識させることである。磁気キャリブレーションが正しく行われていないと、機体が操縦者の意図しない方向へ飛行する可能性がある。飛行させる場所により、地磁気の方向は異なるので、磁気キャリブレーションを行うことが重要である。GNSS","磁気キャリブレーションとは、飛行前にその場所の地磁気（地球の磁気）を検出して方位を取得し、GNSS機能やメインコントローラーに認識させることです。これが正しく行われていないと、機体が操縦者の意図しない方向へ飛行する可能性があります。地磁気の方向は飛行させる場所によって異なります。そのため、磁気キャリブレーションを行うことが重要です。"],["4.5 機体以外の要素技術 GNSS","GPS（GlobalPositioningSystem）は、アメリカ国防総省が、航空機等の航法支援用として開発したシステムである。GPSに加え、ロシアのGLONASS、欧州のGalileo、日本の準天頂衛星QZSS50等を総称してGNSS（GlobalNavigationSatelliteSystem/全球測位衛星システム）と言う。GNSSは最低4個以上の人工衛星からの信号を同時に受信することでその位置を計算することができる。機体に取り付けられた受信機により最低４基以上の人工衛星からの距離を同時に知ることにより、機体の位置を特定している。なお、安定飛行のためには、より多くの人工衛星から信号を受信することが望ましい。","GPS（Global Positioning System）は、アメリカ国防総省が航空機などの航法支援用として開発したシステムです。このGPSに加えて、ロシアのGLONASS、欧州のGalileo、日本の準天頂衛星QZSSなどをまとめてGNSS（Global Navigation Satellite System／全球測位衛星システム）と呼びます。\n\nGNSSは、最低4個以上の人工衛星からの信号を同時に受信することで、その位置を計算できます。機体に取り付けられた受信機で、最低4基以上の人工衛星までの距離を同時に知ることによって、機体の位置を特定しています。なお、安定して飛行させるためには、より多くの人工衛星から信号を受信することが望ましいです。"],["4.5 機体以外の要素技術 GNSS と RTK の精度","GPS測位での受信機1台の単独測位の精度は数十mの精度である。測位方式として固定局と移動局の２つの受信機を使用するRTK(RealTimeKinematic)やDGPS(DifferentialGlobalPositioningSystem)などの技術が確立され、これらの測位方式は数cm～数mレベルの精度の高い測位が可能である。","GPS測位で受信機1台だけを使う単独測位の精度は、数十mの精度です。\n\nこれに対し、測位方式として、固定局と移動局の2つの受信機を使うRTK（Real Time Kinematic）やDGPS（Differential Global Positioning System）などの技術が確立されています。これらの測位方式なら、数cm～数mレベルという精度の高い測位ができます。"],["4.5 機体以外の要素技術 GNSS を使用した飛行における注意事項","自動操縦では手動操作よりも高精度なGNSS測位が必要である。自動操縦のためにあらかじめ地図上で設定したWayPointはGNSSの測位精度の影響を受けるため、精度が悪化した場合は実際の飛行経路の誤差が大きくなる。GNSSの測位精度に影響を及ぼすものとしては、GNSS衛星の時計の精度、捕捉しているGNSS衛星の数、障害物などによるマルチパス、受信環境のノイズなどが挙げられる。受信機は、周囲の地形や障害物の状況を考慮して設置する必要がある。一般的に位置精度は、水平方向に比べ高度方向の誤差が大きくなる。","自動操縦では、手動操作よりも高精度なGNSS測位が必要です。自動操縦のためにあらかじめ地図上で設定したWayPoint（通過点）は、GNSSの測位精度の影響を受けます。そのため、精度が悪化すると、実際の飛行経路の誤差が大きくなります。\n\nGNSSの測位精度に影響を与えるものには、次のようなものがあります。\n・GNSS衛星の時計の精度\n・捕捉しているGNSS衛星の数\n・障害物などによるマルチパス（電波が反射して回り込む現象）\n・受信環境のノイズ\n\n受信機は、周囲の地形や障害物の状況を考えて設置する必要があります。また、一般的に位置精度は、水平方向に比べて高度方向の誤差のほうが大きくなります。"],["4.6 機体の整備・点検・保管・交換・廃棄 運航者が実施すべき、定期的な整備・点検項目","運航者（無人航空機を運航する者をいう。以下同じ。）は飛行前後だけではなく、無人航空機毎に定められた一定の期間や一定の総飛行時間ごとに整備点検を行う必要がある。そのため、各機体メーカーが設定する整備内容を熟知し、必要なタイミングで修理等の整備を行う必要がある。","運航者（＝無人航空機を運航する人のこと。以下同じ）は、飛行前後の点検だけでは足りません。無人航空機ごとに定められた一定の期間ごと、または一定の総飛行時間ごとにも、整備点検を行う必要があります。\n\nそのため、各機体メーカーが設定している整備内容をよく知っておき、必要なタイミングで修理などの整備を行う必要があります。"],["4.6 機体の整備・点検・保管・交換・廃棄 リチウムポリマーバッテリーの保管方法","リチウムポリマーバッテリーの保管方法における主な留意点は以下のとおり。⚫バッテリーの劣化を遅らせるため、長期間使用しない時は充電60%を目安に保管すること。満充電の状態での保管又は飛行後の放電状態での保管は、電池の劣化が進みやすく電池が膨らみ、使用不可になることが多いので行わないこと。⚫短絡すると発火する危険があるため、バッテリー端子が短絡しないように細心の注意を払うこと。機体コネクタとバッテリーを接続したままにしないこと。51⚫万が一発火しても安全を保てる不燃性のケースに入れ、突起物が当たってバッテリーを傷つけない状態で保管すること。⚫落下させるなど衝撃を与えないこと。⚫水に濡らさないこと。⚫バッテリーを高温(35°c超)になる環境で保管しないこと。","リチウムポリマーバッテリーを保管するときの主な注意点は、次のとおりです。\n\n・バッテリーの劣化を遅らせるため、長期間使わないときは充電60%を目安に保管します。満充電の状態での保管や、飛行後の放電した状態での保管は行いません。電池の劣化が進んで電池が膨らみ、使えなくなることが多いためです。\n・短絡（ショート）すると発火する危険があるため、バッテリー端子が短絡しないよう細心の注意を払います。機体コネクタとバッテリーを接続したままにしないでください。\n・万が一発火しても安全を保てる不燃性のケースに入れ、突起物が当たってバッテリーを傷つけない状態で保管します。\n・落下させるなど、衝撃を与えないようにします。\n・水に濡らさないようにします。\n・高温（35°c超）になる環境で保管しないようにします。"],["4.6 機体の整備・点検・保管・交換・廃棄 リチウムポリマーバッテリーの交換","交換時期のチェックが特に重要なものとして、リチウムポリマーバッテリーが挙げられる。リチウムポリマーバッテリーが膨らんでいる場合は、過充電などでバッテリー内部に可燃性ガスが発生している可能性があるため、早めに交換を行う。","交換時期のチェックが特に重要なものとして、リチウムポリマーバッテリーが挙げられます。\n\nリチウムポリマーバッテリーが膨らんでいる場合は、過充電などによってバッテリー内部に可燃性ガスが発生している可能性があります。この場合は、早めに交換を行います。"],["4.6 機体の整備・点検・保管・交換・廃棄 リチウムポリマーバッテリーの廃棄方法","無人航空機の運航で生じる廃棄物は、各地方自治体のルールに従って廃棄しなければならない。事業で用いたリチウムポリマーバッテリーを廃棄する場合は、法律に則り「産業廃棄物」として廃棄する。エンジン機における整備・点検エンジン機においては、飛行前後以外に一定の期間又は一定の総飛行時間毎に、機体メーカーが定めた整備項目を整備手順に従って実施する。運航者のエンジンの整備に関する知識及び技能が不足している場合は、専門の整備業者に依頼する。52","無人航空機の運航で出る廃棄物は、各地方自治体のルールに従って廃棄する必要があります。事業で使ったリチウムポリマーバッテリーを廃棄する場合は、法律に従って「産業廃棄物」として廃棄します。\n\n【エンジン機における整備・点検】\nエンジン機では、飛行前後の点検に加えて、一定の期間ごと、または一定の総飛行時間ごとに、機体メーカーが定めた整備項目を整備手順に従って実施します。運航者のエンジンの整備に関する知識や技能が足りない場合は、専門の整備業者に依頼します。"],["5.1 操縦者の行動規範及び遵守事項 操縦者の義務の概要","航空法においては、無人航空機を安全に飛行させるため、操縦者に対して様々な義務を課している。これらは、無人航空機を飛行させる者にとって根本的なルールである。","航空法では、無人航空機を安全に飛行させるため、操縦者にさまざまな義務を課しています。これらは、無人航空機を飛行させる人にとって根本的なルールです。"],["5.1 操縦者の行動規範及び遵守事項 カテゴリーⅢ飛行の操縦者に追加で義務付けられる事項〔一等〕","カテゴリーⅢ飛行を行う場合には、操縦者は一等無人航空機操縦士の技能証明の取得が必要である。また、その運航の管理が適切に行われることについて、国土交通大臣の許可・承認を受ける必要があるが、運航管理体制の構築に当たっては、操縦者がリスクの高い飛行を行うことについて無人航空機を飛行させる者としての責任を自覚し、運航の中心的な役割を果たさなければならない。運航時の点検及び確認事項","カテゴリーⅢ飛行を行う場合、操縦者は一等無人航空機操縦士の技能証明を取得している必要があります。\n\nさらに、その運航の管理が適切に行われることについて、国土交通大臣の許可・承認を受ける必要があります。運航管理体制をつくるにあたっては、操縦者はリスクの高い飛行を行うことについて、無人航空機を飛行させる者としての責任を自覚し、運航の中心的な役割を果たさなければなりません。"],["5.1 操縦者の行動規範及び遵守事項 安全運航のためのプロセスと点検項目","安全に運航するために点検プロセスを定め、そのプロセスごとに点検項目を設定する。点検プロセスは機体メーカーの指示する内容に従って実施すること。","安全に運航するために、点検のプロセス（手順の区切り）を定め、そのプロセスごとに点検項目を設定します。点検プロセスは、機体メーカーが指示する内容に従って実施します。"],["5.1 操縦者の行動規範及び遵守事項 飛行前の準備","飛行前の準備では、必要な装置や設備の設置を行い、飛行に必要な許可・承認や機体登録等の有効期間が切れていないかを最終確認する。","飛行前の準備では、必要な装置や設備の設置を行います。あわせて、飛行に必要な許可・承認や機体登録などの有効期間が切れていないかを最終確認します。"],["5.1 操縦者の行動規範及び遵守事項 飛行前の点検","飛行前の点検は必ず機体を飛行させる前に都度行うべき最終点検である。ここではバッテリーのチェックや機体の異常チェックなど、無人航空機が正常に飛行できることを最終確認する。","飛行前の点検は、機体を飛行させる前に必ず毎回行うべき最終点検です。ここではバッテリーのチェックや機体の異常チェックなどを行い、無人航空機が正常に飛行できることを最終確認します。"],["5.1 操縦者の行動規範及び遵守事項 飛行中の監視","飛行中の監視では、飛行中の機体の状態チェックや、飛行している機体の周囲の状況など、安全な飛行のためにチェックしなければならない項目を継続的に確認する。53","飛行中の監視では、安全な飛行のためにチェックしなければならない項目を、継続して確認し続けます。たとえば、飛行中の機体の状態チェックや、飛行している機体の周囲の状況などです。"],["5.1 操縦者の行動規範及び遵守事項 飛行後の点検","飛行後の点検は、無人航空機が飛行を終えて着陸したあとに行うべき点検である。ここでは飛行の結果、無人航空機の各部品の摩耗等の状態を確認する。","飛行後の点検は、無人航空機が飛行を終えて着陸したあとに行うべき点検です。ここでは飛行の結果として、無人航空機の各部品の摩耗などの状態を確認します。"],["5.1 操縦者の行動規範及び遵守事項 運航終了後の点検","当日の運航が終了したあとに行うべき点検である。ここでは無人航空機やバッテリーを安全に保管するための点検や、飛行日誌の作成などを確認する。","運航終了後の点検は、その日の運航がすべて終わったあとに行うべき点検です。ここでは、無人航空機やバッテリーを安全に保管するための点検や、飛行日誌の作成などを確認します。"],["5.1 操縦者の行動規範及び遵守事項 異常事態発生時の点検","飛行中に異常事態が発生した際に確認するべき点検である。ここでは危機回避行動を行い、安全に着陸するための確認項目を確認する。","異常事態発生時の点検は、飛行中に異常事態が起きたときに確認するべき点検です。ここでは危機回避行動をとり、安全に着陸するための確認項目を確認します。"],["5.1 操縦者の行動規範及び遵守事項 運航者がプロセスごとに行うべき点検","以下にはプロセスごとに行うべき点検項目の例を挙げているが、運航する無人航空機の特性やその運航方法によって、必要な点検などを追加で行う必要がある。プロセス点検項目の例飛行前の準備①無人航空機の確認・無人航空機の登録及び有効期間・無人航空機の機体認証及び有効期間並びに使用の条件（運用限界）・整備状況等②操縦者の確認・技能証明の等級・限定・条件及び有効期間・操縦者の操縦能力、飛行経験、訓練状況等③飛行空域及びその周囲の状況の確認・第三者の有無、地上又は水上の状況（住宅、学校、病院、道路、鉄道等）・航空機や他の無人航空機の飛行状況、空域の状況（空港・ヘリポート、管制区域・航空路等）・障害物や安全性に影響を及ぼす物件（高圧線、変電所、電波塔、無線施設等）の有無・小型無人機等飛行禁止法の飛行禁止空域、緊急用務空域、飛行自粛要請空域等の該当の有無等④気象状況の確認・最新の気象情報（天気、風向、警報、注意報等）⑤航空法その他の法令等の必要な手続き・国の飛行の許可・承認の取得・必要な書類の携帯又は携行（技能証明書、飛行日誌、飛行の許可・承認書等）・航空法以外の法令等の必要な手続き等⑥立入管理措置・安全確保措置・飛行マニュアルの作成・第三者の立入りを管理する措置・安全管理者や補助者等の配置・役割・訓練状況・緊急時の措置（緊急着陸地点や安全にホバリング・旋回ができる場所の設定等）等⑦飛行計画の策定及び通報・上記事項を踏まえ飛行計画を策定・ドローン情報基盤システム（飛行計画通報機能）に入力し通報飛行前の点検①各機器は安全に取り付けられているか（ネジ等の脱落やゆるみ等）②発動機やモーターに異音はないか③機体（プロペラ、フレーム等）に損傷やゆがみはないか④燃料の搭載量又はバッテリーの充電量は十分か⑤通信系統、推進系統、電源系統及び自動制御系統は正常に作動するか54⑥登録記号（試験飛行届出番号及び「試験飛行中」）について機体に表示されているか⑦リモートＩＤ機能が正常に作動しているか（リモートＩＤ機能を有する機器を装備する場合）（例）リモートＩＤ機能が作動していることを示すランプが点灯していることの確認飛行中の監視①無人航空機の飛行状況・無人航空機の異常の有無・計画通りの経路・高度・速度等の維持状況②飛行空域及びその周囲の気象の変化③飛行空域及びその周囲の状況・航空機及び他の無人航空機の有無・第三者の有無等異常事態発生時の措置①あらかじめ設定した手順等に従った危機回避行動をとる②事故発生時には、直ちに無人航空機の飛行を中止し、危険を防止するための措置を取る・負傷者がいる場合はその救護・通報・事故等の状況に応じた警察への通報・火災が発生している場合の消防への通報等③事故・重大インシデントの国土交通大臣への報告飛行後の点検①機体にゴミ等の付着はないか②各機器は確実に取り付けられているか（ネジ等の脱落やゆるみ等）③機体（プロペラ、フレーム等）に損傷がゆがみはないか④各機器の異常な発熱はないか運航終了後の点検①機体やバッテリー等を安全な状態で適切な場所に保管したか②飛行日誌を作成したか（飛行記録、日常点検記録及び点検整備記録）等","以下は、プロセスごとに行うべき点検項目の例です。運航する無人航空機の特性や運航方法によっては、必要な点検などを追加で行う必要があります。\n\n【飛行前の準備】\n① 無人航空機の確認\n・無人航空機の登録及び有効期間\n・無人航空機の機体認証及び有効期間、ならびに使用の条件（運用限界）\n・整備状況 など\n② 操縦者の確認\n・技能証明の等級・限定・条件及び有効期間\n・操縦者の操縦能力、飛行経験、訓練状況 など\n③ 飛行空域及びその周囲の状況の確認\n・第三者の有無、地上又は水上の状況（住宅、学校、病院、道路、鉄道など）\n・航空機や他の無人航空機の飛行状況、空域の状況（空港・ヘリポート、管制区域・航空路など）\n・障害物や安全性に影響を及ぼす物件（高圧線、変電所、電波塔、無線施設など）の有無\n・小型無人機等飛行禁止法の飛行禁止空域、緊急用務空域、飛行自粛要請空域などに当てはまるかどうか\n④ 気象状況の確認\n・最新の気象情報（天気、風向、警報、注意報など）\n⑤ 航空法その他の法令等の必要な手続き\n・国の飛行の許可・承認の取得\n・必要な書類の携帯又は携行（技能証明書、飛行日誌、飛行の許可・承認書など）\n・航空法以外の法令等の必要な手続き など\n⑥ 立入管理措置・安全確保措置\n・飛行マニュアルの作成\n・第三者の立入りを管理する措置\n・安全管理者や補助者などの配置・役割・訓練状況\n・緊急時の措置（緊急着陸地点や、安全にホバリング・旋回ができる場所の設定など）\n⑦ 飛行計画の策定及び通報\n・上記の内容を踏まえて飛行計画を策定する\n・ドローン情報基盤システム（飛行計画通報機能）に入力して通報する\n\n【飛行前の点検】\n① 各機器は安全に取り付けられているか（ネジなどの脱落やゆるみなど）\n② 発動機やモーターに異音はないか\n③ 機体（プロペラ、フレームなど）に損傷やゆがみはないか\n④ 燃料の搭載量、又はバッテリーの充電量は十分か\n⑤ 通信系統、推進系統、電源系統及び自動制御系統は正常に作動するか\n⑥ 登録記号（試験飛行届出番号及び「試験飛行中」）が機体に表示されているか\n⑦ リモートID機能が正常に作動しているか（リモートID機能を持つ機器を装備する場合）\n　（例）リモートID機能が作動していることを示すランプが点灯していることの確認\n\n【飛行中の監視】\n① 無人航空機の飛行状況\n・無人航空機の異常の有無\n・計画どおりの経路・高度・速度などを維持できているか\n② 飛行空域及びその周囲の気象の変化\n③ 飛行空域及びその周囲の状況\n・航空機及び他の無人航空機の有無\n・第三者の有無 など\n\n【異常事態発生時の措置】\n① あらかじめ設定した手順などに従って危機回避行動をとる\n② 事故が発生したときは、直ちに無人航空機の飛行を中止し、危険を防止するための措置をとる\n・負傷者がいる場合はその救護・通報\n・事故などの状況に応じた警察への通報\n・火災が発生している場合の消防への通報 など\n③ 事故・重大インシデントの国土交通大臣への報告\n\n【飛行後の点検】\n① 機体にゴミなどの付着はないか\n② 各機器は確実に取り付けられているか（ネジなどの脱落やゆるみなど）\n③ 機体（プロペラ、フレームなど）に損傷やゆがみはないか\n④ 各機器に異常な発熱はないか\n\n【運航終了後の点検】\n① 機体やバッテリーなどを安全な状態で適切な場所に保管したか\n② 飛行日誌を作成したか（飛行記録、日常点検記録及び点検整備記録） など"],["5.1 操縦者の行動規範及び遵守事項 ガソリンエンジンで駆動する機体の注意事項","ガソリンは危険物に該当するため、乗用車等で運搬する場合には、消防法で定められた2２リットル以下の専用の容器で運搬しなければならない。エンジン駆動の場合には機体の振動が大きいため、ネジ類の緩みなどを特に注意して点検する必要がある。","ガソリンは危険物に当たります。そのため、乗用車などで運ぶ場合は、消防法で定められた22リットル以下の専用の容器で運搬する必要があります。\n\nまた、エンジン駆動の場合は機体の振動が大きくなります。そのため、ネジ類の緩みなどを特に注意して点検する必要があります。"],["5.1 操縦者の行動規範及び遵守事項 ペイロードを搭載あるいは物件投下時における注意事項","投下場所に補助者を配置しない場合、物件投下を行う際の高度は原則1m以内である必要がある。飛行申請","投下場所に補助者を配置しない場合、物件投下を行うときの高度は、原則として1m以内である必要があります。"],["5.1 操縦者の行動規範及び遵守事項 国土交通省への飛行申請","航空法においては、一定のリスクのある無人航空機の飛行については、そのリスクに応じた安全を確保するための措置を講ずることや、国土交通大臣から許可又は承認を取得した上で行うことを求めている。カテゴリーⅡ飛行については、当該申請に係る飛行開始予定日の10開庁日前までに申請書を所定の提出先に提出する必要がある。","航空法は、一定のリスクがある無人航空機の飛行について、次のことを求めています。\n・そのリスクに応じて、安全を確保するための措置をとること\n・国土交通大臣から許可または承認を受けたうえで飛ばすこと\nカテゴリーⅡ飛行の場合は、飛行を始める予定日の10開庁日前（役所が開いている日で数えて10日前）までに、申請書を決められた提出先に出す必要があります。"],["5.1 操縦者の行動規範及び遵守事項 カテゴリーⅢの飛行申請〔一等〕","カテゴリーⅢ飛行を行う場合には、一等無人航空機操縦士の技能証明を受けた者が第一種機体認証を受けた無人航空機を飛行させることに加えて、その運航の管理が適切に行われることについて、国土交通大臣から許可又は承認を取得する必要がある。具体的には、無人航空機を飛行させる者は、飛55行の形態に応じてリスクの分析と評価を行い、その結果に基づく非常時の対処方針や緊急着陸場所の設定などのリスク軽減策の内容を記載した飛行マニュアルの提出を含めて、運航の管理が適切に行われることについて申請しなければならない。また、飛行の許可・承認の審査において、無人航空機を飛行させる者が適切な保険に加入するなど賠償能力を有することの確認を行うこととしている。カテゴリーⅢ飛行については、通達「無人航空機の飛行に関する許可・承認の審査要領（カテゴリーⅢ飛行）」に従って、当該申請に係る飛行開始予定日の20開庁日前までに申請書を国土交通省航空局に提出しなければならない。","カテゴリーⅢ飛行を行うには、次のすべてが必要です。\n・一等無人航空機操縦士の技能証明を受けた人が飛ばすこと\n・第一種機体認証を受けた無人航空機を使うこと\n・運航の管理が適切に行われることについて、国土交通大臣から許可または承認を受けること\n具体的には、飛ばす人が飛行の形態に応じてリスクの分析と評価を行います。その結果をもとに、非常時の対処方針や緊急着陸場所の設定といったリスク軽減策の内容を書いた飛行マニュアルを提出し、運航の管理が適切に行われることを申請する必要があります。\nまた、飛行の許可・承認の審査では、飛ばす人が適切な保険に加入するなどして賠償能力を持っていることの確認も行われます。\nカテゴリーⅢ飛行の申請書は、通達「無人航空機の飛行に関する許可・承認の審査要領（カテゴリーⅢ飛行）」に従い、飛行を始める予定日の20開庁日前までに国土交通省航空局へ提出する必要があります。"],["5.1 操縦者の行動規範及び遵守事項 損害賠償能力の確保","無人航空機を飛行させる場合、飛行中における航空機や他の無人航空機との接触又は衝突、落下等による地上の人又は物件との接触または衝突により、第三者に損害を与えることが想定され、その場合には当該損害を賠償することが求められることがある。このことから、無人航空機を飛行させる場合には、万一の場合に備え賠償能力を確保しておくことが望まれるが、その対応としては、損害賠償責任保険に加入しておくことが有効と考えられる。このことから国土交通省においては、加入している保険の確認など無人航空機を飛行させる者が賠償能力を有することの確認を、許可・承認の審査の際に行っている。無人航空機の保険については大きく分けて以下の種類がある。種類特徴機体保険機体やカメラ自体の損傷に対する保険※機体が見つからないと保険が適用されないケースがあるため注意すること。","無人航空機を飛ばすと、次のようなことで第三者に損害を与えることが考えられます。\n・飛行中に航空機や他の無人航空機と接触・衝突する\n・落下などにより地上の人や物件と接触・衝突する\nその場合には、その損害を賠償するよう求められることがあります。そのため、万一に備えて賠償能力を確保しておくことが望まれます。その方法としては、損害賠償責任保険に加入しておくことが有効と考えられます。\nこうしたことから国土交通省では、許可・承認の審査の際に、加入している保険の確認などによって、飛ばす人に賠償能力があるかどうかを確認しています。\n無人航空機の保険は、大きく次の種類に分かれます。\n・機体保険…機体やカメラ自体の損傷に対する保険です。※機体が見つからないと保険が適用されないケースがあるため、注意してください。"],["5.1 操縦者の行動規範及び遵守事項 損害賠償能力の確保","※荷物輸送においては、輸送物が保険対象に含まれるか確認すること。損害賠償責任保険無人航空機を運航したことによっておこる損害に対する保険（対物・対人）","※荷物を運ぶ場合は、運ぶ物が保険の対象に含まれるかどうかを確認してください。\n・損害賠償責任保険…無人航空機を運航したことによって起きた損害に対する保険です（対物・対人）。"],["5.1 操縦者の行動規範及び遵守事項 無人航空機に係るセキュリティ確保","無人航空機は、それ自体の財産的な価値を狙った盗難の他、犯罪やプライバシー侵害等の目的で悪用することを意図した運航の妨害や、コントロールの奪取の危険がある。特に無人航空機が悪用された場合、第三者に被害が及ぶことが懸念されることから、無人航空機の所有者及び操縦者は、このような危険から当該無人航空機を守るため、セキュリティの確保に取り組まなければならない。無人航空機のセキュリティ対策として、例えば当該無人航空機及びその遠隔操縦のための機器を適切に管理することで、盗難等を防止することが望ましい。無人航空機にはプログラムに基づき自動又は自律で飛行するものも多くあり、そのようなものは、プログラムを不正に書き換えられる等により、当該無人航空機が奪取されたり操縦者の意図に反して悪用されたりする可能性がある。航空法に基づく機体認証・型式認証に係る安全基準は、無人航空機に係るサイバーセキュリティの観点からの適合性が証明されることも求めており、認証を受けた機体は一定のサイバーセキュリティ対策がされていることから、機体認証・型式認証を受けた機体を利用することで、リスクの軽減策となる。","無人航空機には、次のような危険があります。\n・機体そのものの財産的な価値を狙った盗難\n・犯罪やプライバシー侵害などの目的で悪用しようとする者による、運航の妨害やコントロールの奪取\n特に無人航空機が悪用されると、第三者に被害が及ぶことが心配されます。そのため、無人航空機の所有者と操縦者は、こうした危険から機体を守るために、セキュリティの確保に取り組む必要があります。\nセキュリティ対策の例としては、機体とその遠隔操縦のための機器を適切に管理し、盗難などを防ぐことが望ましいとされています。\nまた、無人航空機にはプログラムに基づいて自動または自律で飛ぶものも多くあります。そうした機体は、プログラムを不正に書き換えられるなどして、奪われたり、操縦者の意図に反して悪用されたりする可能性があります。\n航空法に基づく機体認証・型式認証の安全基準では、サイバーセキュリティの観点から見た適合性が証明されることも求めています。認証を受けた機体は一定のサイバーセキュリティ対策がされているため、機体認証・型式認証を受けた機体を使うことがリスクの軽減策になります。"],["5.1 操縦者の行動規範及び遵守事項 カテゴリーⅢ飛行のリスク評価結果による保険、セキュリティ〔一等〕","カテゴリーⅢ飛行は、第三者上空を飛行するリスクの高い運航であることから、その飛行の許可・承認の審査にあわせて、無人航空機を飛行させる者が賠償能力を有することの確認を行うこととしているが、その飛行の形態に応じたリスク評価を行い、その結果に基づき、必要な保険に加入することが望ましい。また、無人航空機の選定においては、飛行の形態に応じたリスク評価の結果に基づき必要なセキュリティ対策が講じられていることも考慮しなければならない。","カテゴリーⅢ飛行は、第三者の上空を飛ぶリスクの高い運航です。そのため、飛行の許可・承認の審査にあわせて、飛ばす人に賠償能力があるかどうかの確認を行うことになっています。\nそのうえで、飛行の形態に応じたリスク評価を行い、その結果に基づいて必要な保険に加入することが望ましいとされています。\nまた、機体を選ぶときも、飛行の形態に応じたリスク評価の結果に基づいて必要なセキュリティ対策がとられているかを考慮しなければなりません。"],["5.2 操縦者に求められる操縦知識 離陸","回転翼航空機（マルチローター）はコントローラー等によるスロットル操作によって高速に回転する翼から発せられる揚力が重力を上回ることにより離陸する。機体重量1.5kgほどの回転翼航空機（マルチローター）を例にすると、離陸直後から対地高度１ｍ程度までの間は、回転翼から発せられる吹きおろしの気流が地面付近で滞留し、揚力が増す現象「地面効果」が起こりやすくなる。","回転翼航空機（マルチローター）は、コントローラーなどのスロットル操作で翼を高速に回転させます。そこから生まれる揚力が重力を上回ることで離陸します。\n機体重量1.5kgほどの回転翼航空機（マルチローター）を例にすると、離陸直後から対地高度1m程度までの間は「地面効果」が起こりやすくなります。地面効果とは、回転翼から出る吹きおろしの気流が地面付近で滞留し、揚力が増す現象のことです。"],["5.2 操縦者に求められる操縦知識 ホバリング","離陸後、任意の対地高度で一定の高度と位置を継続的に維持することをホバリングという。ホバリング状態の機体は回転翼から発せられる揚力と、重力のバランスが保たれている状態を維持している。回転翼航空機（マルチローター）には飛行時に高い安定性を確保するために方位センサ、地磁気センサやGNSS受信機、気圧センサが用いられている。緊急時にはセンサ類に頼らない手動操作によるホバリングも要求される。","離陸したあと、任意の対地高度で、高度と位置を一定に保ち続けることをホバリングといいます。ホバリング状態の機体は、回転翼から生まれる揚力と重力のバランスが保たれた状態を維持しています。\n回転翼航空機（マルチローター）では、飛行時に高い安定性を確保するために次のものが使われています。\n・方位センサ\n・地磁気センサ\n・GNSS受信機\n・気圧センサ\nなお、緊急時には、これらのセンサ類に頼らない手動操作によるホバリングも求められます。"],["5.2 操縦者に求められる操縦知識 降下","機体を降下させるには、スロットル操作を徐々に弱め揚力を減少させる。機体を垂直降下させる時に、吹きおろした空気が再び吸い込まれ、回転翼の上下で空気の再循環が発生し急激に揚力を失う現象「ボルテックス・リング・ステート」が発生する。降下の際は水平方向の移動を合わせて操作することで墜落防止対策となる。","機体を降下させるには、スロットル操作を少しずつ弱めて揚力を減らします。\n機体を垂直に降下させるときには「ボルテックス・リング・ステート」が発生します。これは、吹きおろした空気を再び吸い込んでしまい、回転翼の上下で空気の再循環が起きて、急に揚力を失う現象です。\n降下のときは、水平方向の移動もあわせて操作することが墜落の防止対策になります。"],["5.2 操縦者に求められる操縦知識 着陸","降下を継続し着陸を行う際には、対地高度に応じて降下速度を減少させる。着地後にコントローラーでローターの回転を停止させる。57","降下を続けて着陸するときは、対地高度に応じて降下速度を落としていきます。着地したあとは、コントローラーでローターの回転を停止させます。"],["5.2 操縦者に求められる操縦知識 GNSS を使用しない操作","緊急時にはGNSS受信装置による機体位置推定機能を使用しない機体操作が求められる。","緊急時には、GNSS受信装置による機体位置の推定機能を使わずに機体を操作することが求められます。"],["5.2 操縦者に求められる操縦知識 GNSS を使用しないホバリング","ホバリング中GNSS受信機能を無効にすると、機体周辺の気流の影響で水平位置が不安定となるためエレベーター操作及びエルロン操作により水平位置を安定させホバリング飛行を維持させる。","ホバリング中にGNSSの受信機能を無効にすると、機体まわりの気流の影響で水平位置が不安定になります。そのため、エレベーター操作とエルロン操作で水平位置を安定させ、ホバリング飛行を維持させます。"],["5.2 操縦者に求められる操縦知識 GNSS を使用しない着陸","上述の操作によりホバリングを安定させながら、スロットル操作により機体を降下させ着陸させる。機体を垂直降下させる時に発生する「ボルテックス・リング・ステート」や、「地面効果」を抑制するために、細かくエレベーター又はエルロン操作などを行いながら、機体を着地させ着陸を完了させる。","上に書いた操作でホバリングを安定させながら、スロットル操作で機体を降下させて着陸させます。\n機体を垂直に降下させるときに起きる「ボルテックス・リング・ステート」や「地面効果」を抑えるため、エレベーターやエルロンを細かく操作しながら機体を着地させ、着陸を完了させます。"],["5.2 操縦者に求められる操縦知識 離着陸地点の選定","⚫水平な場所を選定すること。離着陸直前は、機体が水平となるため、傾斜地ではテール部などが地面に接触する恐れがある。⚫滑りやすい場所を避けること。離陸前は、ヨー軸まわりの制御が不十分な場合があり、ヨー軸を中心に回転する恐れがある。⚫砂又は乾燥した土の上は避けること。ローターのダウンウォッシュによる砂埃等が飛散し、視界を遮るおそれがある。","・水平な場所を選びます。離着陸の直前は機体が水平になるため、傾斜地ではテール部などが地面に接触するおそれがあります。\n・滑りやすい場所は避けます。離陸前はヨー軸まわりの制御が不十分な場合があり、ヨー軸を中心に機体が回転するおそれがあります。\n・砂の上や乾いた土の上は避けます。ローターのダウンウォッシュ（吹きおろしの風）で砂埃などが飛び散り、視界を遮るおそれがあります。"],["5.2 操縦者に求められる操縦知識 離陸方法","⚫十分にローター回転が上昇してから、離陸すること。ローター回転が低い状態で無理に離陸させると、機体の反応が遅れることがあり、危険である。⚫テールローターの作用で、離陸時に機体が左右いずれかに傾く場合がある。傾く方向はローターの回転方向により異なる。予め傾く方向を確認した上で、離陸させること。⚫ローター半径以下の高度では、地面効果の影響が顕著となり、機体が不安定になる。離陸後は速やかに地面効果外まで機体を上昇させること。⚫やむを得ない場合を除き、垂直方向の急上昇は避けること。ローター回転が低下し、機体が不安定になるおそれがある。","・ローターの回転が十分に上がってから離陸します。回転が低い状態で無理に離陸させると、機体の反応が遅れることがあり危険です。\n・テールローターの作用で、離陸時に機体が左右どちらかに傾く場合があります。傾く方向はローターの回転方向によって異なります。あらかじめ傾く方向を確認したうえで離陸させます。\n・ローター半径以下の高度では、地面効果の影響が大きくなり、機体が不安定になります。離陸後はすみやかに地面効果の外まで機体を上昇させます。\n・やむを得ない場合を除き、垂直方向の急上昇は避けます。ローターの回転が低下し、機体が不安定になるおそれがあります。"],["5.2 操縦者に求められる操縦知識 着陸方法","⚫地面に近づくにつれ、降下速度を遅くし、着陸による衝撃を抑えること。衝撃が大きい場合、脚部が変形又は破損するおそれがある。⚫地面効果範囲内のホバリングは避け、速やかに着陸させること。⚫接地後、ローターが停止するまで、機体に近づかないこと。58","・地面に近づくにつれて降下速度を遅くし、着陸による衝撃を抑えます。衝撃が大きいと、脚部が変形したり破損したりするおそれがあります。\n・地面効果の範囲内でのホバリングは避け、すみやかに着陸させます。\n・接地したあとは、ローターが停止するまで機体に近づきません。"],["5.2 操縦者に求められる操縦知識 離着陸地点の選定","⚫滑走路は水平で草などが伸びていない場所を選定すること。傾斜地では滑走中に不安定になり、また草などが伸びているとプロペラに接触し飛行ができないおそれがある。⚫飛行機の離着陸は風向が重要である。離着陸の方向は向かい風を選ぶのが原則である。横風であってもできる限り向かい風方向を選択する。追い風で行うと失速の危険性が生じ、失速しない速度にすると滑走路を逸脱する危険が生じる。","・滑走路は、水平で草などが伸びていない場所を選びます。傾斜地では滑走中に不安定になります。また、草などが伸びているとプロペラに接触して飛行できなくなるおそれがあります。\n・飛行機の離着陸では風向きが重要です。離着陸の方向は向かい風を選ぶのが原則です。横風のときでも、できる限り向かい風の方向を選びます。追い風で行うと失速の危険が生じ、失速しない速度にすると滑走路をはみ出す危険が生じます。"],["5.2 操縦者に求められる操縦知識 離陸方法","⚫向かい風方向に滑走できるエリアを確保できたら離陸操縦に入る。⚫風速を考慮し適切なパワーをかけてエレベーターによる上昇角度をとり離陸する。⚫上昇角度は失速しないように設定する。安全な高度まで機体を上昇させる。","・向かい風の方向に滑走できるエリアを確保できたら、離陸の操縦に入ります。\n・風速を考えて適切なパワーをかけ、エレベーターで上昇角度をとって離陸します。\n・上昇角度は失速しないように設定します。安全な高度まで機体を上昇させます。"],["5.2 操縦者に求められる操縦知識 着陸方法","⚫向かい風方向に滑走できるエリアを確保できたら着陸操縦に入る。⚫地面に近づくにつれ、降下速度を遅くし、滑空着陸による衝撃を抑えること。衝撃が大きい場合、脚部が変形又は破損するおそれがある。⚫目測の誤りにより滑走路を逸脱することがあるので、厳重に注意が必要である。","・向かい風の方向に滑走できるエリアを確保できたら、着陸の操縦に入ります。\n・地面に近づくにつれて降下速度を遅くし、滑空着陸による衝撃を抑えます。衝撃が大きいと、脚部が変形したり破損したりするおそれがあります。\n・目測を誤って滑走路をはみ出すことがあるので、厳重な注意が必要です。"],["5.2 操縦者に求められる操縦知識 カテゴリーⅢ飛行において追加で必要となる離着陸の注意点〔一等〕","カテゴリーⅢ飛行は立入管理措置を講ずることなく行うものであるため、その飛行形態に応じて第三者の立入りがあるものと認識したリスク評価において、離着陸に関して考慮する注意点の例としては以下のとおり。⚫離着陸に際しては、第三者及び第三者の物件と機体が接触するなど第三者の安全が損なわれるおそれがないようにする。⚫離着陸時ローターから発せられる風の影響を受け、物などが飛ばされ、第三者及び第三者の物件に危害を加えることがないようにする。⚫第三者の物件等が多いエリアでの離着陸が考えられることから、家屋の壁面などの構造物の近接による機体のタウンウォッシュの跳ね返り等により、離着陸時に機体が不安定になることが考えられるような環境はあらかじめ離着陸エリアから除外する。","カテゴリーⅢ飛行は、立入管理措置（＝第三者が飛行範囲に入らないようにする措置）をとらずに行う飛行です。そのため、飛行の形態に応じて第三者の立入りがあるものと考えたうえでリスク評価を行います。離着陸について考えるべき注意点の例は次のとおりです。\n・離着陸のとき、第三者や第三者の物件に機体が接触するなどして、第三者の安全が損なわれるおそれがないようにします。\n・離着陸のときにローターから出る風の影響で物などが飛ばされ、第三者や第三者の物件に危害を加えることがないようにします。\n・第三者の物件などが多いエリアでの離着陸も考えられます。家屋の壁面などの構造物が近いと、機体のダウンウォッシュ（吹きおろしの風）が跳ね返るなどして、離着陸時に機体が不安定になることが考えられます。そうした環境は、あらかじめ離着陸エリアから外しておきます。"],["5.2 操縦者に求められる操縦知識 カテゴリーⅢ飛行において追加で必要となる離着陸の注意点〔一等〕","⚫第三者の物件等が多いエリアでは、離着陸エリア上空周辺に電線などの障害物がない、又はこれを回避できる空域をあらかじめ選定する。59手動操縦及び自動操縦","第三者の物件などが多いエリアで飛ばすときは、離着陸エリアの上空やその周辺に電線などの障害物がない空域を、あらかじめ選んでおきます。障害物があっても回避できる空域であれば、それを選んでも構いません。"],["5.2 操縦者に求められる操縦知識 無人航空機の操縦方法（自動操縦と手動操縦）","無人航空機は優れた安定性と高い飛行性能から、人による手動操縦だけでなく、アプリケーションなどにより事前に設定した飛行経路を正確に飛行することが可能となっている。飛行自体は自動で飛行し、機体に付属している撮影用カメラなどのみ人が操作するような複合的な操縦も行える。空中写真測量などによる飛行では測地エリアを指定するのみで自動的に飛行経路や撮影地点をプランニングする機能も備えられている。手動操縦は送信機のスティックにより機体の移動を命令して行う。操縦者の操縦技量によって飛行の安定性に差が生じるが、操縦技量が向上すると自動操縦では実現できない複雑で変化に対応した機体の操作が行える。","無人航空機は安定性が高く飛行性能も優れているため、人が手で操縦する方法（手動操縦）だけでなく、アプリなどで事前に決めた飛行経路を正確に飛ぶこともできます。\n・飛行そのものは自動にまかせ、機体に付いている撮影用カメラなどだけを人が操作する、という組み合わせの操縦もできます。\n・空中写真測量などでは、測る範囲（測地エリア）を指定するだけで、飛行経路や撮影地点を自動で計画してくれる機能もあります。\n手動操縦は、送信機のスティックで機体に動きを指示して飛ばす方法です。操縦者の腕によって飛行の安定性に差が出ますが、技量が上がれば、自動操縦ではできない複雑な操作や、状況の変化に合わせた操作ができるようになります。"],["5.2 操縦者に求められる操縦知識 手動操縦の特徴とメリット","無人航空機の安定飛行に必要なGNSS受信機やセンサを用いた機体を、コントローラースティックで意図した方向に飛行させるが、その制御は全て人が行う。操縦者の習熟度によって飛行高度の微調整や回転半径や飛行速度の調整、遠隔地での高精度な着陸など細かな操作が行え、複雑な構造物の点検作業や耕作地の農薬散布、映画のような芸術性を要求される空撮などでは手動操縦で行われることもある。安定した飛行に使われているGNSS受信機や電子コンパス、気圧センサなどが何らかの原因により機能不全に陥ったときには手動操縦による危険回避が求められる。定められた航路を高精度に飛行をするなど、高い再現性を求められる操縦には不向きである。","手動操縦は、GNSS受信機（＝人工衛星の電波で位置を測る装置）やセンサを積んだ機体を、コントローラーのスティックで思いどおりの方向に飛ばす方法です。制御はすべて人が行います。\n操縦者の習熟度によって、次のような細かい操作ができます。\n・飛行高度の微調整\n・回転半径や飛行速度の調整\n・遠く離れた場所での高精度な着陸\nそのため、複雑な構造物の点検、耕作地への農薬散布、映画のような芸術性が求められる空撮などでは、手動操縦で行うこともあります。\nまた、安定飛行に使っているGNSS受信機・電子コンパス・気圧センサなどが何らかの原因で正しく働かなくなったときは、手動操縦で危険を避けることが求められます。\n一方で、決められた航路を高い精度でなぞるなど、同じ飛び方を何度も再現したい用途には向きません。"],["5.2 操縦者に求められる操縦知識 自動操縦の特徴とメリット","飛行を制御するアプリケーションソフトに搭載されている地図情報に、予め複数の飛行時のウエイポイント（経過点）を設定し飛行経路を作成する。ウェイポイントは地図上の位置情報の設定だけでなく、機体の向きや高度、速度など詳細な設定が可能である。手動操縦に比較して、再現性の高い飛行を行うことができるため、経過観察が必要とされる用地や、離島への輸送、生育状況を把握する耕作地などの飛行に利用される。","自動操縦は、飛行を制御するアプリの地図上に、ウェイポイント（＝飛行の経過点）を複数決めて飛行経路をつくる方法です。ウェイポイントには地図上の位置だけでなく、機体の向き・高度・速度なども細かく設定できます。\n手動操縦より再現性の高い飛行ができるので、次のような飛行に使われます。\n・経過観察が必要な用地\n・離島への輸送\n・生育状況を把握する耕作地"],["5.2 操縦者に求められる操縦知識 自動操縦におけるヒューマンエラーの傾向","ウェイポイント設定時、飛行経路上の障害物等の確認不足によって衝突や墜落が発生することが想定できる。設定した飛行経路上の障害物等は事前に現地確認を行うこと。60","自動操縦で起きやすい人のミスは、ウェイポイントを設定するときに、飛行経路上の障害物などの確認が足りないことです。その結果、衝突や墜落につながることが考えられます。設定した飛行経路上の障害物などは、事前に現地で確認してください。"],["5.2 操縦者に求められる操縦知識 手動操縦におけるヒューマンエラーの傾向","手動操縦は無人航空機を精密に制御できる反面、操縦経験の浅い操縦士が操作を行うと様々な要因で意図しない方向に飛行してしまう場合がある。これは操縦者の視線と回転翼航空機の正面方向が異なる場合に発生しやすい。さらに機体と操縦者との距離が離れると機体付近の障害物などとの距離差が掴みにくくなり接触しやすい状況となる。これらのリスク回避には、機体をあらゆる方向に向けても確実に意図した方向や高度に制御できる訓練や、指定された距離での着陸訓練などが有効となる。","手動操縦は機体を細かく正確に動かせますが、その反面、操縦経験の浅い人が操作すると、いろいろな原因で意図しない方向へ飛んでしまうことがあります。\n・特に起きやすいのは、操縦者から見ている向きと、回転翼航空機の正面の向きがそろっていない場合です。\n・さらに機体と操縦者の距離が離れると、機体と周りの障害物との距離の差がつかみにくくなり、ぶつかりやすくなります。\nこうしたリスクを避けるには、次の訓練が有効です。\n・機体をどの方向に向けても、思ったとおりの方向・高度に確実に制御できる訓練\n・指定された距離での着陸訓練"],["5.2 操縦者に求められる操縦知識 自動操縦と手動操縦の切り替えにおける操作上の注意と対応","自動操縦中、下記のような状況下で手動操作に切り替える場合がある。⚫作業指示による手動操作⚫何らかの原因で不安定な飛行と判断した場合手動操縦に切り替えた後は、急な飛行速度の低下や失速に備えた操作準備や、障害物への接近を避けるための機体方向の確認、ホバリングしての機体の安定性や周囲の安全の確認などが必要となる。また、必要に応じ、鳥などの野生動物からの妨害を想定した防御等、手動操縦への切り替えを速やかに行える等の体制を整えておくこと。","自動操縦の最中でも、次のような場合には手動操作に切り替えることがあります。\n・作業の指示による手動操作\n・何らかの原因で飛行が不安定だと判断した場合\n手動操縦に切り替えたあとは、次のことが必要です。\n・急に飛行速度が落ちたり失速したりしても対応できるよう、操作の準備をしておく\n・障害物に近づかないよう、機体の向きを確認する\n・ホバリングして、機体が安定しているか、周囲が安全かを確認する\nまた必要に応じて、鳥などの野生動物に妨害されることも想定した防御など、手動操縦へすぐ切り替えられる体制を整えておいてください。"],["5.2 操縦者に求められる操縦知識 機体のフェールセーフ機能","送信電波や電源容量の減少などにより飛行が継続できない場合、又は継続できないことが予想される場合は、予め飛行制御アプリケーションのフェールセーフ機能により、自動帰還モードへ切り替わり、離陸地点へ飛行する。さらにバッテリー残量が極端に少ない場合などはその場で自動着陸を試みる。フェールセーフ機能発動時、機体の動作をホバリング、その地点での着陸、自動帰還などの設定を行うことができる機体もある。61フェールセーフ機能発動中にバッテリー残量不足等により飛行が継続できない場合、又は予想される場合、機体は着陸動作に遷移し着陸を試みる。","送信電波が届かなくなったり電源の容量が減ったりして、飛行を続けられない場合、または続けられないと予想される場合は、飛行制御アプリのフェールセーフ機能があらかじめ働き、自動帰還モードに切り替わって離陸地点へ戻ります。さらにバッテリー残量が極端に少ないときなどは、その場で自動着陸を試みます。\n機体によっては、フェールセーフ機能が働いたときの動作を、ホバリング・その場で着陸・自動帰還などから設定できるものもあります。\nフェールセーフ機能が働いている最中に、バッテリー残量不足などで飛行を続けられない場合、または続けられないと予想される場合、機体は着陸動作に移って着陸を試みます。"],["5.2 操縦者に求められる操縦知識 事故発生時の運航者の行動","運航者は、事故発生時においては、直ちに無人航空機の飛行を中止するとともに、負傷者がいる場合には、第一にその負傷者の救護及び緊急通報、事故等の状況に応じた警察への通報、火災が発生している場合の消防への通報など、危険を防止するための必要な措置を講じ、次に当該事故が発生した日時及び場所等の必要事項を国土交通大臣に報告しなければならない。","事故が起きたとき、運航者はまず、ただちに無人航空機の飛行をやめます。そのうえで、危険を防ぐために必要な措置をとります。\n・けが人がいる場合は、何よりも先にそのけが人を救護し、緊急通報をする\n・事故などの状況に応じて警察へ通報する\n・火災が起きている場合は消防へ通報する\nこれらを行ったあとに、事故が起きた日時や場所などの必要事項を、国土交通大臣へ報告する必要があります。"],["5.2 操縦者に求められる操縦知識 カテゴリーⅢ飛行において追加となる緊急時対応手順〔一等〕","カテゴリーⅢ飛行は立入管理措置を講ずることなく行うものであるため、その飛行形態に応じて第三者の立入りがあるものと認識してリスクの分析及び評価を行い、その結果に基づくリスク軽減策を講じる必要がある。例えば、カテゴリーⅢ飛行の際に緊急対応が求められる場合に備えて、予め対応手順を設定するとともに、速やかに当該対応が実施できるよう訓練を実施することが考えられる。その際に考慮すべき項目の例を以下に示す。⚫GNSSによる位置の安定機能を用いない飛行訓練⚫機体寸法に応じた緊急着陸地点の確保⚫フェールセーフ機能が動作しない飛行距離等の把握⚫墜落時の安全優先順位の明確化⚫機体が発火した際の消火方法⚫緊急連絡網の作成","カテゴリーⅢ飛行は、立入管理措置（＝人が入らないようにする措置）をとらずに行う飛行です。そのため、飛行の形態に応じて「第三者が入ってくることがある」と考えたうえでリスクを分析・評価し、その結果に基づいてリスクを減らす対策をとる必要があります。\nたとえば、カテゴリーⅢ飛行で緊急対応が必要になる場合に備えて、あらかじめ対応手順を決めておき、すぐに実行できるよう訓練しておくことが考えられます。そのときに考えておくとよい項目の例は次のとおりです。\n・GNSSによる位置の安定機能を使わない飛行訓練\n・機体の大きさに合った緊急着陸地点の確保\n・フェールセーフ機能が働かなくなる飛行距離などの把握\n・墜落したときに何を優先して守るかをはっきりさせておくこと\n・機体が発火したときの消火方法\n・緊急連絡網の作成"],["5.3 操縦者のパフォーマンス","操縦者のパフォーマンスの低下操縦者は疲労を感じても飛行を継続してしまう傾向にあるため、適切に飛行時間を管理する必要がある。操縦者が高いストレスを抱えている状態は安全な飛行を妨げる要因となるため、操縦者との適切なコミュニケーションを運航の計画（飛行計画の作成、運航体制の構築、飛行前の準備、飛行中及び飛行後の対応等の一連の運航全般に係る計画をいう。以下同じ。）に組み込む等ストレス軽減を図る必要がある。アルコール又は薬物に関する規定前夜に飲酒した場合でも、翌日の操縦時までアルコールの影響を受けている可能性があることに注意が必要であり、アルコール検知器を活用することも有用である。62","【操縦者のパフォーマンスの低下】\n操縦者は疲れを感じても飛行を続けてしまいがちです。そのため、飛行時間を適切に管理する必要があります。\nまた、操縦者が強いストレスを抱えている状態は、安全な飛行のさまたげになります。操縦者と適切にコミュニケーションをとることを運航の計画に組み込むなどして、ストレスを減らす必要があります。ここでいう「運航の計画」とは、飛行計画の作成、運航体制の構築、飛行前の準備、飛行中および飛行後の対応といった、運航全体に関わる一連の計画のことです（以下同じ）。\n【アルコールや薬物についての決まり】\n前の夜にお酒を飲んだ場合でも、翌日の操縦のときまでアルコールの影響が残っている可能性があります。この点に注意が必要で、アルコール検知器を使うことも役に立ちます。"],["5.4 安全な運航のための意思決定体制（CRM 等の理解）","CRM(CrewResourceManagement)事故等の防止のためには、操縦技量（テクニカルスキル）の向上は有効な対策だが、これだけでは人間の特性や能力の限界」（ヒューマンファクター）の観点からヒューマンエラーを完全になくすことはできない。これに対処するためには、全ての利用可能な人的リソース、ハードウェア及び情報を活用した「CRM（CrewResourceManagement）」という概念が有効である。CRMの効果を最大限発揮するために「TEM（ThreatandErrorManagement）」という手法が取り入れられている。ここで「スレット（Threat）」は「エラー（Error）」を誘発する要因であり、操縦者だけではスレットやエラーの発生状況を把握することが困難な場合があり、この場合適切な対処がとれず、無人航空機が安全マージンの低下したUAS（UndesiredAircraftState：望ましくない航空機の状態）に至り、更に事故等につながるおそれがある。TEMとは、このような状態に陥らないために、補助者や関係者との相互確認、機体や送信機の警報、飛行空域周辺状況に関する最新情報の入手など、全ての利用可能なリソースを活用し、エラーにつながりかねないスレット（気象の変化、疲労、機材不具合など）の発生状況を早期に把握・管理し、万一エラーやUASに至ったとしても事故等に至らないように適切に対処しようとする手法である。","【CRM（Crew Resource Management）】\n事故などを防ぐには、操縦技量（テクニカルスキル）を上げることが有効な対策です。ただし、それだけでは「人間の特性や能力の限界」（ヒューマンファクター）という点から、人のミス（ヒューマンエラー）を完全になくすことはできません。\nそこで有効なのが、使える人的リソース・ハードウェア・情報のすべてを活用するという「CRM（Crew Resource Management）」という考え方です。\n【TEM（Threat and Error Management）】\nCRMの効果を最大限に発揮するために、「TEM（Threat and Error Management）」という手法が取り入れられています。\nここでいう「スレット（Threat）」とは、「エラー（Error）」を引き起こす原因のことです。操縦者だけでは、スレットやエラーが起きている状況をつかみきれない場合があります。その場合は適切な対処ができず、無人航空機の安全マージンが下がってUAS（Undesired Aircraft State＝望ましくない航空機の状態）になり、さらに事故などにつながるおそれがあります。\nTEMとは、そうした状態に陥らないために、次のような使えるリソースをすべて活用する手法です。\n・補助者や関係者との相互確認\n・機体や送信機の警報\n・飛行空域の周辺状況に関する最新情報の入手\nこれらによって、エラーにつながりかねないスレット（気象の変化、疲労、機材の不具合など）が起きている状況を早めにつかんで管理し、万一エラーやUASに至っても事故などにならないよう適切に対処します。"],["5.4 安全な運航のための意思決定体制（CRM 等の理解）","TEMを効果的に実践するための能力は、状況認識、意思決定、ワークロード管理、チームワーク、コミュニケーションといった５つのCRMスキル（ノンテクニカルスキル）である。安全な運航のための補助者の必要性、役割及び配置無人航空機を飛行させる操縦者は機体の動きや操縦に集中する必要があり、離着陸エリアを含めた飛行経路の管理を操縦と同時に行うことが困難であるため、飛行準備や飛行経路の安全管理、第三者の立入管理などは補助者が主として行う必要がある。補助者は、離着陸場所や飛行経路周辺の地上や空域の安全確認を行うほか、飛行前の事前確認で明らかになった障害物等の対処について手順に従い作業を行う。操縦者とのコミュニケーションは予め決められた手段を用いて行い、危険予知の警告や緊急着陸地点への誘導、着陸後の機体回収や安全点検の補助も行う。","TEMをうまく実践するための力が、5つのCRMスキル（ノンテクニカルスキル）です。\n・状況認識\n・意思決定\n・ワークロード管理\n・チームワーク\n・コミュニケーション\n【安全な運航のための補助者の必要性・役割・配置】\n無人航空機を飛ばす操縦者は、機体の動きや操縦に集中する必要があります。そのため、離着陸エリアを含む飛行経路の管理を、操縦と同時に行うのは困難です。そこで、飛行の準備、飛行経路の安全管理、第三者の立入管理などは、主に補助者が行う必要があります。\n補助者の役割は次のとおりです。\n・離着陸場所や飛行経路の周辺について、地上と空域の安全を確認する\n・飛行前の事前確認で見つかった障害物などへの対処を、手順に従って行う\n・操縦者とのやり取りは、あらかじめ決めておいた手段で行う\n・危険を予知したときの警告や、緊急着陸地点への誘導を行う\n・着陸後の機体の回収や安全点検を手伝う"],["5.4 安全な運航のための意思決定体制（CRM 等の理解）","無人航空機の飛行経路や範囲に応じ補助者の数や配置、各人の担当範囲や役割、異常運航時の対応方法も決めておく必要がある。63","無人航空機の飛行経路や飛行範囲に合わせて、次のことも決めておく必要があります。\n・補助者の人数と配置\n・それぞれの担当範囲と役割\n・異常が起きたときの対応方法"],["6.1 運航リスクの評価及び最適な運航の計画の立案の基礎","安全に配慮した飛行無人航空機の飛行にあたっては、法令等に基づく基準や要件に適合させるのは当然だが、様々な要素により、飛行中、操縦が困難になること、又は予期せぬ機体故障等が発生する場合があることから、運航者は運航上の「リスク」を管理することが安全確保上非常に重要である。すなわち、運航者は行おうとする運航の形態に応じ、事故等につながりかねない危険性のある要素（ハザード）を具体的に可能な限り多く特定し、それによって生じる「リスク」を評価したうえで、「リスク」の発生確率を低減させたり、「リスク」の結果となる被害を軽減したりする措置を講じることで、「リスク」を許容可能な程度まで低減する必要がある。このようなリスク管理の考え方は、特にカテゴリーⅢ飛行において重要となるが、その他の飛行においても十分に理解したうえで、安全に配慮した計画や飛行を行うことが求められる。","【安全に配慮した飛行】\n無人航空機を飛ばすときに、法令などの基準や要件を満たすのは当然です。しかしそれだけでなく、いろいろな要因で飛行中に操縦が難しくなったり、思わぬ機体の故障などが起きたりすることがあります。そのため、運航者が運航上の「リスク」を管理することが、安全確保のうえでとても重要です。\n具体的には、運航者は行おうとする運航の形態に応じて、次の手順を踏み、リスクを許容できる程度まで下げる必要があります。\n・事故などにつながりかねない危険な要素（ハザード）を、できるだけ多く具体的に洗い出す\n・それによって生じる「リスク」を評価する\n・「リスク」が起こる確率を下げる、または「リスク」が起きたときの被害を軽くする対策をとる\nこうしたリスク管理の考え方は、特にカテゴリーⅢ飛行で重要になります。ただし、それ以外の飛行でも十分に理解したうえで、安全に配慮した計画と飛行を行うことが求められます。"],["6.1 運航リスクの評価及び最適な運航の計画の立案の基礎 安全マージン","飛行を行う際は、原則として飛行空域に安全マージンを加えた範囲で実施する。⚫飛行経路を考慮し、周辺及び上方に障害物がない水平な場所を離着陸場所と設定する。⚫緊急時などに一時的な着陸が可能なスペースを、前もって確認・確保しておく。⚫飛行領域に危険半径（高度と同じ数値又は30ｍのいずれか長い方）を加えた範囲を、立入管理措置を講じて無人地帯とした後に、飛行する。","飛行するときは、原則として、飛行空域に安全マージンを加えた範囲で行います。\n・飛行経路を考えて、周りにも上にも障害物がない水平な場所を離着陸場所にします。\n・緊急時などに一時的に着陸できるスペースを、前もって確認・確保しておきます。\n・飛行領域に危険半径を加えた範囲について、立入管理措置をとって無人地帯にしてから飛行します。危険半径は、高度と同じ数値か30mのどちらか長い方です。"],["6.1 運航リスクの評価及び最適な運航の計画の立案の基礎 飛行の逸脱防止","飛行の逸脱を防止するためには、以下の事項を行うことが有効である。⚫ジオフェンス機能を使用することにより、飛行禁止空域を設定する。⚫衝突防止機能として無人航空機に取り付けたセンサを用いて、周囲の障害物を認識・回避する。","飛行経路から外れてしまうこと（逸脱）を防ぐには、次のことが有効です。\n・ジオフェンス機能を使って、飛行禁止空域を設定する。\n・衝突防止機能として、無人航空機に取り付けたセンサで周りの障害物を認識し、避ける。"],["6.1 運航リスクの評価及び最適な運航の計画の立案の基礎 安全を確保するための運航体制","安全を確保するための運航体制として、操縦と安全管理の役割を分割させる目的で操縦者に加えて、安全管理者（運航管理者）を配置することが望ましい。64飛行計画","安全を確保するための運航体制としては、操縦と安全管理の役割を分けるために、操縦者に加えて安全管理者（運航管理者）を置くことが望ましいです。"],["6.1 運航リスクの評価及び最適な運航の計画の立案の基礎 飛行計画策定時の確認事項","飛行計画では、無人航空機の飛行経路・飛行範囲を決定し、無人航空機を運航するにあたって、自治体など各関係者・権利者への周知や承諾が必要となる場合がある。離着陸場は人の立入りや騒音、コンパスエラーの原因となる構造物がないかなどに留意する。飛行経路の設定は高圧電線などの電力施設が近くにないか、緊急用務空域に当たらないか、ドクターヘリなどの航空機の往来がないかなどを考慮に入れる必要がある。着陸予定地点に着陸できないときに、離陸地点まで戻るほどの飛行可能距離が確保できないなどのリスクがある場合、別途事前に緊急着陸地点を確保しておくべきである。飛行計画の全ての工程において安全管理が優先され、離陸前、離陸時、計画経路の飛行、着陸時、着陸後の状況に応じた安全対策を講じ、飛行の目的を果たす飛行計画の策定が求められる。","飛行計画では、無人航空機の飛行経路と飛行範囲を決めます。運航にあたっては、自治体など関係者・権利者への周知や承諾が必要になる場合があります。\n・離着陸場は、人が入ってこないか、騒音の問題はないか、コンパスエラーの原因になる構造物がないかなどに注意します。\n・飛行経路を決めるときは、高圧電線などの電力施設が近くにないか、緊急用務空域に当たらないか、ドクターヘリなどの航空機の行き来がないかなどを考える必要があります。\n・着陸予定地点に着陸できなかったときに、離陸地点まで戻れるだけの飛行可能距離が確保できないなどのリスクがある場合は、別に緊急着陸地点を事前に確保しておくべきです。\n飛行計画のすべての工程で安全管理が優先されます。離陸前・離陸時・計画経路の飛行中・着陸時・着陸後、それぞれの状況に応じた安全対策をとり、そのうえで飛行の目的を果たせる飛行計画を立てることが求められます。"],["6.1 運航リスクの評価及び最適な運航の計画の立案の基礎 飛行計画策定時の確認事項","飛行計画策定時は、機体の物理的障害や飛行範囲特有の現象、制度面での規制、事前に予想しうる状況の変化などを想定した確認事項の作成が求められる。予定される飛行経路や日時において緊急用務空域の発令など、一時的な飛行規制の対象空域の該当となっていないかなど計画策定時に確認する必要がある。","飛行計画を立てるときは、次のようなことを想定して確認事項をつくることが求められます。\n・機体の物理的な障害\n・その飛行範囲に特有の現象\n・制度面での規制\n・事前に予想できる状況の変化\nまた、予定している飛行経路や日時が、緊急用務空域の発令など一時的な飛行規制の対象空域に当たっていないかを、計画を立てる段階で確認する必要があります。"],["6.1 運航リスクの評価及び最適な運航の計画の立案の基礎 事故・インシデントへの対応","無人航空機の運航中に万が一事故やインシデントが発生した場合を想定し、事前に緊急連絡先を定義しておく。負傷者や第三者物件への物損が発生した場合は、直ちに当該無人航空機の飛行を中止するとともに、人命救助を最優先に行動し、消防署や警察に連絡するなど危険を防止するための必要な措置を講じなければならない。また、「無人航空機の事故及び重大インシデントの報告要領」に従って、速やかに国土交通大臣に事故等の報告をしなければならない。","無人航空機の運航中に事故やインシデントが起きる場合を想定して、緊急連絡先をあらかじめ決めておきます。\n\nけが人が出た場合や、第三者の物件を壊した場合は、次の対応が必要です。\n・すぐにその無人航空機の飛行を中止する\n・人命救助を最優先に行動する\n・消防署や警察に連絡するなど、危険を防ぐために必要な措置をとる\n\nさらに、「無人航空機の事故及び重大インシデントの報告要領」に従って、速やかに国土交通大臣へ事故等を報告する必要があります。"],["6.1 運航リスクの評価及び最適な運航の計画の立案の基礎 カテゴリーⅢ飛行において追加となる安全確保〔一等〕","カテゴリーⅢ飛行の飛行形態に応じたリスク評価において、機体選定に関して考慮する注意点の例としては以下のとおり。⚫地上の第三者への被害の可能性を低減させる対策として、必要最低限の数より多くのプロペラ及びモーターを有するなど、適切な冗長性を備えた機体を使用すること。⚫地上の第三者への被害を軽減させる対策として、パラシュートを展開するなど、落下時の衝撃エネルギーを軽減できる機能を有する機体を使用すること。経路設定","カテゴリーⅢ飛行では、飛行の形態に合わせてリスクを評価します。そのとき、機体を選ぶうえで考える注意点の例は次のとおりです。\n\n・地上の第三者への被害が起きる可能性を下げる対策として、必要最低限の数より多くのプロペラとモーターを備えるなど、適切な冗長性がある機体を使うこと\n・地上の第三者への被害を小さくする対策として、パラシュートを開くなど、落下したときの衝撃エネルギーを減らせる機能を持つ機体を使うこと"],["6.1 運航リスクの評価及び最適な運航の計画の立案の基礎 飛行経路の安全な設定","飛行経路は、無人航空機が飛行する高度と経路において、障害となる建物や鳥などの妨害から避けられるよう設定する。障害物付近を飛行せざるを得ない経路を設定する際は機体の性能に応じて安全な距離を保つように心がける。65操縦者の目視が限界域付近となる飛行では、付近の障害物との距離差が曖昧になりやすいため、事前に飛行経路付近の障害物との距離を現地で確認し、必要と判断した場合は補助者を配置する。","飛行経路は、無人航空機が飛ぶ高度と経路において、じゃまになる建物や鳥などを避けられるように決めます。障害物の近くを飛ばざるを得ない経路にするときは、機体の性能に応じて安全な距離を保つよう心がけます。\n\n操縦者の目視の限界に近いところを飛ばす飛行では、付近の障害物との距離の差があいまいになりやすくなります。そのため、事前に現地で飛行経路付近の障害物との距離を確認し、必要と判断したときは補助者を配置します。"],["6.1 運航リスクの評価及び最適な運航の計画の立案の基礎 カテゴリーⅢ飛行において追加となる経路設定の注意点〔一等〕","カテゴリーⅢ飛行においては、飛行形態に応じてリスクの分析及び評価を行い、その結果に基づくリスク軽減策を講じる必要がある。経路設定に当たっては、地上リスクと空中リスクの両方に関し、逸脱や墜落などの異常事態時におけるリスク軽減策を講じる必要があるが、具体的な対策の例は以下のとおりである。なお、これらに必要となる機体の機能や安全対策は事前に検証が必要である。⚫可能な限り第三者の立入りが少ない飛行経路を設定する。⚫飛行経路付近に緊急着陸地点や不時着エリアを予め設定する。⚫飛行経路からの逸脱を防止するためのジオフェンス機能を設定する。⚫ジオフェンス機能の設定において、当日の他の航空機との空域調整結果が反映されていることを確認する。無人航空機の運航におけるハザードとリスク無人航空機の運航において、「ハザード」は事故等につながる可能性のある危険要素（潜在的なものを含む。）をいう。「リスク」は無人航空機の運航の安全に影響を与える何らかの事象が発生する可能性をいう。発生事象のリスクは、予測される頻度（被害の発生確率）と結果の重大性（被害の大きさ）により計量する。","カテゴリーⅢ飛行では、飛行の形態に応じてリスクの分析と評価を行い、その結果にもとづくリスク軽減策をとる必要があります。\n\n経路を決めるときは、地上リスクと空中リスクの両方について、経路からの逸脱や墜落といった異常事態が起きたときのリスク軽減策が必要です。具体的な対策の例は次のとおりです。\n・できる限り第三者の立入りが少ない飛行経路にする\n・飛行経路の近くに緊急着陸地点や不時着エリアをあらかじめ決めておく\n・飛行経路から外れるのを防ぐためのジオフェンス機能を設定する\n・ジオフェンス機能の設定に、当日の他の航空機との空域調整の結果が反映されていることを確認する\nなお、これらに必要な機体の機能や安全対策は、事前に検証しておく必要があります。\n\n【無人航空機の運航におけるハザードとリスク】\n・ハザード＝事故などにつながる可能性のある危険要素のこと（まだ表に出ていない潜在的なものも含みます）\n・リスク＝無人航空機の運航の安全に影響を与える何らかの事象が起こる可能性のこと\n起きた事象のリスクは、予測される頻度（被害が起こる確率）と、結果の重大性（被害の大きさ）で測ります。"],["6.1 運航リスクの評価及び最適な運航の計画の立案の基礎 カテゴリーⅢ飛行において追加となる経路設定の注意点〔一等〕","無人航空機の運航リスクの評価無人航空機の飛行にあたって、リスク評価とその結果に基づくリスク軽減策の検討は安全確保上非常に重要である。すなわち、運航形態に応じ、事故等につながりかねない具体的な「ハザード」を可能な限り多く特定し、それによって生じる「リスク」を評価したうえで、リスクを許容可能な程度まで低減する。リスクを低減するためには、①事象の発生確率を低減するか、②事象発生による被害を軽減するか、の両方を検討したうえで必要な対策をとる。例えば、機材不具合というハザードによる墜落というリスクに対しては、機材不具合の可能性を低減するために信頼性の高い機材を使用（上記①）したり、墜落時にパラシュートにより地上の被害を低減（上記②）したりなどの対策が考えられる。","【無人航空機の運航リスクの評価】\n無人航空機を飛ばすとき、リスク評価と、その結果にもとづくリスク軽減策の検討は、安全を確保するうえでとても重要です。\n\n具体的には、次のように進めます。\n・運航の形態に応じて、事故などにつながりかねない具体的な「ハザード」をできるだけ多く洗い出す\n・それによって生じる「リスク」を評価する\n・リスクを許容できる程度まで下げる\n\nリスクを下げるには、①その事象が起こる確率を下げる、②事象が起きたときの被害を小さくする、の両方を検討したうえで、必要な対策をとります。\n\n例えば、機材不具合というハザードによる墜落というリスクに対しては、次のような対策が考えられます。\n・機材不具合の可能性を下げるために、信頼性の高い機材を使う（①にあたる）\n・墜落したときにパラシュートで地上の被害を小さくする（②にあたる）"],["6.1 運航リスクの評価及び最適な運航の計画の立案の基礎 カテゴリーⅢ飛行において追加となる経路設定の注意点〔一等〕","カテゴリーⅢ飛行におけるリスク評価〔一等〕第三者上空を飛行するカテゴリーⅢ飛行は、万一墜落等の事故が生じた場合には、人の生命及び身体に甚大な被害をもたらすリスクの高い飛行となることから、より一層の安全に配慮すべきである。このため、一等無人航空機操縦士の技能証明を受けた者が第一種機体認証を受けた無人航空機を飛行させることに加え、あらかじめ、その運航の管理が適切に行われることについて国による飛行の許可・承認を受けることが必要となる。具体的には、飛行形態に応じてリスクの分析及び評価を行い、その結果に基づくリスク軽減策を講じる66必要がある。また、無人航空機を飛行させる際の適切な運航管理の体制を維持するため、リスク評価の結果に基づくリスク軽減策の内容等を記載した飛行マニュアルを作成・遵守することが求められる。","【カテゴリーⅢ飛行におけるリスク評価〔一等〕】\n第三者の上空を飛ぶカテゴリーⅢ飛行は、万一墜落などの事故が起きると、人の生命や身体に甚大な被害をもたらす、リスクの高い飛行です。そのため、いっそう安全に配慮する必要があります。\n\nそこで、次の両方が必要になります。\n・一等無人航空機操縦士の技能証明を受けた人が、第一種機体認証を受けた無人航空機を飛行させること\n・その運航の管理が適切に行われることについて、あらかじめ国から飛行の許可・承認を受けること\n\n具体的には、飛行の形態に応じてリスクの分析と評価を行い、その結果にもとづくリスク軽減策をとる必要があります。\n\nまた、飛ばすときの適切な運航管理の体制を保つため、リスク評価の結果にもとづくリスク軽減策の内容などを書いた飛行マニュアルを作り、それを守ることが求められます。"],["6.1 運航リスクの評価及び最適な運航の計画の立案の基礎 カテゴリーⅢ飛行において追加となる経路設定の注意点〔一等〕","(1)において「無人航空機の飛行に関する許可・承認の審査要領（カテゴリーⅢ飛行）」におけるリスク評価の基本的な考え方を、(2)においてリスク評価手法の1つである「安全確保措置検討のための無人航空機の運航リスク評価ガイドライン」（公益財団法人福島イノベーション・コースト構想推進機構福島ロボットテストフィールド発行）（以下「リスク評価ガイドライン」という。）の概要をそれぞれ示す。","このあとの説明は、次の構成になっています。\n\n・(1)では、「無人航空機の飛行に関する許可・承認の審査要領（カテゴリーⅢ飛行）」におけるリスク評価の基本的な考え方を示します。\n・(2)では、リスク評価手法の1つである「安全確保措置検討のための無人航空機の運航リスク評価ガイドライン」（公益財団法人福島イノベーション・コースト構想推進機構 福島ロボットテストフィールド発行。以下「リスク評価ガイドライン」といいます）の概要を示します。"],["6.1 運航リスクの評価及び最適な運航の計画の立案の基礎 リスク分析及び評価において考慮すべき事項","「無人航空機の飛行に関する許可・承認の審査要領（カテゴリーⅢ飛行）」においては、国による飛行の許可・承認を受けるための申請を行う場合には、飛行形態に応じてリスクの分析及び評価を行い、その結果を提出することを求めている。リスクの分析及び評価において考慮すべき事項は少なくとも以下を含むこととしている。①次の事項を含む運航計画・飛行の日時・飛行する空域及びその地域・無人航空機を飛行させる者及び運航体制・使用する無人航空機・飛行の目的・飛行の方法②飛行経路における人との衝突リスク（地上リスク）及び航空機との衝突リスク（空中リスク）③電波環境（無線通信ネットワークを利用して操縦を行う場合に限る。）④使用条件等指定書で指定された使用の条件等、使用する無人航空機の情報⑤無人航空機を飛行させる者の無人航空機操縦者技能証明及び訓練の内容⑥無人航空機を飛行させる者を補助する者等を含めた運航体制","「無人航空機の飛行に関する許可・承認の審査要領（カテゴリーⅢ飛行）」では、国から飛行の許可・承認を受けるための申請をするときに、飛行の形態に応じてリスクの分析と評価を行い、その結果を提出することを求めています。\n\nリスクの分析と評価で考えるべき事項には、少なくとも次のものが含まれます。\n\n① 次の内容を含む運航計画\n・飛行の日時\n・飛行する空域とその地域\n・無人航空機を飛行させる人と運航体制\n・使用する無人航空機\n・飛行の目的\n・飛行の方法\n② 飛行経路における人との衝突リスク（地上リスク）と、航空機との衝突リスク（空中リスク）\n③ 電波環境（無線通信ネットワークを使って操縦する場合だけ）\n④ 使用条件等指定書で指定された使用の条件など、使用する無人航空機の情報\n⑤ 無人航空機を飛行させる人の無人航空機操縦者技能証明と、訓練の内容\n⑥ 無人航空機を飛行させる人を補助する人などを含めた運航体制"],["6.1 運航リスクの評価及び最適な運航の計画の立案の基礎 リスク軽減策を記載した飛行マニュアル","無人航空機を飛行させる際の適切な運航管理の体制を維持するため、リスク評価の結果に基づくリスク軽減策の内容を記載した飛行マニュアルの作成・遵守をすることが求められる。当該飛行マニュアルに記載する事項として例えば以下のようなものがある。①無人航空機の点検・整備無人航空機の機能及び性能に関する基準に適合した状態を維持するため、次に掲げる事項に留意して、機体の点検・整備の方法を記載する。・機体の点検・整備の方法・機体の点検・整備の記録の作成方法・整備の実施・責任体制の明確化②無人航空機を飛行させる者の訓練67無人航空機を飛行させる者の飛行経歴、知識及び能力を確保・維持するため、次に掲げる事項に留意して、無人航空機を飛行させる者の訓練方法等を記載する。","無人航空機を飛ばすときの適切な運航管理の体制を保つため、リスク評価の結果にもとづくリスク軽減策の内容を書いた飛行マニュアルを作り、それを守ることが求められます。飛行マニュアルに書く事項には、例えば次のようなものがあります。\n\n① 無人航空機の点検・整備\n機体の機能と性能に関する基準に合った状態を保つため、次の点に気をつけて、機体の点検・整備の方法を書きます。\n・機体の点検・整備の方法\n・機体の点検・整備の記録の作り方\n・整備の実施と、責任体制をはっきりさせること\n\n② 無人航空機を飛行させる人の訓練\n飛ばす人の飛行経歴・知識・能力を確保して保つため、次の点に気をつけて、飛ばす人の訓練方法などを書きます。"],["6.1 運航リスクの評価及び最適な運航の計画の立案の基礎 リスク軽減策を記載した飛行マニュアル","・無人航空機を飛行させる者の資格に関する事項・知識及び能力を習得するための訓練方法・知識及び能力を維持させるための訓練方法・飛行記録（訓練を含む。）の作成方法・無人航空機を飛行させる者が遵守しなければならない事項・訓練の実施・管理体制の明確化③無人航空機を飛行させる際の安全を確保するために必要な体制次に掲げる事項に留意して、安全を確保するために必要な体制を記載する。・飛行前の安全確認の方法・無人航空機を飛行させる際の安全管理体制・事故等の報告要領に定める事態への対応及び連絡体制","（飛行マニュアルに書く事項の続き）\n\n② 無人航空機を飛行させる人の訓練で書く内容\n・飛ばす人の資格に関すること\n・知識と能力を身につけるための訓練方法\n・知識と能力を保つための訓練方法\n・飛行記録（訓練を含む）の作り方\n・飛ばす人が守らなければならないこと\n・訓練の実施と、管理体制をはっきりさせること\n\n③ 無人航空機を飛行させるときの安全を確保するために必要な体制\n次の点に気をつけて、安全を確保するために必要な体制を書きます。\n・飛行前の安全確認の方法\n・無人航空機を飛行させるときの安全管理体制\n・事故等の報告要領に定められた事態への対応と、連絡体制"],["6.1 運航リスクの評価及び最適な運航の計画の立案の基礎 リスク評価ガイドラインによるリスク評価手法〔一等〕","「無人航空機の飛行に関する許可・承認の審査要領（カテゴリーⅢ飛行）」においては、リスク評価ガイドラインによるリスク評価手法を活用することが推奨されている。リスク評価ガイドラインは、JARUS(JointAuthoritiesforRulemakingofUnmannedSystems)のSORA(SpecificOperationsRiskAssessment)を参考に作成したものである。ここでは、リスク評価ガイドラインによるリスク評価手法の概要を記載するが、詳細についてはリスク評価ガイドラインを参照すること。","「無人航空機の飛行に関する許可・承認の審査要領（カテゴリーⅢ飛行）」では、リスク評価ガイドラインによるリスク評価手法を活用することがすすめられています。\n\nこのリスク評価ガイドラインは、JARUS（Joint Authorities for Rulemaking of Unmanned Systems）のSORA（Specific Operations Risk Assessment）を参考にして作られたものです。\n\nここではリスク評価ガイドラインによるリスク評価手法の概要を説明します。詳しい内容はリスク評価ガイドラインを参照してください。"],["6.1 運航リスクの評価及び最適な運航の計画の立案の基礎 リスク評価のための基本的なコンセプト","a.セマンティックモデル（想定飛行空間と想定外飛行空間）「想定飛行空間」は、無人航空機の飛行の目的や、機体やシステムの性能、環境に応じて設定される飛行範囲である。機体や外部システムの異常・外乱の影響で想定飛行空間を外れて飛行してしまうことに備える空間として「想定外飛行空間」を設定する。無人航空機の運航が正常に制御できている正常運航時は、標準運航手順に従って飛行を行う。機体や外部システムの異常・外乱の影響で想定飛行空間から外れてしまうおそれ、又は外れてしまった異常事態では、直ちに「異常対応手順」へと移る。異常対応手順により想定飛行空間へと復旧するのに必要な飛行空間を想定外飛行空間として確保する。想定飛行空間と想定外飛行空間を合わせたものが「オペレーション空間」であり、その空間から万一外れてしまった緊急事態では、直ちに「緊急時対応手順」と「緊急時対応計画」を実行する。","a. セマンティックモデル（想定飛行空間と想定外飛行空間）\n\n・想定飛行空間＝無人航空機の飛行の目的、機体やシステムの性能、環境に応じて決める飛行範囲のことです。\n・想定外飛行空間＝機体や外部システムの異常・外乱の影響で、想定飛行空間から外れて飛んでしまうことに備えて設ける空間です。\n\n運航が正常に制御できている正常運航時は、標準運航手順に従って飛行します。\n\n機体や外部システムの異常・外乱の影響で、想定飛行空間から外れるおそれがあるとき、または実際に外れてしまった異常事態では、すぐに「異常対応手順」に移ります。この異常対応手順によって想定飛行空間へ戻すために必要な飛行空間を、想定外飛行空間として確保します。\n\n想定飛行空間と想定外飛行空間を合わせたものが「オペレーション空間」です。万一その空間からも外れてしまった緊急事態では、すぐに「緊急時対応手順」と「緊急時対応計画」を実行します。"],["6.1 運航リスクの評価及び最適な運航の計画の立案の基礎 リスク評価のための基本的なコンセプト","飛行の地上リスクを検討する際には、オペレーション空間からさらに安全マージンとしての「地上リスク緩衝地域」を合わせた範囲を検討し、そのリスクを一定の範囲まで低減するように計画する。飛行の空中リスクを検討する際には、オペレーション空間からさらに任意で「空中リスク緩衝空域」を合わせた68範囲を検討し、そのリスクを一定の範囲まで低減するように計画する。「隣接エリア」は、オペレーション空間並びに地上リスク緩衝地域及び空中リスク緩衝空域に隣接する区域であり、無人航空機が制御不能な形で進入してしまった場合に高いリスクが想定される場合には、隣接エリアに進入しないための対策を検討する。b.ロバスト性（安全確保に必要とされる安全性の水準及び保証の水準）安全確保措置を計画するに当たって、ロバスト性は重要な概念であり、安全確保措置により得られる「安全性の水準」（安全性の増加）と、計画されている安全性の確保が確実に実施されることを示す「保証の水準」（証明の方法）の双方を勘案して評価される。","飛行の地上リスクを検討するときは、オペレーション空間に、安全のゆとり（安全マージン）として「地上リスク緩衝地域」を加えた範囲を検討し、そのリスクを一定の範囲まで下げるように計画します。\n\n飛行の空中リスクを検討するときは、オペレーション空間に、任意で「空中リスク緩衝空域」を加えた範囲を検討し、そのリスクを一定の範囲まで下げるように計画します。\n\n「隣接エリア」とは、オペレーション空間・地上リスク緩衝地域・空中リスク緩衝空域のとなりにある区域のことです。無人航空機が制御できない形でそこへ入ってしまった場合に高いリスクが想定されるときは、隣接エリアに入らないための対策を検討します。\n\nb. ロバスト性（安全確保に必要とされる安全性の水準と保証の水準）\n安全確保措置を計画するうえで、ロバスト性は重要な考え方です。次の2つの両方を勘案して評価します。\n・安全性の水準＝その安全確保措置によって得られる安全性の増加\n・保証の水準＝計画した安全性の確保が確実に実施されることを示す証明の方法"],["6.1 運航リスクの評価及び最適な運航の計画の立案の基礎 リスク評価のための基本的なコンセプト","安全確保措置に必要とされるロバスト性の水準は、運航形態のリスクに応じて検討し、低、中、高の３つの異なる水準があり、安全性の水準と保証の水準の低い方に準じて評価する。例えば、中レベルの安全性の措置が、低レベルの水準で保証された場合には、その安全確保措置は低レベルと評価される。c.総合リスクモデルリスク評価における「総合リスクモデル」とは、無人航空機の運航に伴うリスク、ハザード、脅威、安全確保措置の一般的な枠組みである。","安全確保措置に必要とされるロバスト性の水準は、運航形態のリスクに応じて検討します。水準は低・中・高の3つがあり、安全性の水準と保証の水準のうち、低い方に合わせて評価します。\n\n例えば、中レベルの安全性の措置であっても、低レベルの水準で保証された場合は、その安全確保措置は低レベルと評価されます。\n\nc. 総合リスクモデル\nリスク評価でいう「総合リスクモデル」とは、無人航空機の運航に伴うリスク・ハザード・脅威・安全確保措置についての、一般的な枠組みのことです。"],["6.1 運航リスクの評価及び最適な運航の計画の立案の基礎 リスク評価手法","リスク評価ガイドラインによるリスク評価手法は、次に掲げる６ステップにより構成される。ここでは、当該手法の概要を記載するが、詳細についてはリスク評価ガイドラインを参照すること。a.Step1：運航計画（CONOPS）の説明リスク評価の最初のステップとして「運航計画（CONOPS）」を明確にする。なお、リスク評価の結果要求される対策や安全確保措置のロバスト性の要求により修正が必要な場合がある。b.Step2：地上リスクの把握無人航空機の最大寸法及び運動エネルギーと、想定する運航形態に基づき、判定表を用いて地上リスククラスを判定し、地上リスクの軽減策とロバスト性により調整し、調整後の地上リスククラスを決定する。c.Step3：空中リスクの把握想定する飛行空域において航空機と遭遇する確率について定性的に「空中リスククラス」として判定し、必要により戦略的対策を講じることにより低減し、残留する空中リスククラス（ARC-a／ARC-b／ARC-c／ARC-d）を決定する。","リスク評価ガイドラインによるリスク評価手法は、次の6つのステップでできています。ここでは概要を説明します。詳しい内容はリスク評価ガイドラインを参照してください。\n\na. Step1：運航計画（CONOPS）の説明\nリスク評価の最初のステップとして、「運航計画（CONOPS）」をはっきりさせます。なお、リスク評価の結果として求められる対策や、安全確保措置のロバスト性の要求によって、運航計画の修正が必要になる場合があります。\n\nb. Step2：地上リスクの把握\n無人航空機の最大寸法と運動エネルギー、想定する運航形態にもとづいて、判定表を使って地上リスククラスを判定します。そのうえで地上リスクの軽減策とロバスト性によって調整し、調整後の地上リスククラスを決めます。\n\nc. Step3：空中リスクの把握\n想定する飛行空域で航空機と遭遇する確率を、定性的に「空中リスククラス」として判定します。必要に応じて戦略的対策をとって低減し、残る空中リスククラス（ARC-a／ARC-b／ARC-c／ARC-d）を決めます。"],["6.1 運航リスクの評価及び最適な運航の計画の立案の基礎 リスク評価手法","「戦略的対策」とは、飛行前に航空機との遭遇確率やリスクにさらされている時間を低減するための任意の対策であり、特定の時間帯や特定の境界内での飛行などが挙げられる。一方で、「戦術的対策」とは、飛行中に航空機との衝突を回避するための対策であり、残留する空中リスククラスに応じて対策69の要求レベルとロバスト性のレベルが割り当てられる。d.Step4：運航に関わる安全目標の確認これまでのステップで特定された地上リスククラスと空中リスククラスを用いて「安全性と保証のレベル（SAIL）」を決定する。そのSAILに基づき、「運航に関わる安全目標（OSO）」とその安全目標に対するロバスト性が決定される。運航者は、安全確保措置の安全性の水準と保証の水準により、運航に関わる安全目標（OSO）に対するロバスト性を満たしていることを確認する。","・戦略的対策＝飛行前に、航空機と遭遇する確率や、リスクにさらされている時間を減らすための任意の対策です。特定の時間帯に飛ぶ、特定の境界の中で飛ぶ、などが挙げられます。\n・戦術的対策＝飛行中に航空機との衝突を回避するための対策です。残る空中リスククラスに応じて、対策の要求レベルとロバスト性のレベルが割り当てられます。\n\nd. Step4：運航に関わる安全目標の確認\nここまでのステップで特定した地上リスククラスと空中リスククラスを使って、「安全性と保証のレベル（SAIL）」を決めます。そのSAILにもとづいて、「運航に関わる安全目標（OSO）」と、その安全目標に対するロバスト性が決まります。運航者は、安全確保措置の安全性の水準と保証の水準によって、運航に関わる安全目標（OSO）に対するロバスト性を満たしていることを確認します。"],["6.1 運航リスクの評価及び最適な運航の計画の立案の基礎 リスク評価手法","e.Step5：隣接エリアの考慮オペレーション空間に隣接するエリアについても評価し、そのリスクが高い場合には、逸脱を防止するための対策を講じる。f.Step6：評価結果に対する対応これまでのステップで評価されたリスクに対する要求事項を十分満足することを確認し、各対策や安全目標を達成するため、リスク評価結果に基づき飛行マニュアルを作成する。なお、リスク評価の結果必要とされる対策や安全目標を達成することができない場合は、運航計画（CONOPS）を修正する。","e. Step5：隣接エリアの考慮\nオペレーション空間にとなり合うエリアについても評価します。そのリスクが高い場合は、逸脱を防止するための対策をとります。\n\nf. Step6：評価結果に対する対応\nここまでのステップで評価したリスクに対する要求事項を、十分に満たしていることを確認します。そして、それぞれの対策や安全目標を達成するため、リスク評価の結果にもとづいて飛行マニュアルを作ります。\n\nなお、リスク評価の結果、必要とされる対策や安全目標を達成できない場合は、運航計画（CONOPS）を修正します。"],["6.2 気象の基礎知識及び気象情報を基にしたリスク評価及び運航の計画の立案 無人航空機における気象の重要性","無人航空機を安全に飛行させるための重要な要素の一つが気象である。航空法では「当該無人航空機及びその周囲の状況を目視により常時監視して飛行させること。」とされている。これは目視可能な距離外での無人航空機の飛行を禁止するだけではなく、近距離であっても無人航空機の飛行状況や他の物件との安全な距離が確保されていることを目視で確認できない雲中や濃霧等の気象状態では無人航空機を飛行させてはならないことを意味する。安全な飛行を実施するためには、まず一般的な天気予報だけではなく、どのような気象情報や予報が提供されているかを理解する必要がある。そして、自らの作業内容、時間、環境に応じて、雲や視程障害、風向風速及び降水等、自ら行う飛行に影響する気象情報を適切に入手、分析して、離陸から着陸に至るまで支障のある気象状況にならないことを確認した後に飛行を開始しなければならない。","無人航空機を安全に飛行させるための重要な要素の一つが気象です。\n\n航空法では「当該無人航空機及びその周囲の状況を目視により常時監視して飛行させること。」とされています。これは、目視できる距離の外で飛ばすことを禁止しているだけではありません。近い距離であっても、無人航空機の飛行状況や、他の物件との安全な距離が確保されていることを目視で確認できない雲の中や濃い霧などの気象状態では、飛行させてはいけないという意味です。\n\n安全な飛行のためには、まず一般的な天気予報だけでなく、どのような気象情報や予報が提供されているかを理解する必要があります。\n\nそのうえで、自分の作業内容・時間・環境に応じて、雲や視程障害、風向風速、降水など、自分が行う飛行に影響する気象情報を適切に入手して分析します。離陸から着陸まで支障のある気象状況にならないことを確認してから、飛行を開始する必要があります。"],["6.2 気象の基礎知識及び気象情報を基にしたリスク評価及び運航の計画の立案 安全な飛行を行うために確認すべき気象の情報源","参考となる気象情報には、以下が挙げられる。⚫アメダス⚫気象レーダー⚫実況天気図、予報天気図、悪天解析図インターネットを活用した気象情報の入手も有効である。","参考となる気象情報には、次のものが挙げられます。\n・アメダス\n・気象レーダー\n・実況天気図、予報天気図、悪天解析図\n\nインターネットを活用して気象情報を入手することも有効です。"],["6.2 気象の基礎知識及び気象情報を基にしたリスク評価及び運航の計画の立案 天気図の見方","天気図には、各地で観測した天気、気圧、気温、風向、風力や高気圧、低気圧、前線の位置及び等圧線などが描かれている。実況天気図、予想天気図から気圧配置、前線の位置、移動速度などを確認する。等圧線の間隔から風の強弱を知ることができ、等圧線の間隔が狭いほど風は強まる。","天気図には、各地で観測した天気・気圧・気温・風向・風力のほか、高気圧、低気圧、前線の位置、等圧線などが描かれています。\n\n実況天気図や予想天気図から、気圧配置、前線の位置、移動速度などを確認します。\n\n等圧線の間隔からは、風の強弱がわかります。等圧線の間隔が狭いほど、風は強まります。"],["6.2 気象の基礎知識及び気象情報を基にしたリスク評価及び運航の計画の立案 風","天気記号に付いた矢の向きが風向を表す。風が吹いてくる方向に矢が突き出しており、観測では16又は36方位を用いているが、予報では8方位で表す。矢羽根の数が風力（気象庁風力階級表による風力の尺度）を表す。風力０～12までの13段階で表す。","天気記号についている矢の向きが風向を表します。矢は、風が吹いてくる方向に突き出しています。方位の細かさは場面によって違います。\n・観測：16方位または36方位を使う\n・予報：8方位で表す\n矢羽根の数は風力（気象庁風力階級表による風力の尺度）を表します。風力は0から12までの13段階です。"],["6.2 気象の基礎知識及び気象情報を基にしたリスク評価及び運航の計画の立案 気圧","大気の圧力をいい、単位はヘクトパスカル（hPa）で標準大気圧（１気圧）は、1013hPaである。","気圧とは、大気の圧力のことです。単位はヘクトパスカル（hPa）を使います。標準大気圧（1気圧）は1013hPaです。"],["6.2 気象の基礎知識及び気象情報を基にしたリスク評価及び運航の計画の立案 高気圧","周囲よりも相対的に気圧が高いところを高圧部といい、その中で閉じた等圧線で囲まれたところを高気圧という。北半球では時計回りに等圧線と約30度の角度で中心から外へ向かって風を吹き出している。高気圧の中心部では下降気流が発生し一般的に天気はよい。","周囲より気圧が相対的に高いところを高圧部といいます。その中で、閉じた等圧線で囲まれたところが高気圧です。\n・北半球では、時計回りに、等圧線と約30度の角度をつけて、中心から外へ風を吹き出しています。\n・高気圧の中心部では下降気流が発生し、天気は一般的によくなります。"],["6.2 気象の基礎知識及び気象情報を基にしたリスク評価及び運航の計画の立案 低気圧","周囲よりも相対的に気圧が低いところを低圧部といい、その中で閉じた等圧線で囲まれたところを低71気圧という。北半球では反時計回りに低気圧の中心に向かって周囲から風が吹き込む。中心部では上昇気流が起こり、雲が発生し一般的に天気は悪い。","周囲より気圧が相対的に低いところを低圧部といいます。その中で、閉じた等圧線で囲まれたところが低気圧です。\n・北半球では、反時計回りに、周囲から低気圧の中心に向かって風が吹き込みます。\n・中心部では上昇気流が起こって雲が発生し、天気は一般的に悪くなります。"],["6.2 気象の基礎知識及び気象情報を基にしたリスク評価及び運航の計画の立案 冬の天気","冬の悪い天気の代表は｢雪｣と｢風｣である｡シベリア高気圧が優勢になり冬の季節風の吹き出しが始まると、まず気象衛星の雲写真に沿海州から日本海へ流れる帯状の雲が現れる。冬型の天気の典型は西高東低といわれるもので、天気図では西側に高気圧、東側に低気圧という気圧配置で、日本海側に雪をもたらす。","冬の悪い天気の代表は「雪」と「風」です。シベリア高気圧が優勢になり、冬の季節風の吹き出しが始まると、まず気象衛星の雲写真に、沿海州から日本海へ流れる帯状の雲が現れます。\n冬型の天気の典型は「西高東低」と呼ばれるものです。天気図では西側に高気圧、東側に低気圧という気圧配置になり、日本海側に雪をもたらします。"],["6.2 気象の基礎知識及び気象情報を基にしたリスク評価及び運航の計画の立案 春と秋の天気","日本の天気を支配するのは冬のシベリア高気圧と夏の太平洋高気圧であり、春と秋は両高気圧の勢力が入れ替わるときである｡このとき日本付近に両気団の境界ができ、前線が停滞し、広い範囲に悪い天気をもたらし、１週間くらい雨が降り続き、低い雲高や視程障害をもたらす。","日本の天気を支配するのは、冬のシベリア高気圧と夏の太平洋高気圧です。春と秋は、この二つの高気圧の勢力が入れ替わる時期にあたります。\nこのとき日本付近に両方の気団の境界ができ、前線が停滞します。その結果、広い範囲に悪い天気をもたらし、1週間くらい雨が降り続いて、低い雲高や視程障害をもたらします。"],["6.2 気象の基礎知識及び気象情報を基にしたリスク評価及び運航の計画の立案 前線","温度や湿度の異なる気団（空気の塊）が出会った場合、二つの気団はすぐには混ざらないで境界ができる。境界が地表と接するところを前線という。a.寒冷前線発達した積乱雲により、突風や雷を伴い短時間で断続的に強い雨が降る。前線が接近してくると南から南東よりの風が通過後は風向きが急変し、西から北西よりの風に変わり、気温が下がる。b.温暖前線層状の厚い雲が段々と広がり近づくと気温、湿度は次第に高くなり、時には雷雨を伴うときもあるが、弱い雨が絶え間なく降る。通過後は北東の風が南寄りに変わる。c.閉塞前線寒冷前線が温暖前線に追いついた前線で、閉塞が進むと次第に低気圧の勢力が弱くなる。d.停滞前線気団同士の勢力が変わらないため、ほぼ同じ位置に留まっている前線で、長雨をもたらす梅雨前線や秋雨前線がこれにあたる。","温度や湿度が異なる気団（空気の塊）が出会っても、二つの気団はすぐには混ざらず、境界ができます。この境界が地表と接するところを前線といいます。\na. 寒冷前線：発達した積乱雲により、突風や雷を伴い、短時間で断続的に強い雨が降ります。前線が接近してくると南から南東よりの風が吹き、通過後は風向きが急変して西から北西よりの風に変わり、気温が下がります。\nb. 温暖前線：層状の厚い雲が段々と広がります。近づくと気温と湿度が次第に高くなり、時には雷雨を伴うこともありますが、弱い雨が絶え間なく降ります。通過後は北東の風が南寄りに変わります。\nc. 閉塞前線：寒冷前線が温暖前線に追いついてできた前線です。閉塞が進むと、低気圧の勢力は次第に弱くなります。\nd. 停滞前線：気団同士の勢力が変わらないため、ほぼ同じ位置に留まっている前線です。長雨をもたらす梅雨前線や秋雨前線がこれにあたります。"],["6.2 気象の基礎知識及び気象情報を基にしたリスク評価及び運航の計画の立案 前線","e.梅雨前線梅雨前線とは、四季の変わり目に出現する長雨（菜種梅雨、梅雨、秋霖など）のうち、とくに顕著な長雨、大雨をもたらす停滞前線のことである。72気象の影響","e. 梅雨前線：梅雨前線とは、四季の変わり目に出てくる長雨（菜種梅雨、梅雨、秋霖など）のうち、とくに顕著な長雨や大雨をもたらす停滞前線のことです。"],["6.2 気象の基礎知識及び気象情報を基にしたリスク評価及び運航の計画の立案 雲と降水","雲には１０種雲形と呼ばれる１０種類の雲の形がある。上層雲として巻雲・巻層雲・巻積雲が、中層雲として高層雲・乱層雲・高積雲が、低層雲と下層から発達する雲として積雲・積乱雲・層積雲・層雲がある。このうち層雲系の雲では連続的な降水が、積雲系であれば断続的でしゅう雨性の降水を伴う傾向がある。","雲には「10種雲形」と呼ばれる10種類の雲の形があります。\n・上層雲：巻雲・巻層雲・巻積雲\n・中層雲：高層雲・乱層雲・高積雲\n・低層雲と下層から発達する雲：積雲・積乱雲・層積雲・層雲\nこのうち層雲系の雲では連続的な降水が、積雲系の雲であれば断続的でしゅう雨性の降水を伴う傾向があります。"],["6.2 気象の基礎知識及び気象情報を基にしたリスク評価及び運航の計画の立案 風","a.風と気圧風とは、空気の水平方向の流れをいい、風向と風速で表す。空気は、気圧の高いほうから低いほうに向かうが、この流れが風である。等圧線の間隔が狭いほど風は強く吹く。b.風向風向は、風が吹いてくる方向で、例えば、北の風とは北から南に向かって吹く風をいう。風向は360度を16等分し、北から時計回りに北→北北東→北東→東北東→東のように表す。c.風速風速は空気の動く早さで、メートル毎秒（m/s）で表す。風は必ずしも一定の強さで吹いているわけではなく、単に風速と言えば、観測時の前10分間における平均風速のことをいう。また、平均風速の最大値を最大風速、瞬間風速の最大値を最大瞬間風速という。風は地面の摩擦を受けるため、一般的に上空では強く地表に近づくにつれて弱くなる。変化の度合いは地表の粗度（樹木や建物などによる凸凹の程度）や風速の大きさによって異なる。一般に地表の粗度が大きいほど、高さによる風速の変化は大きくなる。","a. 風と気圧\n風とは、空気が水平方向に流れることで、風向と風速で表します。空気は気圧の高いほうから低いほうへ向かい、この流れが風です。等圧線の間隔が狭いほど、風は強く吹きます。\nb. 風向\n風向は、風が吹いてくる方向です。たとえば「北の風」とは、北から南に向かって吹く風のことです。風向は360度を16等分し、北から時計回りに、北→北北東→北東→東北東→東のように表します。\nc. 風速\n風速は空気が動く速さで、メートル毎秒（m/s）で表します。風は必ずしも一定の強さで吹いているわけではありません。単に「風速」といえば、観測時の前10分間における平均風速のことです。\n・最大風速：平均風速の最大値\n・最大瞬間風速：瞬間風速の最大値\n風は地面の摩擦を受けるため、一般的に上空では強く、地表に近づくにつれて弱くなります。変化の度合いは、地表の粗度（樹木や建物などによる凸凹の程度）や風速の大きさによって異なります。一般に地表の粗度が大きいほど、高さによる風速の変化は大きくなります。"],["6.2 気象の基礎知識及び気象情報を基にしたリスク評価及び運航の計画の立案 風","d.突風低気圧が接近すると、寒冷前線付近の上昇気流によって発達した積乱雲により、強い雨や雷とともに突風が発生することがある。日本付近では、天気は西から東に変わるため、西から寒冷前線を伴う低気圧が接近するときは、突風が発生する時間帯を予測することができる。e.海陸風気温差があると、気圧差が生じて風が吹く。海陸風は海と陸との気温差によって生じる局地的な風で、日本では、日差しの強い夏の沿岸部で顕著に見られる。地表付近において、日中は、暖まりやすい陸上73に向かって風が吹き、夜間は、冷めにくい海上に向かって風が吹く。風が入れ替わるときには、ほぼ無風状態になり、「朝凪」「夕凪」と呼ばれる。f.山谷風山岳地帯に現れる風の一種。昼間は、日射で暖められた空気が谷を這い上がる谷風が吹き、夜間は冷えた空気が山から降りる山風が吹く。","d. 突風\n低気圧が接近すると、寒冷前線付近の上昇気流によって発達した積乱雲により、強い雨や雷とともに突風が発生することがあります。日本付近では天気が西から東へ変わるため、西から寒冷前線を伴う低気圧が接近するときは、突風が発生する時間帯を予測することができます。\ne. 海陸風\n気温差があると気圧差が生じて風が吹きます。海陸風は、海と陸との気温差によって生じる局地的な風です。日本では、日差しの強い夏の沿岸部で顕著に見られます。地表付近では次のようになります。\n・日中：暖まりやすい陸上に向かって風が吹く\n・夜間：冷めにくい海上に向かって風が吹く\n風が入れ替わるときにはほぼ無風状態になり、「朝凪」「夕凪」と呼ばれます。\nf. 山谷風\n山岳地帯に現れる風の一種です。昼間は、日射で暖められた空気が谷を這い上がる谷風が吹きます。夜間は、冷えた空気が山から降りる山風が吹きます。"],["6.2 気象の基礎知識及び気象情報を基にしたリスク評価及び運航の計画の立案 風","g.風力風力は、気象庁風力階級表（ビューフォート風力階級）により、風力０から風力12までの13階級で表す。h.ビル風高層ビルや容積の大きい建物などが数多く近接している場所及び周辺に発生する風で、強さや建物周辺に流れる風の特徴により分類される（剥離流、吹き降ろし、逆流、谷間風、街路風などがある）。ビル風は周辺の風より風速が速く継続して吹いていて、その建物群の配置や構成によって吹く風の種類が異なる。i.ダウンバーストダウンバーストとは、積乱雲や積雲内に発生する強烈な下降流が地表にぶつかり、水平方向にドーナツ状に渦を巻きながら四方に広がってゆく状態をいう。その大きさは数百mから１０kmにもおよぶ。その中でマイクロバーストと呼ばれるものは、直径が４ｋｍ程度以下の下降流で、範囲は小さいが下降流はダウンバーストより強烈なものがある。発生時間は数分から１０分程度のものが多く、通常の観測網では探知されない局地的なものである。","g. 風力\n風力は、気象庁風力階級表（ビューフォート風力階級）により、風力0から風力12までの13階級で表します。\nh. ビル風\n高層ビルや容積の大きい建物などが数多く近接している場所と、その周辺に発生する風です。強さや、建物周辺に流れる風の特徴によって分類されます（剥離流、吹き降ろし、逆流、谷間風、街路風などがあります）。ビル風は周辺の風より風速が速く、継続して吹きます。その建物群の配置や構成によって、吹く風の種類が異なります。\ni. ダウンバースト\nダウンバーストとは、積乱雲や積雲の中に発生した強烈な下降流が地表にぶつかり、水平方向にドーナツ状に渦を巻きながら四方に広がってゆく状態をいいます。その大きさは数百mから10kmにもおよびます。\nその中でマイクロバーストと呼ばれるものは、直径が4km程度以下の下降流です。範囲は小さいものの、下降流はダウンバーストより強烈なものがあります。発生時間は数分から10分程度のものが多く、通常の観測網では探知されない局地的なものです。"],["6.2 気象の基礎知識及び気象情報を基にしたリスク評価及び運航の計画の立案 気象に関する注意事項","無人航空機は、運用可能な動作環境が具体的に明示されている。運用可能な範囲内であっても、低温時や高温時には大きな影響をうけることが予想される。特に気温の低い場合はバッテリーの持続時間（飛行可能時間）が普段より短くなる可能性があるため注意が必要である。地表面が暖められると上昇気流が発生するため、広い面積の太陽光パネルやアスファルト・コンクリートの地面が多い市街地は注意が必要である。また、広い運動場のような場所では、強い日射により上昇気流がおこりつむじ風が発生する可能性がある。安全のための気象状況の確認及び飛行の実施の判断","無人航空機は、運用できる動作環境が具体的に示されています。ただし、その運用可能な範囲内であっても、低温時や高温時には大きな影響を受けることが予想されます。特に気温が低い場合は、バッテリーの持続時間（飛行可能時間）が普段より短くなる可能性があるため、注意が必要です。\n地表面が暖められると上昇気流が発生します。そのため、広い面積の太陽光パネルや、アスファルト・コンクリートの地面が多い市街地では注意が必要です。また、広い運動場のような場所では、強い日射により上昇気流が起こり、つむじ風が発生する可能性があります。"],["6.2 気象の基礎知識及び気象情報を基にしたリスク評価及び運航の計画の立案 気象状況の把握と飛行の実施の判断","安全のため気象条件を考慮した判断をする場合、降雨時、降雪時、霧の発生時や雷鳴が聞こえる時74は飛行の延期や中止が望ましい。","安全のために気象条件を考慮して判断する場合、次のときは飛行の延期や中止が望ましいです。\n・降雨時\n・降雪時\n・霧の発生時\n・雷鳴が聞こえる時"],["6.3 機体の種類に応じた運航リスクの評価及び最適な運航の計画の立案 飛行機の運航の特徴","滑走により離着陸する飛行機は、回転翼航空機よりも広い離着陸エリアが必要である。また回転翼航空機と比べて、飛行中の最小旋回半径が大きくなることが特徴である。飛行機の運航は、離陸、着陸共に、向い風を受ける方向から行う。横風の場合でもできるだけ向かい風方向で行うが操縦の難易度は高くなる。追い風の離着陸は失速のおそれがあるので行わない。回転翼航空機と違いホバリング（空中停止）はできない。上空待機を行う場合はサークルを描くように旋回飛行を行う。着陸は失速しない程度に速度を下げて行うため、高度なエレベーター操作が必要となる。","滑走して離着陸する飛行機は、回転翼航空機よりも広い離着陸エリアが必要です。また、飛行中の最小旋回半径が回転翼航空機と比べて大きくなることも特徴です。\n・離陸も着陸も、向かい風を受ける方向から行います。\n・横風の場合でも、できるだけ向かい風方向で行いますが、操縦の難易度は高くなります。\n・追い風での離着陸は失速のおそれがあるので行いません。\n・回転翼航空機と違い、ホバリング（空中停止）はできません。上空で待機する場合は、サークルを描くように旋回飛行を行います。\n・着陸は失速しない程度に速度を下げて行うため、高度なエレベーター操作が必要になります。"],["6.3 機体の種類に応じた運航リスクの評価及び最適な運航の計画の立案 使用機体と飛行計画を元にしたリスク軽減策の検討要素の例〔一等〕","飛行機の飛行計画においては気象、経路、緊急着陸地点の確保が重要である。離着陸においては向かい風で行うため風向の予測と風向に適した滑走路の確保が必要となる。また地上風速だけでなく上空の風速の確認（アプリ等）も重要である。地上経路設定においては過度な上昇角度、過度に旋回半径が小さくならないようにする。緊急着陸は滑空により行うので広範囲のエリアが必要となる。リスク低減策の例として以上のような点が挙げられるが、飛行計画が正しく設定されているか、複数人で確認を行う運航者の体制も重要である。","飛行機の飛行計画では、気象・経路・緊急着陸地点の確保が重要です。\n・離着陸は向かい風で行うため、風向の予測と、風向に適した滑走路の確保が必要です。\n・地上の風速だけでなく、上空の風速の確認（アプリ等）も重要です。\n・地上での経路設定では、上昇角度が過度にならないように、また旋回半径が過度に小さくならないようにします。\n・緊急着陸は滑空によって行うため、広い範囲のエリアが必要です。\nリスク低減策の例としては以上のような点が挙げられますが、飛行計画が正しく設定されているかを複数人で確認する運航者の体制も重要です。"],["6.3 機体の種類に応じた運航リスクの評価及び最適な運航の計画の立案 リスク軽減策を踏まえた運航の計画の立案の例〔一等〕","飛行機において、リスク軽減策を踏まえた運航計画の立案の際に留意すべき要素の例として、以下の項目が挙げられる。","飛行機について、リスク軽減策を踏まえて運航計画を立てるときに気をつけるべき要素の例として、次の項目が挙げられます。"],["6.3 機体の種類に応じた運航リスクの評価及び最適な運航の計画の立案 離陸及び着陸","⚫離着陸地点は操縦者及び補助者と20m以上離れることを推奨する。取扱説明書等に、推奨距離が記載されている場合は、その指示に従う。⚫離着陸地点は滑走範囲も考慮して周囲の物件から30ｍ以上離すことができる場所を選定する。距離が確保できない場合は、補助者を配置するなどの安全対策を講じる。⚫離陸後は失速しない適度な速度と角度を保って上昇する。着陸は失速しない程度の低速度で滑走路に確実に進入させ、安全に接地させる。","・離着陸地点は、操縦者および補助者と20m以上離すことを推奨します。取扱説明書等に推奨距離が書かれている場合は、その指示に従います。\n・離着陸地点は、滑走する範囲も考えて、周囲の物件から30m以上離すことができる場所を選びます。距離が確保できない場合は、補助者を配置するなどの安全対策をとります。\n・離陸後は、失速しない適度な速度と角度を保って上昇します。着陸は、失速しない程度の低い速度で滑走路に確実に進入させ、安全に接地させます。"],["6.3 機体の種類に応じた運航リスクの評価及び最適な運航の計画の立案 飛行","⚫上昇させる場合は、取扱説明書等で指定された上昇角度以内で飛行させる。⚫旋回させる場合は、取扱説明書等で指定された最大バンク角以内で飛行させる。75⚫降下させる場合は、取扱説明書等で指定された降下速度以内で飛行させる。⚫飛行中断に備え、飛行経路上又はその近傍に緊急着陸地点を事前に選定する。第三者の立入りを制限できる場所の選定又は補助者の配置を検討する。回転翼航空機（ヘリコプター）","・上昇させる場合は、取扱説明書等で指定された上昇角度以内で飛行させます。\n・旋回させる場合は、取扱説明書等で指定された最大バンク角以内で飛行させます。\n・降下させる場合は、取扱説明書等で指定された降下速度以内で飛行させます。\n・飛行を中断する場合に備えて、飛行経路上またはその近くに緊急着陸地点を事前に選んでおきます。第三者の立入りを制限できる場所を選ぶか、補助者を配置することを検討します。"],["6.3 機体の種類に応じた運航リスクの評価及び最適な運航の計画の立案 回転翼航空機（ヘリコプター）の運航の特徴","回転翼航空機（ヘリコプター）は、構造上プロペラガードがない機体が一般的であるため、安全のためにプロペラガード付きの回転翼航空機（マルチローター）よりも広い離着陸エリアが必要である。離着陸において、機体と操縦者及び補助者の必要隔離距離を取扱説明書等で確認するとともに、十分確保すること。機体高度が、およそメインローター半径以下になると、地面効果の影響が顕著になりやすいため、推力変化及びホバリング時の安定・挙動に注意が必要である。前進させながら上昇させた方が必要パワーを削減できるため、垂直上昇は避けることが望ましい。山間部又は斜面に沿って飛行させる場合、吹き下ろし風が強いと上昇できない場合があり、注意が必要である。垂直降下又は降下を伴う低速前進時は、ボルテックス・リング・ステートとなり、急激に高度が低下し回復できない危険性がある。前進させながら降下することは、ボルテックス・リング・ステートの予防に有効である。","回転翼航空機（ヘリコプター）は、構造上プロペラガードがない機体が一般的です。そのため安全のために、プロペラガード付きの回転翼航空機（マルチローター）よりも広い離着陸エリアが必要です。\n・離着陸では、機体と操縦者および補助者の必要隔離距離を取扱説明書等で確認し、十分に確保します。\n・機体の高度がおよそメインローター半径以下になると、地面効果の影響が顕著になりやすいため、推力の変化やホバリング時の安定・挙動に注意が必要です。\n・前進させながら上昇させたほうが必要なパワーを削減できるため、垂直上昇は避けることが望ましいです。\n・山間部や斜面に沿って飛行させる場合、吹き下ろし風が強いと上昇できない場合があるため、注意が必要です。\n・垂直降下、または降下を伴う低速前進のときは、ボルテックス・リング・ステートとなり、急激に高度が低下して回復できない危険性があります。前進させながら降下することは、ボルテックス・リング・ステートの予防に有効です。"],["6.3 機体の種類に応じた運航リスクの評価及び最適な運航の計画の立案 回転翼航空機（ヘリコプター）の運航の特徴","オートローテーション機構を装備している機体は、動力が停止しても軟着陸が可能である。ただし、オートローテーションに入るためには必要な操作、飛行高度範囲及び速度範囲がある。（2）回転翼航空機（ヘリコプター）の使用機体と飛行計画を元にしたリスク軽減策の検討要素の例〔一等〕回転翼航空機（ヘリコプター）において、使用機体と飛行計画を元にしたリスク軽減策の検討要素の例として、以下の項目が挙げられる。","オートローテーション機構を備えた機体は、動力が止まっても軟着陸ができます。ただし、オートローテーションに入るには、必要な操作があり、飛行できる高度の範囲と速度の範囲も決まっています。\n\n次に、回転翼航空機（ヘリコプター）について、使う機体と飛行計画をもとにリスクを減らす対策を考えるときの、検討要素の例をあげます〔一等〕。"],["6.3 機体の種類に応じた運航リスクの評価及び最適な運航の計画の立案 離陸及び着陸","⚫離着陸地点において、機体と操縦者、補助者及び周囲の物件との必要な安全距離を確保する。⚫地面効果範囲内の飛行時間を短くする。","・離着陸する場所では、機体と操縦者・補助者・周りの物件との間に、必要な安全距離をとります。\n・地面効果の範囲内を飛ぶ時間は短くします。"],["6.3 機体の種類に応じた運航リスクの評価及び最適な運航の計画の立案 飛行","⚫余裕を持った上昇率を設定する。⚫ボルテックス・リング・ステートを予防できる降下方法を選定する。⚫緊急着陸地点の安全確保方法を飛行前に検討する。⚫オートローテーション機能を理解し、飛行訓練を実施する。（オートローテーション機能付きの場合）。76","・上昇率は余裕を持って設定します。\n・ボルテックス・リング・ステートを防げる降下方法を選びます。\n・緊急着陸地点の安全をどう確保するかを、飛行前に検討します。\n・オートローテーション機能が付いている機体の場合は、その機能を理解したうえで飛行訓練を行います。"],["6.3 機体の種類に応じた運航リスクの評価及び最適な運航の計画の立案 リスク軽減策を踏まえた運航の計画の立案の例〔一等〕","回転翼航空機（ヘリコプター）において、リスク軽減策を踏まえた運航計画の立案の際に留意するべき要素の例として、以下の項目が挙げられる。","回転翼航空機（ヘリコプター）について、リスクを減らす対策をふまえて運航計画を立てるときに、気をつけるべき要素の例をあげます〔一等〕。"],["6.3 機体の種類に応じた運航リスクの評価及び最適な運航の計画の立案 飛行","⚫上昇させる場合は、取扱説明書等で指定された上昇率以内で飛行させる。⚫前進させながら上昇させる飛行経路を検討する。⚫降下させる場合、ボルテックス・リング・ステートに入ることを予防するため、取扱説明書等で指定された降下率範囲及び降下方法で飛行させること。⚫飛行中断に備え、飛行経路上又はその近傍に緊急着陸地点を事前に選定する。プロペラガード等の安全装備がない機体の場合、第三者の立入りを制限できる場所の選定又は補助者の配置を検討する。⚫オートローテーション機能を装備した機体を運航する場合、機能が発揮できる条件を運航の計画に考慮する。回転翼航空機（マルチローター）","・上昇させるときは、取扱説明書などで指定された上昇率を超えないように飛ばします。\n・前に進みながら上昇する飛行経路を検討します。\n・降下させるときは、ボルテックス・リング・ステートに入るのを防ぐため、取扱説明書などで指定された降下率の範囲と降下方法で飛ばします。\n・飛行を中断する場合に備えて、飛行経路上またはその近くに、緊急着陸地点をあらかじめ選んでおきます。プロペラガードなどの安全装備がない機体の場合は、第三者の立入りを制限できる場所を選ぶか、補助者を配置することを検討します。\n・オートローテーション機能を備えた機体を飛ばす場合は、その機能が働く条件を運航の計画に織り込みます。"],["6.3 機体の種類に応じた運航リスクの評価及び最適な運航の計画の立案 回転翼航空機（マルチローター）の運航の特徴","回転翼航空機（マルチローター）は複数のローターを機体周辺に備え、ローターを回転させることにより揚力を得て垂直上昇し、フライトコントロールシステムにより安定した飛行を行うことができる。（2）回転翼航空機（マルチローター）の使用機体と飛行計画を元にしたリスク軽減策の検討要素の例〔一等〕回転翼航空機（マルチローター）において、使用機体と飛行計画を元にしたリスク軽減策の検討要素の例として、以下の項目が挙げられる。","回転翼航空機（マルチローター）は、複数のローターを機体の周りに備えています。ローターを回して揚力を得ることで垂直に上昇し、フライトコントロールシステムによって安定した飛行ができます。\n\n次に、回転翼航空機（マルチローター）について、使う機体と飛行計画をもとにリスクを減らす対策を考えるときの、検討要素の例をあげます〔一等〕。"],["6.3 機体の種類に応じた運航リスクの評価及び最適な運航の計画の立案 飛行","⚫飛行経路において人や物件との必要な安全距離を確保する。⚫緊急着陸地点の安全確保方法を飛行前に検討する。⚫自動帰還時の高度を障害物等が回避できる安全な高さに設定する。","・飛行経路では、人や物件との間に必要な安全距離をとります。\n・緊急着陸地点の安全をどう確保するかを、飛行前に検討します。\n・自動で帰還するときの高度は、障害物などを避けられる安全な高さに設定します。"],["6.3 機体の種類に応じた運航リスクの評価及び最適な運航の計画の立案 リスク軽減策を踏まえた運航の計画の立案の例〔一等〕","回転翼航空機（マルチローター）において、リスク軽減策を踏まえた運航計画の立案の際に留意するべき要素の例として、以下の項目が挙げられる。","回転翼航空機（マルチローター）について、リスクを減らす対策をふまえて運航計画を立てるときに、気をつけるべき要素の例をあげます〔一等〕。"],["6.3 機体の種類に応じた運航リスクの評価及び最適な運航の計画の立案 離陸及び着陸","⚫離陸地点は操縦者及び補助者との距離を3m以上保つか、機体の取扱説明書に推奨距離が記載されている場合はその指示に従う。⚫離陸地点は周囲の物件から30ｍ以上離すことができる場所を選定する。距離が確保できない場合は、補助者を配置するなどの安全対策を講じる。","・離陸地点は、操縦者と補助者から3m以上の距離を保ちます。機体の取扱説明書に推奨距離が書かれている場合は、その指示に従います。\n・離陸地点は、周りの物件から30m以上離せる場所を選びます。その距離が確保できない場合は、補助者を配置するなどの安全対策をとります。"],["6.3 機体の種類に応じた運航リスクの評価及び最適な運航の計画の立案 飛行","⚫飛行経路での最高飛行高度の設定を行う。⚫飛行中断に備え、飛行経路上又はその近傍に緊急着陸地点を事前に選定する。プロペラガード等の安全装備がない機体の場合、第三者の立入りを制限できる場所の選定又は補助者の配置を検討する。操縦者も必要に応じて保護具を使用する。大型機（最大離陸重量25kg以上）","・飛行経路での最高飛行高度を設定します。\n・飛行を中断する場合に備えて、飛行経路上またはその近くに、緊急着陸地点をあらかじめ選んでおきます。プロペラガードなどの安全装備がない機体の場合は、第三者の立入りを制限できる場所を選ぶか、補助者を配置することを検討します。操縦者も、必要に応じて保護具を使います。"],["6.3 機体の種類に応じた運航リスクの評価及び最適な運航の計画の立案 大型機（最大離陸重量 25kg 以上）の運航の特徴","大型機（最大離陸重量25kg以上）は、事故発生時の影響が大きいことから、操縦者の運航への習熟度及び安全運航意識が十分に高いことが要求される。大型機は機体の慣性力が大きいことから、増速・減速・上昇・降下などに要する時間と距離が長くなるため、障害物回避には特に注意が必要である。緊急着陸地点の選定も小型機よりは広い範囲が要求される。一般に小型の機体よりも騒音が大きくなるため、飛行経路周囲への配慮が必要である。（2）大型機（最大離陸重量25kg以上）の使用機体と飛行計画を元にしたリスク軽減策の検討要素の例〔一等〕大型機において、使用機体と飛行計画を元にしたリスク軽減策の検討要素の例として、以下の項目が挙げられる。⚫飛行速度に応じた障害物回避に必要な時間や距離を事前に把握する。","大型機（最大離陸重量25kg以上）は、事故が起きたときの影響が大きいため、操縦者には運航への十分な習熟度と、高い安全運航意識が求められます。\n\n大型機は機体の慣性力が大きく、増速・減速・上昇・降下にかかる時間と距離が長くなります。そのため、障害物を避けるときは特に注意が必要です。緊急着陸地点も、小型機より広い範囲が必要になります。\n\nまた、一般に小型の機体より騒音が大きくなるため、飛行経路の周りへの配慮が必要です。\n\n次に、大型機について、使う機体と飛行計画をもとにリスクを減らす対策を考えるときの、検討要素の例をあげます〔一等〕。\n・飛行速度に応じて、障害物を避けるのに必要な時間や距離を、あらかじめ把握します。"],["6.3 機体の種類に応じた運航リスクの評価及び最適な運航の計画の立案 大型機（最大離陸重量 25kg 以上）の運航の特徴","⚫安全な緊急着陸地点を選定する。78⚫離着陸地点及び飛行経路周辺の騒音問題対応を検討する。","・安全な緊急着陸地点を選びます。\n・離着陸地点と飛行経路の周辺について、騒音問題への対応を検討します。"],["6.3 機体の種類に応じた運航リスクの評価及び最適な運航の計画の立案 リスク軽減策を踏まえた運航の計画の立案の例〔一等〕","大型機において、リスク軽減策を踏まえた運航計画の立案の際に留意するべき要素の例として、以下の項目が挙げられる。⚫障害物回避など機体の進行方向を変える場合は、時間的、距離的な余裕を十分に考慮した飛行経路及び飛行速度を設定する。⚫緊急着陸地点は、第三者の進入が少ない場所（河川敷、農用地など）を選定する。⚫離着陸地点を含む飛行経路近隣エリアへの事前説明、調整を計画する。","大型機について、リスクを減らす対策をふまえて運航計画を立てるときに、気をつけるべき要素の例をあげます〔一等〕。\n・障害物を避けるなど、機体の進む方向を変える場合は、時間にも距離にも十分な余裕を持たせた飛行経路と飛行速度を設定します。\n・緊急着陸地点は、第三者が入ってくることの少ない場所（河川敷、農用地など）を選びます。\n・離着陸地点を含む飛行経路の近隣エリアへの事前説明と調整を計画します。"],["6.4 飛行の方法に応じた運航リスクの評価及び最適な運航の計画の立案 夜間飛行の運航","夜間飛行は、機体の姿勢及び方向の視認、周囲の安全確認が昼間（日中）飛行と比較し困難となる。夜間飛行においては、原則として目視外飛行は実施せず、機体の向きを視認できる灯火が装備された機体を使用する。操縦者は事前に第三者の立入りの無い安全な場所で、訓練を実施すること。離着陸地点を含め、回避すべき障害物などには、安全確保のため照明が必要である。","夜間飛行は、昼間（日中）の飛行と比べて、機体の姿勢や向きを目で確認することも、周囲の安全確認も難しくなります。\n\n夜間飛行では、原則として目視外飛行は行いません。機体の向きが分かる灯火を備えた機体を使います。\n\n操縦者は事前に、第三者が立ち入らない安全な場所で訓練をしておく必要があります。\n\n離着陸地点を含め、避けるべき障害物などには、安全確保のため照明が必要です。"],["6.4 飛行の方法に応じた運航リスクの評価及び最適な運航の計画の立案 夜間飛行のリスク軽減を図るための対策と提案〔一等〕","夜間飛行において、リスク軽減を図るための検討要素の例として、以下の項目が挙げられる。⚫操縦者は、夜間飛行の訓練を修了したものに限定する。⚫夜間における機体灯火の視認可能範囲など、飛行範囲を明確にする。⚫操縦者と補助者の連絡方法の有効性を確認する。⚫飛行経路下を飛行管理区域に設定する。⚫第三者が出現する可能性が高い地点の特定と対応方法を検討する。⚫離着陸を予定している場所、回避すべき障害物、緊急着陸予定地点を視認可能とする。","夜間飛行でリスクを減らすために検討する要素の例をあげます〔一等〕。\n・操縦者は、夜間飛行の訓練を修了した人に限ります。\n・夜間に機体の灯火が見える範囲など、飛行する範囲をはっきりさせます。\n・操縦者と補助者の連絡方法が有効に働くか確認します。\n・飛行経路の下を飛行管理区域に設定します。\n・第三者が現れる可能性が高い地点を特定し、その対応方法を検討します。\n・離着陸を予定している場所、避けるべき障害物、緊急着陸の予定地点を、目で確認できるようにします。"],["6.4 飛行の方法に応じた運航リスクの評価及び最適な運航の計画の立案 夜間飛行におけるリスク軽減策を踏まえた運航の計画の立案の例〔一等〕","夜間飛行において、リスク軽減策を踏まえた運航計画の立案の際に留意するべき要素の例として、以下の項目が挙げられる。⚫夜間飛行においては、目視外飛行は実施せず、機体の向きを視認できる灯火等が装備できる機体を使用し、機体の灯火が容易に認識できる範囲の飛行に限定する。⚫飛行高度と同じ半径内に第三者が存在しない状況でのみ飛行を実施する。⚫離着陸を予定している場所、回避すべき障害物、緊急着陸予定地点を照明の設置等により明確79にするとともに、機体が視認できるようにする。⚫飛行経路全体を見渡せる位置に、無人航空機の飛行状況及び周囲の気象状況の変化等を常に監視できる補助者を配置し、補助者は操縦者が安全に飛行させることができるよう必要な助言を行う。","夜間飛行について、リスクを減らす対策をふまえて運航計画を立てるときに、気をつけるべき要素の例をあげます〔一等〕。\n・夜間飛行では目視外飛行は行いません。機体の向きが分かる灯火などを装備できる機体を使い、その灯火が簡単に見分けられる範囲の飛行に限定します。\n・飛行高度と同じ長さを半径とする範囲の中に第三者がいない状況でのみ、飛行します。\n・離着陸を予定している場所、避けるべき障害物、緊急着陸の予定地点は、照明を設置するなどしてはっきり分かるようにし、あわせて機体が見えるようにします。\n・飛行経路の全体を見渡せる位置に、補助者を配置します。補助者は、無人航空機の飛行状況や周囲の気象状況の変化などを常に監視し、操縦者が安全に飛ばせるよう必要な助言をします。"],["6.4 飛行の方法に応じた運航リスクの評価及び最適な運航の計画の立案 夜間飛行におけるリスク軽減策を踏まえた運航の計画の立案の例〔一等〕","⚫第三者が出現する可能性が高い地点には、補助者を配置する。⚫操縦者と補助者は常時連絡が取れる機器を使用する。⚫補助者についても、機体特性を十分理解させておく。目視外飛行","・第三者が現れる可能性が高い地点には、補助者を配置します。\n・操縦者と補助者は、常に連絡が取れる機器を使います。\n・補助者にも、機体の特性を十分に理解させておきます。"],["6.4 飛行の方法に応じた運航リスクの評価及び最適な運航の計画の立案 補助者を配置する場合","目視外飛行の運航は、機体の状況や障害物等の周囲の状況を直接肉眼で確認することができない。飛行経路全体を把握し、安全が確認できる双眼鏡等を有する補助者の配置を推奨する。目視外飛行においては、次に掲げる機能を装備した無人航空機を使用すること。⚫自動操縦システムを装備し、機体に設置したカメラ等により機体の外の様子が監視できる。⚫地上において、無人航空機の位置及び異常の有無を把握できる（不具合発生時に不時着した場合を含む）。⚫不具合発生時にフェールセーフ機能が正常に作動する。当該機能の例は、以下のとおり。①電波断絶の場合に、離陸地点まで自動的に戻る機能又は電波が復帰するまでの間、空中で位置を継続的に維持する機能②GNSSの電波に異常が見られる場合に、その機能が復帰するまでの間、空中で位置を継続的に維持する機能、安全な自動着陸を可能とする機能又はGNSS等以外により位置情報を取得できる機能③電池の電圧、容量又は温度等に異常が発生した場合に、発煙及び発火を防止する機能並びに離陸地点まで自動的に戻る機能又は安全な自動着陸を可能とする機能","目視外飛行では、機体の状況や障害物など周りの状況を、自分の肉眼で直接確認することができません。そのため、飛行経路の全体を把握でき、安全を確認できるよう、双眼鏡などを持った補助者を配置することが推奨されます。\n\n目視外飛行では、次の機能を備えた無人航空機を使う必要があります。\n・自動操縦システムを備え、機体に付けたカメラなどで機体の外の様子を監視できること。\n・地上で、無人航空機の位置と異常の有無を把握できること（不具合が起きて不時着した場合も含みます）。\n・不具合が起きたときに、フェールセーフ機能（＝異常時に安全な側へ働く機能）が正常に作動すること。その機能の例は次のとおりです。\n①電波が途切れた場合に、離陸地点まで自動で戻る機能、または電波が復帰するまで空中で位置を保ち続ける機能\n②GNSSの電波に異常が見られる場合に、その機能が復帰するまで空中で位置を保ち続ける機能、安全に自動着陸できる機能、またはGNSS等以外の方法で位置情報を取得できる機能\n③電池の電圧・容量・温度などに異常が発生した場合に、発煙や発火を防ぐ機能と、あわせて離陸地点まで自動で戻る機能または安全に自動着陸できる機能"],["6.4 飛行の方法に応じた運航リスクの評価及び最適な運航の計画の立案 補助者を配置しない場合","補助者を配置しない場合は、無人航空機に求められる要件が追加されることに注意が必要である。追加される要件の例を次に掲げる。⚫航空機からの視認をできる限り容易にするため、灯火を装備する。または飛行時に機体を認識しやすい塗色を行う。⚫地上において、機体や地上に設置されたカメラ等により飛行経路全体の航空機の状況が常に確認できる。80⚫第三者に危害を加えないことを、製造事業者等が証明した機能を有する。ただし立入管理区画（第三者の立入りを制限する区画）を設定し、第三者が立ち入らないための対策を行う場合、又は機体や地上に設置されたカメラ等により進行方向直下及びその周辺への第三者の立入りの有無を常に監視できる場合は除く。⚫地上において、機体の針路、姿勢、高度、速度及び周辺の気象状況等を把握できる。","補助者を配置しない場合は、無人航空機に求められる要件が追加されるので注意が必要です。追加される要件の例は次のとおりです。\n・航空機から見つけやすくするため、灯火を装備します。または、飛行中に機体を認識しやすい塗色をします。\n・地上で、機体や地上に設置したカメラなどにより、飛行経路全体の航空機の状況を常に確認できること。\n・第三者に危害を加えないことを、製造事業者などが証明した機能を持つこと。ただし、立入管理区画（＝第三者の立入りを制限する区画）を設定して第三者が立ち入らないための対策を行う場合、または機体や地上に設置したカメラなどで、進行方向の真下とその周辺に第三者が立ち入っていないかを常に監視できる場合は、この要件から除かれます。\n・地上で、機体の針路・姿勢・高度・速度や、周辺の気象状況などを把握できること。"],["6.4 飛行の方法に応じた運航リスクの評価及び最適な運航の計画の立案 補助者を配置しない場合","⚫地上において、計画上の飛行経路と飛行中の機体の位置の差を把握できる。⚫想定される運用に基づき、十分な飛行実績を有する機体を使用すること。この実績は、機体の初期故障期間を超えていること。","・地上で、計画していた飛行経路と、飛行中の機体の位置とのズレを把握できること。\n・想定される運用にもとづき、十分な飛行実績のある機体を使うこと。この実績は、機体の初期故障期間を超えているものであることが必要です。"],["6.4 飛行の方法に応じた運航リスクの評価及び最適な運航の計画の立案 目視外飛行のリスク軽減を図るための対策と提案〔一等〕","目視外飛行において、リスク軽減を図るための検討要素の例として、以下の項目が挙げられる。","目視外飛行（＝機体を直接目で見ながら飛ばすのではない飛行）では、リスクを減らすためにどんなことを検討すればよいか。その検討要素の例として、次のような項目が挙げられます。"],["6.4 飛行の方法に応じた運航リスクの評価及び最適な運航の計画の立案 補助者を配置する場合","⚫操縦者は、目視外飛行の訓練を修了したものに限定する。⚫事前確認などにより、適切な飛行経路を選定する。⚫適切な補助者の配置を検討する。⚫飛行前に、飛行経路下に第三者が存在しないことを確認する。⚫操縦者と補助者の連絡方法の有効性を確認する。","補助者を配置する場合の検討例です。\n・操縦者は、目視外飛行の訓練を修了した人だけに限ります。\n・事前確認などを行い、適切な飛行経路を選びます。\n・補助者をどこに配置するのが適切かを検討します。\n・飛行前に、飛行経路の下に第三者（＝その飛行に関わっていない人）がいないことを確認します。\n・操縦者と補助者の連絡方法がきちんと使えるかを確認します。"],["6.4 飛行の方法に応じた運航リスクの評価及び最適な運航の計画の立案 補助者を配置しない場合","補助者を配置しない場合は、例えば、次のような内容を追加する。⚫操縦者は、補助者無し目視外飛行の教育訓練を修了したものに限定する。⚫飛行経路は第三者の存在する可能性の低い場所を選定する。⚫有人機の運航を妨げない飛行範囲を設定する。⚫緊急時の対応と、緊急着陸地点をあらかじめ設定する。⚫立入管理区画を設定した場合、第三者が立ち入らないための方策及び周知方法を設定する。（3）目視外飛行におけるリスク軽減策を踏まえた運航の計画の立案の例〔一等〕目視外飛行において、リスク軽減策を踏まえた運航計画の立案の際に留意するべき要素の例として、以下の項目が挙げられる。","補助者を配置しない場合は、例えば次のような内容を追加します。\n・操縦者は、補助者無し目視外飛行の教育訓練を修了した人だけに限ります。\n・飛行経路は、第三者がいる可能性の低い場所を選びます。\n・有人機の運航のじゃまにならない飛行範囲を設定します。\n・緊急時の対応方法と、緊急着陸する地点をあらかじめ決めておきます。\n・立入管理区画（＝人が立ち入らないように管理する区画）を設定した場合は、第三者が立ち入らないようにするための方策と、その周知方法を決めておきます。\n\n次に、目視外飛行でリスク軽減策を踏まえて運航の計画を立てるとき、気をつけるべき要素の例を挙げます〔一等〕。"],["6.4 飛行の方法に応じた運航リスクの評価及び最適な運航の計画の立案 補助者を配置する場合","⚫飛行経路及び周辺の障害物件等を事前に確認し、適切な経路を特定し選定すること。⚫飛行経路全体が見渡せる位置に飛行状況及び周囲の気象状況の変化等を常に監視できる双81眼鏡等を有する補助者を配置し、操縦者へ必要な助言を行うこと。⚫操縦者と補助者が常時連絡を取れること。⚫補助者が安全に着
