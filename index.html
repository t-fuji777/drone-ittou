const KYO = [["1. はじめに","無人航空機は、「空の産業革命」とも言われ、既に空撮、農薬散布、測量、インフラの点検等に広く利用されている。今後は、都市部も含む物流や災害対応、警備への活用等、さらに多様な分野の幅広い用途に利用され、多くの人々がその利便性を享受し、社会が抱える様々な課題を解決に導くことで、産業、経済、社会に変革をもたらすことが期待されている。他方で、上空を飛行するという無人航空機の特性から、衝突や墜落といった事故が発生した場合には、重大な被害を生じさせる可能性がある。実際に、人への墜落事故や、航空機との接近といった人命への危険を生じさせるおそれのある事態や、空港付近での目撃情報に基づき、国際空港が一時的に閉鎖されるといった事態が発生している。無人航空機の飛行の安全を確保しつつ、上記のような役割を果たしていけるようにするための制度の一つとして、無人航空機操縦者技能証明制度が創設された。この制度は、学科試験、実地試験及び身体検査により無人航空機を飛行させる者の知識と能力を判定し、これらに合格した者について無人航空機を飛行させるのに必要となる一定の技能を有していることを国が証明するものである。","無人航空機（ドローン）は「空の産業革命」とも言われ、すでに次のような用途で広く使われています。\n・空撮\n・農薬散布\n・測量\n・インフラの点検\n今後は、都市部も含む物流や災害対応、警備への活用など、さらに多様な分野の幅広い用途で使われていくと期待されています。多くの人がその便利さを受け取り、社会が抱えるさまざまな課題の解決につながることで、産業・経済・社会に変革をもたらすと期待されています。\n一方で、無人航空機は上空を飛ぶという特性があるため、衝突や墜落といった事故が起きると、重大な被害が生じる可能性があります。実際に、次のような事態が起きています。\n・人への墜落事故\n・航空機との接近など、人命への危険が生じるおそれのある事態\n・空港付近での目撃情報にもとづき、国際空港が一時的に閉鎖された事態\n無人航空機の飛行の安全を確保しながら、こうした役割を果たしていけるようにするための制度の一つとして、無人航空機操縦者技能証明制度がつくられました。この制度は、学科試験・実地試験・身体検査によって、無人航空機を飛行させる人の知識と能力を判定するものです。これらに合格した人について、無人航空機を飛行させるのに必要な一定の技能があることを国が証明します。"],["1. はじめに","無人航空機操縦者技能証明（技能証明）を受けるためには、原則として学科試験、実地試験及び身体検査に合格することが必要であるが、登録講習機関（国が登録する民間機関）において無人航空機の操縦に係る必要な講習を受講し、講習の修了審査に合格した場合には実地試験が免除される。この教則は、無人航空機を飛行させるのに必要な最低限の知識要件及び学科試験において求められる最低限の知識要件を記載することを目的として作成されたものである。技能証明を取得しようとする者を含む無人航空機を飛行させる者にあっては、この教則を常に参照し、安全な飛行を行うために必要な知識を身に付けていただきたい。また、登録講習機関においては、この教則を参考にしたうえで、これまでの知見やノウハウを活かし、創意工夫を凝らした独自の講習用テキストを作成し、講習に活用されることが期待される。","無人航空機操縦者技能証明（以下「技能証明」）を受けるには、原則として次の3つに合格する必要があります。\n・学科試験\n・実地試験\n・身体検査\nただし、登録講習機関（＝国が登録する民間の機関のこと）で無人航空機の操縦に必要な講習を受け、その講習の修了審査に合格した場合は、実地試験が免除されます。\nこの教則は、次の2つを書き記すことを目的につくられました。\n・無人航空機を飛行させるのに必要な最低限の知識要件\n・学科試験で求められる最低限の知識要件\n技能証明を取ろうとする人を含め、無人航空機を飛行させる人は、この教則をいつも参照して、安全な飛行に必要な知識を身に付けてください。\nまた登録講習機関には、この教則を参考にしたうえで、これまでの知見やノウハウを活かし、創意工夫をこらした独自の講習用テキストをつくって講習に活用することが期待されています。"],["1. はじめに","このように、無人航空機の飛行に最低限必要となる知識要件が記載されており、登録講習機関における講習用テキストの土台としての役割を担うことになるこの教則が、技能証明の取得を目指す皆さまを安全な飛行へと導く道しるべとなることを願う。2","このように、この教則には無人航空機の飛行に最低限必要となる知識要件が書かれており、登録講習機関の講習用テキストの土台としての役割も担うことになります。この教則が、技能証明の取得を目指す皆さんを安全な飛行へと導く道しるべとなることを願っています。"],["2.1 操縦者の役割と責任","操縦者としての自覚①無人航空機の運航や安全管理などに対して責任を負うこと。②知識と能力に裏付けられた的確な判断を行うこと。③操縦者としての自覚を持ち、あらゆる状況下で、常に人の安全を守ることを第一に考えること。役割分担の明確化①無人航空機操縦者技能証明（以下単に「技能証明」という。）の保有者が複数いる場合は、誰が意図する飛行の操縦者なのか飛行前に明確にしておくこと。②補助者を配置する場合は、役割を必ず確認し、操縦者との連絡手段の確保など安全確認を行うことができる体制としておくこと。準備を怠らない無人航空機の事故は、飛行前の様々な準備不足が直接的又は間接的な原因となっていることが多いことから、事前の準備を怠らないこと。レクリエーション目的で飛行する場合でも、業務のために飛行する場合でも、安全に飛行するためのルールに関する情報、リソース、ツールを入手すること。","操縦者としての自覚\n・無人航空機の運航や安全管理などについて責任を負います。\n・知識と能力に裏付けられた的確な判断を行います。\n・操縦者としての自覚を持ち、あらゆる状況で、常に人の安全を守ることを第一に考えます。\n\n役割分担をはっきりさせる\n・無人航空機操縦者技能証明（以下「技能証明」）を持つ人が複数いる場合は、その飛行で誰が操縦者になるのかを、飛行前にはっきりさせておきます。\n・補助者を配置する場合は、役割を必ず確認します。操縦者との連絡手段を確保するなど、安全確認ができる体制にしておきます。\n\n準備を怠らない\n無人航空機の事故は、飛行前のさまざまな準備不足が直接・間接の原因になっていることが多くあります。事前の準備を怠らないでください。レクリエーション（趣味）目的で飛ばす場合でも、業務のために飛ばす場合でも、安全に飛行するためのルールに関する情報・リソース・ツールを手に入れます。"],["2.1 操縦者の役割と責任","ルール・マナーの遵守①安全のために、法令やルールを遵守すること。②空域は、無人航空機のみでなく航空機も利用している。航空機と無人航空機との間で飛行の進路が交差し、又は接近する場合には、航空機の航行の安全を確保するため、無人航空機側が回避する行動をとること。③飛行させる場所ごとのルールや遵守事項に従い、一般社会通念上のマナーを守るとともに、モラルのある飛行を行うこと。④飛行に際しては、騒音の発生に注意をすること。無理をしない①自然を侮らず、謙虚な気持ちで、無理をしないこと。②計画の中止や帰還させる勇気を持つこと。危険な状況を乗り切ることよりも、危険を事前に回避することの方が重要である。3社会に対する操縦者の責任操縦者は、飛行を開始してから終了するまで、全てに責任を問われる。操縦者の最も基本的な責任は、飛行を安全に成し遂げることにある。したがって、飛行の全体にわたって安全を確保するための対策を実施する必要があり、その責任は操縦者が負っていることを自覚すること。","ルール・マナーを守る\n・安全のために、法令やルールを守ります。\n・空域は無人航空機だけでなく航空機も利用しています。航空機と無人航空機の進路が交差したり接近したりする場合は、航空機の航行の安全を確保するため、無人航空機の側が回避する行動をとります。\n・飛ばす場所ごとのルールや守るべき事項に従い、一般社会通念上のマナーを守って、モラルのある飛行を行います。\n・飛行の際は、騒音の発生に注意します。\n\n無理をしない\n・自然を侮らず、謙虚な気持ちで、無理をしません。\n・計画を中止する、帰還させるという勇気を持ちます。危険な状況を乗り切ることよりも、危険を事前に回避することのほうが重要です。\n\n社会に対する操縦者の責任\n操縦者は、飛行を開始してから終了するまで、そのすべてについて責任を問われます。操縦者の最も基本的な責任は、飛行を安全にやり遂げることです。したがって、飛行の全体にわたって安全を確保する対策を実施する必要があり、その責任は操縦者が負っていることを自覚してください。"],["2.1 操縦者の役割と責任","第三者及び関係者に対する操縦者の責任第三者や関係者が危険を感じるような操縦をしない、第三者が容易に近付くことのないような飛行経路を選択するなど、常に第三者及び関係者の安全を意識すること。事故を起こしたときに操縦者が負う法的責任衝突や墜落等の事故を起こした場合に、操縦者は、「刑事責任」「民事責任」を負うことがあり、また「行政処分」を受けることがある。","第三者および関係者に対する操縦者の責任\n・第三者や関係者が危険を感じるような操縦をしません。\n・第三者が簡単に近付けないような飛行経路を選びます。\nこのように、常に第三者と関係者の安全を意識します。\n\n事故を起こしたときに操縦者が負う法的責任\n衝突や墜落などの事故を起こした場合、操縦者は「刑事責任」「民事責任」を負うことがあり、また「行政処分」を受けることがあります。"],["2.1 操縦者の役割と責任 刑事責任","衝突や墜落により死傷者が発生した場合、事故の内容により「業務上過失致死傷」などの刑事責任（懲役、罰金等）を負う場合がある。","衝突や墜落で死傷者が出た場合、事故の内容によっては「業務上過失致死傷」などの刑事責任（懲役、罰金など）を負うことがあります。"],["2.1 操縦者の役割と責任 民事責任","操縦者は、被害者に対して民法に基づく「損害賠償責任」を負う場合がある。","操縦者は、被害者に対して、民法にもとづく「損害賠償責任」を負うことがあります。"],["2.1 操縦者の役割と責任 行政処分等","航空法（昭和27年法律第231号）への違反や無人航空機を飛行させるに当たり非行又は重大な過失があった場合には、次のような行政処分等の対象となる。①技能証明の効力の取消②技能証明の効力の停止（期間は１年、6月、3月のいずれか）③文書警告④口頭注意","航空法（昭和27年法律第231号）に違反した場合や、無人航空機を飛行させるにあたって非行または重大な過失があった場合は、次のような行政処分などの対象になります。\n・技能証明の効力の取消\n・技能証明の効力の停止（期間は1年、6月、3月のいずれか）\n・文書警告\n・口頭注意"],["2.2 安全な飛行の確保 飛行計画の作成","①無人航空機の性能、操縦者や補助者の経験や能力などを考慮して無理のない計画を立てる。②近所を飛行するときや飛行経験のある場所を飛行する場合でも、必ず計画を立てる。4③何かあった場合の対策を考えておく（緊急着陸地点や安全にホバリング・旋回ができる場所の設定等）。④計画は、ドローン情報基盤システム（飛行計画通報機能）に事前に通報する。ただし、あらかじめ通報することが困難な場合には事後に通報してもよい。","・無人航空機の性能や、操縦者・補助者の経験や能力などを考えて、無理のない計画を立てます。\n・近所を飛ばすときや、飛ばした経験のある場所を飛ばすときでも、必ず計画を立てます。\n・何かあった場合の対策を考えておきます（緊急着陸地点や、安全にホバリング・旋回ができる場所を決めておくなど）。\n・計画は、ドローン情報基盤システム（飛行計画通報機能）に事前に通報します。ただし、あらかじめ通報することが難しい場合は、あとから通報してもかまいません。"],["2.2 安全な飛行の確保 飛行予定地域や周辺施設の調査","①日出や日没の時刻等②標高（海抜高度）、障害物の位置、目標物等③離着陸する場所の状況等④地上の歩行者や自動車の通行、有人航空機の飛行などの状況等機体の点検飛行前には必ず機体の点検を行い、気になるところがあれば必ず整備をしてから飛行を開始する。気象情報の収集飛行前に、最新の気象情報（天気、風向、警報、注意報等）を収集する。地域情報の収集地域によっては、地方公共団体により無人航空機の飛行を制限する条例や規則が設けられていたり、立入禁止区域が設定されていたりする場合があることから、緊急用務空域や飛行自粛要請空域の情報も含め飛行予定地域の情報を収集する。（緊急用務空域や飛行自粛要請空域の詳細は、3.1.2(2)1)b.緊急用務空域、3.2.4飛行自粛要請空域を参照）連絡体制の確保飛行の際には、携帯電話（通話可能範囲を確認しておく）等により関係機関（空港事務所等）と常に連絡がとれる体制を確保する。","飛行予定地域や周辺施設の調査\n次のことを調べます。\n・日出や日没の時刻など\n・標高（海抜高度）、障害物の位置、目標物など\n・離着陸する場所の状況など\n・地上の歩行者や自動車の通行、有人航空機の飛行などの状況\n\n機体の点検\n飛行前には必ず機体の点検を行います。気になるところがあれば、必ず整備をしてから飛行を開始します。\n\n気象情報の収集\n飛行前に、最新の気象情報（天気、風向、警報、注意報など）を集めます。\n\n地域情報の収集\n地域によっては、地方公共団体が条例や規則で無人航空機の飛行を制限していたり、立入禁止区域が設定されていたりします。緊急用務空域や飛行自粛要請空域の情報も含めて、飛行予定地域の情報を集めます。（緊急用務空域や飛行自粛要請空域の詳細は、3.1.2(2)1)b.緊急用務空域、3.2.4飛行自粛要請空域を参照）\n\n連絡体制の確保\n飛行の際は、携帯電話（通話できる範囲を確認しておきます）などで、空港事務所などの関係機関と常に連絡がとれる体制を確保します。"],["2.2 安全な飛行の確保 飛行予定地域や周辺施設の調査","服装に対する注意①動きやすいもの②素肌（頭部を含む）の露出の少ないもの③無人航空機の飛行を行う関係者であることが容易にわかるような服装④必要に応じてヘルメットや保護メガネなどの保護具を準備する。体調管理①体調が悪い場合は、注意力が散漫になり、判断力が低下するなど事故の原因となる。5②前日に十分な睡眠を取り、睡眠不足や疲労が蓄積した状態で操縦しないなど体調管理に努める。③アルコール等の摂取に関する注意事項を守る。技能証明書等の携帯特定飛行（航空法において規制の対象となる空域における飛行又は規制の対象となる方法による飛行）を行う際には、許可書又は承認書の原本又は写し（口頭により許可等を受け、まだ許可書又は承認書の交付を受けていない場合は許可等の年月及び番号を回答できるようにしておく。）、技能証明書（技能証明を受けている場合に限る。）、飛行日誌を携行（携帯）する。","服装に対する注意\n・動きやすいもの\n・素肌（頭部を含む）の露出が少ないもの\n・無人航空機の飛行を行う関係者だと簡単にわかるような服装\n・必要に応じて、ヘルメットや保護メガネなどの保護具を準備します。\n\n体調管理\n・体調が悪いと注意力が散漫になり、判断力が低下するなど、事故の原因になります。\n・前日に十分な睡眠をとります。睡眠不足や疲労がたまった状態で操縦しないなど、体調管理に努めます。\n・アルコールなどの摂取に関する注意事項を守ります。\n\n技能証明書などの携帯\n特定飛行（＝航空法で規制の対象となる空域での飛行、または規制の対象となる方法での飛行のこと）を行う際は、次のものを携行（携帯）します。\n・許可書または承認書の原本か写し（口頭で許可などを受け、まだ許可書・承認書の交付を受けていない場合は、許可などの年月と番号を答えられるようにしておきます）\n・技能証明書（技能証明を受けている場合に限ります）\n・飛行日誌"],["2.2 安全な飛行の確保 無理をしない","飛行中は、気象の変化に注意し、天候が悪化しそうになれば、飛行途中でもただちに帰還させるか、又は緊急着陸するなど、安全を第一に判断する。危険な状況になった場合に、適切に対応できるだけの能力を身に付けておくことは必要であるが、危険な状況になる前にそれを察知して回避することが操縦者としてより大切である。","飛行中は気象の変化に注意します。天候が悪化しそうになったら、飛行の途中でもただちに帰還させる、または緊急着陸させるなど、安全を第一に判断します。危険な状況になった場合に適切に対応できるだけの能力を身に付けておくことは必要です。ただし、操縦者としてより大切なのは、危険な状況になる前にそれを察知して回避することです。"],["2.2 安全な飛行の確保 監視の実施","無人航空機の事故のうち、十分に監視をしていなかったことが原因となる事故が多発している。無人航空機の飛行する空域や場所には、他の航空機をはじめ、ビルや家屋といった建物や自動車、電柱、高圧線、樹木などの飛行の支障となるものが数多く存在する。衝突防止装置を搭載する機体もあるが、衝突防止装置を過信せず、鳥等にも注意を要する。飛行に際しては、周囲の監視が最大の安全対策である。補助者を配置する場合には、情報の共有の方法についても事前に確認し、状況把握における誤解や伝達の遅れなどがないよう配慮する。","無人航空機の事故のうち、十分に監視をしていなかったことが原因の事故が多発しています。無人航空機が飛行する空域や場所には、飛行の支障となるものが数多くあります。\n・他の航空機\n・ビルや家屋といった建物\n・自動車、電柱、高圧線、樹木 など\n衝突防止装置を積んでいる機体もありますが、衝突防止装置を過信してはいけません。鳥などにも注意が必要です。飛行に際しては、周囲の監視が最大の安全対策です。補助者を配置する場合は、情報の共有の方法についても事前に確認し、状況把握での誤解や伝達の遅れなどが起きないよう配慮します。"],["2.2 安全な飛行の確保 ルールを守る","飛行中は飛行のルールを守る。また、法令や条例に定められたルール以外にも、ある地域において限定的に行われている地域の特性に応じたルールや社会通念上のマナーについても遵守する。飛行後の注意","飛行中は飛行のルールを守ります。また、法令や条例で定められたルールだけでなく、ある地域で限定的に行われている、その地域の特性に応じたルールや、社会通念上のマナーも守ります。"],["2.2 安全な飛行の確保 飛行後の点検","飛行が終わった後には、機体に不具合がないか等を点検し、使用後の手入れをして次回の飛行に備える。6","飛行が終わった後は、機体に不具合がないかなどを点検します。使用後の手入れをして、次回の飛行に備えます。"],["2.2 安全な飛行の確保 適切な保管","飛行の終了後には、機体やバッテリー等を安全な状態で、適切な場所に保管する。","飛行が終わった後は、機体やバッテリーなどを安全な状態にして、適切な場所に保管します。"],["2.2 安全な飛行の確保 飛行日誌の作成","特定飛行を行った場合には、飛行記録、日常点検記録、点検整備記録を遅滞なく飛行日誌（紙又は電子データ）に記載する。特定飛行に該当しない飛行の場合でも、飛行日誌に記載することが望ましい。また、リスクに対する対応が不十分と感じた場合は、今後の飛行に備えた記録も行うことが望ましい。","特定飛行を行った場合は、次の記録を遅滞なく（すぐに）飛行日誌に記載します。飛行日誌は紙でも電子データでもかまいません。\n・飛行記録\n・日常点検記録\n・点検整備記録\n特定飛行にあたらない飛行の場合でも、飛行日誌に記載することが望ましいです。また、リスクへの対応が不十分だと感じた場合は、今後の飛行に備えた記録も行うことが望ましいです。"],["2.3 事故が起きた時の対応","事故を起こしたら①慌てず落ち着いて、ケガの有無や、ケガの程度など、人の安全確認を第一に行う。②機体が墜落した場合には、地上又は水上における交通への支障やバッテリーの発火等により周囲に危険を及ぼすことがないよう、機体が通電している場合は電源を切るなど速やかに措置を講ずる。プロペラがまだ回転している場合は不用意に機体に接近せず十分に注意する。③事故の原因究明、再発防止のために飛行ログ等の記録を残す。通報先無人航空機の飛行による人の死傷、第三者の物件の損傷、飛行時における機体の紛失又は航空機との衝突若しくは接近事案が発生した場合には、事故の内容に応じ、直ちに警察署、消防署、その他必要な機関等へ連絡するとともに、国土交通大臣に報告する。","事故を起こしたら\n・慌てず落ち着いて、ケガの有無やケガの程度など、人の安全確認を第一に行います。\n・機体が墜落した場合は、地上や水上の交通の支障になったり、バッテリーの発火などで周囲に危険を及ぼしたりしないよう、機体が通電している場合は電源を切るなど、速やかに措置をとります。プロペラがまだ回転している場合は、不用意に機体へ近付かず、十分に注意します。\n・事故の原因究明と再発防止のために、飛行ログなどの記録を残します。\n\n通報先\n次のことが発生した場合は、事故の内容に応じて、ただちに警察署・消防署・その他必要な機関などへ連絡するとともに、国土交通大臣に報告します。\n・無人航空機の飛行による人の死傷\n・第三者の物件の損傷\n・飛行時における機体の紛失\n・航空機との衝突、または接近事案"],["2.3 事故が起きた時の対応","保険無人航空機の保険は、車の自動車損害賠償責任保険（自賠責）のような強制保険はなく、すべて任意保険であるが、万一の場合の金銭的負担が大きいので、保険に加入しておくとよい。無人航空機の保険には、機体に対する保険、賠償責任保険などいろいろな種類や組合せがあるので自機の使用実態に即した保険に加入することが推奨される。なお、カテゴリーⅡ飛行のうち一部の飛行（総重量25kg以上の無人航空機を飛行させる場合又は3.1.2(2)4）c.レベル3.5飛行の場合）にあたっては、不測の事態が発生した場合に十分な補償が可能な第三者賠償責任保険に加入していることが求められる。7","無人航空機の保険には、車の自動車損害賠償責任保険（自賠責）のような強制保険はなく、すべて任意保険です。ただし、万一の場合の金銭的な負担が大きいので、保険に加入しておくとよいでしょう。無人航空機の保険には、機体に対する保険、賠償責任保険など、いろいろな種類や組合せがあるので、自分の機体の使い方に合った保険に加入することが勧められます。\nなお、カテゴリーⅡ飛行のうち次の飛行にあたる場合は、不測の事態が起きたときに十分な補償ができる第三者賠償責任保険に加入していることが求められます。\n・総重量25kg以上の無人航空機を飛行させる場合\n・3.1.2(2)4)c.レベル3.5飛行の場合"],["3.1 航空法全般 航空法における無人航空機の定義","航空法において、「無人航空機」とは、①航空の用に供することができる飛行機、回転翼航空機、滑空機及び飛行船であって構造上人が乗ることができないもののうち、②遠隔操作又は自動操縦（プログラムにより自動的に操縦を行うことをいう。）により飛行させることができるものであり、③重量が100グラム以上のものを対象としている。①の「構造上人が乗ることができないもの」とは、単に人が乗ることができる座席の有無を意味するものではなく、当該機器の概括的な大きさや潜在的な能力を含めた構造、性能等により判断される。一方で、「航空機」とは、人が乗って航空の用に供することができる飛行機、回転翼航空機、滑空機及び飛行船を対象としているため、人が乗り組まないで操縦できる機器であっても、航空機を改造したものなど、航空機に近い構造、性能等を有している場合には、無人航空機ではなく、航空機に分類される。このように操縦者が乗り組まないで飛行することができる装置を有する航空機を「無操縦者航空機」という。飛行機、回転翼航空機、滑空機及び飛行船のいずれにも該当しない気球やロケットなどは航空機や無人航空機には該当しない。","航空法でいう「無人航空機」は、次の3つをすべて満たすものです。\n・飛行機、回転翼航空機、滑空機、飛行船のうち、構造上人が乗ることができないもの\n・遠隔操作、または自動操縦（プログラムによって自動的に操縦すること）で飛ばすことができるもの\n・重量が100グラム以上のもの\n\n①の「構造上人が乗ることができないもの」は、人が乗れる座席があるかどうかだけで決まるものではありません。その機器のおおまかな大きさや、潜在的な能力も含めた構造・性能などから判断します。\n\n一方で「航空機」とは、人が乗って飛ぶことができる飛行機、回転翼航空機、滑空機、飛行船のことです。そのため、人が乗り組まないで操縦できる機器であっても、航空機を改造したものなど、航空機に近い構造や性能を持っている場合は、無人航空機ではなく航空機に分類されます。このように、操縦者が乗り組まないで飛ぶことができる装置を持つ航空機を「無操縦者航空機」といいます。\n\nなお、飛行機・回転翼航空機・滑空機・飛行船のどれにも当てはまらない気球やロケットなどは、航空機にも無人航空機にも当たりません。"],["3.1 航空法全般 航空法における無人航空機の定義","②は「遠隔操作又は自動操縦により飛行させることができるもの」としているため、例えば、紙飛行機など遠隔操作又は自動操縦により制御できないものは、無人航空機には該当しない。③の「重量」とは、無人航空機本体の重量及びバッテリーの重量の合計を指しており、バッテリー以外の取り外し可能な付属品の重量は含まない。なお、１００グラム未満のものは、無人航空機ではなく、「模型航空機」に分類される。重要施設の周辺地域の上空における小型無人機等の飛行の禁止に関する法律（平成28年法律第９号。以下「小型無人機等飛行禁止法」という。）において規制対象となる「小型無人機」については大きさや重さにかかわらず対象となり、１００グラム未満のものも含まれる。","②は「遠隔操作又は自動操縦により飛行させることができるもの」となっています。そのため、紙飛行機のように遠隔操作や自動操縦で制御できないものは、無人航空機には当たりません。\n\n③の「重量」とは、無人航空機の本体の重量とバッテリーの重量を合計したものです。バッテリー以外の取り外しできる付属品の重さは含みません。100グラム未満のものは、無人航空機ではなく「模型航空機」に分類されます。\n\nただし、小型無人機等飛行禁止法（正式名称は「重要施設の周辺地域の上空における小型無人機等の飛行の禁止に関する法律」、平成28年法律第9号）で規制の対象となる「小型無人機」は、大きさや重さに関係なく対象となり、100グラム未満のものも含まれます。"],["3.1 航空法全般 無人航空機の登録","全ての無人航空機（重量が１００グラム未満のものは除く。）は、国の登録を受けたものでなければ、原則として航空の用に供することができない。登録の有効期間は３年である。また、無人航空機を識別するための登録記号を表示し、一部の例外を除きリモートID機能を備えなければならない。8","すべての無人航空機（重量100グラム未満のものは除く）は、国の登録を受けたものでなければ、原則として飛ばすことができません。登録の有効期間は3年です。\n\nまた、無人航空機を識別するための登録記号を機体に表示する必要があります。さらに、一部の例外を除いて、リモートID機能（＝機体の識別情報を電波で発信する機能）を備える必要があります。"],["3.1 航空法全般 規制対象となる飛行の空域及び方法（特定飛行）","航空法において、無人航空機の飛行に当たって確保すべき安全は、⚫航空機の航行の安全⚫地上又は水上の人又は物件の安全であり、これらに危害を及ぼすおそれがあるものとして、次に掲げる飛行の空域と方法を規制している。a.規制対象となる飛行の空域＜航空機の航行の安全に影響を及ぼすおそれのある空域＞（Ａ）空港等の周辺の上空の空域（Ｂ）消防、救助、警察業務その他の緊急用務を行うための航空機の飛行の安全を確保する必要がある空域（緊急用務空域）（Ｃ）地表又は水面から１５０メートル以上の高さの空域＜人又は家屋の密集している地域の上空＞（D）国勢調査の結果を受け設定されている人口集中地区の上空（工業専用地域内の区域の上空を除く。）b.規制対象となる飛行の方法①夜間飛行（日没後から日出まで）②操縦者の目視外での飛行（目視外飛行）③第三者又は第三者の物件との間の距離が30メートル未満での飛行④祭礼、縁日、展示会など多数の者の集合する催しが行われている場所の上空での飛行⑤爆発物など危険物の輸送⑥無人航空機からの物件の投下上記aに掲げる空域における飛行又は上記bに掲げる方法による飛行のいずれかに該当する飛行を「特定飛行」といい、航空機の航行の安全への影響や地上及び水上の人及び物件への危害を及ぼすおそれがあることから原則として禁止されている。","航空法が無人航空機の飛行にあたって確保しようとしている安全は、次の2つです。\n・航空機の航行の安全\n・地上または水上にいる人や物件の安全\n\nこれらに危害を及ぼすおそれがあるものとして、次の空域と飛行方法が規制されています。\n\na. 規制対象となる飛行の空域\n＜航空機の航行の安全に影響を及ぼすおそれのある空域＞\n・（A）空港等の周辺の上空の空域\n・（B）緊急用務空域（消防、救助、警察業務その他の緊急用務を行うための航空機の飛行の安全を確保する必要がある空域）\n・（C）地表または水面から150メートル以上の高さの空域\n＜人又は家屋の密集している地域の上空＞\n・（D）国勢調査の結果を受けて設定されている人口集中地区の上空（工業専用地域内の区域の上空は除く）\n\nb. 規制対象となる飛行の方法\n①夜間飛行（日没後から日出まで）\n②操縦者の目視外での飛行（目視外飛行）\n③第三者、または第三者の物件との距離が30メートル未満での飛行\n④祭礼、縁日、展示会など、多数の人が集まる催しが行われている場所の上空での飛行\n⑤爆発物など危険物の輸送\n⑥無人航空機からの物件の投下\n\n上のaの空域を飛ぶ場合か、bの方法で飛ぶ場合のどちらかに当てはまる飛行を「特定飛行」といいます。航空機の航行の安全への影響や、地上・水上の人や物件への危害を及ぼすおそれがあるため、原則として禁止されています。"],["3.1 航空法全般 無人航空機の飛行形態の分類（カテゴリーⅠ～Ⅲ）","飛行の禁止空域及び飛行の方法に関する無人航空機の飛行形態については、そのリスクに応じて次に掲げるとおりに分類される。a.カテゴリーⅠ飛行（レベル１（目視内での操縦飛行）、レベル２（目視内での自動・自律飛行））特定飛行に該当しない飛行を「カテゴリーⅠ飛行」という。この場合には、航空法上は特段の手続きは不要で飛行可能である。9b.カテゴリーⅡ飛行（レベル３（無人地帯での目視外飛行））特定飛行のうち、無人航空機の飛行経路下において無人航空機を飛行させる者及びこれを補助する者以外の者（以下「第三者」という。）の立入りを管理する措置（以下「立入管理措置」という。）を講じたうえで行うものを「カテゴリーⅡ飛行」という。カテゴリーⅡ飛行のうち、特に、空港周辺、高度１５０ｍ以上、催し場所上空、危険物輸送及び物件投下並びに最大離陸重量２５ｋｇ以上の無人航空機の飛行は、リスクの高いものとして、「カテゴリーⅡＡ飛行」といい、その他のカテゴリーⅡ飛行を「カテゴリーⅡＢ飛行」という。","飛行の禁止空域と飛行の方法に関する無人航空機の飛行形態は、そのリスクに応じて次のように分類されます。\n\na. カテゴリーⅠ飛行（レベル1＝目視内での操縦飛行、レベル2＝目視内での自動・自律飛行）\n特定飛行に当てはまらない飛行のことです。この場合、航空法上は特別な手続きは不要で飛ばすことができます。\n\nb. カテゴリーⅡ飛行（レベル3＝無人地帯での目視外飛行）\n特定飛行のうち、立入管理措置を講じたうえで行うものです。立入管理措置とは、飛行経路の下に、無人航空機を飛行させる人とその補助をする人以外の人（＝「第三者」）が立ち入らないように管理する措置のことです。\n\nカテゴリーⅡ飛行のうち、特にリスクが高いものとして、次の飛行を「カテゴリーⅡA飛行」といいます。\n・空港周辺\n・高度150メートル以上\n・催し場所上空\n・危険物輸送\n・物件投下\n・最大離陸重量25キログラム以上の無人航空機の飛行\n\nそれ以外のカテゴリーⅡ飛行を「カテゴリーⅡB飛行」といいます。"],["3.1 航空法全般 無人航空機の飛行形態の分類（カテゴリーⅠ～Ⅲ）","c.カテゴリーⅢ飛行（レベル４（有人地帯での目視外飛行））特定飛行のうち立入管理措置を講じないで行うもの、すなわち第三者上空における特定飛行を「カテゴリーⅢ飛行」といい、最もリスクの高い飛行となることから、その安全を確保するために最も厳格な手続き等が必要となる。なお、上記のカテゴリーによる分類とレベルによる分類は厳密には一致しない場合があるため注意が必要である。また、b.カテゴリーⅡ飛行（レベル３（無人地帯での目視外飛行））には、レベル3.5が含まれるが、これについては3.1.2(2)4)c.レベル3.5飛行で解説する。","c. カテゴリーⅢ飛行（レベル4＝有人地帯での目視外飛行）\n特定飛行のうち、立入管理措置を講じないで行うもの、つまり第三者上空での特定飛行のことです。最もリスクの高い飛行になるため、その安全を確保するために最も厳しい手続きなどが必要になります。\n\nなお、カテゴリーによる分類とレベルによる分類は、厳密には一致しない場合があるので注意が必要です。また、b.のカテゴリーⅡ飛行（レベル3＝無人地帯での目視外飛行）にはレベル3.5が含まれますが、これについては「3.1.2(2)4)c. レベル3.5飛行」で解説します。"],["3.1 航空法全般 機体認証及び無人航空機操縦者技能証明","特定飛行については、航空機の航行の安全への影響や地上及び水上の人及び物件への危害を及ぼすおそれがあることから、①使用する機体、②操縦する者の技能及び③運航管理の方法の適格性を担保し、飛行の安全を確保する必要がある。このうち、①使用する機体及び②操縦する者の技能について、国があらかじめ基準に適合していることを確認したことを証明する「機体認証」及び「技能証明」に関する制度が設けられている。機体認証及び技能証明については、無人航空機の飛行形態のリスクに応じ、カテゴリーⅢ飛行に対応した第一種機体認証及び一等無人航空機操縦士、カテゴリーⅡ飛行に対応した第二種機体認証及び二等無人航空機操縦士に区分されている。機体認証のための検査は、国又は国が登録した民間の検査機関（以下「登録検査機関」という。）が実施し、機体認証の有効期間は、第一種は１年、第二種は３年である。","特定飛行は、航空機の航行の安全への影響や、地上・水上の人や物件への危害を及ぼすおそれがあります。そのため、①使用する機体、②操縦する人の技能、③運航管理の方法、の3つがふさわしいものであることを担保して、飛行の安全を確保する必要があります。\n\nこのうち①使用する機体と②操縦する人の技能については、あらかじめ基準に適合していることを国が確認したと証明する「機体認証」と「技能証明」の制度が設けられています。\n\n機体認証と技能証明は、飛行形態のリスクに応じて次のように区分されています。\n・カテゴリーⅢ飛行に対応するもの：第一種機体認証、一等無人航空機操縦士\n・カテゴリーⅡ飛行に対応するもの：第二種機体認証、二等無人航空機操縦士\n\n機体認証のための検査は、国または国が登録した民間の検査機関（＝登録検査機関）が行います。機体認証の有効期間は、第一種が1年、第二種が3年です。"],["3.1 航空法全般 機体認証及び無人航空機操縦者技能証明","技能証明のための試験は、国が指定した民間の試験機関（以下「指定試験機関」という。）が実施し、技能証明の有効期間は、一等及び二等ともに３年である。","技能証明のための試験は、国が指定した民間の試験機関（＝指定試験機関）が行います。技能証明の有効期間は、一等・二等ともに3年です。"],["3.1 航空法全般 特定飛行を行う場合の航空法上の手続き等","特定飛行の安全を確保するためには、無人航空機の飛行形態のリスクに応じて、①使用する機体、②操縦する者の技能及び③運航管理の方法の適格性を担保する必要があることから、飛行形態の分類に対応して次に掲げるとおりとなる。10a.カテゴリーⅡ飛行カテゴリーⅡB飛行に関しては、技能証明を受けた者が機体認証を受けた無人航空機を飛行させる場合には、特段の手続き等なく飛行可能である。この場合、国土交通省令で定める飛行の安全を確保するための措置（以下「安全確保措置」という。）として飛行マニュアルを作成し遵守しなければならない。カテゴリーⅡA飛行に関しては、カテゴリーⅡB飛行に比べてリスクが高いことから、技能証明を受けた者が機体認証を受けた無人航空機を飛行させる場合であっても、あらかじめ③運航管理の方法について国土交通大臣の審査を受け、飛行の許可・承認を受けることにより可能となる。","特定飛行の安全を確保するには、飛行形態のリスクに応じて、①使用する機体、②操縦する人の技能、③運航管理の方法、の3つがふさわしいものであることを担保する必要があります。飛行形態の分類ごとに、次のとおりです。\n\na. カテゴリーⅡ飛行\n・カテゴリーⅡB飛行：技能証明を受けた人が、機体認証を受けた無人航空機を飛ばす場合は、特別な手続きなどは不要で飛行できます。この場合、国土交通省令で定める安全確保措置（＝飛行の安全を確保するための措置）として、飛行マニュアルを作成し、守る必要があります。\n・カテゴリーⅡA飛行：カテゴリーⅡB飛行よりリスクが高いため、技能証明を受けた人が機体認証を受けた無人航空機を飛ばす場合であっても、あらかじめ③運航管理の方法について国土交通大臣の審査を受け、飛行の許可・承認を受けることで飛行できます。"],["3.1 航空法全般 特定飛行を行う場合の航空法上の手続き等","なお、カテゴリーⅡA飛行及びカテゴリーⅡＢ飛行はともに、機体認証及び技能証明の両方又はいずれかを有していない場合であっても、あらかじめ①使用する機体、②操縦する者の技能及び③運航管理の方法について国土交通大臣の審査を受け、飛行の許可・承認を受けることによっても可能となる。b.カテゴリーⅢ飛行カテゴリーⅢ飛行に関しては、最もリスクの高い飛行となることから、一等無人航空機操縦士の技能証明を受けた者が第一種機体認証を受けた無人航空機を飛行させることが求められることに加え、あらかじめ③運航管理の方法について国土交通大臣の審査を受け、飛行の許可・承認を受けることにより可能となる。","なお、カテゴリーⅡA飛行もカテゴリーⅡB飛行も、機体認証と技能証明の両方またはどちらかを持っていない場合であっても、あらかじめ①使用する機体、②操縦する人の技能、③運航管理の方法について国土交通大臣の審査を受け、飛行の許可・承認を受ければ飛行できます。\n\nb. カテゴリーⅢ飛行\n最もリスクの高い飛行になるため、一等無人航空機操縦士の技能証明を受けた人が、第一種機体認証を受けた無人航空機を飛ばすことが求められます。それに加えて、あらかじめ③運航管理の方法について国土交通大臣の審査を受け、飛行の許可・承認を受けることで飛行できます。"],["3.1 航空法全般 無人航空機の操縦者が航空機の運航ルールを理解する必要性","無人航空機は、航空機と同様、空中を飛行する機器であることから、万一の場合には、航空機の航行の安全に重大な影響を及ぼすおそれがある。この観点から、①航空機の航行の安全は、人の生命や身体に直接かかわるものとして最大限優先すべきものであること、②航空機の速度や無人航空機の大きさから、航空機側から無人航空機の機体を視認し回避することが困難であること、③無人航空機は航空機と比較して一般的には機動性が高いと考えられることから、航空機と無人航空機間で飛行の進路が交差し、又は接近する場合には、航空機の航行の安全を確保するためにも、無人航空機側が回避することが妥当であり、航空機は、無人航空機に対して進路権を有するとされている。無人航空機の操縦者は、(a)国が提供している「ドローン情報基盤システム（飛行計画通報機能）」などを通じて飛行情報を共有し、(b)飛行前に航行中の航空機を確認した場合には飛行させないなどして航空機と無人航空機の接近を事前に回避するとともに、(c)飛行中に航行中の航空機を確認した場合には無人航空機を地上に降下させることその他適当な方法を講じることが求められている。","無人航空機は、航空機と同じように空中を飛ぶ機器です。そのため、万一の場合には航空機の航行の安全に重大な影響を及ぼすおそれがあります。\n\nこの観点から、次の3つの理由により、航空機と無人航空機の進路が交差したり接近したりする場合には、航空機の航行の安全を確保するためにも無人航空機の側が回避するのが妥当とされています。航空機は無人航空機に対して進路権を持つとされています。\n①航空機の航行の安全は、人の生命や身体に直接かかわるものとして、最大限優先すべきものであること\n②航空機の速度や無人航空機の大きさから、航空機側から無人航空機の機体を目で見つけて回避することが難しいこと\n③無人航空機は航空機と比べて、一般的には機動性が高いと考えられること\n\n無人航空機の操縦者には、次のことが求められています。\n(a) 国が提供している「ドローン情報基盤システム（飛行計画通報機能）」などを通じて飛行情報を共有すること\n(b) 飛行前に航行中の航空機を確認した場合には飛ばさないなどして、航空機と無人航空機の接近を事前に回避すること\n(c) 飛行中に航行中の航空機を確認した場合には、無人航空機を地上に降下させるなど、適切な方法をとること"],["3.1 航空法全般 無人航空機の操縦者が航空機の運航ルールを理解する必要性","我が国においても無人航空機と航空機の接近事案や無人航空機により空港が閉鎖される事案などが発生しており、ひとたび航空機に事故が発生した場合には甚大な被害が生じるおそれがあることから、航空機と同じ空を飛行させる無人航空機の操縦者も航空機の運航ルールを十分に理解することが極めて重要である。11","日本でも、無人航空機と航空機が接近した事案や、無人航空機によって空港が閉鎖された事案が起きています。ひとたび航空機に事故が発生すれば、甚大な被害が生じるおそれがあります。そのため、航空機と同じ空を飛ばす無人航空機の操縦者も、航空機の運航ルールを十分に理解することがきわめて重要です。"],["3.1 航空法全般 計器飛行方式及び有視界飛行方式","航空機が飛行する方式には、「計器飛行方式（IFR：InstrumentalFlightRules）」と「有視界飛行方式（VFR：VisualFlightRules）」との２つがある。計器飛行方式（IFR）は、航空交通管制機関が与える指示等に常時従って行う飛行の方式である。高速で高高度を移動する旅客機は通常は計器飛行方式（IFR）で飛行する。その他の航空機も有視界飛行方式（VFR）ができない気象状態となった場合には計器飛行方式（IFR）で飛行する。有視界飛行方式（VFR）は、計器飛行方式（IFR）以外の飛行の方式とされ、航空機の操縦者の判断に基づき飛行する方式である。小型機や回転翼航空機は有視界飛行方式（VFR）で飛行することが多い。空港及びその周辺においては、有視界飛行方式で飛行する航空機も航空交通管制機関が与える指示等に従う必要がある。","航空機が飛行する方式には、「計器飛行方式（IFR：Instrumental Flight Rules）」と「有視界飛行方式（VFR：Visual Flight Rules）」の2つがあります。\n\n・計器飛行方式（IFR）：航空交通管制機関が与える指示などに常に従って飛ぶ方式です。高速で高い高度を移動する旅客機は、通常はIFRで飛びます。その他の航空機も、有視界飛行方式（VFR）で飛べない気象状態になった場合はIFRで飛びます。\n・有視界飛行方式（VFR）：計器飛行方式（IFR）以外の飛行方式で、航空機の操縦者の判断にもとづいて飛ぶ方式です。小型機や回転翼航空機はVFRで飛ぶことが多いです。\n\nなお、空港とその周辺では、有視界飛行方式で飛ぶ航空機も、航空交通管制機関が与える指示などに従う必要があります。"],["3.1 航空法全般 航空機の飛行高度","メートル以下での航空機の飛行は離着陸に引き続く場合が多いが、捜索又は救助を任務としている公的機関（警察・消防・防衛・海上保安庁）等又はこれらの者の依頼により捜索又は救助を行う航空機や救急医療用ヘリコプター（いわゆるドクターヘリ）及び低空での飛行の許可を受けた航空機（物資輸送・送電線巡視・薬剤散布）等もしくは人又は家屋のない地域及び広い水面の上空では離着陸にかかわらず150メートル以下で飛行している場合がある。無人航空機の操縦者は、航空機との接近及び衝突を避けるため、無人航空機の飛行経路及びその周辺の空域を注意深く監視し、飛行中に航空機を確認した場合には、無人航空機を地上に降下させるなどの適切な措置を取らなければならない。","航空機がその高さ以下を飛ぶのは、離着陸に引き続く場合が多いです。ただし、次のような航空機は、離着陸かどうかに関係なく150メートル以下を飛んでいる場合があります。\n・捜索や救助を任務としている公的機関（警察・消防・防衛・海上保安庁）等の航空機、またはこれらの依頼を受けて捜索や救助を行う航空機\n・救急医療用ヘリコプター（いわゆるドクターヘリ）\n・低空での飛行の許可を受けた航空機（物資輸送・送電線巡視・薬剤散布）\nまた、人や家屋のない地域や広い水面の上空でも、離着陸かどうかに関係なく150メートル以下を飛んでいる場合があります。\n\n無人航空機の操縦者は、航空機との接近や衝突を避けるため、無人航空機の飛行経路とその周辺の空域を注意深く監視する必要があります。飛行中に航空機を確認した場合には、無人航空機を地上に降下させるなど、適切な措置をとる必要があります。"],["3.1 航空法全般 航空機の操縦者による見張り義務","航空機の操縦者は、航空機の航行中は、飛行方式にかかわらず、視界の悪い気象状態にある場合を除き、他の航空機その他の物件と衝突しないように見張りをすることが義務付けられているが、航空機の飛行速度や無人航空機の大きさを考慮すると、航空機側から無人航空機の機体を視認し回避することは困難である。無人航空機の操縦者は、これを理解したうえで、無人航空機の飛行経路上及びその周辺の空域を注意深く監視し、飛行中の航空機を確認した場合には、無人航空機を地上に降下させるなどの適切な措置を取らなければならない。","航空機の操縦者は、飛行中は飛行方式にかかわらず、他の航空機やその他の物件と衝突しないように見張りをすることが義務づけられています（視界の悪い気象状態にある場合は除く）。ただし、航空機の飛行速度や無人航空機の大きさを考えると、航空機側から無人航空機の機体を目で見つけて回避することは困難です。\n\n無人航空機の操縦者は、このことを理解したうえで、無人航空機の飛行経路上とその周辺の空域を注意深く監視する必要があります。飛行中の航空機を確認した場合には、無人航空機を地上に降下させるなど、適切な措置をとる必要があります。"],["3.1 航空法全般 出発前の航空情報の確認","航空機の機長は、出発前に運航に必要な準備が整っていることを確認することが求められており、その一環として、国土交通大臣から提供される航空情報を確認することが義務付けられている。","航空機の機長は、出発前に、運航に必要な準備が整っているかどうかを確認することが求められています。その一環として、国土交通大臣から提供される航空情報を確認することが義務づけられています。"],["3.1 航空法全般 航空機の空域の概要","無人航空機は、高度１５０メートル以上又は空港周辺の空域の飛行は原則禁止されているが、これは航空機が主に飛行する空域との分離を図ることにより、安全を確保するためである。このため、無人航12空機がこれらの禁止空域を飛行する場合には、当該空域を管轄する航空交通管制機関と調整し支障の有無を確認したうえで飛行の許可を受ける必要があるが、そのうえで、無人航空機の操縦者は、次に掲げる航空機の空域の特徴や注意点を十分に理解して慎重に飛行し、航空交通管制機関等の指示等を遵守する必要がある。a.航空機の管制区域国は、航空交通の安全及び秩序を確保するため、航空交通管制業務を実施する区域（管制区域）を設定している（管制区域以外の空域を非管制区域という）。","無人航空機は、高度150メートル以上の空域や空港周辺の空域を飛ぶことが原則として禁止されています。これは、航空機が主に飛ぶ空域と分けることで、安全を確保するためです。\n\nそのため、無人航空機がこれらの禁止空域を飛ぶ場合には、その空域を管轄する航空交通管制機関と調整し、支障がないかを確認したうえで、飛行の許可を受ける必要があります。そのうえで無人航空機の操縦者は、次に挙げる航空機の空域の特徴や注意点を十分に理解して慎重に飛行し、航空交通管制機関などの指示に従う必要があります。\n\na. 航空機の管制区域\n国は、航空交通の安全と秩序を確保するため、航空交通管制業務を行う区域（＝管制区域）を設定しています。管制区域以外の空域は、非管制区域といいます。"],["3.1 航空法全般 航空機の空域の概要","航空交通管制区は、地表又は水面から２００メートル以上の高さの空域のうち国が指定した空域であり、この空域を計器飛行方式により飛行する航空機は航空交通管制機関と常時連絡を取り、飛行の方法等についての指示に従って飛行を行わなければならない。また、航空交通管制圏は、航空機の離着陸が頻繁に実施される空港等及びその周辺の空域であり、この空域を飛行する全ての航空機は航空交通管制機関と連絡を取り、飛行の方法や離着陸の順序等の指示に従って飛行を行わなければならない。b.空港の制限表面の概要航空機が安全に離着陸するためには、空港周辺の一定の空間を障害物が無い状態にしておく必要があるため、航空法において、次のような制限表面を設定している。ア）全ての空港に設定するもの進入表面：進入の最終段階及び離陸時における航空機の安全を確保するために必要な表面水平表面：空港周辺での旋回飛行等低空飛行の安全を確保するために必要な表面転移表面：進入をやり直す場合等の側面方向への飛行の安全を確保するために必要な表面イ）東京・成田・中部・関西国際空港及び政令空港において指定することができるもの東京（羽田）・成田・中部・関西国際空港及び政令空港（釧路・函館・仙台・大阪国際・松山・福岡・長崎・熊本・大分・宮崎・鹿児島・那覇の各空港）においては、航空機が頻繁に離着陸することから、上記ア)の制限表面に加え、次の制限表面も設定されている。","・航空交通管制区：地表または水面から200メートル以上の高さの空域のうち、国が指定した空域です。この空域を計器飛行方式で飛ぶ航空機は、航空交通管制機関と常に連絡を取り、飛行の方法などについての指示に従って飛ぶ必要があります。\n・航空交通管制圏：航空機の離着陸が頻繁に行われる空港等とその周辺の空域です。この空域を飛ぶすべての航空機は、航空交通管制機関と連絡を取り、飛行の方法や離着陸の順序などの指示に従って飛ぶ必要があります。\n\nb. 空港の制限表面の概要\n航空機が安全に離着陸するためには、空港周辺の一定の空間を障害物がない状態にしておく必要があります。そのため航空法では、次のような制限表面が設定されています。\n\nア）すべての空港に設定するもの\n・進入表面：進入の最終段階と離陸時における航空機の安全を確保するために必要な表面\n・水平表面：空港周辺での旋回飛行など、低空飛行の安全を確保するために必要な表面\n・転移表面：進入をやり直す場合など、側面方向への飛行の安全を確保するために必要な表面\n\nイ）東京・成田・中部・関西国際空港および政令空港で指定することができるもの\n東京（羽田）・成田・中部・関西国際空港と、政令空港（釧路・函館・仙台・大阪国際・松山・福岡・長崎・熊本・大分・宮崎・鹿児島・那覇の各空港）では、航空機が頻繁に離着陸するため、上のア）の制限表面に加えて、次の制限表面も設定されています。"],["3.1 航空法全般 航空機の空域の概要","円錐表面：大型化及び高速化により旋回半径が増大した航空機の空港周辺での旋回飛行等の安全を確保するために必要な表面延長進入表面：精密進入方式による航空機の最終直線進入の安全を確保するために必要な表面外側水平表面：航空機が最終直線進入を行うまでの経路の安全を確保するために必要な表面","・円錐表面：大型化・高速化によって旋回半径が大きくなった航空機の、空港周辺での旋回飛行などの安全を確保するために必要な表面\n・延長進入表面：精密進入方式による航空機の最終直線進入の安全を確保するために必要な表面\n・外側水平表面：航空機が最終直線進入を行うまでの経路の安全を確保するために必要な表面"],["3.1 航空法全般 模型航空機に対する規制","重量１００グラム未満のものを含む模型航空機についても、航空機の飛行に影響を及ぼすおそれのある行為は航空法により規制されている。①航空交通管制圏、航空交通情報圏、航空交通管制区内の特別管制空域等における模型航空機13の飛行は禁止されている。また、国土交通省が災害等の発生時に後述の緊急用務空域を設定した場合には、当該空域における飛行も禁止される。②①の空域以外のうち、空港等の周辺、航空路内の空域（高度１５０メートル以上）、高度２５０メートル以上の空域において、模型航空機を飛行させる場合には、国土交通省への事前の届出が必要となる。航空法に関する各論","重量100グラム未満のものを含む模型航空機についても、航空機の飛行に影響を及ぼすおそれのある行為は航空法によって規制されています。\n\n①次の空域では、模型航空機を飛ばすことが禁止されています。\n・航空交通管制圏、航空交通情報圏、航空交通管制区内の特別管制空域等\n・国土交通省が災害等の発生時に緊急用務空域を設定した場合は、その空域\n\n②①以外の空域のうち、次の場所で模型航空機を飛ばす場合には、国土交通省への事前の届出が必要です。\n・空港等の周辺\n・航空路内の空域（高度150メートル以上）\n・高度250メートル以上の空域"],["3.1 航空法全般 無人航空機登録制度の背景・目的","無人航空機による不適切な飛行事案への対応の必要性や無人航空機の利活用の増加に伴い、無人航空機の登録制度が創設された。その目的は、①事故発生時などにおける所有者把握、②事故の原因究明など安全確保上必要な措置の実施、③安全上問題のある機体の登録を拒否し安全を確保することである。","無人航空機の登録制度は、ドローンによる不適切な飛行への対応が必要になったことと、ドローンの利活用が増えてきたことを受けて作られました。目的は次の3つです。\n・事故が起きたときなどに、所有者が誰かを把握できるようにすること\n・事故の原因究明など、安全確保のために必要な措置を実施できるようにすること\n・安全上問題のある機体は登録を拒否し、安全を確保すること"],["3.1 航空法全般 無人航空機登録制度の概要","全ての無人航空機（重量が１００グラム未満の模型航空機は除く。）は、国の登録を受けたものでなければ、原則として航空の用に供することができない。登録の有効期間は３年である。登録記号を表示し、一部の例外を除きリモートID機能を備えなければならない。","すべての無人航空機は、国の登録を受けたものでなければ、原則として飛行に使うことができません。ただし、重量100グラム未満の模型航空機は除きます。\n・登録の有効期間は3年です。\n・機体には登録記号を表示します。\n・一部の例外を除き、リモートID機能（＝機体の識別情報を電波で発信する機能）を備える必要があります。"],["3.1 航空法全般 登録を受けることができない無人航空機","①製造者が機体の安全性に懸念があるとして回収（リコール）しているような機体や、事故が多発していることが明らかである機体など、あらかじめ国土交通大臣が登録できないものと指定したもの②表面に不要な突起物があるなど地上の人などに衝突した際に安全を著しく損なうおそれのある無人航空機③遠隔操作又は自動操縦による飛行の制御が著しく困難である無人航空機","次の無人航空機は登録を受けることができません。\n・国土交通大臣があらかじめ「登録できない」と指定したもの。たとえば、製造者が機体の安全性に懸念があるとして回収（リコール）している機体や、事故が多発していることが明らかな機体です。\n・表面に不要な突起物があるなど、地上の人などに衝突したときに安全を著しく損なうおそれのある機体\n・遠隔操作や自動操縦による飛行の制御が著しく難しい機体"],["3.1 航空法全般 登録の手続き及び登録記号の表示","無人航空機の登録の申請は、オンライン又は書類提出により行い、手数料の納付等全ての手続き完了後、登録記号が発行される。登録記号は、無人航空機の容易に取り外しができない外部から確認しやすい箇所に耐久性のある方法で鮮明に表示しなければならない。登録記号の文字は機体の重量区分に応じて次の高さとし、表示する地色と鮮明に判別できる色で表示しなければならない。⚫最大離陸重量25kg以上の機体は25mm以上⚫最大離陸重量25kg未満の機体は3mm以上14所有者又は使用者の氏名や住所などに変更があった場合には、登録事項の変更の届出をしなければならない。３年の有効期間毎に更新を受けなければ、登録の効力を失う。","登録の申請は、オンラインまたは書類の提出で行います。手数料の納付など、すべての手続きが終わると登録記号が発行されます。\n表示のしかた\n・登録記号は、機体の外から確認しやすく、簡単に取り外せない箇所に表示します。\n・耐久性のある方法で、鮮明に表示します。\n・文字の高さは機体の重量区分で決まります。最大離陸重量25kg以上の機体は25mm以上、最大離陸重量25kg未満の機体は3mm以上です。\n・表示する地色とはっきり判別できる色を使います。\nそのほか\n・所有者や使用者の氏名・住所などが変わったときは、登録事項の変更の届出をする必要があります。\n・3年の有効期間ごとに更新を受けないと、登録の効力を失います。"],["3.1 航空法全般 リモート ID 機能の搭載の義務","機体への物理的な登録記号の表示に加え、識別情報を電波で遠隔発信するリモートID機能を機体に備えなければならない。ただし、次に掲げる場合にあっては、リモートID機能の搭載が免除される。①無人航空機の登録制度の施行前（２０２２年６月１９日）までの事前登録期間中に登録手続きを行った無人航空機②あらかじめ国に届け出た特定区域（リモートID特定区域）の上空で行う飛行であって、無人航空機の飛行を監視するための補助者の配置、区域の範囲の明示などの必要な措置を講じた上で行う飛行③十分な強度を有する紐（ひも）など（長さが３０ｍ以内のもの）により係留して行う飛行④警察庁、都道府県警察又は海上保安庁が警備その他の特に秘匿を必要とする業務のために行う飛行","機体に登録記号を表示するのに加えて、識別情報を電波で遠隔発信するリモートID機能を機体に備える必要があります。ただし、次の場合は搭載が免除されます。\n・登録制度が始まる前（2022年6月19日）までの事前登録期間中に登録手続きを行った機体\n・あらかじめ国に届け出た特定区域（リモートID特定区域）の上空での飛行。ただし、飛行を監視する補助者の配置や区域の範囲の明示など、必要な措置をとったうえで行うものに限ります。\n・十分な強度のある紐（ひも）など（長さ30メートル以内のもの）で係留して行う飛行\n・警察庁、都道府県警察、海上保安庁が、警備その他の特に秘匿を必要とする業務のために行う飛行"],["3.1 航空法全般 リモート ID 機器の概要及び発信情報","リモートID機能は、識別情報を電波で遠隔発信するためのものであり（内蔵型と外付型がある）、当該機器は技術規格書に準拠して開発・製造される。リモートID機能により発信される情報には、静的情報として無人航空機の製造番号及び登録記号、動的情報として位置、速度、高度、時刻などの情報が含まれており（所有者や使用者の情報は含まれない）、１秒に１回以上発信される。","リモートID機能は、識別情報を電波で遠隔発信するためのもので、内蔵型と外付型があります。機器は技術規格書に沿って開発・製造されます。\n発信される情報は次のとおりです。\n・静的情報（変わらない情報）：無人航空機の製造番号と登録記号\n・動的情報（飛行中に変わる情報）：位置、速度、高度、時刻など\n所有者や使用者の情報は含まれません。発信は1秒に1回以上行われます。"],["3.1 航空法全般 規制対象となる飛行の空域","a.空港等の周辺の空域航空法に基づき原則として無人航空機の飛行が禁止されている「空港等の周辺の空域」は、空港やヘリポート等の周辺に設定されている進入表面、転移表面若しくは水平表面又は延長進入表面、円錐表面若しくは外側水平表面の上空の空域、（進入表面等がない）飛行場周辺の、航空機の離陸及び着陸の安全を確保するために必要なものとして国土交通大臣が告示で定める空域である。ただし、航空機の離着陸が頻繁に実施される新千歳空港・成田国際空港・東京国際空港・中部国際空港・関西国際空港・大阪国際空港・福岡空港・那覇空港では、進入表面等の上空の空域に加えて、進入表面若しくは転移表面の下の空域又は空港の敷地の上空の空域についても飛行禁止空域となっている。","航空法で原則として飛行が禁止されている「空港等の周辺の空域」は、次のとおりです。\n・空港やヘリポートなどの周辺に設定されている、進入表面、転移表面、水平表面、延長進入表面、円錐表面、外側水平表面の上空の空域\n・進入表面などがない飛行場の周辺で、航空機の離陸・着陸の安全を確保するために必要なものとして国土交通大臣が告示で定める空域\nさらに、航空機の離着陸が頻繁に行われる次の空港では、進入表面などの上空の空域に加えて、進入表面や転移表面の下の空域、空港の敷地の上空の空域も飛行禁止空域になります。\n・新千歳空港、成田国際空港、東京国際空港、中部国際空港、関西国際空港、大阪国際空港、福岡空港、那覇空港"],["3.1 航空法全般 規制対象となる飛行の空域","b.緊急用務空域国土交通省、防衛省、警察庁、都道府県警察又は地方公共団体の消防機関その他の関係機関の使用する航空機のうち捜索、救助その他の緊急用務を行う航空機の飛行の安全を確保するため、国土交通省が緊急用務を行う航空機が飛行する空域（緊急用務空域）を指定し、この空域では、原則、無人航空機の飛行が禁止される（重量１００グラム未満の模型航空機も飛行禁止の対象となる）。災害等の規模に応じ、緊急用務を行う航空機の飛行が想定される場合には、国土交通省がその都度「緊急用務空域」を指定し、国土交通省のホームページ・X(旧Twitter）にて公示する。無人航空機の操縦者は、飛行を開始する前に、当該空域が緊急用務空域に該当するか否かの別を確認することが義務付けられている。空港等の周辺の空域、地表若しくは水面から１５０ｍ以上の高さの空域又は人口集中地区の上空の飛行許可があっても、緊急用務空域を飛行させることはできない。","捜索・救助その他の緊急用務を行う航空機の飛行の安全を確保するため、国土交通省がその航空機の飛ぶ空域を「緊急用務空域」として指定します。対象となる航空機は、国土交通省、防衛省、警察庁、都道府県警察、地方公共団体の消防機関その他の関係機関が使うものです。\n・この空域では、原則として無人航空機は飛ばせません。重量100グラム未満の模型航空機も飛行禁止の対象です。\n・災害などの規模に応じて、緊急用務を行う航空機の飛行が想定されるときに、国土交通省がその都度「緊急用務空域」を指定し、国土交通省のホームページとX（旧Twitter）で公示します。\n・操縦者は、飛行を始める前に、その空域が緊急用務空域にあたるかどうかを確認することが義務づけられています。\n・空港等の周辺の空域、地表や水面から150メートル以上の高さの空域、人口集中地区の上空について飛行の許可を受けていても、緊急用務空域を飛ばすことはできません。"],["3.1 航空法全般 規制対象となる飛行の空域","c.高度１５０メートル以上の空域「高度１５０メートル以上の飛行禁止空域」とは、海抜高度ではなく、無人航空機が飛行している直下の地表又は水面からの高度差が１５０メートル以上の空域を指す。このため、山岳部などの起伏の激しい地形の上空で無人航空機を飛行させる場合には、意図せず１５０メートル以上の高度差になるおそれがあるので注意が必要である。d.人口集中地区「人口集中地区（DID：DenselyInhabitedDistrict）」は、５年毎に実施される国勢調査の結果から一定の基準により設定される地域であり、現在は令和２年の国勢調査の結果に基づく人口集中地区が適用されている。ただし、都市計画法第8条第1項第1号の工業専用地域内の区域において、無人航空機を飛行させる場合には、DIDに係る許可手続き等が不要である。","高度150メートル以上の空域\n・「高度150メートル以上の飛行禁止空域」は、海抜高度で決まるのではありません。無人航空機が飛んでいる真下の地表または水面からの高度差が150メートル以上の空域を指します。\n・そのため、山岳部など起伏の激しい地形の上空で飛ばすときは、意図せず150メートル以上の高度差になるおそれがあり、注意が必要です。\n人口集中地区\n・「人口集中地区（DID：Densely Inhabited District）」は、5年ごとに行われる国勢調査の結果から一定の基準で設定される地域です。現在は令和2年の国勢調査の結果に基づく人口集中地区が適用されています。\n・ただし、都市計画法第8条第1項第1号の工業専用地域内の区域で飛ばす場合は、DIDに関する許可手続きなどは不要です。"],["3.1 航空法全般 規制対象となる飛行の方法","a.昼間（日中）における飛行無人航空機の操縦者は、昼間（日中。日出から日没までの間）における飛行が原則とされ、それ以外の飛行の方法（夜間飛行）は、航空法に基づく規制の対象となる。「昼間（日中）」とは、国立天文台が発表する日の出の時刻から日の入りの時刻までの間を指す。b.目視による常時監視無人航空機の操縦者は、当該無人航空機及びその周囲の状況を目視により常時監視して飛行させることが原則とされ、それ以外の飛行の方法（目視外飛行）は、航空法に基づく規制の対象となる。「目視により常時監視」とは、飛行させる者が自分の目で見ることを指し、双眼鏡やモニター（FPV（FirstPersonView）を含む。）による監視や補助者による監視は含まない（眼鏡やコンタクトレンズの使用は「目視」に含まれる）。なお、安全な飛行を行うためにバッテリー残量を確認する目的等で無人16航空機から一時的に目を離し、モニターを確認する等は目視飛行の範囲内となる。","昼間（日中）における飛行\n・飛行は昼間（日中。日出から日没までの間）に行うのが原則です。それ以外の飛ばし方（夜間飛行）は、航空法に基づく規制の対象になります。\n・「昼間（日中）」とは、国立天文台が発表する日の出の時刻から日の入りの時刻までの間を指します。\n目視による常時監視\n・機体とその周囲の状況を、目視で常に監視しながら飛ばすのが原則です。それ以外の飛ばし方（目視外飛行）は、航空法に基づく規制の対象になります。\n・「目視により常時監視」とは、飛ばす人が自分の目で見ることです。双眼鏡やモニター（FPV（First Person View。一人称視点の映像）を含む）による監視、補助者による監視は含みません。眼鏡やコンタクトレンズを使うことは「目視」に含まれます。\n・なお、安全な飛行のためにバッテリー残量を確認する目的などで、一時的に機体から目を離してモニターを確認することは、目視飛行の範囲内です。"],["3.1 航空法全般 規制対象となる飛行の方法","c.人又は物件との距離無人航空機の操縦者は、当該無人航空機と地上又は水上の人又は物件との間に３０メートル以上の距離（無人航空機と人又は物件との間の直線距離）を保って飛行させることが原則とされ、それ以外の飛行の方法は、航空法に基づく規制の対象となる。「人又は物件」とは、第三者又は第三者の物件を指し、無人航空機を飛行させる者及びその関係者並びにこれらの者が所有又は管理する物件は該当しない。また、「物件」とは、(a)中に人が存在することが想定される機器、(b)建築物その他の相当の大きさを有する工作物等を指す。具体的な「物件」の例は次のとおり。車両等：自動車、鉄道車両、軌道車両、船舶、航空機、建設機械、港湾のクレーン等工作物：ビル、住居、工場、倉庫、橋梁、高架、水門、変電所、鉄塔、電柱、電線、信号機、街灯等なお、土地や自然物（樹木、雑草等）などは、「物件」に該当しない。","人または物件との距離\n・機体と、地上または水上の人・物件との間に30メートル以上の距離（機体と人・物件との直線距離）を保って飛ばすのが原則です。それ以外の飛ばし方は、航空法に基づく規制の対象になります。\n・ここでいう「人又は物件」は、第三者または第三者の物件のことです。無人航空機を飛ばす人やその関係者、これらの人が所有・管理する物件はあたりません。\n・「物件」とは、(a)中に人が存在することが想定される機器、(b)建築物その他の相当の大きさを有する工作物などを指します。\n・車両等の例：自動車、鉄道車両、軌道車両、船舶、航空機、建設機械、港湾のクレーンなど\n・工作物の例：ビル、住居、工場、倉庫、橋梁、高架、水門、変電所、鉄塔、電柱、電線、信号機、街灯など\n・土地や自然物（樹木、雑草など）は「物件」にあたりません。"],["3.1 航空法全般 規制対象となる飛行の方法","d.催し場所上空無人航空機の操縦者は、多数の者の集合する催しが行われている場所の上空における飛行が原則禁止されている。「多数の者の集合する催し」とは、特定の場所や日時に開催される多数の者が集まるものを指す。その該当の有無については、催し場所上空において無人航空機が落下することにより地上等の人に危害を及ぼすことを防止するという趣旨に照らし、集合する者の人数や規模だけでなく、特定の場所や日時に開催されるかどうかによって総合的に判断される。なお、飛行許可・承認の取得の有無によらず、飛行予定経路下において想定していない「多数の者の集合する催し」が開催されることが明らかになり、飛行場所に第三者の立入り又はそのおそれのあることを確認したときは、直ちに当該無人航空機の飛行を停止し、飛行経路の変更、航空機の航行の安全並びに地上及び水上の人及び物件の安全を損なうおそれがない場所への着陸その他の必要な措置を講じなければならない。","多数の人が集まる催しが行われている場所の上空では、飛行が原則禁止です。\n・「多数の者の集合する催し」とは、特定の場所や日時に開催される、多数の人が集まるものを指します。\n・あてはまるかどうかは、催し場所の上空で機体が落下して地上などの人に危害を及ぼすことを防ぐという趣旨に照らして判断します。集まる人数や規模だけでなく、特定の場所や日時に開催されるかどうかも含めて総合的に判断されます。\n・飛行の許可・承認を受けているかどうかに関係なく、飛行予定経路の下で想定していなかった「多数の者の集合する催し」が開かれることが明らかになり、飛行場所に第三者が立ち入る、またはそのおそれがあると確認したときは、直ちに飛行を停止する必要があります。あわせて、飛行経路の変更や、航空機の航行の安全ならびに地上・水上の人および物件の安全を損なうおそれがない場所への着陸など、必要な措置をとる必要があります。"],["3.1 航空法全般 規制対象となる飛行の方法","具体的には、次のとおり。⚫該当する例祭礼、縁日、展示会のほか、プロスポーツの試合、スポーツ大会、運動会、屋外で開催されるコンサート等のイベント、ドローンショー（自社敷地内、無人の競技場内等、第三者の立入管理措置が行われていることが明白である場所での事前練習や企業向けの配信用撮影等を除く）、花火大会、盆踊り大会、マラソン、街頭パレード、選挙等における屋外演説会、デモ（示威行為）等⚫該当しない例関係者のみが参加する催し場所上空の飛行自然発生的なもの（信号待ちや混雑により生じる人混み等）また、多数の者の集合する催しが行われている場所の上空における飛行に際しては、風速5m/s以上の場合は飛行を中止することや、機体が第三者及び物件に接触した場合の危害を軽減する構造17を用意していることが必要である。","あてはまる例\n・祭礼、縁日、展示会\n・プロスポーツの試合、スポーツ大会、運動会\n・屋外で開催されるコンサートなどのイベント\n・ドローンショー（ただし、自社敷地内や無人の競技場内など、第三者の立入管理措置が行われていることが明白な場所での事前練習や、企業向けの配信用撮影などは除きます）\n・花火大会、盆踊り大会、マラソン、街頭パレード\n・選挙などにおける屋外演説会、デモ（示威行為）など\nあてはまらない例\n・関係者のみが参加する催し場所の上空の飛行\n・自然発生的なもの（信号待ちや混雑によって生じる人混みなど）\nまた、多数の人が集まる催しの場所の上空で飛ばすときは、次が必要です。\n・風速5m/s以上の場合は飛行を中止すること\n・機体が第三者や物件に接触した場合の危害を軽減する構造を用意していること"],["3.1 航空法全般 規制対象となる飛行の方法","e.危険物の輸送無人航空機の操縦者は、当該無人航空機により危険物を輸送することが原則禁止されている。「危険物」とは、火薬類、高圧ガス、引火性液体、可燃性物質、酸化性物質類、毒物類、放射性物質、腐食性物質などが該当する。無人航空機の飛行のため当該無人航空機で輸送する物件は、「危険物」の対象とならない。例えば、無人航空機の飛行のために必要な燃料や電池、安全装置としてのパラシュートを開傘するために必要な火薬類や高圧ガス、業務用機器（カメラ等）に用いられる電池が該当する。f.物件の投下無人航空機の操縦者は、当該無人航空機から物件を投下させることが原則禁止されている。物件の投下には、水や農薬等の液体や霧状のものの散布も含まれる。無人航空機を使って対象物件を地表等に落下させることなく地上の人員に受け渡す行為や輸送した物件を地表に置く行為は、物件の投下には含まれない。","危険物の輸送\n・無人航空機で危険物を運ぶことは原則禁止です。\n・「危険物」にあたるのは、火薬類、高圧ガス、引火性液体、可燃性物質、酸化性物質類、毒物類、放射性物質、腐食性物質などです。\n・その無人航空機を飛ばすために積んでいる物件は「危険物」にあたりません。たとえば、飛行に必要な燃料や電池、安全装置としてのパラシュートを開傘するために必要な火薬類や高圧ガス、業務用機器（カメラなど）に使う電池です。\n物件の投下\n・無人航空機から物件を投下することは原則禁止です。\n・水や農薬などの液体、霧状のものの散布も投下に含まれます。\n・無人航空機を使って、対象物件を地表などに落下させずに地上の人員へ受け渡す行為や、輸送した物件を地表に置く行為は、物件の投下に含まれません。"],["3.1 航空法全般 規制対象となる飛行の空域及び方法の例外","a.捜索又は救助のための特例国や地方公共団体又はこれらから依頼を受けた者が、事故、災害等に際し、捜索又は救助を目的として無人航空機を飛行させる場合には、特例として飛行の空域及び方法の規制が適用されない。ここで、「捜索又は救助」とは、事故や災害の発生等に際して人命や財産に急迫した危難のおそれがある場合において、人命の危機又は財産の損傷を回避するための措置を指しており、当該措置をとることについて緊急性がある飛行については、本特例が適用されることとなる。例えば、大規模災害発生時においては、多数の道路の寸断や集落の孤立が発生する可能性があることから、被災者の捜索又は救助に加え、被災地の孤立地域等への医薬品、衛生用品、食料品、飲料水等の生活必需品の輸送、危険を伴う箇所での調査・点検のほか、住民避難後の住宅やその地域の防犯対策のための無人航空機の飛行も含め、当該特例の対象となる。これらについては通達「無人航空機に係る規制の運用における解釈について」や「航空法第132条の92の適用を受け無人航空機を飛行させる場合の運用ガイドライン」において規定されている。また、震災発生に伴う仮設住宅建設予定調査のための飛行や獣害を未然に防ぐための飛行など、この特例の具体的な適用事例が国土交通省ホームページに参考資料として示されている。","捜索または救助のための特例\n・国や地方公共団体、またはこれらから依頼を受けた人が、事故や災害の際に捜索・救助を目的として無人航空機を飛ばす場合は、特例として飛行の空域と方法の規制が適用されません。\n・ここでいう「捜索又は救助」とは、事故や災害の発生などで人命や財産に急迫した危難のおそれがある場合に、人命の危機や財産の損傷を避けるためにとる措置のことです。その措置をとることに緊急性がある飛行が、この特例の対象になります。\n・たとえば大規模災害では、多くの道路が寸断されたり集落が孤立したりする可能性があります。そのため、被災者の捜索・救助に加えて、次のものも特例の対象になります。\n・被災地の孤立地域などへの医薬品、衛生用品、食料品、飲料水といった生活必需品の輸送\n・危険を伴う箇所での調査・点検\n・住民が避難した後の住宅やその地域の防犯対策のための飛行\n・これらは、通達「無人航空機に係る規制の運用における解釈について」や「航空法第132条の92の適用を受け無人航空機を飛行させる場合の運用ガイドライン」で定められています。\n・また、震災に伴う仮設住宅の建設予定調査のための飛行や、獣害を未然に防ぐための飛行など、この特例の具体的な適用事例が国土交通省のホームページに参考資料として示されています。"],["3.1 航空法全般 規制対象となる飛行の空域及び方法の例外","なお、災害時の対応であっても、国や地方公共団体にかかわらない独自の活動にあっては、特例の対象とはならず、国の飛行の許可・承認などの手続き等が必要となる。b.高度１５０メートル以上の空域の例外地表又は水面から１５０メートル以上の高さの空域に関しては、航空機の空域と分離する観点から原18則として飛行が禁止されているが、煙突や鉄塔などの高層の構造物の周辺は、航空機の飛行が想定されないことから、高度１５０メートル以上の空域であっても、当該構造物から３０メートル以内の空域については、無人航空機の飛行禁止空域から除外されている。ただし、当該構造物の関係者による飛行を除き、第三者又は第三者の物件から３０メートル以内の飛行に該当することから、当該飛行の方法に関する手続き等は必要となる。","・災害時の対応であっても、国や地方公共団体に関わらない独自の活動は特例の対象になりません。この場合は、国の飛行の許可・承認などの手続きが必要です。\n高度150メートル以上の空域の例外\n・地表または水面から150メートル以上の高さの空域は、航空機の空域と分離する観点から、原則として飛行が禁止されています。\n・ただし、煙突や鉄塔などの高い構造物の周辺は航空機の飛行が想定されないため、高度150メートル以上でも、その構造物から30メートル以内の空域は飛行禁止空域から除かれています。\n・ただし、その構造物の関係者による飛行を除き、第三者または第三者の物件から30メートル以内の飛行にあたるため、その飛行の方法に関する手続きなどは必要です。"],["3.1 航空法全般 規制対象となる飛行の空域及び方法の例外","c.十分な強度を有する紐等で係留した場合の例外十分な強度を有する紐（ひも）等（３０メートル以下）で係留し、飛行可能な範囲内への第三者の立入管理等の措置を講じて無人航空機を飛行させる場合は、人口集中地区、夜間飛行、目視外飛行、第三者から３０メートル以内の飛行及び物件投下に係る手続き等が不要である。自動車、航空機等の移動する物件に紐等を固定して又は人が紐等を持って移動しながら無人航空機を飛行させる行為（えい航）は、係留には該当しない。d.航空法施行規則第236条の82第１項第２号の規定による農薬散布等の例外無人航空機を飛行させて農薬等の空中散布などを行う場合であって、航空法施行規則第236条の82第１項第２号の規定で定める要件を満たす場合には、夜間飛行、目視外飛行、第三者から３０メートル以内の飛行、危険物輸送及び物件投下に係る飛行の承認手続きが不要である。","十分な強度がある紐などで係留した場合の例外\n・十分な強度がある紐（ひも）など（30メートル以下）で係留し、飛行できる範囲へ第三者が立ち入らないよう管理するなどの措置をとって飛ばす場合は、次に関する手続きなどが不要です。\n・人口集中地区での飛行\n・夜間飛行\n・目視外飛行\n・第三者から30メートル以内の飛行\n・物件投下\n・自動車や航空機など移動する物件に紐などを固定したり、人が紐などを持って移動しながら飛ばしたりする行為（えい航）は、係留にあたりません。\n農薬散布などの例外（航空法施行規則第236条の82第1項第2号）\n・無人航空機で農薬などの空中散布などを行う場合で、航空法施行規則第236条の82第1項第2号が定める要件を満たすときは、次に関する飛行の承認手続きが不要です。\n・夜間飛行\n・目視外飛行\n・第三者から30メートル以内の飛行\n・危険物輸送\n・物件投下"],["3.1 航空法全般 「第三者」について","「第三者」とは、無人航空機の飛行に直接的又は間接的に関与していない者をいう。次に掲げる者は無人航空機の飛行に直接的又は間接的に関与しており、「第三者」には該当しない。(a)無人航空機の飛行に直接的に関与している者直接的に関与している者（以下「直接関与者」という。）とは、操縦者、現に操縦はしていないが操縦する可能性のある者、補助者等無人航空機の飛行の安全確保に必要な要員とする。(b)無人航空機の飛行に間接的に関与している者間接的に関与している者（以下「間接関与者」という。）とは、飛行目的について操縦者と共通の認識を持ち、次のいずれにも該当する者とする。a.操縦者が、間接関与者について無人航空機の飛行の目的の全部又は一部に関与していると判断している。","「第三者」とは、無人航空機の飛行に直接的にも間接的にも関与していない人のことです。次の人は飛行に直接的または間接的に関与しているので、「第三者」にあたりません。\n(a) 飛行に直接的に関与している人（直接関与者）\n・操縦者\n・今は操縦していないが、操縦する可能性のある人\n・補助者など、無人航空機の飛行の安全確保に必要な要員\n(b) 飛行に間接的に関与している人（間接関与者）\n飛行の目的について操縦者と共通の認識を持ち、次のすべてにあてはまる人です。\n・a. 操縦者が、その人は無人航空機の飛行の目的の全部または一部に関与していると判断している。"],["3.1 航空法全般 「第三者」について","b.間接関与者が、操縦者から、無人航空機が計画外の挙動を示した場合に従うべき明確な指示と安全上の注意を受けている。なお、間接関与者は当該指示と安全上の注意に従うことが期待され、操縦者は、指示と安全上の注意が適切に理解されていることを確認する必要がある。19c.間接関与者が、無人航空機の飛行目的の全部又は一部に関与するかどうかを自ら決定することができる。例：映画の空撮における俳優やスタッフ、学校等での人文字の空撮における生徒等","・b. 間接関与者が、無人航空機が計画外の挙動を示した場合に従うべき明確な指示と安全上の注意を、操縦者から受けている。間接関与者はその指示と安全上の注意に従うことが期待されます。操縦者は、その指示と注意が適切に理解されているかを確認する必要があります。\n・c. 間接関与者が、無人航空機の飛行目的の全部または一部に関与するかどうかを、自分で決められる。\n例：映画の空撮における俳優やスタッフ、学校などでの人文字の空撮における生徒など"],["3.1 航空法全般 「第三者上空」について","「第三者上空」とは、（１）の「第三者」の上空をいい、当該第三者が乗り込んでいる移動中の車両等（自動車、鉄道車両、軌道車両、船舶、航空機、建設機械、港湾のクレーン等をいう。以下同じ。）の上空を含むものとする。この場合の「上空」とは、「第三者」の直上だけでなく、飛行させる無人航空機の落下距離（飛行範囲の外周から製造者等が保証した落下距離）を踏まえ、当該無人航空機が落下する可能性のある領域に第三者が存在する場合は、当該無人航空機は当該第三者の上空にあるものとみなす。また、無人航空機の飛行が終了するまでの間、無人航空機の飛行に関与しない者（（１）の「第三者」）の態様（状況）及び飛行の形態が以下のいずれかに該当する場合は、無人航空機が第三者上空にあるとはみなさないこととなる。","「第三者上空」とは、（1）の「第三者」の上空のことです。その第三者が乗り込んでいる移動中の車両等（自動車、鉄道車両、軌道車両、船舶、航空機、建設機械、港湾のクレーンなどをいいます。以下同じ）の上空も含みます。\n・ここでいう「上空」は、「第三者」の真上だけを指すのではありません。飛ばす無人航空機の落下距離（飛行範囲の外周から、製造者などが保証した落下距離）を踏まえ、機体が落下する可能性のある領域に第三者がいる場合は、その第三者の上空にあるとみなします。\n・また、飛行が終わるまでの間、飛行に関与しない人（（1）の「第三者」）の状況と飛行の形態が次のいずれかにあてはまる場合は、無人航空機が第三者上空にあるとはみなされません。"],["3.1 航空法全般 「第三者上空」について","①「第三者」が遮蔽物に覆われており、当該遮蔽物に無人航空機が衝突した際に当該第三者が保護される状況にある場合（当該第三者が屋内又は車両等（移動中のものを除く。）の内部にある場合等。）②「第三者」が、移動中の車両等（無人航空機が当該車両等に衝突した際に当該第三者が保護される状況にある場合に限る。）の中にある場合であって、無人航空機が必要な要件を満たした上でc.レベル3.5飛行に規定される飛行として一時的に当該移動中の車両等の上空を飛行するとき。ただし、「第三者」が遮蔽物に覆われず、無人航空機の衝突から保護されていない状況になった場合には、無人航空機が「第三者上空」にあるとみなされる点に留意する必要がある。b.立入管理措置特定飛行に関しては、無人航空機の飛行経路下において第三者の立入りを管理する措置（立入管理措置）を講ずるか否かにより、カテゴリーⅡ飛行とカテゴリーⅢ飛行に区分され、必要となる手続き等が異なる。","次の①②にあたる人は、「第三者上空」の第三者としては扱われません。\n①その人が遮蔽物（さえぎる物）に覆われていて、無人航空機がその遮蔽物にぶつかってもその人が守られる状況にある場合。たとえば、屋内にいる場合や、車両等（動いていないもの）の中にいる場合などです。\n②その人が移動中の車両等の中にいて、無人航空機がその車両等にぶつかってもその人が守られる状況にある場合。ただし、無人航空機が必要な要件を満たしたうえで、レベル3.5飛行として一時的にその移動中の車両等の上空を飛ぶときに限ります。\n注意点として、その人が遮蔽物に覆われず、無人航空機の衝突から守られていない状態になったときは、無人航空機は「第三者上空」にあるとみなされます。\n\nb. 立入管理措置\n特定飛行は、飛行経路の下に第三者が入らないようにする措置（＝立入管理措置）をとるかどうかで、カテゴリーⅡ飛行とカテゴリーⅢ飛行に分かれます。どちらになるかで必要な手続きなどが変わります。"],["3.1 航空法全般 「第三者上空」について","立入管理措置の内容は、第三者の立入りを制限する区画（立入管理区画）を設定し、当該区画の範囲を明示するために必要な標識の設置等としており、例えば、関係者以外の立入りを制限する旨の看板、コーン等による表示、補助者による監視及び口頭警告などが該当する。c.レベル3.5飛行2023年12月に、デジタル技術の活用（機上カメラ）、無人航空機操縦者技能証明の保有及び保険への加入を条件として、レベル3飛行で従来求められていた立入管理措置のうち、補助者の配置や看板の設置等を機上カメラによる確認に代替し、移動中の車両等の上空の一時的な横断を伴う飛行が可能となる「レベル3.5飛行」が新設された。以下、レベル3.5飛行の概要を述べる。","立入管理措置とは、第三者の立入りを制限する区画（＝立入管理区画）を決め、その範囲がわかるように必要な標識を設置することなどです。たとえば次のようなものが当てはまります。\n・関係者以外の立入りを制限する旨の看板\n・コーン等による表示\n・補助者による監視や口頭での警告\n\nc. レベル3.5飛行\n2023年12月に「レベル3.5飛行」が新たにつくられました。これは、次の3つを条件として、レベル3飛行でこれまで求められていた立入管理措置のうち補助者の配置や看板の設置などを、機上カメラでの確認に置き換えられるものです。\n・デジタル技術の活用（機上カメラ）\n・無人航空機操縦者技能証明を持っていること\n・保険に加入していること\nこれにより、移動中の車両等の上空を一時的に横断する飛行ができるようになりました。以下でレベル3.5飛行の概要を説明します。"],["3.1 航空法全般 レベル 3.5 飛行の位置づけ","レベル3.5飛行は、山、海水域、河川・湖沼、森林、農用地等の人口密度が低い地域といった第三者が存在する可能性が低い場所（※夜間含む）で行うものであり、飛行経路下に歩行者等がいない無人地帯であることをデジタル技術の活用(機上カメラ)によって確認することで立入管理措置を代替し、経路を特定したうえで行う飛行であることから、カテゴリーⅡ飛行（レベル3飛行）に該当する。カテゴリーⅡ飛行（レベル３）カテゴリーⅢ飛行（レベル４）カテゴリーⅡ飛行（レベル３.５）補助者や周知看板を配置する等の立入管理措置を講じ、飛行経路下が無人地帯であることを確認し飛行する。機体に搭載したカメラによって、飛行経路下に歩行者等がいない無人地帯であることを確認し飛行する。","レベル3.5飛行は、山・海水域・河川や湖沼・森林・農用地など、人口密度が低くて第三者がいる可能性の低い場所で行う飛行です（夜間も含みます）。飛行経路の下に歩行者等がいない無人地帯であることをデジタル技術（機上カメラ）で確認することで立入管理措置の代わりとし、経路を決めたうえで飛ばします。そのため、区分としてはカテゴリーⅡ飛行にあたります。\n\n3つの飛び方の違いは次のとおりです。\n・カテゴリーⅡ飛行（レベル3）：補助者や周知看板を配置するなどの立入管理措置をとり、飛行経路の下が無人地帯であることを確認して飛ばす。\n・カテゴリーⅡ飛行（レベル3.5）：機体に載せたカメラで、飛行経路の下に歩行者等がいない無人地帯であることを確認して飛ばす。\n・カテゴリーⅢ飛行（レベル4）：飛行経路の下で立入管理措置をとらず、有人地帯で飛ばす。"],["3.1 航空法全般 レベル 3.5 飛行の位置づけ","飛行経路下において、立入管理措置を講じず、有人地帯で飛行する。そのため、レベル3.5飛行は以下の点について注意する必要がある。⚫一定の要件を満たすことにより、一時的な道路等の横断に限って移動中の車両等の上空を飛行することを可能とするものであり、カテゴリーⅢ（レベル４）飛行と同様に歩行者等の第三者の上空の飛行を認めるものではない。⚫一定の要件を満たすことにより、従来求められていた立入管理措置のうち補助者の配置や看板の設置等を機上カメラでの確認に代替するものであり、立入管理措置そのものが不要となるわけではない。","レベル3.5飛行では、次の2点に注意する必要があります。\n・一定の要件を満たせば、一時的な道路等の横断に限って、移動中の車両等の上空を飛べるようになるだけです。カテゴリーⅢ（レベル4）飛行のように、歩行者等の第三者の上空を飛ぶことを認めるものではありません。\n・一定の要件を満たすことで、これまで求められていた立入管理措置のうち補助者の配置や看板の設置などを機上カメラでの確認に置き換えられるだけです。立入管理措置そのものが不要になるわけではありません。"],["3.1 航空法全般 レベル 3.5 飛行の実施に求められる安全確保体制等","レベル3.5飛行の実施に当たっては、特に下記3つの要件への適合が必要である。⚫機上カメラと地上に設置するモニター等の設備により、進行方向の飛行経路の直下及びその周辺に第三者の立入りが無いことを確認できることを事前に確認していること⚫操縦者が無人航空機操縦者技能証明(飛行させる無人航空機の種類、重量に対応したものであって、目視内飛行の限定解除を受けたもの)を保有していること⚫移動中の車両等との接触や交通障害等の不測の事態に備え、十分な補償が可能な第三者賠償責任保険に加入していることまた、レベル3.5飛行の実施に際し、レベル３飛行に必要な要件へ適合していることを示す以下の資料の作成が必要である。また、飛行の安全を確保するための運航条件等を事前に定める必要がある。","レベル3.5飛行を行うときは、特に次の3つの要件を満たす必要があります。\n・機上カメラと、地上に置くモニター等の設備によって、進む方向の飛行経路の真下とその周辺に第三者が立ち入っていないことを確認できると、事前に確かめてあること\n・操縦者が無人航空機操縦者技能証明を持っていること（飛ばす無人航空機の種類・重量に合ったもので、目視内飛行の限定解除を受けたもの）\n・移動中の車両等との接触や交通障害など、思わぬ事態に備えて、十分な補償ができる第三者賠償責任保険に入っていること\n\nまた、レベル3.5飛行を行うときは、レベル3飛行に必要な要件を満たしていることを示す資料をつくる必要があります。あわせて、飛行の安全を守るための運航条件などを事前に決めておく必要があります。"],["3.1 航空法全般 レベル 3.5 飛行の実施に求められる安全確保体制等","⚫飛行に際し想定されるリスクを十分に考慮の上、安全な飛行が可能となる運航条件等を設定した資料⚫無人航空機の機能・性能及び飛行形態に応じた追加基準に関する基準適合状況を示せる資料⚫操縦者にかかる飛行形態に応じた追加基準への適合性について、過去の飛行実績又は訓練実績等を記載した資料⚫飛行範囲及びその外周から製造者等が保証した落下距離の範囲内を立入管理区画として地図上に示した資料⚫想定される運用により、十分な飛行実績(機体の初期故障期間を超えたもの)を有することを示せる資料21なお、上記資料は基本的に申請時の提出は不要であるが、別途、国土交通省航空局から求めがあった場合には提出が必要となる。","必要な資料は次のとおりです。\n・飛行で想定されるリスクを十分に考えたうえで、安全に飛べる運航条件などを決めた資料\n・無人航空機の機能・性能や飛行形態に応じた追加基準について、基準に適合している状況を示せる資料\n・操縦者について、飛行形態に応じた追加基準に適合していることを、過去の飛行実績や訓練実績などで記載した資料\n・飛行範囲と、その外周から製造者等が保証した落下距離の範囲内を、立入管理区画として地図上に示した資料\n・想定される運用について、十分な飛行実績（機体の初期故障期間を超えたもの）があることを示せる資料\n\nこれらの資料は、基本的に申請のときに提出する必要はありません。ただし、国土交通省航空局から求めがあった場合には提出する必要があります。"],["3.1 航空法全般 無人航空機の操縦者が遵守する必要がある運航ルール","a.アルコール又は薬物の影響下での飛行禁止アルコール又は薬物の影響により当該無人航空機の正常な飛行ができないおそれがある間において飛行させないこと。「アルコール」とはアルコール飲料やアルコールを含む食べ物を指し、「薬物」とは麻薬や覚せい剤等の規制薬物に限らず、医薬品も含まれる。アルコールによる身体への影響は、個人の体質やその日の体調により異なるため、体内に保有するアルコールが微量であっても無人航空機の正常な飛行に影響を与えるおそれがあるため、体内に保有するアルコール濃度の程度にかかわらず体内にアルコールを保有する状態では無人航空機の飛行を行ってはならない。b.飛行前の確認無人航空機が飛行に支障がないことその他飛行に必要な準備が整っていることを確認した後において飛行させること。","a. アルコール又は薬物の影響下での飛行禁止\nアルコールや薬物の影響で無人航空機を正常に飛ばせないおそれがある間は、飛行させてはいけません。\n・「アルコール」とは、アルコール飲料やアルコールを含む食べ物のことです。\n・「薬物」とは、麻薬や覚せい剤などの規制薬物だけでなく、医薬品も含みます。\nアルコールが体に与える影響は、その人の体質やその日の体調によって違います。体内のアルコールがごくわずかでも正常な飛行に影響するおそれがあるため、体内のアルコール濃度がどの程度かに関係なく、体内にアルコールがある状態では飛行させてはいけません。\n\nb. 飛行前の確認\n無人航空機が飛行に支障がないこと、その他飛行に必要な準備が整っていることを確認してから飛ばす必要があります。"],["3.1 航空法全般 無人航空機の操縦者が遵守する必要がある運航ルール","(a)外部点検及び作動点検による無人航空機の状況の確認各機器の取付状況（ネジ等の脱落やゆるみ等）、発動機・モーター等の異音の有無、機体（プロペラ、フレーム等）の損傷や歪みの有無、通信系統・推進系統・電源系統・自動制御系統等の作動状況などの確認が挙げられる。(b)無人航空機を飛行させる空域及びその周囲の状況の確認飛行空域や周囲における航空機や他の無人航空機の飛行状況、飛行空域や周囲の地上又は水上の人（第三者の有無）又は物件（障害物等の有無）の状況、航空法その他の法令等の必要な手続き等の状況、緊急用務空域・飛行自粛要請空域の該当の有無、立入管理措置・安全確保措置等の準備状況などの確認が挙げられる。(c)飛行に必要な気象情報の確認天候、風速、視程など当該無人航空機の飛行に適した天候にあるか否かを確認する。","(a) 外部点検と作動点検による無人航空機の状態の確認\n・各機器の取付状況（ネジ等の脱落やゆるみなど）\n・発動機・モーター等の異音の有無\n・機体（プロペラ、フレーム等）の損傷や歪みの有無\n・通信系統・推進系統・電源系統・自動制御系統等の作動状況　など\n\n(b) 飛ばす空域とその周囲の状況の確認\n・飛行空域や周囲での航空機や他の無人航空機の飛行状況\n・飛行空域や周囲の地上・水上にいる人（第三者がいるか）や物件（障害物などがあるか）の状況\n・航空法その他の法令等で必要な手続きなどの状況\n・緊急用務空域・飛行自粛要請空域に当たるかどうか\n・立入管理措置や安全確保措置などの準備状況　など\n\n(c) 飛行に必要な気象情報の確認\n天候・風速・視程などを見て、その無人航空機を飛ばすのに適した天候かどうかを確認します。"],["3.1 航空法全般 無人航空機の操縦者が遵守する必要がある運航ルール","(d)燃料の搭載量又はバッテリーの残量の確認(e)リモートID機能の作動状況（リモートID機能の搭載の例外となっている場合を除く。）c.航空機又は他の無人航空機との衝突防止飛行前において、航行中の航空機を確認した場合には、飛行を行わないこと。また、飛行中の他の無人航空機を確認した場合には、飛行日時、飛行経路、飛行高度等について、他の無人航空機を飛行さ22せる者と調整を行うこと。飛行中において、航行中の航空機を確認した場合には、地上に降下させるなど、接近又は衝突を回避するための適切な措置を取ること。また、飛行中の他の無人航空機を確認した場合には、当該無人航空機との間に安全な間隔を確保して飛行させ、接近又は衝突のおそれがあると認められる場合には地上に降下させるなど適切な措置を取るとともに、飛行日時、飛行経路、飛行高度等について、他の無人航空機を飛行させる者と調整を行うこと。","(d) 燃料の搭載量またはバッテリーの残量の確認\n(e) リモートID機能の作動状況の確認（リモートID機能の搭載が例外として不要な場合を除きます）\n\nc. 航空機や他の無人航空機との衝突防止\n飛行前に確認したときは、次のようにします。\n・飛んでいる航空機を見つけたら、飛行を行わないこと。\n・飛んでいる他の無人航空機を見つけたら、飛行日時・飛行経路・飛行高度などについて、その無人航空機を飛ばしている人と調整すること。\n\n飛行中に確認したときは、次のようにします。\n・飛んでいる航空機を見つけたら、地上に降下させるなど、近づいたりぶつかったりするのを避けるための適切な措置をとること。\n・飛んでいる他の無人航空機を見つけたら、その機体との間に安全な間隔をとって飛ばすこと。近づくおそれやぶつかるおそれがあると認められる場合は、地上に降下させるなど適切な措置をとり、あわせて飛行日時・飛行経路・飛行高度などについて、その無人航空機を飛ばしている人と調整すること。"],["3.1 航空法全般 無人航空機の操縦者が遵守する必要がある運航ルール","d.他人に迷惑を及ぼす方法での飛行禁止飛行上の必要がないのに高調音を発し、又は急降下し、その他他人に迷惑を及ぼすような方法で飛行させないこと。「他人に迷惑を及ぼすような方法」とは、人に向かって無人航空機を急接近させることなどを指す。e.使用者の整備及び改造の義務登録を受けた無人航空機の使用者は、整備及び必要に応じて改造をし、当該無人航空機が安全上の問題から登録を受けることができない無人航空機とならないように維持しなければならない。登録記号の機体への表示も維持しなければならない。f.事故等の場合の措置ア）事故の場合の措置無人航空機に関する事故が発生した場合には、当該無人航空機を飛行させる者は、直ちに当該無人航空機の飛行を中止するとともに、負傷者がいる場合にはその救護・通報、事故等の状況に応じた警察への通報、火災が発生している場合の消防への通報など、危険を防止するための必要な措置を講じなければならない。また、当該事故が発生した日時及び場所等の必要事項を国土交通大臣に報告しなければならない。なお、無人航空機の事故とは、次の事態をいう。","d. 他人に迷惑を及ぼす方法での飛行禁止\n飛行上の必要がないのに高調音（大きな音）を出したり、急降下したりするなど、他人に迷惑を及ぼすような方法で飛ばしてはいけません。「他人に迷惑を及ぼすような方法」とは、人に向かって無人航空機を急に近づけることなどを指します。\n\ne. 使用者の整備及び改造の義務\n登録を受けた無人航空機の使用者は、整備をし、必要に応じて改造もして、その機体が安全上の問題で登録を受けられない機体にならないよう維持する必要があります。登録記号の機体への表示も維持する必要があります。\n\nf. 事故等の場合の措置\nア）事故の場合の措置\n無人航空機に関する事故が起きたとき、その機体を飛ばしていた人は、すぐに飛行を中止し、危険を防ぐために必要な措置をとる必要があります。たとえば、けが人がいる場合の救護と通報、状況に応じた警察への通報、火災が起きている場合の消防への通報などです。あわせて、事故が起きた日時や場所などの必要事項を国土交通大臣に報告する必要があります。\nなお、無人航空機の事故とは次の事態をいいます。"],["3.1 航空法全般 無人航空機の操縦者が遵守する必要がある運航ルール","a.無人航空機による人の死傷又は物件の損壊人の死傷に関しては重傷以上を対象とする。物件の損壊に関しては第三者の所有物を対象とするが、その損傷の規模や損害額を問わず全ての損傷を対象とする。b.航空機との衝突又は接触航空機又は無人航空機のいずれか又は両方に損傷が確認できるものを対象とする。イ）重大インシデントの報告上記事故が発生するおそれがあると認める事態（重大インシデント）が発生した場合にあっても、国土交通大臣への報告が義務付けられている。重大インシデントの対象としては、飛行中航空機との衝突又は接触のおそれがあったと認めた事態、重傷に至らない無人航空機による人の負傷、無人航空機の制御が不能となった事態及び無人航空機が発火した事態（飛行中に発生したものに限る。）が含まれる。","a. 無人航空機による人の死傷または物件の損壊\n・人の死傷については、重傷以上が対象です。\n・物件の損壊については、第三者の所有物が対象です。損傷の規模や損害額は問わず、すべての損傷が対象になります。\nb. 航空機との衝突または接触\n航空機と無人航空機のどちらか、または両方に損傷が確認できるものが対象です。\n\nイ）重大インシデントの報告\n上の事故が起きるおそれがあると認められる事態（＝重大インシデント）が起きた場合も、国土交通大臣への報告が義務づけられています。重大インシデントには次のものが含まれます。\n・飛行中、航空機とぶつかる、または接触するおそれがあったと認めた事態\n・重傷には至らない、無人航空機による人の負傷\n・無人航空機の制御ができなくなった事態\n・無人航空機が発火した事態（飛行中に起きたものに限ります）"],["3.1 航空法全般 特定飛行をする場合に遵守する必要がある運航ルール","a.飛行計画の通報等無人航空機を飛行させる者は、特定飛行を行う場合には、あらかじめ、次に掲げる事項等を記載した飛行計画を国土交通大臣に通報しなければならない（あらかじめ飛行計画を通報することが困難な場合には事後の通報でも可）。具体的には、国が提供している「ドローン情報基盤システム（飛行計画通報機能）」に入力することにより通報する。a.無人航空機の登録記号及び種類並びに型式（型式認証を受けたものに限る。）b.無人航空機を飛行させる者の氏名並びに技能証明書番号（技能証明を受けた者に限る。）及び飛行の許可・承認の番号（許可・承認を受けた場合に限る。）c.飛行の目的、高度及び速度d.飛行させる飛行禁止空域及び飛行の方法e.出発地、目的地、目的地に到着するまでの所要時間f.立入管理措置の有無及びその内容g.損害賠償のための保険契約の有無及びその内容無人航空機を飛行させる者は、通報した飛行計画に従って特定飛行をしなければならない。国土交通大臣は、当該飛行計画の通報を受けた場合に安全の確保のために必要と認めるときは、特定飛行の日時又は経路の変更など必要な措置を講ずるよう指示する場合があり、当該指示を受けた場合にはその指示に従わなければならない。ただし、安全を確保するためにやむを得ない場合はこの限りではない。","a. 飛行計画の通報など\n特定飛行を行う場合、飛ばす人はあらかじめ次の事項などを書いた飛行計画を国土交通大臣に通報する必要があります（あらかじめ通報するのが難しい場合は、後から通報しても構いません）。通報は、国が提供している「ドローン情報基盤システム（飛行計画通報機能）」に入力して行います。\na. 無人航空機の登録記号・種類・型式（型式は、型式認証を受けたものに限る）\nb. 飛ばす人の氏名、技能証明書番号（技能証明を受けた人に限る）、飛行の許可・承認の番号（許可・承認を受けた場合に限る）\nc. 飛行の目的・高度・速度\nd. 飛ばす飛行禁止空域と飛行の方法\ne. 出発地、目的地、目的地に到着するまでの所要時間\nf. 立入管理措置の有無とその内容\ng. 損害賠償のための保険契約の有無とその内容\n\n飛ばす人は、通報した飛行計画のとおりに特定飛行をする必要があります。国土交通大臣は、飛行計画の通報を受けて安全の確保のために必要と認めるときは、特定飛行の日時や経路の変更など、必要な措置をとるよう指示することがあります。その指示を受けたら従う必要があります。ただし、安全を確保するためにやむを得ない場合は、この限りではありません。"],["3.1 航空法全般 特定飛行をする場合に遵守する必要がある運航ルール","なお、特定飛行に該当しない無人航空機の飛行を行う場合であっても、飛行計画を通報することが望ましい。b.飛行日誌の携行及び記載無人航空機を飛行させる者は、特定飛行をする場合には、飛行日誌を携行（携帯）することが義務付けられる。飛行日誌は、紙又は電子データ（システム管理を含む。）の形態を問わないが、特定飛行を行う場合には、必要に応じ速やかに参照や提示できるようにする必要がある。特定飛行を行う者は、無人航空機に関する情報（登録記号、種類、型式、製造者・製造番号等）に加え、次に掲げる事項等を遅滞なく飛行日誌に記載しなければならない。特定飛行に該当しない無人航空機の飛行を行う場合であっても、飛行日誌に記載することが望ましい。a.飛行記録飛行の年月日、離着陸場所・時刻、飛行時間、飛行させた者の氏名、不具合及びその対応等b.日常点検記録日常点検の実施の年月日・場所、実施者の氏名、日常点検の結果等c.点検整備記録点検整備の実施の年月日・場所、実施者の氏名、点検・修理・改造・整備の内容・理由等3）機体認証を受けた無人航空機を飛行させる者が遵守する必要がある運航ルール24a.使用の条件の遵守無人航空機の機体認証を行う場合は、無人航空機飛行規程に定めた無人航空機の安全性を確保するための限界事項等（最大離陸重量、飛行可能高度、飛行可能速度等）を「使用の条件」として指定し、使用条件等指定書として交付することとしている。機体認証を受けた無人航空機を飛行させる者は、当該使用の条件の範囲内で特定飛行しなければならない。","特定飛行に当たらない飛行を行う場合でも、飛行計画を通報することが望ましいとされています。\n\nb. 飛行日誌の携行と記載\n特定飛行をする場合、飛ばす人は飛行日誌を携行（携帯）することが義務づけられます。飛行日誌は紙でも電子データ（システム管理を含む）でもよいですが、特定飛行を行う場合は、必要に応じてすぐに参照したり提示したりできるようにする必要があります。\n特定飛行を行う人は、無人航空機に関する情報（登録記号、種類、型式、製造者・製造番号など）に加えて、次の事項などを遅れずに飛行日誌に記載する必要があります。特定飛行に当たらない飛行の場合でも、飛行日誌に記載することが望ましいとされています。\na. 飛行記録：飛行の年月日、離着陸場所・時刻、飛行時間、飛ばした人の氏名、不具合とその対応など\nb. 日常点検記録：日常点検を行った年月日・場所、実施者の氏名、日常点検の結果など\nc. 点検整備記録：点検整備を行った年月日・場所、実施者の氏名、点検・修理・改造・整備の内容と理由など\n\n3）機体認証を受けた無人航空機を飛ばす人が守る運航ルール\na. 使用の条件の遵守\n機体認証を行う際は、無人航空機飛行規程に定めた安全性を確保するための限界事項など（最大離陸重量、飛行可能高度、飛行可能速度など）を「使用の条件」として指定し、使用条件等指定書として交付することになっています。機体認証を受けた無人航空機を飛ばす人は、その使用の条件の範囲内で特定飛行をする必要があります。"],["3.1 航空法全般 特定飛行をする場合に遵守する必要がある運航ルール","b.必要な整備の義務機体認証を受けた無人航空機の使用者は、必要な整備をすることにより、当該無人航空機を安全基準に適合するように維持しなければならない。具体的には、無人航空機の機体認証を行う場合に設定される無人航空機整備手順書（機体メーカーの取扱説明書等）に従って整備をすることが義務付けられる。","b. 必要な整備の義務\n機体認証を受けた無人航空機の使用者は、必要な整備をして、その機体を安全基準に適合するように維持する必要があります。具体的には、機体認証の際に設定される無人航空機整備手順書（機体メーカーの取扱説明書など）に従って整備することが義務づけられます。"],["3.1 航空法全般 罰則","航空法令の規定に違反した場合には、次の罰則の対象となる可能性がある（技能証明を有する者は、罰則に加えて、技能証明の取消し等の行政処分の対象にもなる可能性がある）。違反行為罰則⚫事故が発生した場合に飛行を中止し負傷者を救護するなどの危険を防止するための措置を講じなかったとき２年以下の懲役又は１００万円以下の罰金⚫登録を受けていない無人航空機を飛行させたとき１年以下の懲役又は５０万円以下の罰金⚫アルコール又は薬物の影響下で無人航空機を飛行させたとき１年以下の懲役又は３０万円以下の罰金⚫登録記号の表示又はリモートIDの搭載をせずに飛行させたとき⚫規制対象となる飛行の区域又は方法に違反して飛行させたとき⚫飛行前の確認をせずに飛行させたとき⚫航空機又は他の無人航空機との衝突防止をしなかったとき⚫他人に迷惑を及ぼす飛行を行ったとき⚫機体認証で指定された使用の条件の範囲を超えて特定飛行をおこなったとき等５０万円以下の罰金⚫飛行計画を通報せずに特定飛行を行ったとき⚫事故が発生した場合に報告をせず、又は虚偽の報告をしたとき等３０万円以下の罰金⚫技能証明を携帯せずに特定飛行を行ったとき⚫飛行日誌を備えずに特定飛行を行ったとき⚫飛行日誌に記載せず、又は虚偽の記載をしたとき１０万円以下の罰金","航空法令の規定に違反した場合、次の罰則の対象になることがあります（技能証明を持っている人は、罰則に加えて、技能証明の取消しなどの行政処分の対象にもなることがあります）。\n\n【2年以下の懲役または100万円以下の罰金】\n・事故が起きたときに、飛行を中止し負傷者を救護するなど、危険を防ぐための措置をとらなかったとき\n\n【1年以下の懲役または50万円以下の罰金】\n・登録を受けていない無人航空機を飛ばしたとき\n\n【1年以下の懲役または30万円以下の罰金】\n・アルコールまたは薬物の影響下で無人航空機を飛ばしたとき\n\n【50万円以下の罰金】\n・登録記号の表示やリモートIDの搭載をせずに飛ばしたとき\n・規制対象となる飛行の区域や方法に違反して飛ばしたとき\n・飛行前の確認をせずに飛ばしたとき\n・航空機や他の無人航空機との衝突防止をしなかったとき\n・他人に迷惑を及ぼす飛行を行ったとき\n・機体認証で指定された使用の条件の範囲を超えて特定飛行を行ったとき　など\n\n【30万円以下の罰金】\n・飛行計画を通報せずに特定飛行を行ったとき\n・事故が起きたときに報告をせず、または虚偽の報告をしたとき　など\n\n【10万円以下の罰金】\n・技能証明を携帯せずに特定飛行を行ったとき\n・飛行日誌を備えずに特定飛行を行ったとき\n・飛行日誌に記載せず、または虚偽の記載をしたとき"],["3.1 航空法全般 行政処分等","技能証明を有する者が、「無人航空機操縦者技能証明に係る行政処分に関する基準」に定める処分事由に該当する行為を行った場合、処分事由に応じて技能証明の効力の取消や停止等の行政処分又は行政指導が行われる。同基準では点数制を採用しており、技能証明に係る行政処分及び行政指導の内容は、「点数表」に掲げる処分事由に対応する点数を基本として、個別事情や過去に処分を受けているかの有無を勘案して点数の加重又は軽減を行い、当該処分事由についての点数を決定したうえで、「処分等区分表」によって決定される。25「点数表」、「処分等区分表」、「個別事情による加減表」、「過去に処分等を受けている場合の取扱表」を以下に示す。「無人航空機操縦者技能証明に係る行政処分に関する基準」に定める「点数表」処分事由点数1事故が発生した場合に危険防止措置を講じない152アルコール・薬物の影響下での飛行153飛行計画の変更指示に従わない飛行154限定をされた技能証明を受けた者による限定外の種類・方法での特定飛行145条件付きの技能証明を受けた者による条件の範囲外での特定飛行146飛行前確認・衝突予防措置を行わないこと147他人に迷惑を及ぼすような方法での公共の場所の上空での飛行148承認を受けずに行う夜間・目視外・30ｍ未満・催し上空飛行149承認を受けずに行う危険物輸送1410承認を受けずに行う物件投下1411飛行の方法について承認外での飛行1412夜間・目視外・30ｍ未満飛行において安全確保措置を講じないこと1413機体認証において指定された使用の条件の範囲を超えた特定飛行1314整備命令に違反した特定飛行1315無人航空機の飛行に影響を及ぼすおそれのある行為1216飛行禁止空域での飛行等1117飛行計画を通報しない特定飛行1018機体登録を受けて 示その他の登録記号を識別するための措置を講じていない登録無人航空機の供用：1\n27 機体認証を受けずに法第132条の13第8項の表示、またはこれと紛らわしい表示を付すこと：1\n28 型式認証を受けずに法第132条の19第2項の表示、またはこれと紛らわしい表示を付すこと：1\n29 技能証明書不携帯での特定飛行：1\n30 登録事項の変更の届出を行わない、または虚偽の届出を行うこと：1\n31 登録の抹消申請を行わないこと：1\n32 飛行に当たり非行または重大な過失があったとき：1～10\n\n■「処分等区分表」（点数：処分等の内容）\n1～2：口頭注意\n3～5：文書警告\n6～8：技能証明の効力の停止3月\n9～11：技能証明の効力の停止6月\n12～14：技能証明の効力の停止1年\n15～：技能証明の効力の取消\n\n■「個別事情による加減表」\n〈行為者の意識〉\n・重大な悪意または害意に基づく行為：加重3点\n・行為を行うにつきやむを得ない事情がある場合：軽減1～3点\n〈行為の態様・結果〉\n・違反行為等の内容が軽微で情状をくむべき場合：軽減1～3点\n・第三者の負傷の結果が生じた場合：加重1～3点\n・常習的に行っている場合：加重3点\n〈是正等の対応〉\n・速やかに処分事由が生じている状態の解消を自主的に行った場合：軽減1～3点\n・処分の対象となる事由につき自主的に申し出た場合：軽減1～3点\n〈社会的影響〉\n・刑事訴追されるなど社会的影響が大きい場合：加重1～3点\n〈その他〉\n・上記以外の特に考慮すべき事情がある場合：適宜加減\n\n■「過去に処分等を受けている場合の取扱表」（過去の処分等 → 今回相当する処分等ごとの加重）\n・過去が口頭注意または文書警告：今回が口頭注意・文書警告なら加重2点／効力停止なら加重3点／取消なら加重4点\n・過去が技能証明の効力停止：今回が口頭注意・文書警告なら加重4点／効力停止なら加重5点／取消なら加重6点\n・過去が技能証明の取消：技能証明の取消"],["3.1 航空法全般 安全確保措置等","カテゴリーⅡ飛行のうち、カテゴリーⅡB飛行については、技能証明を受けた操縦者が機体認証を受けた無人航空機を飛行させる場合には、特段の手続きなく飛行可能である。この場合には、安全確保措置として次に掲げる事項等を記載した飛行マニュアルを作成し遵守しなければならない。a.無人航空機の定期的な点検及び整備に関する事項b.無人航空機を飛行させる者の技能の維持に関する事項c.当該無人航空機の飛行前の確認に関する事項d.無人航空機の飛行に係る安全管理体制に関する事項e.事故等が発生した場合における連絡体制の整備等に関する事項カテゴリーⅡ飛行のうち、カテゴリーⅡＡ飛行については、技能証明を受けた操縦者が機体認証を受けた無人航空機を飛行させる場合であっても、あらかじめ「運航管理の方法」について国土交通大臣の審査を受け、飛行の許可・承認を受ける必要がある。","カテゴリーⅡ飛行のうちカテゴリーⅡB飛行は、技能証明を受けた操縦者が機体認証を受けた無人航空機を飛ばす場合、特段の手続きなしで飛行できます。この場合は、安全確保措置として次の事項などを書いた飛行マニュアルをつくり、それを守る必要があります。\na. 無人航空機の定期的な点検と整備に関する事項\nb. 無人航空機を飛ばす人の技能の維持に関する事項\nc. その無人航空機の飛行前の確認に関する事項\nd. 無人航空機の飛行に関する安全管理体制に関する事項\ne. 事故等が起きた場合の連絡体制の整備などに関する事項\n\n一方、カテゴリーⅡ飛行のうちカテゴリーⅡA飛行は、技能証明を受けた操縦者が機体認証を受けた無人航空機を飛ばす場合であっても、あらかじめ「運航管理の方法」について国土交通大臣の審査を受け、飛行の許可・承認を受ける必要があります。"],["3.1 航空法全般 カテゴリーⅢ飛行を行う場合の運航管理体制［一等］","カテゴリーⅢ飛行を行う場合には、一等無人航空機操縦士の技能証明を受けた操縦者が第一種機体認証を受けた無人航空機を飛行させることが求められることに加え、あらかじめ「運航管理の方法」について国土交通大臣の審査を受け、飛行の許可・承認を受ける必要がある。具体的には、無人航空機を飛行させる者は、第三者上空飛行に当たり想定されるリスクの分析と評価を実施し、非常時の対処方針や緊急着陸場所の設定などの必要なリスク軽減策を講じることとし、これらのリスク評価結果に基づき作成された飛行マニュアルを含めて、運航の管理が適切に行われることを審査される。また、飛行の許可・承認の審査において、無人航空機を飛行させる者が適切な保険に加入するなど賠償能力を有することの確認を行うこととしている。なお、リスク評価については、「安全確保措置検討のための無人航空機の運航リスク評価ガイドライン」（公益財団法人福島イノベーション・コースト構想推進機構福島ロボットテストフィールド発行）を活用することが推奨されている。","カテゴリーⅢ飛行を行う場合は、一等無人航空機操縦士の技能証明を受けた操縦者が、第一種機体認証を受けた無人航空機を飛ばすことが求められます。これに加えて、あらかじめ「運航管理の方法」について国土交通大臣の審査を受け、飛行の許可・承認を受ける必要があります。\n具体的には、飛ばす人は、第三者上空飛行で想定されるリスクの分析と評価を行い、非常時の対処方針や緊急着陸場所の設定など、必要なリスク軽減策を講じます。そして、このリスク評価の結果に基づいてつくった飛行マニュアルも含めて、運航の管理が適切に行われるかどうかが審査されます。\nまた、飛行の許可・承認の審査では、飛ばす人が適切な保険に加入しているなど、賠償能力があることの確認も行われます。\nなお、リスク評価については、「安全確保措置検討のための無人航空機の運航リスク評価ガイドライン」（公益財団法人福島イノベーション・コースト構想推進機構 福島ロボットテストフィールド発行）を活用することが推奨されています。"],["3.1 航空法全般 制度概要","無人航空機操縦者技能証明（技能証明）制度は、無人航空機を飛行させるのに必要な技能（知識及び能力）を有することを国が証明する資格制度である。国が指定した民間試験機関（指定試験機関）による学科試験、実地試験及び身体検査により知識及び能力を判定し、これらの試験等に合格した場合には、国が技能証明を行う。技能証明は、カテゴリーⅢ飛行に必要な技能に係る一等無人航空機操縦士とカテゴリーⅡ飛行に必要な技能に係る二等無人航空機操縦士の２つの資格に区分され、それぞれの資格において、無人航空機の種類（６種類）及び飛行の方法（３種類）について限定をすることとしている。28パワードリフト機（Powered-lift）の飛行にあたっては、回転翼航空機（マルチローター）及び飛行機の両方の種類の限定に係る資格が必要となる。","無人航空機操縦者技能証明（＝技能証明）制度は、無人航空機を飛ばすのに必要な技能（知識と能力）を持っていることを国が証明する資格制度です。\n国が指定した民間試験機関（＝指定試験機関）が行う学科試験・実地試験・身体検査で知識と能力を判定し、これらに合格した場合に国が技能証明を行います。\n技能証明は次の2つの資格に分かれます。\n・一等無人航空機操縦士：カテゴリーⅢ飛行に必要な技能に関する資格\n・二等無人航空機操縦士：カテゴリーⅡ飛行に必要な技能に関する資格\nそれぞれの資格では、無人航空機の種類（6種類）と飛行の方法（3種類）について限定がつけられます。\nなお、パワードリフト機（Powered-lift）を飛ばすには、回転翼航空機（マルチローター）と飛行機の両方の種類の限定に関する資格が必要です。"],["3.1 航空法全般 制度概要","資格の区分無人航空機の種類の限定飛行の方法の限定1.一等無人航空機操縦士資格2.二等無人航空機操縦士資格1-1.回転翼航空機（マルチローター）（重量制限なし）1-2回転翼航空機（マルチローター）（最大離陸重量25kg未満）2-1.回転翼航空機（ヘリコプター）（重量制限なし）2-2回転翼航空機（ヘリコプター）（最大離陸重量25kg未満）3-1.飛行機（重量制限なし）3-2飛行機（最大離陸重量25kg未満）1.昼間（日中）飛行・目視内飛行2.昼間（日中）飛行3.目視内飛行","■資格の区分\n1. 一等無人航空機操縦士資格\n2. 二等無人航空機操縦士資格\n\n■無人航空機の種類の限定（6種類）\n1-1. 回転翼航空機（マルチローター）（重量制限なし）\n1-2. 回転翼航空機（マルチローター）（最大離陸重量25kg未満）\n2-1. 回転翼航空機（ヘリコプター）（重量制限なし）\n2-2. 回転翼航空機（ヘリコプター）（最大離陸重量25kg未満）\n3-1. 飛行機（重量制限なし）\n3-2. 飛行機（最大離陸重量25kg未満）\n\n■飛行の方法の限定（3種類）\n1. 昼間（日中）飛行・目視内飛行\n2. 昼間（日中）飛行\n3. 目視内飛行"],["3.1 航空法全般 技能証明の資格要件","次に掲げる項目のいずれかに該当する場合には、技能証明の申請をすることができない。a.１６歳に満たない者b.航空法の規定に基づき技能証明を拒否された日から１年以内の者又は技能証明を保留されている者（航空法等に違反する行為をした場合や無人航空機の飛行に当たり非行又は重大な過失があった場合に係るものに限る。）c.航空法の規定に基づき技能証明を取り消された日から２年以内の者又は技能証明の効力を停止されている者（航空法等に違反する行為をした場合や無人航空機の飛行に当たり非行又は重大な過失があった場合に係るものに限る。）次に掲げる項目のいずれかに該当する場合には、技能証明試験に合格した者であっても技能証明を拒否又は保留することができる。a.てんかんや認知症等の無人航空機の飛行に支障を及ぼすおそれがある病気にかかっている者b.アルコールや大麻、覚せい剤等の中毒者c.航空法等に違反する行為をした者d.無人航空機の飛行に当たり非行又は重大な過失があった者","【技能証明の申請ができない人】\n次のどれかに当てはまる人は、技能証明（＝国が操縦者の技能を認める資格）の申請ができません。\n・16歳に満たない人\n・技能証明を拒否された日から1年以内の人、または技能証明を保留されている人（航空法などに違反する行為をした場合や、無人航空機の飛行にあたって非行または重大な過失があった場合によるものに限ります）\n・技能証明を取り消された日から2年以内の人、または技能証明の効力を停止されている人（同じく、航空法などへの違反や、飛行にあたっての非行・重大な過失によるものに限ります）\n\n【合格しても拒否・保留されることがある人】\n次のどれかに当てはまる場合は、技能証明試験に合格した人であっても、技能証明を拒否したり保留したりすることができます。\n・てんかんや認知症など、無人航空機の飛行に支障を及ぼすおそれがある病気にかかっている人\n・アルコールや大麻、覚せい剤などの中毒者\n・航空法などに違反する行為をした人\n・無人航空機の飛行にあたって非行または重大な過失があった人"],["3.1 航空法全般 技能証明の交付手続き","技能証明を受けようとする者は、「指定試験機関」が実施する学科試験、実地試験及び身体検査に合格したうえで、国土交通大臣に技能証明書の交付の申請手続きを行う必要がある。この場合において、学科試験に合格しなければ、実地試験を受けることができない。無人航空機の民間講習機関のうち国の登録を受けた「登録講習機関」の無人航空機講習（学科講習・実地講習）を修了した者にあっては、技能証明試験のうち実地試験を免除することができる。技能証明試験に関して不正の行為が認められた場合には、当該不正行為と関係のある者について、その試験を停止し、又はその合格を無効にすることができる。この場合において、当該者に対し一定期間試験を拒否することができる。これらの手続きについては、技能証明の新規交付に係る場合のほか、技能証明を有する者がその限29定を変更しようとする場合も同様である。","技能証明を受けたい人は、まず「指定試験機関」が行う次の3つに合格する必要があります。\n・学科試験\n・実地試験\n・身体検査\nそのうえで、国土交通大臣に技能証明書の交付を申請する手続きを行います。なお、学科試験に合格しないと実地試験は受けられません。\n\n民間の講習機関のうち国の登録を受けた「登録講習機関」の無人航空機講習（学科講習・実地講習）を修了した人は、技能証明試験のうち実地試験を免除することができます。\n\n技能証明試験で不正行為があった場合は、その不正行為に関係した人について、試験を止めたり、合格を無効にしたりすることができます。この場合、その人に対して一定の期間、試験を受けさせないこともできます。\n\nこれらの手続きは、技能証明を新しく交付してもらうときだけでなく、すでに技能証明を持っている人が限定（＝操縦できる機体の種類や飛行方法の範囲）を変更しようとするときも同じです。"],["3.1 航空法全般 技能証明の交付手続き","また、技能証明の有効期間は３年であり、その更新を申請する者は、「登録更新講習機関」が実施する無人航空機更新講習を有効期間の更新の申請をする日以前３月以内に修了したうえで、有効期間が満了する日の６月前から１月前までの間に国土交通大臣に対し技能証明の更新を申請しなければならない。","技能証明の有効期間は3年です。\n更新を申請する人は、次の手順で進める必要があります。\n・「登録更新講習機関」が行う無人航空機更新講習を、更新の申請をする日以前3月以内に修了する\n・そのうえで、有効期間が満了する日の6月前から1月前までの間に、国土交通大臣へ技能証明の更新を申請する"],["3.1 航空法全般 技能証明を受けた者の義務","技能証明を受けた者は、その限定をされた種類の無人航空機又は飛行の方法でなければ特定飛行を行ってはならない（飛行の許可・承認を受けて特定飛行を行う場合を除く。）。技能証明を行うにあたって、国土交通大臣は技能証明に係る身体状態に応じ、無人航空機を飛行させる際の必要な条件（眼鏡・コンタクトレンズや補聴器の着用等）を付すことができることとしており、当該条件が付された技能証明を受けた者は、その条件の範囲内でなければ特定飛行を行ってはならない（飛行の許可・承認を受けて特定飛行を行う場合を除く。）。技能証明を受けた者は、特定飛行を行う場合には、技能証明書を携帯しなければならない。","技能証明を受けた人は、限定された種類の無人航空機、または限定された飛行の方法でなければ、特定飛行（＝許可・承認が必要になる飛行）をしてはいけません。ただし、飛行の許可・承認を受けて特定飛行を行う場合は別です。\n\nまた、技能証明を出すとき、国土交通大臣はその人の身体の状態に応じて、無人航空機を飛ばす際の必要な条件（眼鏡・コンタクトレンズや補聴器の着用など）を付けることができます。この条件が付いた技能証明を受けた人は、その条件の範囲内でなければ特定飛行をしてはいけません（こちらも、飛行の許可・承認を受けて特定飛行を行う場合は別です）。\n\nそして、技能証明を受けた人が特定飛行を行うときは、技能証明書を携帯する必要があります。"],["3.1 航空法全般 技能証明の取消し等","技能証明を受けた者が次に掲げる項目のいずれかに該当する場合には、技能証明の取消し又は１年以内の技能証明の効力の停止を受けることがある。a.てんかんや認知症等の無人航空機の飛行に支障を及ぼすおそれがある病気にかかっている又は身体の障害であることが判明したときb.アルコールや大麻、覚せい剤等の中毒者であることが判明したときc.航空法等に違反する行為をしたときd.無人航空機の飛行に当たり非行又は重大な過失があったとき","技能証明を受けた人が次のどれかに当てはまる場合、技能証明の取消し、または1年以内の技能証明の効力停止を受けることがあります。\n・てんかんや認知症など、無人航空機の飛行に支障を及ぼすおそれがある病気にかかっている、または身体の障害であることが判明したとき\n・アルコールや大麻、覚せい剤などの中毒者であることが判明したとき\n・航空法などに違反する行為をしたとき\n・無人航空機の飛行にあたって非行または重大な過失があったとき"],["3.2 航空法以外の法令等 制度概要","小型無人機等飛行禁止法は、国会議事堂などの重要施設に対する危険を未然に防止し、もって国政の中枢機能等、良好な国際関係、我が国を防衛するための基盤並びに国民生活及び経済活動の基盤の維持並びに公共の安全の確保に資するため、これら重要施設及びその周囲おおむね１０00mの周辺地域の上空における小型無人機等の飛行を禁止するものである。","小型無人機等飛行禁止法は、国会議事堂などの重要施設に対する危険を前もって防ぐための法律です。\nそれによって、次のものを守ることを目的としています。\n・国政の中枢機能など\n・良好な国際関係\n・日本を防衛するための基盤\n・国民生活および経済活動の基盤の維持\n・公共の安全の確保\nこの目的のため、重要施設と、その周囲おおむね1000mの周辺地域の上空で、小型無人機などを飛ばすことを禁止しています。"],["3.2 航空法以外の法令等 飛行禁止の対象となる小型無人機等","小型無人機等飛行禁止法により重要施設及びその周辺地域の上空の飛行が禁止される対象は、小型無人機及び特定航空用機器であり、具体的には次のとおりである。30","小型無人機等飛行禁止法によって、重要施設とその周辺地域の上空を飛ばすことが禁止される対象は、次の2つです。\n・小型無人機\n・特定航空用機器\nそれぞれの中身は次のとおりです。"],["3.2 航空法以外の法令等 小型無人機","飛行機、回転翼航空機、滑空機、飛行船その他の航空の用に供することができる機器であって構造上人が乗ることができないもののうち、遠隔操作又は自動操縦により飛行させることができるものと定義されている。航空法の「無人航空機」と異なり、「小型無人機」は大きさや重さにかかわらず対象となり、１００グラム未満のものも含まれる。","小型無人機とは、飛行機・回転翼航空機・滑空機・飛行船など、航空に使うことができる機器のうち、構造上、人が乗れないものをいいます。そのうえで、遠隔操作または自動操縦で飛ばすことができるものが該当します。\n\n航空法の「無人航空機」とは違い、「小型無人機」は大きさや重さに関係なく対象になります。100グラム未満のものも含まれます。"],["3.2 航空法以外の法令等 特定航空用機器","航空機以外の航空の用に供することができる機器であって、当該機器を用いて人が飛行することができるものと定義されており、気球、ハンググライダー及びパラグライダー等が該当する。","特定航空用機器とは、航空機以外で航空に使うことができる機器のうち、その機器を使って人が飛べるものをいいます。\n気球、ハンググライダー、パラグライダーなどが当てはまります。"],["3.2 航空法以外の法令等 飛行禁止の対象となる重要施設","小型無人機等飛行禁止法により、重要施設の敷地・区域の上空（レッド・ゾーン）及びその周囲おおむね１０00mの上空（イエロー・ゾーン）においては小型無人機等を飛行させることはできない。その対象となる重要施設は以下のとおり。このほかにも、外国要人の来日等に伴い、一時的に対象施設が追加されることがある。詳細については、警察庁ホームページなどを参照すること。①国の重要な施設等⚫国会議事堂、内閣総理大臣官邸、最高裁判所、皇居等⚫危機管理行政機関の庁舎⚫対象政党事務所⚫天皇又は内閣総理大臣の所在する施設であって、国内要人が出席する行事会場等②外国公館等（外務大臣指定）⚫外国公館、国際機関の事務所等⚫外国要人が参加する国際会議の準備又は運営のために使用される会議場施設等③防衛関係施設（防衛大臣指定）⚫自衛隊施設⚫在日米軍施設④空港（国土交通大臣指定）⚫新千歳空港、成田国際空港、東京国際空港、中部国際空港、大阪国際空港、関西国際空港、福岡空港、那覇空港⑤原子力事業所（国家公安委員会指定）","小型無人機等飛行禁止法により、次の場所では小型無人機などを飛ばすことができません。\n・重要施設の敷地・区域の上空（レッド・ゾーン）\n・その周囲おおむね1000mの上空（イエロー・ゾーン）\n\n対象となる重要施設は次のとおりです。\n①国の重要な施設等\n・国会議事堂、内閣総理大臣官邸、最高裁判所、皇居など\n・危機管理行政機関の庁舎\n・対象政党事務所\n・天皇または内閣総理大臣がいる施設で、国内要人が出席する行事会場など\n②外国公館等（外務大臣が指定）\n・外国公館、国際機関の事務所など\n・外国要人が参加する国際会議の準備や運営のために使われる会議場施設など\n③防衛関係施設（防衛大臣が指定）\n・自衛隊施設\n・在日米軍施設\n④空港（国土交通大臣が指定）\n・新千歳空港、成田国際空港、東京国際空港、中部国際空港、大阪国際空港、関西国際空港、福岡空港、那覇空港\n⑤原子力事業所（国家公安委員会が指定）\n\nこのほかにも、外国要人の来日などに伴って、一時的に対象施設が追加されることがあります。詳しくは警察庁ホームページなどを見てください。"],["3.2 航空法以外の法令等 飛行禁止の例外及びその手続き","小型無人機等の飛行禁止の例外は、次に掲げる場合に限られており、航空法に基づく飛行の許可・承認や機体認証・技能証明を取得した場合であっても小型無人機等を飛行させることはできない。(a)対象施設の管理者又はその同意を得た者による飛行31(b)土地の所有者等又はその同意を得た者が当該土地の上空において行う飛行(c)国又は地方公共団体の業務を実施するために行う飛行ただし、対象防衛関係施設及び対象空港の敷地又は区域の上空（レッドゾーン）においては、上記(b)又は(c)であっても対象施設の管理者の同意が必要となる（(a)の飛行のみ可）。飛行禁止の例外にあたる場合であっても、対象施設及びその周囲おおむね1000mの周辺地域の上空で小型無人機等を飛行させる場合、都道府県公安委員会等へ通報しなければならない。","小型無人機などの飛行禁止に対する例外は、次の場合だけです。航空法にもとづく飛行の許可・承認や、機体認証・技能証明を取っていても、それだけでは飛ばすことはできません。\n(a) 対象施設の管理者、またはその同意を得た人が行う飛行\n(b) 土地の所有者など、またはその同意を得た人が、その土地の上空で行う飛行\n(c) 国または地方公共団体の業務を行うための飛行\n\nただし、対象となる防衛関係施設と対象空港の敷地・区域の上空（レッド・ゾーン）では、(b) や (c) であっても対象施設の管理者の同意が必要です（同意なしで飛ばせるのは (a) の飛行だけです）。\n\nまた、例外に当てはまる場合でも、対象施設とその周囲おおむね1000mの周辺地域の上空で小型無人機などを飛ばすときは、都道府県公安委員会などへ通報する必要があります。"],["3.2 航空法以外の法令等 違反に対する措置等","警察官等は、小型無人機等飛行禁止法の規定に違反して小型無人機等の飛行を行う者に対し、機器の退去その他の必要な措置をとることを命ずることができる。また、やむを得ない限度において、小型無人機等の飛行の妨害、破損その他の必要な措置をとることができる。対象施設の敷地・区域の上空（レッド・ゾーン）で小型無人機等の飛行を行った者及び警察官等の命令に違反した者は、１年以下の拘禁刑又は５０万円以下の罰金に処せられる。また、対象施設の敷地の周囲おおむね１０00mの上空（イエロー・ゾーン）で小型無人機等の飛行を行った者は、６月以下の拘禁刑又は50万円以下の罰金に処せられる。電波法","警察官などは、小型無人機等飛行禁止法の決まりに違反して小型無人機などを飛ばしている人に対し、機器を退去させることなど、必要な措置をとるよう命じることができます。また、やむを得ない範囲で、小型無人機などの飛行を妨げたり、壊したりするなど、必要な措置をとることができます。\n\n罰則は次のとおりです。\n・対象施設の敷地・区域の上空（レッド・ゾーン）で小型無人機などを飛ばした人、および警察官などの命令に違反した人 … 1年以下の拘禁刑または50万円以下の罰金\n・対象施設の敷地の周囲おおむね1000mの上空（イエロー・ゾーン）で小型無人機などを飛ばした人 … 6月以下の拘禁刑または50万円以下の罰金"],["3.2 航空法以外の法令等 制度概要及び無人航空機に用いられる無線設備","無人航空機においては、その操縦や画像伝送のために電波を発射する無線設備が利用されている。これらの無線設備を日本国内で使用する場合には、電波法令に基づき、国内の技術基準に合致した無線設備を使用し、原則、総務大臣の免許や登録を受け、無線局を開設する必要がある（微弱な無線局や一部の小電力の無線局は除く）。本制度の詳細については、総務省電波利用ホームページ等で確認すること。国内で無人航空機での使用が想定される主な無線通信システムは以下のとおり。分類無線局免許周波数帯最大送信出力主な利用形態無線従事者資格免許又は登録を要しない無線局不要７３MHｚ帯等微弱※１操縦用不要不要※2920MHｚ帯２０ｍW操縦用2.4GHz帯１０ｍＷ/MHz※3操縦用、画像伝送用、データ伝送用携帯局（無人移動体画像伝送システムの無線局）要※4169MHz帯10mW※5操縦用、画像伝送用、データ伝送用第三級陸上特殊無線技士以上の資格２.４GHｚ帯1W操縦用、画像伝送用、データ伝送用5.7GHz帯１W操縦用、画像伝送用、データ伝送用陸上移動局（携帯電話（４G、５G））不要※6800MHz帯900MHz帯1.7GHz帯2GHｚ帯※７※８操縦用、画像伝送用、データ伝送用不要※1：500mの距離において電界強度が200μV/m以下のもの※2：技術基準適合証明等を受けた適合表示無線設備であることが必要32※3：変調方式や占有周波数帯幅によって出力の上限は異なる※4：運用に際しては、運用調整を行うこと※5:地上から電波発射を行う無線局の場合は最大1W※6：携帯電話事業者の包括免許により運用※７：上空利用が可能な周波数帯のみ掲載※８：基地局によって制御される","無人航空機では、操縦や画像の伝送のために電波を出す無線設備が使われています。これらの無線設備を日本国内で使うときは、電波法令にもとづき、国内の技術基準に合った無線設備を使い、原則として総務大臣の免許や登録を受けて無線局を開設する必要があります（微弱な無線局や一部の小電力の無線局は除きます）。制度の詳しい内容は、総務省電波利用ホームページなどで確認してください。\n\n国内で無人航空機に使われることが想定される主な無線通信システムは次のとおりです。\n\n【免許または登録を要しない無線局】（無線局免許は不要／無線従事者資格も不要）\n・73MHz帯など … 出力は微弱（※1）。操縦用。\n・920MHz帯 … 最大20mW。操縦用。（※2）\n・2.4GHz帯 … 最大10mW/MHz（※3）。操縦用、画像伝送用、データ伝送用。（※2）\n\n【携帯局（無人移動体画像伝送システムの無線局）】（無線局免許が必要 ※4／第三級陸上特殊無線技士以上の資格が必要）\n・169MHz帯 … 最大10mW（※5）。操縦用、画像伝送用、データ伝送用。\n・2.4GHz帯 … 最大1W。操縦用、画像伝送用、データ伝送用。\n・5.7GHz帯 … 最大1W。操縦用、画像伝送用、データ伝送用。\n\n【陸上移動局（携帯電話（4G、5G））】（無線局免許は不要 ※6／無線従事者資格も不要）\n・800MHz帯、900MHz帯、1.7GHz帯、2GHz帯（※7、※8）。操縦用、画像伝送用、データ伝送用。\n\n注記\n※1：500mの距離で電界強度が200μV/m以下のもの\n※2：技術基準適合証明等を受けた適合表示無線設備であることが必要\n※3：変調方式や占有周波数帯幅によって出力の上限は異なる\n※4：運用にあたっては運用調整を行うこと\n※5：地上から電波を出す無線局の場合は最大1W\n※6：携帯電話事業者の包括免許によって運用\n※7：上空で利用できる周波数帯のみ掲載\n※8：基地局によって制御される"],["3.2 航空法以外の法令等 免許又は登録を要しない無線局","発射する電波が極めて微弱な無線局や、一定の技術的条件に適合する無線設備を使用する小電力の無線局については、無線局の免許又は登録が不要である。無人航空機には、ラジコン用の微弱無線局や小電力データ通信システム（無線LAN等）の一部が主として用いられている。①微弱無線局（ラジコン用）ラジコン等に用いられる微弱無線局は、無線設備から500メートルの距離での電界強度（電波の強さ）が200μＶ／ｍ以下のものとして、周波数などが総務省告示で定められている。無線局免許や無線従事者資格が不要であり、主に、産業用の農薬散布ラジコンヘリ等で用いられている。②一部の小電力の無線局空中線電力が1W以下で、特定の用途に使用される一定の技術基準が定められた無線局については、免許又は登録が不要である。例えば、Wi-FiやBluetooth等の小電力データ通信システムの無線局等が該当する。","出す電波がとても弱い無線局や、決められた技術的条件に合う無線設備を使う小電力の無線局は、無線局の免許や登録が要りません。無人航空機には、ラジコン用の微弱無線局や、小電力データ通信システム（無線LANなど）の一部が主に使われています。\n\n①微弱無線局（ラジコン用）\nラジコンなどに使われる微弱無線局は、無線設備から500メートルの距離での電界強度（＝電波の強さ）が200μV/m以下のものとして、周波数などが総務省告示で決められています。無線局免許も無線従事者資格も要りません。主に、産業用の農薬散布ラジコンヘリなどで使われています。\n\n②一部の小電力の無線局\n空中線電力が1W以下で、特定の用途に使われる、一定の技術基準が決められた無線局は、免許も登録も要りません。たとえばWi-FiやBluetoothなどの小電力データ通信システムの無線局が当てはまります。"],["3.2 航空法以外の法令等 免許又は登録を要しない無線局","これらの小電力の無線局は、無線局免許や無線従事者資格が不要だが、技術基準適合証明等（技術基準適合証明又は工事設計認証）を受けた適合表示無線設備でなければならない。具体的には、以下の技術基準適合証明等を受けた旨の表示（技適マーク）等により確認すること。Ｒ（番号）","これらの小電力の無線局は、無線局免許も無線従事者資格も要りません。ただし、技術基準適合証明等（＝技術基準適合証明または工事設計認証）を受けた適合表示無線設備でなければなりません。\n具体的には、技術基準適合証明等を受けた旨の表示（技適マーク）などで確認してください。"],["3.2 航空法以外の法令等 アマチュア無線局","上記の無線局のほか、無人航空機にアマチュア無線が用いられることがある。この場合は、アマチュア無線技士の資格及びアマチュア無線局免許が必要である。なお、アマチュア無線とは、金銭上の利益のためでなく、専ら個人的な興味により行う自己訓練、通信及び技術研究のための無線通信である。そのため、アマチュア無線を使用した無人航空機を、利益を目的とした仕事などの業務に利用することはできない。また、無人航空機においてFPV（FirstPersonView）といった画像伝送が用いられることがある。アマチュア無線によるFPV無人航空機については、現在、無人航空機の操縦に2.4GHz帯の免許不33要局を使用し、無人航空機からの画像伝送に5GHz帯のアマチュア無線局を使用する場合が多いが、5GHz帯のアマチュア無線は、周波数割当計画上、二次業務に割り当てられている。このため、同一帯域を使用する他の一次業務の無線局の運用に妨害を与えないように運用しなければならない。特に、5.7GHz帯では無人移動体画像伝送システムが用いられているほか、5.8GHz帯は、DSRCシステムに割り当てられており、主として高速道路のETCシステムや駐車場管理等に用いられているので、それら付近での使用は避ける等、運用の際には配慮が必要である。","ここまでの無線局のほかに、無人航空機にアマチュア無線が使われることがあります。この場合は、アマチュア無線技士の資格と、アマチュア無線局免許が必要です。\n\nアマチュア無線とは、お金もうけのためではなく、もっぱら個人的な興味から行う自己訓練・通信・技術研究のための無線通信です。そのため、アマチュア無線を使った無人航空機を、利益を目的とした仕事などの業務に使うことはできません。\n\nまた、無人航空機ではFPV（First Person View）という画像伝送が使われることがあります。アマチュア無線によるFPV無人航空機では、現在、操縦に2.4GHz帯の免許不要局を使い、機体からの画像伝送に5GHz帯のアマチュア無線局を使う場合が多くなっています。\n\nただし、5GHz帯のアマチュア無線は、周波数割当計画のうえで二次業務に割り当てられています。そのため、同じ帯域を使う他の一次業務の無線局の運用に妨害を与えないように運用しなければなりません。\n特に次の点に注意が必要です。\n・5.7GHz帯では無人移動体画像伝送システムが使われている\n・5.8GHz帯はDSRCシステムに割り当てられており、主に高速道路のETCシステムや駐車場管理などに使われている\nこのため、その付近での使用を避けるなど、運用の際には配慮が必要です。"],["3.2 航空法以外の法令等 携帯電話","携帯電話等の移動通信システムは、地上での利用を前提に設計されていることから、上空で利用した場合、通信品質の安定性や地上の携帯電話等の利用への影響が懸念される。こうした状況を踏まえ、一定の条件下で利用することで、既設の無線局の運用等に支障を与えずに上空で利用できるよう、制度整備がなされている。携帯電話を無人航空機に搭載して利用する場合（無人航空機にSIMカードを挿入して利用する場合を含む）には、携帯電話事業者が提供する条件に対応した上空用プラン等の利用手続を行うことが必要である。詳細は総務省電波利用ホームページを確認すること。その他の法令等上記の法令に加え、その他の法令等又は地方公共団体が定める条例に基づき、無人航空機の利用方法が制限されたり、都市公園や施設の上空など特定の場所において、無人航空機の飛行が制限されたりする場合がある。","携帯電話などの移動通信システムは、地上で使うことを前提に設計されています。そのため上空で使うと、通信品質の安定性や、地上の携帯電話などの利用への影響が心配されます。\nこうした事情を踏まえ、一定の条件のもとで使えば、すでにある無線局の運用などに支障を与えずに上空で利用できるよう、制度が整えられています。\n\n携帯電話を無人航空機に載せて使う場合（無人航空機にSIMカードを入れて使う場合を含みます）は、携帯電話事業者が用意している条件に対応した上空用プランなどの利用手続きを行う必要があります。詳しくは総務省電波利用ホームページを確認してください。\n\n【その他の法令等】\nここまでの法令に加えて、ほかの法令等や、地方公共団体が定める条例によって、無人航空機の使い方が制限されたり、都市公園や施設の上空など特定の場所で飛行が制限されたりする場合があります。"],["3.2 航空法以外の法令等 携帯電話","こうした法令等や条例については、国土交通省ホームページに一覧等が掲載されている（条例の最新の情報については地方公共団体に確認すること）。飛行自粛要請空域法令等に基づく規制ではないが、警備上の観点等から警察などの関係省庁等の要請に基づき、国土交通省が無人航空機の飛行自粛を要請することがある。飛行自粛要請空域が設定される場合には国土交通省のホームページ・X（旧Twitter）にて公示するため、無人航空機の操縦者は、飛行を開始する前に、当該空域が飛行自粛要請空域に該当するか否かの別を確認し、その要請内容に基づき適切に対応すること。34","こうした法令等や条例については、国土交通省ホームページに一覧などが載っています（条例の最新の情報は、地方公共団体に確認してください）。\n\n【飛行自粛要請空域】\nこれは法令等にもとづく規制ではありませんが、警備上の観点などから、警察など関係省庁等の要請にもとづいて、国土交通省が無人航空機の飛行自粛を要請することがあります。\n飛行自粛要請空域が設定される場合は、国土交通省のホームページとX（旧Twitter）で公示されます。そのため操縦者は、飛行を始める前に、その空域が飛行自粛要請空域に当たるかどうかを確認し、要請の内容にもとづいて適切に対応してください。"],["4.1 無人航空機の機体の特徴（機体種類別）","無人航空機の種類と特徴回転翼航空機（マルチローター）、回転翼航空機（ヘリコプター）及び飛行機などが該当する。回転翼航空機（マルチローター）及び回転翼航空機（ヘリコプター）は、垂直離着陸や空中でのホバリングが可能という特徴がある。一方で、飛行機は、垂直離着陸やホバリングはできないが、回転翼航空機に比べ、飛行速度が速く、エネルギー効率が高いため、長距離・長時間の飛行が可能という特徴がある。さらに、回転翼航空機のように垂直離着陸が可能で、巡行中は飛行機のように前進飛行が可能となる、両方の特徴を組み合わせたパワードリフト機（Powered-lift）もある。飛行機","無人航空機の種類には、回転翼航空機（マルチローター）、回転翼航空機（ヘリコプター）、飛行機などがあります。\n\n・回転翼航空機（マルチローター）と回転翼航空機（ヘリコプター）は、垂直に離着陸でき、空中でホバリング（＝その場に停止した飛行）ができるのが特徴です。\n・飛行機は、垂直離着陸やホバリングはできません。ただし回転翼航空機に比べて飛行速度が速く、エネルギー効率が高いため、長距離・長時間の飛行ができるのが特徴です。\n\nさらに、回転翼航空機のように垂直離着陸ができて、巡航中は飛行機のように前進飛行ができる、両方の特徴を組み合わせたパワードリフト機（Powered-lift）もあります。"],["4.1 無人航空機の機体の特徴（機体種類別） 機体の特徴","飛行機は回転翼航空機と比べ高速飛行、長時間飛行、長距離飛行が可能であるが、一般に、安全に飛行できる最低速度が決められており、それ未満での低速飛行ができない。水平離着陸には広いエリアが必要であり、高度な操縦技能と飛行制御技術が必要である。一方、適切な機体設計によって無操縦・無制御でも飛行安定が達成でき、仮に故障などによって飛行中に推力を失っても滑空飛行状態になれば、すぐには墜落しない。飛行機は、翼に揚力を発生させて自重を支えることができるのが特徴である。このため比較的少ないエネルギーで飛行し、長距離飛行が可能になる。エレベーター（上下ピッチ方向）、エルロン（左右ロール方向）、ラダー（左右ヨー方向）、スロットル（推進パワー）の複合的な操縦で飛行する。離着陸には機体のサイズに合わせた滑走路が必要となる。滑空するため墜落、不時着する場合の落下地点を狭い範囲に抑えることができない。推力により前進し空気を掴み揚力が生まれるので、回転翼航空機とは違いホバリングや後退、横移動はできない。横方向の移動はバンクターン（旋回）で行う。姿勢安定装置を使用しない場合はバンクターンの操作はエルロンとエレベーターの複合である。過度の低速飛行や過度の上昇角度、過度の旋回半径小により翼面から空気が剥離する失速という状態に陥ることがある。","飛行機は回転翼航空機と比べて、高速飛行・長時間飛行・長距離飛行ができます。一方で、一般に安全に飛べる最低速度が決まっており、それより遅い低速飛行はできません。水平に離着陸するには広いエリアが必要で、高度な操縦技能と飛行制御技術も必要です。\n\nその反面、機体をうまく設計すれば、操縦や制御をしなくても飛行の安定が得られます。仮に故障などで飛行中に推力を失っても、滑空飛行の状態になれば、すぐには墜落しません。\n\n主な特徴は次のとおりです。\n・翼に揚力を発生させて自分の重さを支えられるのが飛行機の特徴です。そのため比較的少ないエネルギーで飛べ、長距離飛行ができます。\n・エレベーター（上下のピッチ方向）、エルロン（左右のロール方向）、ラダー（左右のヨー方向）、スロットル（推進パワー）を組み合わせて操縦します。\n・離着陸には、機体のサイズに合った滑走路が必要です。\n・滑空するため、墜落や不時着をするときの落下地点を狭い範囲に抑えることができません。\n・推力で前進し、空気をつかむことで揚力が生まれます。そのため回転翼航空機とは違い、ホバリングや後退、横移動はできません。横方向の移動はバンクターン（旋回）で行います。\n・姿勢安定装置を使わない場合、バンクターンの操作はエルロンとエレベーターの組み合わせになります。\n・低速すぎる飛行、上昇角度が大きすぎる飛行、旋回半径が小さすぎる飛行では、翼の面から空気がはがれる「失速」という状態に陥ることがあります。"],["4.1 無人航空機の機体の特徴（機体種類別） 機体の特徴","失速時は舵の操作が効かなくなる。これは飛行機にとって極めて危険な状態である。失速を回避するためにも操縦には高い技能が求められる。特に技能が必要なのは手動操縦における離着陸である。離着陸含めて自動飛行を行う場合は、発射装置や回収装置などの地上設備が必要となる場合がある。","失速すると舵の操作が効かなくなります。これは飛行機にとって極めて危険な状態です。失速を避けるためにも、操縦には高い技能が求められます。特に技能が必要なのは、手動操縦での離着陸です。なお、離着陸を含めて自動飛行を行う場合は、発射装置や回収装置などの地上設備が必要になることがあります。"],["4.1 無人航空機の機体の特徴（機体種類別） 大型機(最大離陸重量 25kg 以上)の特徴","大型機（最大離陸重量25kg以上）は主翼面積が大きくなるため、よりペイロード（積載可能重量）を大きくすることができる。ガソリンエンジンなど推進動力の選択肢も広がるのでより長距離・長時間飛行も可能になる。25kg未満の飛行機に比べて風の影響も受けにくくなる。大型機は、事故発生時の影響が大きいことから、操縦者の運航への習熟度及び安全運航意識が十分に高いことが要求される。大型35機は機体の慣性力が大きいことから、増速・減速・上昇・降下などに要する時間と距離が長くなるため、障害物回避には特に注意が必要である。緊急着陸地点の選定も小型機より広い範囲が必要となる。一般に小型の機体よりも騒音が大きくなるため、飛行ルート周囲への配慮が必要である。","大型機（最大離陸重量25kg以上）には次の特徴があります。\n・主翼の面積が大きくなるため、ペイロード（＝積める重さ）をより大きくできます。\n・ガソリンエンジンなど推進動力の選択肢も広がるので、より長距離・長時間の飛行ができます。\n・25kg未満の飛行機に比べて、風の影響も受けにくくなります。\n・事故が起きたときの影響が大きいため、操縦者には運航への十分な習熟度と高い安全運航意識が求められます。\n・機体の慣性力が大きいので、増速・減速・上昇・降下にかかる時間と距離が長くなります。そのため障害物の回避には特に注意が必要です。\n・緊急着陸地点の選定も、小型機より広い範囲が必要になります。\n・一般に小型の機体より騒音が大きくなるため、飛行ルート周囲への配慮が必要です。"],["4.1 無人航空機の機体の特徴（機体種類別） 機体の特徴","回転翼航空機（ヘリコプター）は、垂直離着陸、ホバリング、低速飛行が可能であるが、これには大きなエネルギー消費がともない、風の影響を受けやすい。同じ回転翼航空機であるヘリコプター型とマルチローター型で比べると、ヘリコプター型は１組のローターで揚力を発生させるため、回転翼航空機（マルチローター）に比べローターの直径が大きく、空力的に効率良く揚力を得る事が出来る。回転翼航空機（ヘリコプター）においては以下に示すような機構が必要であり、構造的に複雑となっている。⚫ローターの回転面を傾けたり（機体を前後左右に運動させる場合）、ローターピッチ角を変えたり（上昇・降下させる場合）するために必要な機構（スワッシュプレート等）⚫ローターの反トルクを打ち消したり、向き（ヨー方向）を変える操縦に用いたりするテールローター","回転翼航空機（ヘリコプター）は、垂直の離着陸、ホバリング（＝空中で位置を保つこと）、低速飛行ができます。ただし、これには大きなエネルギー消費がともない、風の影響も受けやすいです。\n同じ回転翼航空機でも、ヘリコプター型は1組のローターで揚力を出すため、回転翼航空機（マルチローター）に比べてローターの直径が大きく、空力的に効率よく揚力を得られます。\n一方で、ヘリコプター型には次のような機構が必要で、構造が複雑になっています。\n・スワッシュプレートなど、ローターの回転面を傾けたり（機体を前後左右に動かすとき）、ローターのピッチ角を変えたり（上昇・降下させるとき）するための機構\n・ローターの反トルクを打ち消したり、向き（ヨー方向）を変える操縦に使ったりするテールローター"],["4.1 無人航空機の機体の特徴（機体種類別） 大型機（最大離陸重量 25kg 以上）の特徴","回転翼航空機（ヘリコプター）において最大離陸重量25kg以上の大型機では慣性力が大きく操舵時の機体挙動が遅れ気味になるため、特に定点で位置を維持するホバリングでは早めに操舵することが必要となる。また一般的に小型の機体よりエンジン騒音やローター騒音が大きくなる。回転翼航空機（マルチローター）","回転翼航空機（ヘリコプター）のうち最大離陸重量25kg以上の大型機は、慣性力が大きく、舵を操作したときの機体の動きが遅れ気味になります。そのため、特に定点で位置を保つホバリングでは、早めに操舵することが必要です。また一般に、小型の機体よりエンジン騒音やローター騒音が大きくなります。"],["4.1 無人航空機の機体の特徴（機体種類別） 機体の特徴","回転翼航空機（マルチローター）は機体外周に配置されたローターを高速回転させ、上昇・降下や前後左右移動、ホバリングや機体を水平回転させることが出来る。大きなエネルギー消費により、複数のローターを高速回転させ揚力を得て飛行するが、風の影響を受けやすく飛行の安定性を高めるため、フライトコントロールシステムを用いローターの回転数を制御し、機体の姿勢や位置を安定させている。操縦は送信機に備わるコントロールスティック等を操作して行う。ローターの数によってそれぞれ呼称が異なる（ローターの数4：クワッドコプター、6：ヘキサコプター8：オクトコプター）。モーター性能を同一とした場合、ローターの数が多いほど故障に対する耐性が向上し、ペイロード（積載可能重量）が増える。","回転翼航空機（マルチローター）は、機体の外周に配置したローターを高速で回転させることで、上昇・降下、前後左右の移動、ホバリング、機体の水平回転ができます。\n複数のローターを高速で回して揚力を得て飛ぶため、エネルギーの消費が大きくなります。また風の影響を受けやすいので、飛行の安定性を高めるために、フライトコントロールシステムでローターの回転数を制御し、機体の姿勢や位置を安定させています。\n操縦は、送信機に備わるコントロールスティックなどを操作して行います。\nローターの数によって呼び方が異なります。\n・4つ：クワッドコプター\n・6つ：ヘキサコプター\n・8つ：オクトコプター\nモーターの性能が同じ場合、ローターの数が多いほど故障に対する耐性が高まり、ペイロード（＝積める重さ）も増えます。"],["4.1 無人航空機の機体の特徴（機体種類別） 機体の特徴","ローターの回転方向は、時計回転（CW：クロックワイズ）と反時計回転（CCW：カウンタークロックワイズ）の方向で構成され、反トルクによりの機体の回転バランスを保っている。36","ローターの回転方向は、時計回転（CW：クロックワイズ）と反時計回転（CCW：カウンタークロックワイズ）で構成されています。これにより、反トルクで機体の回転バランスを保っています。"],["4.1 無人航空機の機体の特徴（機体種類別） 上昇、ホバリング、降下","機体に備わる全てのローターを回転させ回転数を増加させていくと、機体重量以上の揚力を得ると上昇し始める。機体重量と揚力が釣り合い、対地高度が安定した状態を継続するとホバリングとなる。ホバリング状態からローター回転数を下げると降下する。","機体のすべてのローターを回して回転数を上げていくと、機体の重さ以上の揚力が出た時点で上昇し始めます。機体の重さと揚力が釣り合い、対地高度が安定した状態が続くと、ホバリングになります。ホバリングの状態からローターの回転数を下げると降下します。"],["4.1 無人航空機の機体の特徴（機体種類別） 前後、左右移動","機体の前後左右移動は、その指示した側のローターの回転数を下げ、反対側のローター回転数を上げることで機体が傾き、ローター推力の合力が、指示した方向に傾くので、傾いた方向に機体が移動する。","機体を前後左右に動かすときは、指示した側のローターの回転数を下げ、反対側のローターの回転数を上げます。すると機体が傾き、ローターの推力を合わせた力（合力）も指示した方向に傾くので、傾いた方向へ機体が移動します。"],["4.1 無人航空機の機体の特徴（機体種類別） 水平回転","ローターの反トルクバランスを崩すと機体の水平回転が始まる。揚力を得ている状態で、右もしくは左回転を指示すると、指示した回転方向のローターの回転数が下がりトルクバランスが崩れ回転が始まる。","ローターの反トルクのバランスを崩すと、機体の水平回転が始まります。揚力を得ている状態で右または左への回転を指示すると、指示した回転方向のローターの回転数が下がってトルクのバランスが崩れ、回転が始まります。"],["4.1 無人航空機の機体の特徴（機体種類別） 回転翼航空機（マルチローター）と機体の動き","回転翼航空機（マルチローター）を操縦する際に、機体の動きを指示するために用いられる用語として以下のものがある。⚫スロットル：上昇・降下⚫ラダー：機首方向の旋回⚫エルロン：左右移動⚫エレベーター：前後移動","回転翼航空機（マルチローター）を操縦するとき、機体の動きを指示するために使う用語には次のものがあります。\n・スロットル：上昇・降下\n・ラダー：機首方向の旋回\n・エルロン：左右移動\n・エレベーター：前後移動"],["4.1 無人航空機の機体の特徴（機体種類別） 大型機（最大離陸重量 25kg 以上）の特徴","回転翼航空機（マルチローター）の最大離陸重量25kg以上の大型機の特徴としては、以下のものが挙げられる。⚫機体の対角寸法やローターのサイズやモーターパワーも大きくなり、飛行時の慣性力も増加し、上昇・降下や加減速などに要する時間と距離が長くなる。⚫離着陸やホバリング時の地面効果等の範囲が広がり、高度な操縦技術を要する。⚫飛行時機体から発せられる騒音も大きくなり周囲への影響範囲も広がる。","回転翼航空機（マルチローター）で最大離陸重量25kg以上の大型機には、次の特徴があります。\n・機体の対角寸法やローターのサイズ、モーターパワーも大きくなり、飛行時の慣性力も増えます。そのため上昇・降下や加減速などにかかる時間と距離が長くなります。\n・離着陸やホバリングのときの地面効果などの範囲が広がり、高度な操縦技術が必要になります。\n・飛行時に機体から出る騒音も大きくなり、周囲への影響範囲も広がります。"],["4.2 無人航空機の機体の特徴（飛行方法別） 夜間飛行と昼間（日中）飛行の違い","航空法では原則として無人航空機は日出から日没までの間において飛行させることになっている。こ37れ以外の夜間（日没から日出までの間）に飛行させる場合は承認が必要である。日没及び日出時刻は地域により異なるため、事前に確認すること。地形や人工物等の障害物も視認できないため、離着陸地点や計画的に用意する緊急着陸地点、飛行経路中の回避すべき障害物も視認できるように地上照明を当てる。機体に搭載されたビジョンセンサーが夜間に対応していない場合は、衝突回避・姿勢安定などの安全機能が使用できない可能性があることに注意が必要である。","航空法では、無人航空機は原則として日出から日没までの間に飛行させることになっています。これ以外の夜間（日没から日出までの間）に飛ばす場合は承認が必要です。日没・日出の時刻は地域によって違うので、事前に確認しましょう。\n夜間は地形や人工物などの障害物も見えません。そのため、離着陸地点、計画的に用意しておく緊急着陸地点、飛行経路の途中で避けるべき障害物が見えるように、地上から照明を当てます。\n機体に搭載したビジョンセンサーが夜間に対応していない場合、衝突回避や姿勢安定などの安全機能が使えない可能性があるので注意が必要です。"],["4.2 無人航空機の機体の特徴（飛行方法別） 夜間飛行のために必要な装備","夜間飛行のための必須装備として、無人航空機の姿勢及び方向が正確に視認できる灯火を有することが求められる。ただし、無人航空機の飛行範囲が照明等で十分照らされている場合は、この限りではない。また、送信機については、操縦者の手元で位置、高度、速度等の情報が把握できるものを使用することが望ましい。目視外飛行","夜間飛行の必須装備として、無人航空機の姿勢と方向が正確に見て分かる灯火を備えることが求められます。ただし、無人航空機を飛ばす範囲が照明などで十分に照らされている場合は、この限りではありません。また送信機については、操縦者の手元で位置・高度・速度などの情報が分かるものを使うことが望ましいです。"],["4.2 無人航空機の機体の特徴（飛行方法別） 目視外飛行と目視内飛行の違い","目視外飛行では機体の状況や、障害物、他の航空機等の周囲の状況を直接肉眼で確認することができないので、機体に設置されたカメラや機体の位置、速度、異常等の状態を把握することが必要である。","目視外飛行では、機体の状況や障害物、他の航空機など周囲の状況を、直接肉眼で確認できません。そのため、機体に設置したカメラや、機体の位置・速度・異常などの状態を把握することが必要です。"],["4.2 無人航空機の機体の特徴（飛行方法別） 目視外飛行のために必要な装備","目視外飛行では周囲の安全を確認する補助者が配置された場合に必要な装備がある。なお、補助者を配置しない場合には追加される装備がある。主なものは、以下のとおり。①目視外飛行では周囲の安全を確認する補助者が配置された場合に必要な装備⚫自動操縦システム及び機体の外の様子が監視できる機体⚫搭載カメラや機体の高度、速度、位置、不具合状況等を地上で監視できる操縦装置⚫不具合発生時に対応する危機回避機能（フェールセーフ機能）、電波断絶時の自動帰還や空中停止機能、ＧＮＳＳ電波異常時の空中停止や安全な自動着陸、電池異常時の発煙発火防止等の機能がある。②補助者を配置しない場合に追加する必要のある装備⚫航空機からの視認性を高める灯火、塗色⚫機体や地上に設置されたカメラ等により飛行経路全体の航空機の状況が常に確認できるもの⚫第三者に危害を加えないことを、製造事業者等が証明した機能⚫機体の針路、姿勢、高度、速度及び周辺の気象状況等を把握できる操縦装置⚫計画上の飛行経路と飛行中の機体の位置の差を把握できる操縦装置38","目視外飛行では、周囲の安全を確認する補助者を配置した場合に必要な装備があります。補助者を配置しない場合には、さらに追加される装備があります。主なものは次のとおりです。\n① 補助者を配置した場合に必要な装備\n・自動操縦システムと、機体の外の様子が監視できる機体\n・搭載カメラや、機体の高度・速度・位置・不具合状況などを地上で監視できる操縦装置\n・不具合が起きたときに対応する危機回避機能（フェールセーフ機能）。電波が途切れたときの自動帰還や空中停止機能、GNSS電波が異常なときの空中停止や安全な自動着陸、電池異常時の発煙・発火防止などの機能があります。\n② 補助者を配置しない場合に追加で必要な装備\n・航空機から見つけやすくするための灯火と塗色\n・機体や地上に設置したカメラなどで、飛行経路全体の航空機の状況が常に確認できるもの\n・第三者に危害を加えないことを、製造事業者などが証明した機能\n・機体の針路・姿勢・高度・速度や、周辺の気象状況などを把握できる操縦装置\n・計画した飛行経路と、飛行中の機体の位置とのズレを把握できる操縦装置"],["4.3 飛行原理と飛行性能","無人航空機の飛行原理無人航空機が飛行するためには、重力に対抗する上向きの力を必要とする。飛行機では主翼に発生する揚力で重力に対抗する。一方、飛行機には飛行速度と逆向きに空気抵抗である抗力が働くが、それに抗するために回転翼であるプロペラ等による推力が必要である。一方、回転翼航空機（ヘリコプター）及び回転翼航空機（マルチローター）においては、重力に対抗する上向きの力はプロペラ（ローター）による推力によって生み出される。機体が運動すると、機体には飛行機と同様に抗力も作用するが、推力の大きさを重力以上にし、機体姿勢を変化させてこれに抗する。これら機体に働く力が釣り合ったとき、機体は速度と姿勢を一定とする定常飛行（釣り合い飛行）を行う。飛行中の航空機に流入する空気の機体に対する角度を迎角と横滑り角で表す。機体の前後・上下を含む面に空気流入の向きを投影したときに、前後軸とのなす角を迎角という。下方から空気が流入するときに迎角は正である。また、機体の前後・上下を含む面と空気流入の向きの面のなす角を横滑り角という。","無人航空機が飛ぶには、重力に対抗する上向きの力が必要です。\n飛行機は、主翼に発生する揚力で重力に対抗します。また飛行機には、飛行速度と逆向きに空気抵抗である抗力が働くので、それに抗するためにプロペラなど回転翼による推力が必要です。\n一方、回転翼航空機（ヘリコプター）と回転翼航空機（マルチローター）では、重力に対抗する上向きの力をプロペラ（ローター）の推力で生み出します。機体が動くと飛行機と同じように抗力も働きますが、推力の大きさを重力以上にし、機体の姿勢を変えることでこれに抗します。\nこれら機体に働く力が釣り合ったとき、機体は速度と姿勢が一定の定常飛行（釣り合い飛行）になります。\n飛行中の航空機に流れ込む空気の、機体に対する角度は迎角と横滑り角で表します。\n・迎角：機体の前後・上下を含む面に空気の流入方向を投影したときの、前後軸とのなす角。下方から空気が流入するときに迎角は正です。\n・横滑り角：機体の前後・上下を含む面と、空気の流入方向の面とのなす角。"],["4.3 飛行原理と飛行性能","機体右側から空気流入するときに横滑り角は正である。機体に作用する揚力と抗力などの空気力、モーメントは流入空気の速さとともに、迎角、横滑り角で決まる。航空機の姿勢はピッチ、ロール、ヨーとよばれる角度で表現する。機体の機首を上げ下げする回転がピッチ、機体を左右に傾ける回転がロール、機体を上から見たときの機首の左右の回転がヨーである。水平状態からのそれぞれの角度をピッチ角、ロール角（バンク角）、ヨー角（方位角）とよび、それらの角速度をピッチ角速度（ピッチング）、ロール角速度（ローリング）、ヨー角速度（ヨーイング）とよぶ。一般に、飛行機はプロペラによる推力によって速さを制御し、また、ピッチ、ロール、ヨーの姿勢を変化させることで飛行速度の向きを制御する。基本的に、ピッチを変化させるための舵が水平尾翼にあるエレベーター（昇降舵）、ロールを変化させるための舵が主翼にあるエルロン（補助翼）、ヨーを変化させる舵が垂直尾翼にあるラダー（方向舵）である。","横滑り角は、機体の右側から空気が流入するときに正になります。機体に働く揚力や抗力などの空気力とモーメントは、流入する空気の速さと、迎角、横滑り角で決まります。\n航空機の姿勢は、ピッチ・ロール・ヨーと呼ばれる角度で表します。\n・ピッチ：機首を上げ下げする回転\n・ロール：機体を左右に傾ける回転\n・ヨー：機体を上から見たときの機首の左右の回転\n水平の状態からのそれぞれの角度を、ピッチ角、ロール角（バンク角）、ヨー角（方位角）と呼び、それらの角速度をピッチ角速度（ピッチング）、ロール角速度（ローリング）、ヨー角速度（ヨーイング）と呼びます。\n飛行機は一般に、プロペラによる推力で速さを制御し、ピッチ・ロール・ヨーの姿勢を変えることで飛行速度の向きを制御します。舵は基本的に次のとおりです。\n・エレベーター（昇降舵）：水平尾翼にあり、ピッチを変える\n・エルロン（補助翼）：主翼にあり、ロールを変える\n・ラダー（方向舵）：垂直尾翼にあり、ヨーを変える"],["4.3 飛行原理と飛行性能","揚力発生の特徴流れる空気の中に翼のような流線形をした物体が置かれると物体には空気力が作用するが、流れと垂直方向に作用する力を揚力、流れの方向に働く力を抗力とよぶ。翼の前縁と後縁を結ぶ翼弦と流れのなす角を迎角といい、空気が下方から流入する時に迎角は正である。一般に迎角が増すと揚力、抗力ともに増加する。翼の断面形状が上面の湾曲が下面より大きな翼型は、効率よく揚力を発生できるので翼型やローター断面に利用される。しかしながら、あまり大きな迎角にすると、流れは翼の表面から剥離し、揚力は減じ、抗力が増大し、失速を招く。飛行中の飛行機が失速状態に陥ると、機体は急降下を始める。プロペラは、２枚以上のブレードとよばれる翼が回転して推力を発生する。プロペラの回転にはトルクが必要であり、プロペラを回転させる原動機には反トルクが作用する。","流れる空気の中に、翼のような流線形をした物体を置くと、その物体には空気の力が働きます。流れと垂直な方向に働く力を揚力、流れの方向に働く力を抗力と呼びます。\n翼の前縁と後縁を結んだ翼弦と、流れとのなす角を迎角といい、空気が下方から流入するときに迎角は正です。一般に迎角が増すと、揚力も抗力も増加します。\n翼の断面が、上面の湾曲が下面より大きい翼型は、効率よく揚力を発生できるので、翼型やローターの断面に利用されます。\nただし、あまり大きな迎角にすると、流れが翼の表面からはがれ（剥離）、揚力が減って抗力が増大し、失速を招きます。飛行中の飛行機が失速状態に陥ると、機体は急降下を始めます。\nプロペラは、ブレードと呼ばれる2枚以上の翼が回転して推力を発生します。プロペラの回転にはトルクが必要で、プロペラを回転させる原動機には反トルクが働きます。"],["4.3 飛行原理と飛行性能","回転翼航空機（マルチローター）はプロペラからの反トルクを相殺するために、偶数個のプロペラを半数ずつ異なる向きに回転させるのが一般である。各プロペラの回転数を変化させ、推力とトルクを変化させてピッチ、ロール、ヨーの運動を行う。一方、一般的に、回転翼航空機（ヘリコプター）はメインローターの反トルクをテールローターで相殺する。メインローターは1回転する間にブレードのピッチ角を周期的に変化させる可変ピッチ機構を持ち、これによって機体のピッチ、ロールの姿勢制御を行い、テールローターの39推力を変化させてヨーの姿勢制御を行う。無人航空機の飛行性能〔一等〕カテゴリーⅢ飛行を行うにあたっては、無人航空機の飛行性能（離陸性能、上昇性能、加速性能、巡行性能、旋回性能、降下性能、着陸性能等）及びこれに影響を与える要因（機体重量、飛行速度、空気密度や風などの大気状態等）について理解することが必要となる。","回転翼航空機（マルチローター）は、プロペラからの反トルクを打ち消すため、偶数個のプロペラを半数ずつ異なる向きに回転させるのが一般的です。各プロペラの回転数を変えて推力とトルクを変化させ、ピッチ・ロール・ヨーの運動を行います。\n一方、回転翼航空機（ヘリコプター）は一般に、メインローターの反トルクをテールローターで打ち消します。メインローターは1回転する間にブレードのピッチ角を周期的に変える可変ピッチ機構を持ち、これで機体のピッチとロールの姿勢を制御します。ヨーの姿勢制御は、テールローターの推力を変えて行います。\n〔一等〕カテゴリーⅢ飛行を行うにあたっては、無人航空機の飛行性能（離陸性能・上昇性能・加速性能・巡行性能・旋回性能・降下性能・着陸性能など）と、それに影響を与える要因（機体重量、飛行速度、空気密度や風などの大気の状態など）について理解することが必要です。"],["4.3 飛行原理と飛行性能","無人航空機へのペイロード搭載無人航空機には、ペイロードを搭載できない機体を除き、機体ごとに安全に飛行できるペイロードの最大積載量が定められている。ただし、ペイロードの最大積載量とペイロード搭載時の飛行性能は飛行高度、大気状態によっても異なり、また飛行機の場合は離着陸エリアの広さによっても異なる。機体重量が変化すると航空機の飛行特性（安定性、飛行性能、運動性能）は変化するため注意が必要である。機体の重心位置の変化は飛行特性に大きな影響を及ぼすため、ペイロードの有無によって機体の重心位置が著しく変化しないようにしなければならない。飛行性能の基本的な計算〔一等〕カテゴリーⅢ飛行を行うにあたっては、無人航空機の飛行性能に関わる以下のような基本的な計算（機体重量、揚力、推力、空気密度、飛行速度、高度、回転翼の回転角速度の関係等）について理解しておく必要がある。","無人航空機には、ペイロードを積めない機体を除き、機体ごとに安全に飛行できるペイロードの最大積載量が定められています。\nただし、最大積載量と、ペイロードを積んだときの飛行性能は、飛行高度や大気の状態によっても変わります。飛行機の場合は、離着陸エリアの広さによっても変わります。\n機体の重さが変わると、航空機の飛行特性（安定性・飛行性能・運動性能）も変わるので注意が必要です。特に機体の重心位置の変化は飛行特性に大きな影響を与えるため、ペイロードの有無によって重心位置が著しく変わらないようにする必要があります。\n〔一等〕カテゴリーⅢ飛行を行うにあたっては、飛行性能に関わる次のような基本的な計算（機体重量、揚力、推力、空気密度、飛行速度、高度、回転翼の回転角速度の関係など）についても理解しておく必要があります。"],["4.3 飛行原理と飛行性能 飛行機の揚力・回転翼航空機の推力","飛行機の水平定常飛行においては、機体重量𝑊、揚力𝐿、空気密度𝜌、飛行速度𝑉の間に以下の関係がある。𝑊=𝐿∝𝜌𝑉2プロペラなどの回転翼の推力𝑇は、空気密度𝜌、回転角速度𝜔の間に以下の関係がある。𝑇∝𝜌𝜔2回転翼航空機（ヘリコプター）及び回転翼航空機（マルチローター）のホバリング時には、機体重量𝑊と推力𝑇の間に以下の関係がある。𝑊=𝑇また、回転翼の消費パワー（仕事率）𝑃は、空気密度𝜌、回転角速度𝜔、推力𝑇の間に以下の関係がある。𝑃∝𝜌𝜔3∝𝑇𝜔40大気には標準大気が定められており、空気密度は高度に対して以下の表のように変化する。高度が1000m増加すると、空気密度は約0.9倍になる。高度[m]空気密度[kg/m3]高度0mとの比01.22501.000005001.16730.9528710001.11160.9074615001.05810.8637320001.00650.8216225000.956860.7811130000.909120.7421435000.863230.70468例えば、高度300０ｍでの空気密度は高度0mと比べると、0.74倍になる。そのため、飛行機が同じ飛行速度で飛行するならば揚力は0.74倍になる。そこで√1/0.74≒1.16倍の飛行速度が必要である。回転翼航空機の場合も、同じ回転角速度で発生するプロペラの推力は0.74倍になり、同じ機体重量の回転翼航空機を飛行させるためには√1/0.74≒1.16倍のプロペラの回転角速度が必要であり、そのために必要な消費パワーは0.74×√(1/0.74)3≒1.１6倍になる。","飛行機が高度も速度も一定で水平に飛んでいるとき（水平定常飛行）は、機体重量W、揚力L、空気密度ρ、飛行速度Vの間に次の関係があります。\n・W＝L∝ρV²（揚力は空気密度と速度の2乗に比例する）\n\nプロペラなどの回転翼が生む推力Tは、空気密度ρと回転角速度ωの間に次の関係があります。\n・T∝ρω²\n\nヘリコプターやマルチローターがホバリング（空中で停止）しているときは、機体重量Wと推力Tがつり合います。\n・W＝T\n\n回転翼の消費パワー（仕事率）Pは、空気密度ρ、回転角速度ω、推力Tと次の関係があります。\n・P∝ρω³∝Tω\n\n大気には標準大気（＝基準として定められた大気の状態）があり、空気密度は高度によって次のように変わります。高度が1,000m上がるごとに、空気密度は約0.9倍になります。\n・高度0m：1.2250kg/m³（高度0mとの比 1.00000）\n・高度500m：1.1673（0.95287）\n・高度1000m：1.1116（0.90746）\n・高度1500m：1.0581（0.86373）\n・高度2000m：1.0065（0.82162）\n・高度2500m：0.95686（0.78111）\n・高度3000m：0.90912（0.74214）\n・高度3500m：0.86323（0.70468）\n\n例えば高度3,000mの空気密度は、高度0mと比べて0.74倍です。そのため飛行機が同じ速度で飛ぶと、揚力も0.74倍に減ってしまいます。そこで√(1/0.74)≒1.16倍の飛行速度が必要になります。\n回転翼航空機も同じで、同じ回転角速度ではプロペラの推力が0.74倍になります。同じ機体重量の機体を飛ばすには√(1/0.74)≒1.16倍のプロペラ回転角速度が必要で、そのために必要な消費パワーは0.74×√(1/0.74)³≒1.16倍になります。"],["4.3 飛行原理と飛行性能 飛行機の揚力・回転翼航空機の推力","ペイロードが搭載されるなどして飛行機の機体重量が2倍になると、2倍の揚力が必要となり、高度などの他の条件が同じであれば、√2≒1.4倍の機体速度が必要である。回転翼航空機の場合、機体重量が2倍になると、2倍の推力が必要となり、高度
